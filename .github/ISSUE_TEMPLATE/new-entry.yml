name: Propose an OS
description: An OS that meets the five inclusion criteria is missing.
title: "[new entry] <OS name>"
labels: ["new-entry"]
body:
  - type: markdown
    attributes:
      value: |
        An OS is added when it meets all five inclusion criteria in the methodology. Give a primary source for each criterion: the project's own docs, code, release notes or announcement.
  - type: input
    id: name
    attributes:
      label: OS name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Project homepage or repository
    validations:
      required: true
  - type: textarea
    id: r1
    attributes:
      label: "Rule 1: whole-system updates"
      description: How the OS updates as one unit (an image, a deployment or a snapshot), with a source.
    validations:
      required: true
  - type: textarea
    id: r2
    attributes:
      label: "Rule 2: immutable at runtime"
      description: Which part of the OS is read-only on a running node, with a source.
    validations:
      required: true
  - type: textarea
    id: r3
    attributes:
      label: "Rule 3: rollback"
      description: How at least one previous OS version is kept and can be booted, with a source.
    validations:
      required: true
  - type: textarea
    id: r4
    attributes:
      label: "Rule 4: declarative provisioning"
      description: How a node configures itself at first boot from a declarative input, with a source.
    validations:
      required: true
  - type: textarea
    id: r5
    attributes:
      label: "Rule 5: runs Kubernetes"
      description: Where the project or its vendor documents running Kubernetes on it, with a source.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Governance, latest release, or why it matters to readers.
  - type: checkboxes
    id: affiliation
    attributes:
      label: Affiliation
      options:
        - label: I am a maintainer of, or work for a company behind, this OS.
