name: Check site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-checks:
    name: Site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml jsonschema
      - name: Validate profiles
        run: python3 tools/validate_profiles.py data/projects
      - name: Build and check the public preview site
        env:
          PULSE_PREVIEW: public
        run: |
          python3 site/build.py data/projects out/public
          python3 site/check_site.py out/public/site
      - name: Build and check the full site
        run: |
          python3 site/build.py data/projects out/full
          python3 site/check_site.py out/full/site
