schema_version: "1.0.0"
edition: "2026"
id: nixos
name: NixOS
homepage: https://nixos.org/
repository: https://github.com/NixOS/nixpkgs
collected_at: "2026-09-15"

entry_kind:
  - distribution
  - framework

category_fit:
  comparable: adjacent
  note: >-
    NixOS is in this survey because the contrast is informative, not because it
    is a peer of a Kubernetes node operating system. Its own front page says
    "Declarative builds and deployments", and its three headline properties are
    reproducible, declarative and reliable. The word immutable does not appear.

    The honest split. On the package and closure layer NixOS is genuinely
    immutable and hash-addressed, and that is stronger and older than most
    systems here. On the running root it is not: / is an ordinary read-write
    filesystem, /etc is writable, users can be added imperatively by default,
    and packages can be installed imperatively.

    The sharpest way to put it, and the reason this entry is adjacent: NixOS
    guarantees that a configuration reproduces a system closure. It does not
    guarantee that a running machine matches its configuration, and the documented
    escape hatches are defaults rather than edge cases.

    The project's own manual says the model is not an appliance model, in as many
    words. That statement is quoted in d04.

self_description:
  text: >-
    Nix is a tool that takes a unique approach to package management and system
    configuration. Learn how to make reproducible, declarative and reliable
    systems.
  source:
    url: https://nixos.org/
    type: official-docs
    title: NixOS home page
    retrieved: "2026-09-22"

version_observed:
  version: "26.05"
  released: "2026-05-30"
  channel: stable
  method: >-
    Cross-checked three ways: the download page's current stable version, the
    stable manual header, and the release notes header in the source repository.
  source:
    url: https://nixos.org/blog/announcements/2026/nixos-2605/
    type: announcement
    title: NixOS 26.05 release announcement
    retrieved: "2026-09-22"
    quote: >-
      Published on Sat May 30 2026
  additional_channels:
    - channel: "previous stable"
      version: "25.11"
      released: "2025-11-30"
      eol: "2026-06-30, already reached"

taxonomy:
  workload_scope: general-purpose-host
  construction_model:
    - framework
    - package-repository-assembly
  root_state_substrate:
    - nix-store-generation
  notes: >-
    A general-purpose host in the fullest sense in this edition: it is a desktop
    distribution, a server distribution and a build system, and Kubernetes is one
    packaged service among more than 140,000 packages.

    The construction model is a framework, and NixOS is the clearest example of
    one here. The system is built from a declarative module evaluation rather
    than assembled from a vendor image, and the adopter's configuration is the
    artifact.

dimensions:
  d01_os_model:
    normalized:
      workload_scope: general-purpose-host
      ships_kubernetes: false
      packages_kubernetes: true
      core_claim: "reproducibility and declarative configuration, not root immutability"
    summary: >-
      A Linux distribution built by a purely functional package manager from a
      declarative description, implemented inside the same repository as the
      package collection it draws from.
    notes: >-
      The relationship between the three names matters for reading anything else
      here. Nix is the build and package tool with its own language and store.
      Nixpkgs is the package collection and also the repository in which NixOS
      itself is implemented. NixOS is the distribution composed from modules and
      packages defined there.

      So NixOS is, structurally, a subdirectory of a package collection rather
      than a separate product. That is unusual enough to be worth stating.

      Scale, from the project's own release announcement: 2,842 contributors and
      59,703 commits in the 26.05 cycle alone.
    evidence: DOCUMENTED
    sources:
      - url: https://nixos.org/manual/nixos/stable/
        type: official-docs
        title: NixOS manual preface
        retrieved: "2026-09-22"
        quote: >-
          a Linux distribution based on the purely functional package management
          system Nix, that is composed using modules and packages defined in the
          Nixpkgs project
      - url: https://github.com/NixOS/nixpkgs
        type: source-repo
        title: Nixpkgs README
        retrieved: "2026-09-22"
        quote: >-
          It also implements NixOS, a purely-functional Linux distribution.
      - url: https://nixos.org/blog/announcements/2026/nixos-2605/
        type: announcement
        title: NixOS 26.05 announcement
        retrieved: "2026-09-22"
        quote: >-
          The 26.05 release was made possible due to the efforts of 2842
          contributors, who authored 59703 commits since the previous release.

  d02_immutability:
    normalized:
      read_only:
        - /nix/store
      read_only_mechanism: "read-only bind mount, which the build daemon undoes in order to write"
      writable_and_persistent:
        - /
        - /etc
        - /var
        - /home
      integrity_mechanism:
        - read-only-store
      dm_verity: "available as an opt-in module, undocumented in the manual"
      drift_possible: true
      drift_detection: "none"
      mutable_users_default: true
      etc_immutable_option: "opt-in and experimental"
      configurable_paths:
        value: 'yes'
        evidence: DOCUMENTED
        how: Set system.etc.overlay.mutable to false to mount /etc read-only. The /etc overlay is opt-in and the manual calls it experimental.
        sources:
          - url: https://github.com/NixOS/nixpkgs/blob/417538e/nixos/doc/manual/development/etc-overlay.section.md
            type: source-repo
            title: 'NixOS manual: /etc via overlay filesystem'
            retrieved: '2026-10-12'
            quote: you can also mount `/etc` immutably (i.e. read-only) by setting
      mounts_sources:
        - url: https://github.com/NixOS/nixpkgs/blob/417538e/nixos/modules/system/boot/stage-2.nix
          type: source-repo
          title: 'NixOS stage 2: the Nix store mount'
          retrieved: '2026-10-12'
          quote: '`ro` enforces immutability of the Nix store.'
    summary: >-
      The store is read-only, mounted with no-device and no-setuid, and the
      documentation says that flag is what "enforces immutability of the Nix
      store". The root filesystem is an ordinary writable ext4.
    notes: >-
      Three documented defaults make configuration drift possible, and calling
      them out is the point of including NixOS in this survey.

      Imperative package installation into a profile works and sits outside the
      declarative configuration. The manual states the consequence directly:
      other packages in the profile are not affected by a channel update, and
      this is "the crucial difference with the declarative style of package
      management".

      Mutable users default to on, so accounts created with ordinary commands are
      merged into the generated configuration on activation rather than being
      replaced.

      /etc is generated at activation but writable. An overlay variant that can
      be made immutable exists, is opt-in, requires a recent kernel, and the
      manual labels it experimental with a warning to enable it only if you are
      confident you can recover the system if it breaks.

      There is no drift detection and no reconciliation loop. The closest tool
      compares against the new configuration rather than reporting divergence
      from the declared current one.

      One further caveat on the claim that a configuration identifies a machine:
      a state-version option records the first NixOS version installed on that
      particular machine and is deliberately never changed, so two machines with
      identical configurations but different install histories can evaluate
      differently.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/NixOS/nixpkgs/blob/master/nixos/modules/system/boot/stage-2.nix
        type: source-repo
        title: Nix store mount options
        retrieved: "2026-09-22"
        quote: >-
          Defines the mount options used on a bind mount for the /nix/store ...
          ro enforces immutability of the Nix store.
      - url: https://github.com/NixOS/nixpkgs/blob/master/nixos/doc/manual/configuration/ad-hoc-packages.section.md
        type: official-docs
        title: Ad-hoc packages
        retrieved: "2026-09-22"
        quote: >-
          this is the crucial difference with the declarative style of package
          management
      - url: https://github.com/NixOS/nixpkgs/blob/master/nixos/modules/config/users-groups.nix
        type: source-repo
        title: Mutable users default
        retrieved: "2026-09-22"
        quote: >-
          If set to `true`, you are free to add new users and groups to the system
          with the ordinary `useradd` and `groupadd` commands.
      - url: https://github.com/NixOS/nixpkgs/blob/master/nixos/doc/manual/development/etc-overlay.section.md
        type: official-docs
        title: /etc overlay
        retrieved: "2026-09-22"
        quote: >-
          This is experimental and requires a kernel version >= 6.6 because it
          uses new overlay features and relies on the new mount API.
      - url: https://github.com/NixOS/nixpkgs/blob/master/nixos/modules/system/etc/etc.nix
        type: source-repo
        title: system.etc.overlay.enable option description
        retrieved: "2026-09-22"
        quote: >-
          Note: This is currently experimental. Only enable this option if you're
          confident that you can recover your system if it breaks.

  d03_artifact:
    normalized:
      primary_artifact: "a closure, addressed by hash"
      addressing: "input-addressed by default; content-addressing is an experimental feature"
      oci_registry_distribution: "official tooling to produce OCI images; no path for a system closure"
      mirrorable: true
      signed: "required by default"
      air_gapped_capable: true
      kernel_initrd_userspace_together: false
    summary: >-
      There is no single OS release artifact. The representations are a channel,
      a generation, a closure, and optionally a built disk image. A store path is
      a hash of the package's entire build dependency graph.
    notes: >-
      Signature verification is required by default, which is a genuine strength
      and better than several peers: the configuration requires a signature by a
      trusted key for any non-content-addressed path added to the store, and the
      default trusted key set is the project's own cache.

      One precision worth getting right, because it is often stated loosely:
      default store paths are input-addressed, a hash of the build graph, not
      content-addressed. True content addressing is an experimental feature.

      Air-gapped operation is genuinely well covered, with documented commands to
      disable substitution, export and import store objects, and copy closures
      over a network, including a documented removable-media workflow.

      Official image building moved upstream in 2025 and the long-standing
      community generator was archived in January 2026 as a result.

      There is official tooling to produce OCI container images, which does not
      use Docker to do it. No official mechanism publishes a NixOS system closure
      as an OCI artifact.
    evidence: DOCUMENTED
    sources:
      - url: https://nix.dev/manual/nix/stable/command-ref/conf-file
        type: official-docs
        title: Nix configuration, require-sigs and trusted keys
        retrieved: "2026-09-22"
        quote: >-
          any non-content-addressed path added or copied to the Nix store must
          have a signature by a trusted key
      - url: https://nix.dev/manual/nix/stable/introduction
        type: official-docs
        title: Nix introduction, store paths
        retrieved: "2026-09-22"
        quote: >-
          it's a cryptographic hash of the package's build dependency graph
      - url: https://github.com/NixOS/nixpkgs/blob/master/nixos/doc/manual/installation/building-images-via-nixos-rebuild-build-image.chapter.md
        type: official-docs
        title: Building images
        retrieved: "2026-09-22"
        quote: >-
          All of those images can be built via both, their `system.build.image`
          attribute and the `nixos-rebuild build-image` command.
      - url: https://github.com/NixOS/nixpkgs/blob/master/doc/build-helpers/images/dockertools.section.md
        type: official-docs
        title: dockerTools
        retrieved: "2026-09-22"
        quote: >-
          Docker itself is not used to perform any of the operations done by
          these functions.
    unknowns:
      - "No official mechanism to publish or consume a NixOS system closure as an OCI artifact."

  d04_upgrade:
    normalized:
      mechanism:
        - generation-switch
      atomicity: "the build and the profile symlink swap are atomic; activation of the running system is not"
      initiator: "operator, or a scheduled auto-upgrade unit"
      requires_kubernetes: false
      requires_vendor_infrastructure: false
      artifact_verification: "signature required by default"
      running_filesystem_changed: true
    summary: >-
      A new generation is built, the profile symlink is swapped, the bootloader
      gains an entry, and then an ordered sequence of stops, activation, reloads
      and restarts brings the running system to the new state.
    notes: >-
      What is atomic and what is not deserves precision, because this dimension
      is often overstated in both directions. Store additions never overwrite, so
      there is no window in which a package is half-old and half-new. The profile
      symlink swap is atomic. The activation of a running system is not: it is a
      documented ordered action list that can leave units failed, and the tool's
      final step is to report which units failed and which newly started.

      Four actions separate build from activation from boot-default cleanly,
      which is unusually fine-grained control: build only, build and make the
      boot default without activating, build and activate without changing the
      boot default, or all three.

      The manual states plainly that this model is not for appliances: "The
      generation based update mechanism of NixOS is not suited for appliances.
      Updates of appliances are usually either performed by replacing the entire
      image with a new one or by updating partitions via an A/B scheme." That is
      the project locating itself relative to the rest of this survey, in its own
      words.

      Upgrades work offline if the closure is already present. Flakes, the newer
      input-pinning mechanism that most modern tooling assumes, remain an
      experimental feature that the Nix manual says can be changed or removed at
      any time.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/NixOS/nixpkgs/blob/master/nixos/doc/manual/development/what-happens-during-a-system-switch.chapter.md
        type: official-docs
        title: What happens during a system switch
        retrieved: "2026-09-22"
        quote: >-
          Inspect what changed during these actions and print units that failed
          and that were newly started
      - url: https://github.com/NixOS/nixpkgs/blob/master/nixos/doc/manual/installation/building-images-via-systemd-repart.chapter.md
        type: official-docs
        title: Building images via systemd-repart
        retrieved: "2026-09-22"
        quote: >-
          The generation based update mechanism of NixOS is not suited for
          appliances.
      - url: https://nix.dev/manual/nix/stable/development/experimental-features
        type: official-docs
        title: Experimental features
        retrieved: "2026-09-22"
        quote: >-
          Experimental features are considered unstable, which means that they
          can be changed or removed at any time.
      - url: https://github.com/NixOS/nixpkgs/blob/master/nixos/doc/manual/installation/upgrading.chapter.md
        type: official-docs
        title: Upgrading
        retrieved: "2026-09-22"
        quote: >-
          If `allowReboot` is `true`, then the system will automatically reboot
          if the new generation contains a different kernel, initrd or kernel
          modules.

  d05_rollback_recovery:
    normalized:
      rollback_to_previous: available
      rollback_to_arbitrary_version: available
      automatic_rollback_on_boot_failure: "none by default; opt-in boot counting on one bootloader"
      retained_versions: "all, until garbage collected"
      recovery_environment: "boot menu of every retained generation"
      factory_reset: unknown
      network_independent_recovery: "yes"
    summary: >-
      Every previous generation stays bootable until garbage collected, and they
      appear in the boot menu. That is the deepest rollback capability in this
      edition by a wide margin, and it needs no network.
    notes: >-
      The contrast with the A/B systems runs in both directions and both halves
      matter.

      In NixOS's favour: A/B systems retain one previous version and NixOS
      retains all of them, selectable from the boot menu, with a documented note
      that this is especially useful if the new configuration fails to boot.
      Rollback is local, needs no network, and can reach far back rather than one
      step.

      Against it: there is no automatic rollback by default. Boot counting exists
      as an opt-in option on the systemd bootloader, defaulting to off with three
      attempts when enabled. No equivalent was found for the other bootloader,
      whose documented recovery path is a human selecting an older generation.

      So NixOS gives an operator more to choose from and nothing that chooses for
      them.

      Retention is unbounded by default, which is its own operational hazard: the
      systemd bootloader's configuration limit defaults to unlimited and the
      other defaults to 100 entries, and the manual warns about the boot
      partition filling up. Ordinary garbage collection deliberately does not
      remove the ability to roll back; a separate flag does.

      No factory reset facility is documented.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/NixOS/nixpkgs/blob/master/nixos/doc/manual/administration/rollback.section.md
        type: official-docs
        title: Rolling back configuration changes
        retrieved: "2026-09-22"
        quote: >-
          the GRUB boot manager allows you to boot into any previous
          configuration that hasn't been garbage-collected ... This is especially
          useful if the new configuration fails to boot.
      - url: https://github.com/NixOS/nixpkgs/blob/master/nixos/modules/system/boot/loader/systemd-boot/systemd-boot.nix
        type: source-repo
        title: Boot counting option, default off
        retrieved: "2026-09-22"
        quote: >-
          New boot entries are written with a boot counter in the file name. On
          each boot, systemd-boot decrements the counter
      - url: https://github.com/NixOS/nixpkgs/blob/master/nixos/doc/manual/administration/cleaning-store.chapter.md
        type: official-docs
        title: Cleaning the store
        retrieved: "2026-09-22"
        quote: >-
          The commands above do not remove garbage collector roots ... Thus they
          do not remove the ability to roll back to previous configurations.
      - url: https://github.com/NixOS/nixpkgs/blob/master/nixos/doc/manual/administration/boot-problems.section.md
        type: official-docs
        title: Boot problems
        retrieved: "2026-09-22"
        quote: >-
          If NixOS fails to boot, there are a number of kernel command line
          parameters that may help you to identify or fix the issue.
    unknowns:
      - "No factory reset facility is documented."
      - "No boot counting or automatic rollback was found for the GRUB path."

  d06_customization:
    normalized:
      runtime_package_install: available
      mechanisms:
        - module-system
        - overlays-and-overrides
        - custom-kernel-and-modules
        - image-building
        - imperative-profiles
      customization_points:
        - build-time
        - activation
        - runtime
      kernel_modules: "first-class, including out-of-tree and kernel configuration changes"
      gpu: "proprietary drivers available but unfree, and therefore not built or cached by project CI"
    summary: >-
      The most complete customization model in this edition. The module system,
      overlays and package overrides let an adopter change anything, including
      the kernel and its configuration, declaratively.
    notes: >-
      Kernel work is genuinely first-class rather than an escape hatch: selecting
      a kernel also swaps packages tied to that kernel version such as video
      drivers, out-of-tree modules have declared options, kernel configuration
      can be changed by override, and Rust module support is documented.

      Two documented limits are worth recording because they bite in practice.
      First, the project maintains only actively supported kernel versions, and
      non-longterm kernels are removed after upstream abandons them, explicitly
      including in stable releases. Second, unfree software, which includes
      proprietary GPU drivers, is not tested or built in the project's continuous
      integration and therefore is not cached. An adopter builds those locally,
      which on a GPU driver is a real cost.

      Imperative installation exists and interacts with declarative state in a
      documented way, covered under d02.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/NixOS/nixpkgs/blob/master/nixos/doc/manual/configuration/linux-kernel.chapter.md
        type: official-docs
        title: Linux kernel configuration
        retrieved: "2026-09-22"
        quote: >-
          This means that a non-longterm kernel will be removed after it's
          abandoned by the kernel developers, even on stable NixOS versions.
      - url: https://github.com/NixOS/nixpkgs/blob/master/doc/using/configuration.chapter.md
        type: official-docs
        title: Nixpkgs configuration, unfree packages
        retrieved: "2026-09-22"
        quote: >-
          Unfree software is not tested or built in Nixpkgs continuous
          integration, and therefore not cached.
      - url: https://github.com/NixOS/nixpkgs/blob/master/doc/using/overlays.chapter.md
        type: official-docs
        title: Overlays
        retrieved: "2026-09-22"
        quote: >-
          Overlays are used to add layers in the fixed-point used by Nixpkgs to
          compose the set of all packages.

  d07_kubernetes:
    normalized:
      requirement: unrelated
      bundled: "none"
      independent_lifecycle: partial
      os_manages_kubernetes: "no"
      kubernetes_manages_os: "none"
      distributions:
        - "upstream Kubernetes, via an in-tree module"
        - k3s
        - rke2
    summary: >-
      Unrelated. Kubernetes is packaged as ordinary in-tree service modules,
      including upstream Kubernetes, k3s and rke2, and nothing in the system
      requires it.
    notes: >-
      The in-tree upstream module builds a cluster from NixOS options with roles
      and optional automatic certificate setup, rather than wrapping the usual
      bootstrap tool. No module based on that tool was found.

      Lifecycle independence is partial by inference rather than by statement:
      Kubernetes arrives as ordinary packages pinned by the same channel or lock
      as everything else, so advancing the system advances both unless the
      adopter pins Kubernetes separately through an override. No primary source
      states a decoupling guarantee either way.

      No official mechanism exists for Kubernetes to manage the NixOS lifecycle.
      The only official lifecycle drivers are the rebuild tool, locally or
      against a remote host, and a scheduled auto-upgrade unit.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/NixOS/nixpkgs/blob/master/nixos/modules/services/cluster/kubernetes/default.nix
        type: source-repo
        title: Kubernetes module
        retrieved: "2026-09-22"
        quote: >-
          Kubernetes role that this machine should take.
      - url: https://github.com/NixOS/nixpkgs/blob/master/nixos/modules/services/cluster/rancher/k3s.nix
        type: source-repo
        title: k3s module
        retrieved: "2026-09-22"
        quote: >-
          Whether k3s should run as a server or agent.
      - url: https://github.com/NixOS/nixpkgs/blob/master/nixos/modules/services/cluster/rancher/rke2.nix
        type: source-repo
        title: rke2 module
        retrieved: "2026-09-22"
        quote: >-
          Whether rke2 should run as a server or agent.
    unknowns:
      - "No official mechanism for a Kubernetes control plane to drive NixOS node upgrades."
      - "No primary source states whether the OS and Kubernetes can be upgraded independently."

  d08_hardware_platform:
    normalized:
      architectures_tier_1:
        - x86_64-linux
      architectures_tier_2:
        - aarch64-linux
      architectures_tier_3:
        - armv6l-linux
        - armv7l-linux
        - i686-linux
      architectures_unmandated:
        - riscv64-linux
        - powerpc64le-linux
      installer_images:
        - x86_64
        - aarch64
      platforms:
        - bare-metal
        - virtual-machines
        - public-cloud
        - sbc
      gpu: "proprietary drivers available, unfree, not cached"
      tpm: "TPM2 LUKS unlock supported; no manual chapter"
      extension_mechanism: "a hardware module collection in the project's own organization"
    summary: >-
      Support is formally tiered by a merged design document, and the live tier
      assignment lives in a source file. riscv64 and ppc64le are present with
      working toolchains but sit outside the mandated tiers.
    notes: >-
      The tiering is a real strength for anyone planning, because it states what
      a tier commits to: on tier 1 problems can block updates for as long as
      needed, on tier 2 updates are expected not to break the build, on tier 3
      updates might break builds.

      riscv64 is notable in this edition as the only entry where the architecture
      is genuinely usable rather than absent, with a working toolchain, even
      though it carries no mandated tier commitment.

      Two currency problems. The design document's own platform table is dated
      2019 and is stale; the source file is the live truth and the document does
      not point to it. And the announcement for the current release states it is
      the last to support Intel macOS.

      The hardware module collection covering Raspberry Pi, single-board
      computers and many laptops sits in the project's own organization but
      carries no stated support or stability guarantee, which is worth knowing
      before relying on it.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/NixOS/nixpkgs/blob/master/lib/systems/flake-systems.nix
        type: source-repo
        title: Live platform tier assignment
        retrieved: "2026-09-22"
        quote: >-
          Other platforms with sufficient support in stdenv which is not formally
          mandated by their platform tier.
      - url: https://github.com/NixOS/rfcs/blob/master/rfcs/0046-platform-support-tiers.md
        type: design-doc
        title: "RFC 46, platform support tiers"
        retrieved: "2026-09-22"
        quote: >-
          Problems on these platforms can block updates for as long as necessary
          to resolve the issue.
      - url: https://nixos.org/download/
        type: official-docs
        title: Downloads
        retrieved: "2026-09-22"
        quote: >-
          We publish AMIs to all AWS regions for both x86_64 and arm64 on a
          weekly basis.
      - url: https://github.com/NixOS/nixos-hardware
        type: source-repo
        title: nixos-hardware
        retrieved: "2026-09-22"
        quote: >-
          NixOS profiles to optimize settings for different hardware.
    unknowns:
      - "The tier commitment, if any, for riscv64 and ppc64le. They sit outside the mandated tiers in the live source."

  d09_provisioning:
    normalized:
      methods:
        - iso-installer
        - pxe-netboot
        - kexec
        - cloud-image
        - install-from-another-distribution
      config_mechanism: "declarative configuration evaluated at build time"
      config_reapplied: "on every rebuild"
      zero_touch: unknown
    summary: >-
      A broad set of official paths: ISO installer, network boot, kexec, cloud
      images, and installing from another running distribution. Weekly cloud
      images are published for two architectures.
    notes: >-
      A gap worth recording for anyone planning bare-metal fleet provisioning:
      network boot artifacts are built rather than published, and the manual says
      the project may begin making them available as build products in future,
      which means today there is nothing official to point a boot server at.

      The most widely used remote-install and disk-partitioning tooling is
      community rather than official, living outside the project's own
      organization and carrying no stability statement. That community tool's
      own README states the underlying gap, describing disk partitioning and
      formatting as the one manual step in an otherwise fully declared system,
      and the project's manual confirms that the installer does no partitioning
      or formatting.

      No official zero-touch or auto-enrolment flow was found.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/NixOS/nixpkgs/blob/master/nixos/doc/manual/installation/installing-pxe.section.md
        type: official-docs
