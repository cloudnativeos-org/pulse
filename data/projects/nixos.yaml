      commercial:
        - name: Determinate Systems
          vendor: Determinate Systems
          license: commercial
          self_hostable: false
          note: "Vendor-stated offerings include a validated Nix distribution, a flake platform with binary caching and access control, commercially supported packages with a stated seven-day vulnerability commitment, and enterprise support with guaranteed response times. Vendor claims, not endorsed by the project."
        - name: Flox
          vendor: Flox
          license: commercial
          self_hostable: false
          note: "Vendor-stated enterprise platform with single sign-on, private and air-gapped distribution, signed bills of materials, and support with a service level agreement. Vendor claims, not endorsed by the project."
      cluster_api:
        os_specific_provider: "none"
        maintainer: not-applicable
        upstream_provider_list: "not listed under any provider type"
        provisions: not-applicable
        bootstrap_target: "none. The services.kubernetes module configures the control-plane components directly and does not use kubeadm, which the kubeadm bootstrap provider requires."
        image_builder_target: "none"
        upstream_interest: "no Cluster API or image-builder issue has ever named this system"
    summary: >-
      The core gives remote deployment and a self-upgrade timer. Everything above
      that is companion tooling, and the notable fact is how scattered it is
      across four different organizations with differing maturity.
    notes: >-
      The organizational spread is the finding here, because it is what an
      adopter has to navigate. The tool in the project's own organization is
      self-described as low maintenance and not suited for new projects. Its
      intended successor is in a different organization and in development with
      no release. The two most used alternatives sit in a community organization
      and in a company's organization respectively, neither claiming official
      status.

      There is no in-tree inventory, orchestration, staged rollout or health
      gating.

      Both commercial vendors publish concrete enterprise commitments including
      response times and, in one case, a stated vulnerability response window.
      Those are vendor claims recorded as such, and neither is endorsed by the
      project.

      Cluster API has no presence here, and the absence is searched rather than
      assumed. No provider of any type exists, by the project or by anyone else.
      Nothing appears in the provider list. No issue on Cluster API or on
      image-builder has ever named this system, so there is not even a rejected
      request to record. There is no image-builder target.

      The structural reason is worth stating, because it explains why nobody has
      tried. The kubeadm bootstrap provider drives kubeadm. This project's own
      Kubernetes module is a from-scratch implementation that configures the
      API server, controller manager, scheduler, kubelet, proxy and its own
      public key infrastructure directly as units, and contains no kubeadm
      anywhere. So the native Kubernetes story on this system and the mechanism
      Cluster API's default bootstrap provider needs point in opposite
      directions.

      The relationship runs the other way instead. The package collection ships
      clusterctl, so this system consumes Cluster API as a client and supplies
      nothing to it. Whether a hand-built image works under the kubeadm
      bootstrap provider is recorded as unknown: third-party write-ups assert it
      does, no primary source states it either way, and marketing and blog
      sources are not admissible here.
