tradeoffs:
  buys:
    - "Every previous generation stays bootable until garbage collected, selectable from the boot menu with no network."
    - "A configuration that reproduces a system closure, with store paths addressed by a hash of the whole build dependency graph."
    - "Signature verification of substituted binaries required by default, and build sandboxing on by default."
    - "A customization model covering the kernel, kernel configuration, out-of-tree modules and any package, all declaratively and without leaving the supported path."
    - "Remote build and remote activation built into the core tool, which the deployment tooling ecosystem builds on. Most deployment tooling assumes flakes, which the manual calls experimental and says can change or be removed at any time."
    - "Documented offline operation, with commands to disable substitution and to export, import and copy closures, including over removable media."
    - "A written constitution, an elected steering committee with term limits, foundation ownership, a registered trademark, and 2,842 contributors in one release cycle across many employers."
    - "Formally tiered platform support that states what each tier commits to, and a usable riscv64 toolchain."
  costs:
    - "The running root is not immutable. / is writable, /etc is writable, users are mutable by default, and imperative package installation works. A configuration does not guarantee that a machine matches it."
    - "No drift detection or reconciliation."
    - "Automatic rollback needs boot counting, which is opt-in and is documented for one bootloader only."
    - "Secure Boot is not in the project; it needs a community-maintained add-on."
    - "System activation is a sequence of imperative steps that can leave units failed. Only the build and the symlink swap are atomic."
    - "Generation retention is unbounded by default, and the bootloader limit defaults to unlimited. The documentation notes a risk of filling the boot partition."
    - "A seven-month support window with about one month of overlap, announced per release rather than codified, with requests for a written policy open since 2018."
    - "No published network boot artifacts."
    - "NixOps, the fleet tool in the project's own organization, says it is in low-maintenance mode and probably not suited for new projects; its successor has no release."
    - "A two-person security team with no published response commitment, no embargo policy and no numbering-authority statement. No FIPS."
open_questions:
  - "Is there a written, standing support-window policy planned, given the request has been open since 2018?"
  - "Is the build daemon the only writer to the store on a running system, and is there a supported way to make it read-only to the daemon too?"
  - "Is there intent to make the immutable /etc overlay non-experimental, or a supported profile?"
  - "What is the current reproducibility percentage, and is the dashboard still being fed? Its newest evaluation was months old at this snapshot."
  - "Does the project publish SBOMs, provenance or attestations, in what format, and can a third party verify one?"
  - "Is the dm-verity image module considered supported, is its root hash signed, and why is it absent from the manual?"
  - "Is the image and A/B update path intended to become a documented first-class deployment mode, given the manual says the generation model is not suited for appliances?"
  - "Is boot counting expected to become the default, and is there any plan for it under the other bootloader?"
  - "What remains before Secure Boot support lands upstream, and is there a target release?"
  - "What response-time and embargo expectations apply to a report sent to the two-person security team, and is the project a numbering authority?"
  - "What is the tier commitment for riscv64 and ppc64le, and will the design document's table be updated or replaced by the source file?"
  - "Is the hardware module collection covered by any support or continuous-integration guarantee, or is being in the project's organization incidental?"
  - "What is the intended division of labour between the successor deployment tool, the community alternatives, and remote activation? Will the successor move into the project's organization?"
  - "When do flakes leave experimental status, and what is the migration commitment if the interface changes?"
  - "Is there any planned mechanism for a Kubernetes control plane to drive NixOS node upgrades?"
  - "Is the reproducibility dashboard at reproducibility.nixos.social still served? It returned no content on 2026-09-22, so the age of its newest evaluation could not be re-checked."
  - "How many maintainers does the project have, and who employs them? No maintainer count or maintainer affiliation is published. The steering committee's employers are published."

