    field: "tradeoffs.costs"
    change: "Methodology section 9, rule 17: where a capability is documented is not a cost. Removed cost 'An official dm-verity image module exists and is undocumented in the manual, discoverable only by reading source.' The module exists, and the project documents it in the module's own option descriptions. Whether the module is supported and whether its root hash is signed stay as an open question."
    source:
      url: "https://github.com/NixOS/nixpkgs/blob/release-26.05/nixos/modules/image/repart-verity-store.nix"
