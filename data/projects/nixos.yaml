      - "No official zero-touch provisioning flow."

  d10_security:
    normalized:
      secure_boot: "none by default; a community project provides it"
      measured_boot: "opt-in, through the same community project"
      tpm: "TPM2 LUKS unlock, options exist but no manual chapter"
      integrity: read-only-store
      dm_verity: "an official opt-in module exists, undocumented in the manual"
      disk_encryption: "LUKS, opt-in, with hardware token options in tree"
      artifact_verification: "signature required by default"
      reproducible_builds: "a stated project goal with a dedicated site"
      sbom: unknown
      provenance: unknown
      fips: "none"
      security_team_size: 2
      default_on:
        - signature-required-substitution
        - read-only-store-nodev-nosuid
        - build-sandboxing
      opt_in:
        - disk-encryption
        - secure-boot-via-community-project
        - dm-verity-image-module
        - boot-counting
    summary: >-
      Signature verification of substituted binaries is required by default,
      builds are sandboxed by default, and the store is mounted read-only with
      no-device and no-setuid. Secure Boot is not available by default.
    notes: >-
      Secure Boot is the clearest gap. Neither bootloader module defines Secure
      Boot options. The project that provides it, including measured boot, lives
      in the community organization and its README has long described upstreaming
      as work in progress, which was still the case at this snapshot.

      An official dm-verity image module exists in the tree in both recent
      releases and is substantial, building a verity-protected store with the
      root hash embedded in a unified kernel image. It is undocumented in the
      manual and discoverable only by reading source, and nothing documents
      whether the root hash is signed.

      Reproducible builds are a genuine and long-standing strength in ambition,
      with a dedicated official site stating the goal and four published health
      check reports. But no percentage figures are published, and the linked
      dashboard's most recent evaluation at this snapshot was roughly eight
      months old. The claim is documented; the current measurement is not.

      No SBOM, provenance or attestation documentation exists. FIPS is not
      available: the request was closed as not planned and the pull request adding
      it has been open since 2025.

      The security team is two named people with published keys. No response-time
      commitment, embargo policy or numbering-authority status is published. There
      is a real vulnerability tracking service run in the project's own
      organization, which is more infrastructure than most community projects
      have.
