      retrieved: "2026-10-06"
      quote: "building images with a dm-verity protected nix store"
  - date: "2026-10-06"
    field: "open_questions"
    change: "Methodology section 9, rule 16: an entry whose maintainer affiliations are not published says so as an open question. Added 'How many maintainers does the project have, and who employs them? No maintainer count or maintainer affiliation is published. The steering committee's employers are published.' From d13 contribution_diversity and unknowns."
  - date: "2026-10-06"
    field: "tradeoffs"
    change: "Methodology section 9, rule 18: a status goes inside the buy for the capability it describes, when the project states a consequence in its own words. Moved cost c5 ('Flakes, which most modern tooling and most fleet tools assume, are an experimental feature that the manual says can change or be removed at any time.') into buy b4, which now ends 'Most deployment tooling assumes flakes, which the manual calls experimental and says can change or be removed at any time.'"
  - date: "2026-10-06"
    field: "tradeoffs.costs"
    change: "Methodology section 9, rule 18: a GPU driver rebuild applies to several entries and is costed on none of them. Removed cost c7 'Proprietary GPU drivers are unfree, so they are not built or cached by project infrastructure and the adopter compiles them locally.' The fact stays in d08."
  - date: "2026-10-06"
    field: "tradeoffs.costs"
    change: "Methodology section 9, rule 18: where community tooling lives is not assessed for every entry. Cost c9 reworded. Was 'No published network boot artifacts, and the most used remote-install and partitioning tooling is community-maintained outside the project's own organization.' Now 'No published network boot artifacts.' The tooling facts stay in d09."
  - date: "2026-10-06"
    field: "tradeoffs.costs"
    change: "Methodology section 9, rule 18: a stated stop of maintenance counts; the spread across organizations is not assessed for every entry. Cost c10 reworded. Was 'Fleet tooling is spread across four organizations: the one in the project's own organization is self-described as low maintenance, its successor is in development elsewhere with no release.' Now 'NixOps, the fleet tool in the project's own organization, says it is in low-maintenance mode and probably not suited for new projects; its successor has no release.' Verified verbatim on 2026-10-06; nixops4/nixops4 has no releases and no tags (gh api)."
    source:
      url: "https://github.com/NixOS/nixops"
      type: "source-repo"
      title: "NixOps README"
      retrieved: "2026-10-06"
      quote: "NixOps is in low-maintenance mode and probably not suited for new projects. Use at your own risks."
