taxonomy:
  workload_scope: kubernetes-oriented-host
  construction_model:
    - vendor-fixed-image
  root_state_substrate:
    - ab-partition-image
  notes: >-
    A container host rather than a Kubernetes appliance. It is the default and
    recommended node image for the vendor's managed Kubernetes service, and it
    is equally documented as a standalone Compute Engine image for running
    containers with no Kubernetes involved.

    Construction is vendor-fixed. Customization happens through defined tools
    that modify a published image, not by rebuilding the distribution, and the
    operating system does not accept public contributions.

dimensions:
  d01_os_model:
    normalized:
      workload_scope: kubernetes-oriented-host
      ships_kubernetes: false
      ships_container_runtimes: true
      lineage: "fork of the Chromium OS open-source project"
      open_source: partial
      runs_outside_vendor_cloud: "not supported"
    summary: >-
      A minimal container host derived from Chromium OS, with Docker,
      containerd and cloud-init preinstalled. It is the default node image for
      the vendor's managed Kubernetes, and also runs standalone on plain VMs.
    notes: >-
      The vendor's own statement about source availability is hedged and the
      hedge is theirs, not a paraphrase: the majority of the source code is in
      the public repositories. No document names which parts are not published.

      A third party can build it: the procedure is documented, with two board
      names for the two architectures, and includes running the result locally
      under emulation and importing it to the vendor's cloud. What is not
      supported is running it outside that cloud, which the documentation states
      plainly.

      The documentation is unusually direct about when not to use it, listing
      cases including applications that are not containerized, dependence on
      kernel modules or packages the image does not have, wanting professional
      support from a Linux vendor, and wanting full support outside the vendor's
      cloud.

      Kubernetes is recorded as not shipped on the strength of the release
      notes' per-build component table, which names the kernel, Docker,
      containerd and GPU drivers and no Kubernetes component. No page states
      it in words, and the same convention is applied to every other profile
      in this edition whose image carries no Kubernetes.
    evidence: DOCUMENTED
    sources:
      - url: https://docs.cloud.google.com/container-optimized-os/docs/resources/sources
        type: vendor-docs
        title: COS sources
        retrieved: "2026-09-22"
        quote: >-
          Container-Optimized OS from Google is a fork of the Chromium OS
          open-source project.
      - url: https://docs.cloud.google.com/container-optimized-os/docs/concepts/features-and-benefits
        type: vendor-docs
        title: Features and benefits
        retrieved: "2026-09-22"
        quote: >-
          Container-Optimized OS is not supported outside of the Google Cloud
          Platform environment.
      - url: https://docs.cloud.google.com/container-optimized-os/docs/how-to/building-from-open-source
        type: vendor-docs
        title: Building from open source
        retrieved: "2026-09-22"
        quote: >-
          To build Container-Optimized OS, specify lakitu (x86 image) or
          lakitu-arm64 (Arm image) for the board name as follows:
    unknowns:
      - "Which parts of a shipped image are not in the public repositories. The vendor says 'the majority' and names no exclusions."
      - "Whether a third-party build can reproduce an official image bit for bit. No reproducibility claim is made either way."
      - "No page states in words that the image carries no kubelet; the value rests on the release notes component table. Searched the features page, the node images page and the run-container page as well."

  d02_immutability:
    normalized:
      read_only:
        - /
      integrity_mechanism:
        - read-only-mount
      integrity_verification: "checksum computed at build time, verified by the kernel at each boot"
      dm_verity: unknown
      ephemeral:
        - /etc
        - /tmp
        - /var/lib/cloud
        - /mnt/disks
      writable_and_persistent:
        - /home
        - /var
        - /var/lib/docker
        - /var/lib/toolbox
        - /var/lib/google
        - /mnt/stateful_partition
      ephemeral_mechanism: tmpfs
      read_only_mechanism: root filesystem mounted read-only, checked by the kernel at boot
      configurable_paths:
        value: 'yes'
        evidence: DOCUMENTED
        how: 'Only to add storage: mount persistent disks in a subdirectory of /mnt/disks, from cloud-config bootcmd. /etc/fstab does not work because /etc is stateless.'
        sources:
          - url: https://docs.cloud.google.com/container-optimized-os/docs/concepts/disks-and-filesystem
            type: official-docs
            title: 'COS disks and file system: mounting disks'
            retrieved: '2026-10-12'
            quote: The disks can be mounted by creating a subdirectory under /mnt/disks directory.
          - url: https://docs.cloud.google.com/container-optimized-os/docs/concepts/disks-and-filesystem
            type: official-docs
            title: 'COS disks and file system: fstab'
            retrieved: '2026-10-12'
            quote: Since /etc/ is stateless on Container-Optimized OS, you cannot use /etc/fstab to automatically fsck
      mounts_sources:
        - url: https://docs.cloud.google.com/container-optimized-os/docs/concepts/disks-and-filesystem
          type: official-docs
          title: 'COS disks and file system: stateless partitions'
          retrieved: '2026-10-12'
          quote: Stateless partitions, which are writable but the contents do not persist across reboots.
        - url: https://docs.cloud.google.com/container-optimized-os/docs/concepts/disks-and-filesystem
          type: official-docs
          title: 'COS disks and file system: persistent paths'
          retrieved: '2026-10-12'
          quote: However, home directories and /mnt/stateful_partition are persistent and writable.
        - url: https://docs.cloud.google.com/container-optimized-os/docs/concepts/disks-and-filesystem
          type: official-docs
          title: 'COS disks and file system: working directories'
          retrieved: '2026-10-12'
          quote: These paths are working directories for Compute Engine packages (for example, the accounts manager service), Docker, and Toolbox respectively.
    summary: >-
      The root filesystem is always mounted read-only and the kernel refuses to
      boot if its integrity check fails. /etc is writable but stateless, so
      changes do not survive a reboot.
    notes: >-
      The stateless /etc is the operationally surprising property and the
      documentation draws out the consequence: enabling or disabling a systemd
      unit does not persist, and fstab cannot be relied on for boot-time mounts.
      Configuration must be reapplied on every boot, which is why cloud-init
      modules that normally run once per instance run on every boot here.

      Whether the integrity mechanism is dm-verity is recorded as unknown, and
      the distinction matters. The concept pages say only that a checksum is
      computed at build time and verified by the kernel. dm-verity is named by
      the vendor in a blog post about compliance scanning and in the
      documentation for a derived confidential-computing image, but not on the
      operating system's own concept pages. Rather than infer, this profile
      records what each source actually supports.

      Persistence across an upgrade is not stated as a guarantee anywhere. It is
      implied by the separate stateful partition, and it is recorded as an
      unknown rather than asserted.
    evidence: DOCUMENTED
    sources:
      - url: https://docs.cloud.google.com/container-optimized-os/docs/concepts/security
        type: vendor-docs
        title: COS security
        retrieved: "2026-09-22"
        quote: >-
          The Container-Optimized OS root filesystem is always mounted as
          read-only ... its checksum is computed at build time and verified by
          the kernel on each boot.
      - url: https://docs.cloud.google.com/container-optimized-os/docs/concepts/disks-and-filesystem
        type: vendor-docs
        title: Disks and filesystem
        retrieved: "2026-09-22"
        quote: >-
          The kernel verifies integrity root filesystem during boot up, and
          refuses to boot in case of errors.
      - url: https://docs.cloud.google.com/docs/security/confidential-space
        type: vendor-docs
        title: Confidential Space, dm-verity on a COS-derived image
        retrieved: "2026-09-22"
        quote: >-
          These partitions are immutable and protected by dm-verity.
    unknowns:
      - "Whether the stock operating system uses dm-verity for the root filesystem. It is named for a derived image and in a blog post, not on the OS concept pages."
      - "Whether the stateful partition survives an A/B upgrade is never stated as a guarantee."

  d03_artifact:
    normalized:
      primary_artifact: "cloud disk image"
      downloadable: unknown
      oci_registry_distribution: "companion tooling only, not the OS"
      content_addressable: unknown
      mirrorable: unknown
      signed: unknown
      air_gapped_capable: unknown
    summary: >-
      The artifact is a Compute Engine image selected by image family. No
      documentation offers it as a downloadable file. Kernel sources and
      headers are published per build in a public storage bucket.
    notes: >-
      Four image families exist per architecture: an LTS family per milestone,
      plus stable, beta and dev.

      Companion tooling is distributed as container images, which is where any
      OCI involvement sits. The operating system itself is not.

      Whether the image can be obtained as a file is recorded as unknown rather
      than absent. No documentation page offers a download, and the build page
      describes importing a self-built image into the platform rather than
      exporting a published one. The tooling repository does carry an OVA
      converter whose stated purpose includes exporting a Compute Engine image
      to OVA, which is source-level evidence that an export path exists for the
      customizer workflow, not a documented distribution channel.

      Image digests, mirroring, signing and air-gapped installation are all
      undocumented. Given the product boundary in d01, that is coherent rather
      than an oversight, but it is recorded as unknown because the questions have
      no published answers.
    evidence: DOCUMENTED
    sources:
      - url: https://docs.cloud.google.com/container-optimized-os/docs/concepts/versioning
        type: vendor-docs
        title: Versioning and milestones
        retrieved: "2026-09-22"
        quote: >-
          This family follows releases for a particular production-ready
          milestone. Images on this family receive only security and stability
          fixes.
      - url: https://docs.cloud.google.com/container-optimized-os/docs/resources/sources
        type: vendor-docs
        title: Sources and published build artifacts
        retrieved: "2026-09-22"
        quote: >-
          Additional image artifacts, including archived kernel sources and
          kernel headers, are also available in a public Google Cloud Storage
          bucket under gs://cos-tools/<build-number>/.
      - url: https://cos.googlesource.com/cos/tools/+/refs/heads/master/src/cmd/cos_ova_converter/README.md
        type: source-repo
        title: COS OVA converter README
        retrieved: "2026-09-22"
        quote: >-
          COS Ova Converter is a simple interface to convert the OVA images to
          GCE image in a GCP project and also exports the GCE image to OVA.
    unknowns:
      - "No documentation of image digests, mirroring, image signing, or air-gapped installation."
      - "Whether a published image can be obtained as a file. Searched the concept pages, the sources page and the build page; none documents a download or export path for the published image, and the OVA converter in the tooling repository is the only evidence found either way."

  d04_upgrade:
    normalized:
      fleet_upgrade:
        self_update: "In milestone 117 and later, the automatic updates feature is disabled by default."
        paths:
          - kind: managed-service
            name: "GKE node auto-upgrade"
            license: "service"
            class: service
            reconciliation: replacement
            filter: true
            note: "GKE drains nodes and re-creates them on a new image."
            evidence: DOCUMENTED
            sources:
              - url: https://cloud.google.com/kubernetes-engine/docs/concepts/node-auto-upgrades
                title: "GKE node auto-upgrades"
                retrieved: "2026-10-06"
                quote: >-
                  node auto-upgrade is enabled by default
      version_identity:
        identifier: "Milestone (VERSION_ID) plus build number (BUILD_ID), for example 12871.1160.0"
        condition: "none"
        evidence: DOCUMENTED
        sources:
          - url: https://cloud.google.com/container-optimized-os/docs/concepts/versioning
            type: official-docs
            title: "Container-Optimized OS versioning"
            retrieved: "2026-10-06"
      mechanism:
        - ab-partition-switch
        - image-replacement-redeploy
      scope_by_mode:
        In place: whole-os-image
        GKE: whole-node
      scope_sources:
        - url: https://docs.cloud.google.com/container-optimized-os/docs/concepts/auto-update
          type: vendor-docs
          title: Container-Optimized OS auto update
          retrieved: '2026-10-06'
          quote: uses an active-passive root partition scheme. The OS image is updated in its entirety, including the kernel
        - url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/node-pool-upgrade-strategies
          type: vendor-docs
          title: GKE node pool upgrade strategies (surge, blue-green)
          retrieved: '2026-10-06'
          quote: GKE creates a new surge node before removing an existing one
      initiator: "the instance itself, controlled by metadata"
      auto_update_default: false
      auto_update_default_note: "disabled by default from milestone 117 onward; enabled by default before that"
      requires_kubernetes: false
      requires_vendor_infrastructure: unknown
      self_hostable_update_server: unknown
      self_hostable_update_server_evidence: UNKNOWN
      self_hostable_update_server_note: "The update server is never named in the docs found. No page documents or denies a self-hosted or mirrored update source."
      self_hostable_update_server_searched: "Read on 2026-10-05: the COS auto-update page, the features and benefits page, and the COS sources page. None names the update server or describes a way to point an instance at another one. Only the cos-update-strategy metadata switch is documented."
      artifact_verification: unknown
    summary: >-
      An active-passive root partition scheme, with the whole image updated at
      once including the kernel rather than package by package. The update
      installs to the passive partition and takes effect on reboot.
    notes: >-
      A default changed and it is easy to miss: automatic updates are disabled by
      default from milestone 117 onward, and were enabled by default before that.
      The documentation is internally inconsistent on this point, because the
      features page still describes automatic weekly background updates while the
      auto-update and platform pages state the newer default. The auto-update
      page also contradicts itself: its design section still says the image
      ships with the feature enabled and that a default instance always
      downloads the latest version, two sections after stating the milestone
      117 default. Recorded as a documentation conflict.

      Two documented limits on in-place updates matter for anyone planning: they
      are not supported with UEFI Secure Boot enabled, and they are not supported
      on Arm images at all. Both are significant, and the first is an unusual
      interaction between two features a security-minded operator would want
      together.

      Managed Kubernetes node upgrades are a different mechanism entirely: node
      pool upgrades provision new nodes, cordon, drain and delete the old ones.
      That is image replacement, not in-place update, and the two are recorded
      separately.

      How the payload is authenticated is not documented. The only adjacent
      evidence is a note that images older than certain builds cannot update due
      to key rotation, which implies signing keys exist without describing the
      verification scheme. The update server is never named and no self-hosting
      path is documented or denied.
    evidence: DOCUMENTED
    sources:
      - url: https://docs.cloud.google.com/container-optimized-os/docs/concepts/auto-update
        type: vendor-docs
        title: Auto update
        retrieved: "2026-09-22"
        quote: >-
          Container-Optimized OS uses an active-passive root partition scheme.
          The OS image is updated in its entirety, including the kernel ... In
          milestone 117 and later, the automatic updates feature is disabled by
          default on all Container-Optimized OS images.
      - url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/node-pool-upgrade-strategies
        type: vendor-docs
        title: Node pool upgrade strategies
        retrieved: "2026-09-22"
        quote: >-
          maxSurge: GKE creates a new surge node before removing an existing one
      - url: https://docs.cloud.google.com/container-optimized-os/docs/concepts/features-and-benefits
        type: vendor-docs
        title: Features and benefits, conflicting update statement
        retrieved: "2026-09-22"
        quote: >-
          Container-Optimized OS instances are configured to automatically
          download weekly updates in the background; only a reboot is necessary
          to use the latest updates.
    unknowns:
      - "How an update payload is authenticated and verified. Not documented."
      - "The update server is never named, and no self-hosting or mirroring path is documented either way."
      - "Two documentation pages disagree on whether automatic updates are on by default, and the auto-update page disagrees with itself between its default section and its design section."

  d05_rollback_recovery:
    normalized:
      rollback_to_previous: unknown
      automatic_rollback_on_boot_failure: unknown
      retained_versions: unknown
      recovery_environment: unknown
      factory_reset: unknown
      network_independent_recovery: unknown
    summary: >-
      This is the largest documentation gap in the profile. An active-passive
      partition scheme exists, and nothing in the documentation describes how to
      use it to roll back, or whether the system does so on its own.
    notes: >-
      Every field here is unknown rather than absent, and the distinction is the
      point. The mechanism for rollback almost certainly exists, because the
      partition scheme is documented. What is missing is any published procedure
      to boot the previous partition, any statement about boot attempt tracking
      or automatic fallback, any recovery or rescue environment, any factory
      reset, and any statement of how many prior versions are retained.

      Searched: the concept pages, the full documentation index, the how-to
      pages, the project's own documentation repository, and site-scoped searches
      for recovery, rescue, factory reset, bootloader, partition priority and
      successful-boot terminology.

      Equivalent behaviour in the upstream lineage was deliberately not inferred,
      because that would be reverse-engineering rather than reporting.

      What does exist generically is the platform's interactive serial console,
      documented for troubleshooting an instance that cannot be reached over the
      network or is not fully booted, and it is disabled by default.
    evidence: UNKNOWN
    searched: >-
      The COS concept pages (auto-update, disks-and-filesystem, security,
      versioning, supported-filesystems), the full documentation index and
      how-to pages, cos.googlesource.com documentation, and site-scoped searches
      for recovery mode, rescue mode, factory reset, bootloader, GRUB, partition
      priority and boot success tracking. No COS-specific rollback or recovery
      documentation was found.
    sources:
      - url: https://docs.cloud.google.com/compute/docs/troubleshooting/troubleshooting-using-serial-console
        type: vendor-docs
        title: Troubleshooting using the serial console
        retrieved: "2026-09-22"
        quote: "By default, interactive serial port access is disabled."

  d06_customization:
    normalized:
      runtime_package_install: "none"
      mechanisms:
        - cos-customizer
        - cos-extensions
        - toolbox
        - cloud-init-on-every-boot
        - containers
      customization_points:
        - image-build
        - every-boot
        - runtime
      kernel_modules: "third-party modules permitted under a managed-Kubernetes feature; Google-signed only when enforcement is on"
      gpu: "NVIDIA drivers installed by a first-party extension command"
      add_software:
      - kind: vendor-extensions
        how: The cos-extensions utility installs the NVIDIA GPU driver (cos-extensions install gpu). The page read documents it for the GPU driver only. The docs also state that COS has no package manager, so packages cannot be installed directly on an instance.
        evidence: DOCUMENTED
        sources:
        - url: https://docs.cloud.google.com/container-optimized-os/docs/concepts/features-and-benefits
          type: vendor-docs
          title: 'Container-Optimized OS: features and benefits'
          retrieved: '2026-10-12'
          quote: Container-Optimized OS does not include a package manager; as such, you'll be unable to install software packages directly on an instance.
        - url: https://docs.cloud.google.com/container-optimized-os/docs/how-to/run-gpus
          type: vendor-docs
          title: Run GPUs on Container-Optimized OS VM instances
          retrieved: '2026-10-12'
          quote: Container-Optimized OS provides a built-in utility cos-extensions to simplify the NVIDIA driver installation process.
      - kind: derive-image
        how: COS Customizer creates a customized COS image from a COS VM. The GitHub repository is archived and points to cos.googlesource.com.
        evidence: DOCUMENTED
        sources:
        - url: https://cos.googlesource.com/cos/tools/+/refs/heads/master/src/cmd/cos_customizer/README.md
          type: source-repo
          title: COS Customizer README, cos.googlesource.com
          retrieved: '2026-10-12'
          quote: The COS Customizer is a tool for creating customized Container-Optimized OS images.
        - url: https://github.com/GoogleCloudPlatform/cos-customizer/blob/master/README.md
          type: source-repo
          title: COS Customizer README, GitHub (archived)
          retrieved: '2026-10-12'
          quote: '[ARCHIVED repository] COS Customizer has relocated to https://cos.googlesource.com/cos/tools.'
    summary: >-
      There is no package manager. Customization is an image-build tool, an
      extension installer for drivers, a debugging container, and cloud-init
      reapplied on every boot because /etc does not persist.
    notes: >-
      The GPU story is the strongest customization path here: a first-party
      command installs NVIDIA drivers, with a documented model list, and a
      version can be pinned. The constraints are stated: the milestone must be
      LTS and at least 85, and Arm images do not support the feature.

      Out-of-tree kernel modules have a documented path, and it is worth stating
      precisely because it is unusually restrictive. It is a managed-Kubernetes
      feature with two policies: enforce Google-signed modules only, or allow any
      module signed or unsigned. Without the feature, CPU and TPU nodes restrict
      out-of-tree module loading entirely, while GPU nodes allow it and are
      described by the vendor as less secure by default. Whether a third party
      can sign its own modules with its own key is not documented; the documented
      trust anchor is the vendor's key.

      The features overview page states flatly that the kernel is locked down
      and third-party kernel modules or drivers cannot be installed. The GPU
      page and the managed-Kubernetes module-loading page document paths that
      do exactly that. Recorded as a documentation conflict; this profile
      records the specific paths the more detailed pages describe.

      The image-build tool's former public GitHub repository is archived, with
      its last push dated 2021-08-25, and its README points to the vendor's own
      source host, where the tool carries a note that it is not an official
      product.
    evidence: DOCUMENTED
    sources:
      - url: https://docs.cloud.google.com/container-optimized-os/docs/how-to/run-gpus
        type: vendor-docs
        title: Running GPUs
        retrieved: "2026-09-22"
        quote: >-
          To run GPUs on Container-Optimized OS VM instances, the
          Container-Optimized OS release milestone must be a LTS milestone and
          the milestone number must be 85 or higher.
      - url: https://docs.cloud.google.com/kubernetes-engine/security/secure-modules-cos
        type: vendor-docs
        title: Secure kernel module loading
        retrieved: "2026-09-22"
        quote: >-
          enforces that any out-of-tree kernel modules are signed by Google
      - url: https://docs.cloud.google.com/container-optimized-os/docs/how-to/toolbox
        type: vendor-docs
        title: Toolbox
        retrieved: "2026-09-22"
        quote: >-
          toolbox is a debugging utility and not intended for production use.
      - url: https://docs.cloud.google.com/container-optimized-os/docs/how-to/osconfig
        type: vendor-docs
        title: OS config limitations
        retrieved: "2026-09-22"
        quote: >-
          packages and packageRepositories features of guest policies are not
          supported on Container-Optimized OS
      - url: https://docs.cloud.google.com/container-optimized-os/docs/concepts/features-and-benefits
        type: vendor-docs
        title: Features and benefits, conflicting kernel module statement
        retrieved: "2026-09-22"
        quote: >-
          The Container-Optimized OS kernel is locked down; you'll be unable to
          install third-party kernel modules or drivers.
      - url: https://github.com/GoogleCloudPlatform/cos-customizer
        type: source-repo
        title: Archived GitHub mirror of cos-customizer
        retrieved: "2026-09-22"
        quote: >-
          This Git repository is archived and is now read-only.
    unknowns:
      - "Whether a third party can sign its own out-of-tree kernel modules with its own key."
      - "Whether the module loading restrictions apply to standalone VMs or only to managed Kubernetes nodes."
      - "The features page says third-party kernel modules cannot be installed; the GPU and secure-module pages document installing them. Which statement describes a standalone VM is not stated."

  d07_kubernetes:
    normalized:
      requirement: optional
      bundled: "none"
      independent_lifecycle: unknown
      os_manages_kubernetes: "no"
      kubernetes_manages_os: "node auto-upgrade, release channels and node auto-repair, all managed-service features"
      distributions:
        - "the vendor's managed Kubernetes"
      managed_kubernetes_default_node_image: "yes; cos_containerd is the documented default node image of a new Standard cluster's default node pool"
      managed_kubernetes_sole_node_image: "yes on Autopilot; Autopilot nodes always use cos_containerd and no other node image can be selected"
      node_image_alternatives_on_standard:
        - ubuntu_containerd
        - windows_ltsc_containerd
    summary: >-
      Optional. It is the documented default node image for the vendor's managed
      Kubernetes, the only node image on that service's Autopilot mode, and
      equally documented for running containers on plain VMs with no Kubernetes
      at all.
    notes: >-
      Two separate facts about the managed Kubernetes service are worth keeping
      apart, because a reader comparing hyperscalers needs both and a single
      "supported" or "available" answer destroys the distinction.

      It is the **default**. A new Standard cluster's default node pool is
      created with the cos_containerd node image, stated in those words on the
      node pools concept page. An operator who selects nothing gets it. Ubuntu
      and Windows Server node images remain selectable on Standard.

      It is also the **only** option on Autopilot. Autopilot nodes always use
      cos_containerd, so on that mode there is no opt-out and no alternative to
      choose. That is a stronger statement than "default" and the two are
      recorded separately.

      Of the three hyperscaler platform operating systems in this edition, this
      is the only one whose managed Kubernetes service defaults to it. See the
      equivalent fields in bottlerocket.yaml and azure-container-linux.yaml for the
      contrast, which is a difference in the default, not in capability.

      On the managed service the two are coupled through the node image that
      ships with a given node version, and node upgrades recreate nodes. Whether
      the milestone can be pinned independently of the node version is not
      documented, so lifecycle independence is recorded as unknown rather than
      claimed either way.

      Off the managed service, the operating system updates through its own
      mechanism and there is no Kubernetes to couple to.

      Self-managed Kubernetes on this operating system is not documented
      anywhere.

      Note that the managed Kubernetes release channels version Kubernetes, not
      the operating system image. Those are two different axes and no published
      mapping between them was found.

      The bundled value rests on the release notes, which list the kernel,
      Docker, containerd and GPU drivers per build and no Kubernetes
      component. No page states in words that the image carries no kubelet.
      See d01.
    evidence: DOCUMENTED
    sources:
      - url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/node-images
        type: vendor-docs
        title: Node images
        retrieved: "2026-09-22"
        quote: >-
          GKE Autopilot nodes always use Container-Optimized OS with containerd
          (cos_containerd), which is the recommended node operating system.
      - url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/node-pools
        type: vendor-docs
