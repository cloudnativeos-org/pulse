        retrieved: "2026-09-22"
        quote: >-
          By default, this first node pool (known as the default node pool)
          consists of three nodes in each of the cluster's compute zones, with
          the default node image cos_containerd, and a general-purpose machine
          type.
      - url: https://docs.cloud.google.com/container-optimized-os/docs/how-to/run-container-instance
        type: vendor-docs
