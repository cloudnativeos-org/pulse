  d10_security:
    normalized:
      boot_trust_chain:
        level: 2
        how: platform-provided
        note: Shielded VM provides a vTPM, integrity monitoring and Secure Boot. The kernel checks a build-time root checksum on each boot, but no source shows that the hash
          sits in a signed artifact
        evidence: DOCUMENTED
        sources:
