tradeoffs:
  buys:
    - "A read-only root whose integrity the kernel verifies at every boot, refusing to boot on failure, with no configuration required."
    - "A stateless /etc, so configuration is reasserted from cloud-init on every boot and drift in system configuration is structurally hard."
    - "Hardened defaults: deny-inbound host firewall, AppArmor applied automatically to containers, hardened sysctls, a minimal userspace with no package manager."
    - "A preinstalled support-bundle collector and a preinstalled debugging container."
    - "A documented 26-month LTS window with a published milestone and end-of-support table, plus a stated patching cadence separating on-demand high-priority fixes from quarterly refreshes."
    - "Platform integration for shielded and confidential computing across three processor technologies on current milestones."
    - "A first-party GPU driver installer with pinnable versions."
    - "The documented default node image on the vendor's managed Kubernetes, and the only node image on that service's Autopilot mode."
  costs:
    - "An active-passive partition scheme exists, and no published procedure uses it for rollback."
    - "Documented as not supported outside the vendor's cloud. The same artifact is not portable to other clouds, bare metal or on-premises, and the vendor's own on-premises Kubernetes uses different operating systems."
    - "Single vendor. The operating system does not accept public contributions. A third party who finds a defect has no public issue tracker and no path to fix it themselves."
    - "The majority of the source is published, with no exclusion list and no reproducibility claim, so a third party cannot fully verify what they run."
    - "Two vendor pages disagree on whether automatic updates are on by default from milestone 117."
    - "Enabling Secure Boot disables in-place updates, so the two features cannot be used together."
    - "Arm images have no automatic updates and no GPU support."
    - "Under the enforced policy, out-of-tree kernel modules must be signed by the vendor."
    - "Two vendor pages disagree about end-of-support dates for current milestones."
maintainers_fact:
  text: "Single vendor."
  evidence: DOCUMENTED
  sources:
    - url: "https://docs.cloud.google.com/container-optimized-os/docs/resources/sources"
      type: "vendor-docs"
      title: "COS sources and contributions"
      retrieved: "2026-09-22"
      quote: "Container-Optimized OS does not accept direct contributions from the public."
known_issues: []
open_questions:
  - "Which parts of a shipped image are not in the public repositories, and why?"
  - "Can a third party reproduce an official image bit for bit from the public manifest?"
  - "How is an update payload authenticated and verified? Which keys, which scheme, and what is the rotation policy?"
  - "Which update server does the updater contact, and is there any supported way to mirror or self-host it?"
  - "Does the stock operating system use dm-verity for the root filesystem? If so, why do the concept pages describe it only as a kernel-verified checksum?"
  - "What happens when an instance fails to boot a newly updated partition? Is there boot attempt tracking and automatic fallback, or is recovery entirely manual?"
  - "How many previous versions are retained, and is there a supported procedure to boot the previous root partition?"
  - "Does the stateful partition survive an A/B upgrade as a supported guarantee?"
  - "Is there a recovery path for an instance with no network and a corrupted stateful partition? Is there a factory reset?"
  - "Why were automatic updates turned off by default at milestone 117, and what is the expected update mechanism for standalone fleets now?"
  - "Which page is authoritative for end-of-support dates, the release notes table or the compute image details table?"
  - "Can a third party sign its own out-of-tree kernel modules, or is the vendor's key the only trust anchor? Do the module restrictions apply to standalone VMs or only to managed Kubernetes nodes?"
  - "Is an SBOM, provenance or FIPS validation published or planned?"
  - "Is there a public issue tracker where a non-customer can file a bug?"
  - "Is the documented cadence of three LTS milestones a year still accurate, given published end-of-life dates six months apart?"
  - "Does the managed service install the kubelet at node bootstrap, or is it present in the image? No page states it in words; the release notes component table names no Kubernetes component, which is what the bundled value rests on."
  - "Can a published image be exported as a file through the platform's generic image export, and is that supported? The tooling repository ships an OVA converter that exports a Compute Engine image, and no documentation page describes either path for this OS."
  - "The features page says third-party kernel modules and drivers cannot be installed, while the GPU page and the managed-Kubernetes module-loading page document installing them. Which statement applies to a standalone VM?"
  - "Under which licence is the cos-extensions tooling repository published? It carries no LICENSE file."

