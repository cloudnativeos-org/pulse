schema_version: "1.0.0"
edition: "2026"
id: cos
name: Container-Optimized OS
homepage: https://docs.cloud.google.com/container-optimized-os/docs
repository: https://cos.googlesource.com/
collected_at: "2026-09-15"

entry_kind:
  - platform-os

category_fit:
  comparable: partial
  note: >-
    A vendor platform operating system. It is architecturally comparable to the
    other image-based systems here, with a read-only integrity-checked root and
    A/B updates, but two facts limit how far it can be compared.

    It is documented as not supported outside Google Cloud, and it does not
    accept public contributions to the operating system itself. So dimensions
    that ask about portability and community participation have answers that
    reflect a product boundary rather than a technical one.

    Documentation is the only usable evidence for several dimensions, and where
    it is silent this profile records unknown generously rather than
    reverse-engineering undocumented internals.

self_description:
  text: >-
    Container-Optimized OS is an operating system image for your Compute Engine
    VMs that is optimized for running Docker containers.
  source:
    url: https://docs.cloud.google.com/container-optimized-os/docs
    type: vendor-docs
    title: Container-Optimized OS documentation
    retrieved: "2026-09-22"

version_observed:
  version: "cos-129-19506-448-36"
  released: "2026-09-17"
  channel: "milestone 129 LTS"
  method: >-
