          retrieved: '2026-10-06'
          quote: its checksum is computed at build time and verified by the kernel on each boot
        - url: https://docs.cloud.google.com/compute/shielded-vm/docs/shielded-vm
          type: official-docs
          title: Shielded VM
          retrieved: '2026-10-06'
          quote: vTPM and integrity monitoring are enabled by default, and Google recommends enabling Secure Boot if possible.
      secure_boot: "available through the platform's shielded VM feature, off by default"
      measured_boot: "available through the platform's shielded VM feature"
      tpm: "virtual TPM through shielded VM"
      integrity: "kernel-verified checksum at boot"
      dm_verity: unknown
      disk_encryption: "platform-level encryption at rest; no OS-specific mechanism documented"
      artifact_verification: unknown
      sbom: unknown
      provenance: unknown
      fips: unknown
      mandatory_access_control: apparmor
      host_firewall: "default deny inbound except SSH"
      default_on:
        - read-only-root
        - boot-integrity-verification
        - host-firewall-deny-inbound
        - apparmor-default-profile-for-containers
        - kernel-hardening-and-hardened-sysctls
        - out-of-tree-module-restriction-on-cpu-nodes
      opt_in:
        - secure-boot
        - measured-boot
        - confidential-computing
        - signed-module-enforcement
    summary: >-
      Strong defaults in the areas the vendor controls: read-only verified root,
      a deny-inbound host firewall, AppArmor applied automatically to containers,
      hardened kernel settings, and a minimal userspace with no package manager.
    notes: >-
      It ships AppArmor, not SELinux, and applies a default profile automatically
      when a container starts. That is worth stating because the two are often
      treated as interchangeable and they are not.

      Secure Boot and measured boot are platform features rather than operating
      system features, opt-in, and the platform does not enable Secure Boot by
      default. And as recorded in d04, enabling Secure Boot disables in-place
      operating system updates, which is an awkward interaction for an operator
      who wants both.

      Disk encryption has no operating-system-specific documentation. The
      platform encrypts all data at rest by default with vendor-managed keys,
      which is a platform property and is kept distinct here.

      No software bill of materials, no build provenance or attestation, and no
      FIPS validation is documented for this operating system. These are
      recorded as unknown rather than absent, because no source states either
      way; the targeted searches are listed in the unknowns below.

      The security patching process is documented concretely, which is a
      strength: active patching for critical bugs during the support window,
      regular vulnerability scanning, high-priority fixes released on demand, and
      medium and low priority fixes every three months. Individual vulnerabilities
      are named in release notes and in security bulletins for the managed
      Kubernetes service. No numeric response-time commitment is published.
    evidence: DOCUMENTED
    sources:
