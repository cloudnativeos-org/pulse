  d14_maturity:
    normalized:
      first_release: "2017-04-05"
      current_version: "cos-129-19506-448-36"
      current_version_date: "2026-09-17"
      release_cadence: "a new LTS milestone approximately three times a year; builds on a supported milestone land weekly or faster"
      observed_intervals: "5, 7, 8 and 9 days between the last five builds on the current LTS milestone (2026-08-19, 08-24, 08-31, 09-08, 09-17)"
      support_model: lts-stream
      support_window: "26 months per LTS milestone"
      commercial_support: available
    summary: >-
      Nine years old, generally available since April 2017. Support is LTS only:
      a milestone is supported for 26 months and the non-LTS families receive no
      support at all.
    notes: >-
      The lifecycle is documented in detail, with a published table of milestones
      and end-of-support dates, and documented behaviour at deprecation: images
      are flagged, drop out of active listings, and family references begin
      returning errors while the images stay usable by exact name.

      Two problems with the dates are worth recording for anyone depending on
      them. Two of the vendor's own pages give different end-of-support dates for
      the same two current milestones, differing by four and five months. And
      the documented cadence of approximately three LTS milestones a year does
      not reconcile with the published end-of-life dates, which sit six months
      apart.

      Commercial support runs through the vendor's standard support channels at
      no separate licence fee, and the vendor explicitly names the absence of
      third-party Linux vendor support as a reason this may not fit.
