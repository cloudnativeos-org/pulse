      config_mechanism: "cloud-init through instance metadata, plus startup scripts"
      config_reapplied: true
      iso: "none"
      pxe: "none"
    summary: >-
      One path: launch the vendor's image and supply cloud-init or a startup
      script through instance metadata. There is no ISO, no network boot and no
      bare-metal install.
    notes: >-
      Because /etc is stateless, configuration semantics differ from other
      systems in a way that matters: cloud-init modules that normally run once
      per instance run on every boot here. That is a genuine advantage for drift,
      since configuration is continuously reasserted, and a genuine constraint,
      since anything not expressed in that configuration is lost on reboot.

      The container deployment agent that used to configure a container at VM
      creation time is documented as deprecated, with the current guidance being
      to run containers from a startup script or cloud-init.

      ISO, network boot and bare-metal installation are recorded as absent rather
      than unknown: the documentation was searched specifically for them and the
      product is documented as cloud-only.
