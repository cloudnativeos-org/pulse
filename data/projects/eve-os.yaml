schema_version: "1.0.0"
edition: "2026"
id: eve-os
name: EVE-OS
homepage: https://www.lfedge.org/projects/eve/
repository: https://github.com/lf-edge/eve
collected_at: "2026-10-05"

entry_kind:
  - distribution

category_fit:
  comparable: partial
  note: >-
    EVE-OS is a type-1 hypervisor operating system for edge devices, managed
    by a remote controller. Its unit of work is an Edge Container (a virtual
    machine, a container or a unikernel), not a Kubernetes node. Kubernetes
    exists only in the separate EVE-k build flavor (HV=k), which bundles k3s.
    The default build flavor (HV=kvm) ships no Kubernetes. This profile
    therefore describes the project as a whole and records the EVE-k
    differences inside each dimension. Dimensions about the OS lifecycle
    (immutability, A/B update, rollback, provisioning, security, governance,
    maturity) compare directly. Dimensions about Kubernetes (d07, d12 Cluster
    API) apply to the EVE-k flavor only. The entry was approved for the matrix
    on 2026-10-05 on the basis of EVE-k.

self_description:
  text: >-
    Edge Virtualization Engine (EVE) is a secure by design operating system
    that supports running Edge Containers on compute devices deployed in the
    field.
  source:
    url: https://github.com/lf-edge/eve/blob/master/docs/README.md
    type: official-docs
    title: lf-edge/eve docs/README.md
    retrieved: "2026-10-05"
    quote: >-
      Edge Virtualization Engine (EVE) is a secure by design operating system
      that supports running Edge Containers on compute devices deployed in the
      field.

