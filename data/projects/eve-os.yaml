  - "Is Secure Boot supported, and with which key chain? The repository documentation does not describe it."
  - "Is the root image verified at runtime beyond the read-only mount (dm-verity or similar)?"
  - "Are release artifacts and installers signed, and is there SLSA style provenance?"
  - "Who holds the EVE trademark, and where is the LF Edge governance page that states it?"
  - "Is the Xen build still maintained, given that the Makefile no longer lists it as a supported HV value?"
  - "What is the published LTS support duration, and is the 36 month figure from the ZEDEDA policy page correct?"
  - "Can Kubernetes be upgraded without a full EVE-k image update? (17.0.0-lts ships k3s v1.34.2+k3s1 per its release notes.)"
  - "Can ZEDEDA Cloud be self-hosted, and does Edge Sync act as a local controller?"
  - "Is there a documented recovery environment or factory reset procedure for a device that cannot boot?"
  - "Is there any Cluster API integration for EVE-k outside the repository?"
  - "Is the Raspberry Pi 4 and 5 support a released artifact of the current release, and under which platform tag?"
  - "When was the first EVE release?"

