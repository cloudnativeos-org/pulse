tradeoffs:
  buys:
    - "A/B root partitions with a 10 minute post-update health test and automatic fall back, with no operator action, which protects remote devices against a failed update."
    - "Applications and the last applied configuration keep running, with no age limit, when the controller is unreachable, and the vault unseals locally from the TPM."
    - "Measured boot, TPM sealed disk encryption, remote attestation and an integrity token tied to the controller form a documented security design aimed at devices in untrusted locations. It needs TPM 2.0; without one there is no encryption at rest."
    - "One host runs virtual machines, containers and unikernels, with PCI and GPU passthrough documented, so workloads that do not fit a container-only node can share the device."
    - "An open API and an open-source reference controller (Adam), with the update source any datastore the operator names."
    - "Hosted by LF Edge at Stage 3 with a TSC and published governance."
  costs:
    - "A controller is mandatory. Without one the device receives no configuration or updates. The open-source reference controller states it is not built for scale or attack resistance, and the production controller named in the guide is commercial."
    - "Kubernetes exists only in the separate EVE-k build flavor. Upgrading from EVE-k to another flavor is not supported, and moving a device to EVE-k needs it to hold no volumes."
    - "Mandatory access control does not cover workloads: the AppArmor profiles shipped with EVE confine EVE's own components and are not applied to edge applications."
    - "Production builds have no ssh, so diagnosis depends on the controller, edge-view or a debug build."
    - "Four of six maintainers use a ZEDEDA email address."
    - "No application can run as a plain POSIX process on the host, so existing host-level agents and tools must be repackaged as Edge Containers."
    - "The success test for a new base image includes a controller connection, so a version that runs correctly but cannot reach the controller is rolled back."
maintainers_fact:
  text: "Four of six maintainers use a ZEDEDA email address."
  evidence: DOCUMENTED
  sources:
