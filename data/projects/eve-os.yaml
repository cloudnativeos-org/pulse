              quote: 'CLUSTER_TYPE_REPLICATED_STORAGE : (k3s + multus) and kubevirt, cdi, longhorn.'
    summary: >-
      Kubernetes is optional and exists only in the EVE-k build flavor
      (HV=k), which runs k3s in a kube service container, with KubeVirt and
      Longhorn in the replicated storage mode. The default build flavor
      (HV=kvm) ships no Kubernetes.
    notes: >-
      The Makefile excludes the kube package from builds other than HV=k, so
      EVE-k is a different image and not a switch in the default one. The EVE-k
      page says the EVE API controller configuration defines a cluster type
      for the k3s instance, so the OS (through its controller configuration)
      manages the Kubernetes instance. Upgrading from EVE-k to another flavor
      is not supported in any case, and upgrading to EVE-k is supported only
      while the device has no volumes.

      The EVE-k page lists a three-node cluster in which each node is an etcd
      master, with a tie-breaker node option. It states that the VXLAN
      overlay carries traffic unencrypted and unauthenticated, so the cluster
      network must be trusted.

      The LF Edge announcement of 2025-03-31 reports edge node clustering
      with groups of three EVE nodes, and a talk that cited over 10,000
      single-node Kubernetes clusters and VMs running in production. Those
      figures come from the announcement and are not independently verified.

      The ZEDEDA 17.0 LTS release notes (a commercial vendor page, found
      through search and not read directly because the page returned HTTP 403)
      list strict node affinity for EVE-k applications as a feature of the
      ZEDEDA Edge Kubernetes Service. That is a vendor service built on
      EVE-k and is not recorded as a capability of the open-source OS.

      The workload API of EVE is not the Kubernetes API. The docs describe
      EVE-k as keeping EVE's own application model, with Kubernetes objects
      used underneath.
