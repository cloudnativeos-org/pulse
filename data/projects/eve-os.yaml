  d05_rollback_recovery:
    normalized:
      rollback_to_previous: available
      automatic_rollback_on_boot_failure: available
      automatic_rollback_trigger: "after the new version boots, the device does not stay connected to the controller with all agents running for the test period (default 10 minutes)"
      automatic_rollback_attempts: "the device remembers a failed version and refuses to retry it while the controller keeps requesting it"
      retained_versions: 2
      recovery_environment: unknown
      factory_reset: unknown
      network_independent_recovery: partial
    summary: >-
      EVE falls back to the previous root partition by itself if the new
      version fails its post-update test, and reports the failure to the
      controller. Two root partitions exist, so one previous version is
      retained.
    notes: >-
      The fallback decision is local, but the test includes a connection to
      the controller. A new version that boots and runs correctly but cannot
      reach the controller within the test period is treated as failed. That
      is why network_independent_recovery is recorded as partial: the revert
      needs no operator or controller action, while the pass condition needs
      the network.

      The documentation says the dual partition design is robust against power
      failure during the flash write, a hung boot, bugs in EVE or the dom0
      kernel, and a broken network driver.

      The retained version count of two is derived from the two root
      partitions, IMGA and IMGB. No page states the number in those words.
      A manual rollback is an update to the older image through the same
      controller interface. That path is not described as a rollback in the
      pages read.

      The persist partition (applications and encrypted vault) is outside the
      A/B pair, so a root rollback does not revert application state. The
      vault key is sealed to TPM registers that change with the boot chain,
      so the security document describes a controller step after an update
      to release a backup key (d10).

      EVE-k. Upgrade from HV=k to another flavor is documented as not
      supported, because the vault layout cannot be converted back. A rollback
      across flavors is therefore not available.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/lf-edge/eve/blob/master/docs/BASEIMAGE-UPDATE.md
        type: official-docs
        title: lf-edge/eve baseimage update
        retrieved: "2026-10-05"
        quote: >-
          EVE will automatically fall back to the old version and report the
          failure
      - url: https://github.com/lf-edge/eve/blob/master/docs/BASEIMAGE-UPDATE.md
        type: official-docs
        title: lf-edge/eve baseimage update, failed version memory
        retrieved: "2026-10-05"
        quote: the device will refuse to try it since it remembers that it tried and failed
      - url: https://github.com/lf-edge/eve/blob/master/docs/README.md
        type: official-docs
        title: lf-edge/eve docs/README.md, partitioning
        retrieved: "2026-10-05"
        quote: IMGB (second copy of EVE's read-only root filesystem)
      - url: https://github.com/lf-edge/eve/blob/master/docs/EVE-K.md
        type: official-docs
        title: lf-edge/eve EVE-k, upgrades
        retrieved: "2026-10-05"
        quote: >-
          a vault migrated to the `HV=k` zvol layout has no path back to a
          filesystem dataset the other flavors can read
