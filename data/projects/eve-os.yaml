  d10_security:
    normalized:
      boot_trust_chain:
        level: 2
        how: always-on
        note: Measured boot with remote attestation. GRUB measures the root filesystem into PCR 13 at boot,
          and the vault key is sealed to PCR 0 to 4 and 6 to 14 by default. Needs a TPM. Secure Boot is not
          documented
        evidence: DOCUMENTED
        sources:
        - url: https://raw.githubusercontent.com/lf-edge/eve/master/docs/SECURITY-ARCHITECTURE.md
          type: official-docs
          title: EVE-OS security architecture
          retrieved: '2026-10-06'
          quote: Separately measured boot with remote attestation will ensure that the device is running the expected versions and hashes of firmware and of the EVE software.
        - url: https://github.com/lf-edge/eve/blob/e10c5710f5ab5781458a8436a43593065d8b35b7/pkg/grub/rootfs.cfg#L125
          type: source-code
          title: EVE-OS GRUB rootfs.cfg
          retrieved: '2026-10-06'
          quote: measurefs $root --pcr 13
      secure_boot: unknown
      measured_boot: available
      measured_boot_registers: "PCR 1 (boot options), PCR 8 (grub.cfg), PCR 14 (CONFIG partition contents); sealing policy is configurable by the controller"
      remote_attestation: available
      tpm: "TPM 2.0 with SHA256 banks required for the minimum hardware security level"
      integrity: read-only-mount
      integrity_scope: "root filesystem image"
      disk_encryption: "fscrypt on ext4 or native ZFS encryption for the persist vault, key sealed to the TPM; no encryption at rest without a working TPM"
      artifact_verification: "sha256 digest in controller configuration; object signing for configuration"
      sbom: "SPDX json per image variant"
      provenance: unknown
      fips: unknown
      mandatory_access_control: "AppArmor profiles confine EVE's own components (swtpm, vtpm, vector) and are not applied to edge applications"
      default_on:
        - measured-boot
        - vault-encryption-when-tpm-present
        - production-builds-without-ssh
      opt_in:
        - remote-access-for-debug
    summary: >-
      EVE measures its boot chain and CONFIG partition into TPM registers,
      seals the vault key to them and supports remote attestation through the
      controller. Without a working TPM there is no encryption at rest.
      Secure Boot is not described in the repository documentation.
    notes: >-
      The security architecture document says measured boot with remote
      attestation ensures the device runs the expected firmware and software,
      and describes an integrity token that the controller issues after
      successful attestation and that the device needs for configuration
      requests. The vault key is generated on the device, sealed to PCR
      values and also encrypted with a TPM wrapped key escrowed with the
      controller. After an update changes the boot chain, the controller
      validates the new PCR values by attestation and returns the encrypted
      key. Release 17.0.0-lts adds a flexible PCR policy: the controller can
      change which registers seal the key, and the device reseals without
      reinstall.

      The security hardware page states that EVE performs no encryption at
      rest at all on a device without a working TPM and reports data at rest
      as disabled.

      A change to the controller address or certificate, or to the remote
      access status, changes PCR 14 and leaves the vault sealed until the
      controller releases the backup key. The text user interface that can
      change the controller address renders only on a locally attached
      monitor and only before onboarding.

      Remote access: production builds have no way to ssh into the device,
      per the FAQ. Developer and debug builds can enable ssh with a
      configuration property. The security document describes building an
      image with edge-view and ssh disabled, and says re-enabling needs the
      controller plus physical access.

      Mandatory access control: the security architecture document says the
      AppArmor profiles shipped with EVE confine EVE's own components, such as
      swtpm, vtpm and vector, and the document states they are not applied to
      edge applications. The pages read do not mention SELinux.

      Project security process: the repository has a SECURITY.md that lists
      supported versions for security fixes (see d14), and the README carries
      OpenSSF Best Practices and Scorecard badges. A badge is a pointer to
      another site and is not evidence of its result.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/lf-edge/eve/blob/master/docs/SECURITY-ARCHITECTURE.md
        type: official-docs
        title: lf-edge/eve security architecture
        retrieved: "2026-10-05"
        quote: >-
          Separately measured boot with remote attestation will ensure that the
          device is running the expected versions and hashes of firmware and of
          the EVE software.
      - url: https://github.com/lf-edge/eve/blob/master/docs/SECURITY-HARDWARE.md
        type: official-docs
        title: lf-edge/eve hardware security recommendation
        retrieved: "2026-10-05"
        quote: >-
          EVE performs no encryption at rest at all on a device without a
          working TPM
      - url: https://github.com/lf-edge/eve/blob/master/docs/MEASURED-CONFIG.md
        type: official-docs
        title: lf-edge/eve measured config
        retrieved: "2026-10-05"
        quote: EVE measures the contents of the CONFIG partition into TPM PCR 14 on every boot
      - url: https://github.com/lf-edge/eve/blob/master/docs/BOOTING.md
        type: official-docs
        title: lf-edge/eve booting
        retrieved: "2026-10-05"
        quote: grub.cfg is measured to PCR 8
      - url: https://github.com/lf-edge/eve/blob/master/docs/FAQ.md
        type: official-docs
        title: lf-edge/eve FAQ
        retrieved: "2026-10-05"
        quote: >-
          For developer or debug builds of EVE you can set a debug.enable.ssh
          property to your ssh public key.
      - url: https://github.com/lf-edge/eve/blob/master/docs/LOCAL-TUI.md
        type: official-docs
        title: lf-edge/eve local text user interface
        retrieved: "2026-10-05"
        quote: >-
          The UI is rendered on a local TTY (/dev/tty2) only i.e. on a physical
          monitor attached to the system.
    unknowns:
      - "Secure Boot. Searched every file in docs/ of lf-edge/eve for secure boot, secureboot and shim (the matches for shim concern the container shim VM). docs/BIOS-FIRMWARE.md lists the firmware options EVE expects (VT-x, VT-d, watchdog, TPM 2.0) and does not list Secure Boot. Not recorded as absent."
      - "Which PCR set is the default seal policy. SECURITY-ARCHITECTURE.md says typically firmware, bootloader, root filesystem and kernel configuration. The 17.0.0 release makes the policy controller-defined."
      - "FIPS status. The documentation mentions FIPS only as a citation for a key derivation function. Searched docs/ for fips."
      - "Provenance and artifact signing, see d03."

