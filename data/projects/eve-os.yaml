      methods:
        - raw-disk-image
        - iso-installer
        - pxe
        - ipxe
      config_mechanism: "bootstrap-config.pb (protobuf) for network settings, then controller configuration after registration"
      config_reapplied: "bootstrap config is applied once; controller configuration is reconciled continuously"
      identity: "onboarding certificate and serial number, then a device certificate generated on the device (in the TPM when present)"
      unattended: "yes, after the installer image is prepared"
    summary: >-
      EVE is installed from a raw disk image, an ISO or a network boot. The
      installer can carry a bootstrap configuration with controller
      connection details. The device then registers with the controller and
      receives its full configuration from it.
    notes: >-
      The installer image writes the live image to local storage and then
      shuts down the device. The bootstrap-config.pb file is protobuf encoded,
      is used and applied only once, and a hash is recorded so it is not
      applied again. At minimum EVE needs the host name, port and certificate
      of the controller. A legacy override.json for network settings is
      marked deprecated.

      Registration: the device sends a POST request to the register endpoint
      with the onboarding certificate, hardware serial and a soft serial, and
      generates a device certificate, using a TPM when available. The
      certificate is saved in TPM NVRAM so the identity survives a disk
      replacement.

      The documented promise is zero touch: after installation no physical
      access should be needed. In practice the security design restricts the
      local text user interface to a physical monitor, to prove the presence
      of an operator.

      This is a declarative model at the controller level: the controller
      holds the desired state and the documentation describes EVE as
      eventually consistent. It differs from a first-boot-only model, since
      configuration is reconciled continuously after registration.
    evidence: DOCUMENTED
    sources:
