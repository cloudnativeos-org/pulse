taxonomy:
  workload_scope: general-purpose-host
  construction_model:
    - vendor-fixed-image
  root_state_substrate:
    - ab-partition-image
  notes: >-
    The value general-purpose-host is the closest in the closed vocabulary and
    is imprecise. EVE is a hypervisor host with no POSIX application
    environment: its documentation says applications must be Edge Containers.
    Kubernetes is absent from the default build and present in the EVE-k
    flavor. The project documents a custom-build path (modify a package, set a
    kernel tag), but it presents released images as the normal way to consume
    EVE, so the construction model is recorded as vendor-fixed-image only.

dimensions:
  d01_os_model:
    normalized:
      workload_scope: general-purpose-host
      ships_kubernetes: "only in the HV=k (EVE-k) build flavor"
      build_flavors:
        - "kvm (default; the HV_DEFAULT value in the Makefile)"
        - "k (EVE-k, adds a k3s based kube service)"
        - "mini (listed as a supported HV value; documented as the default for riscv64)"
      workloads_supported:
        - virtual-machine
        - container
        - unikernel
      management_model: remote-controller
    summary: >-
      A type-1 hypervisor operating system for edge devices. Applications run
      as virtual machines, containers or unikernels, and the device is managed
      through an API by a remote controller. Kubernetes is a separate build
      flavor, EVE-k.
    notes: >-
      The build flavor is chosen at build time with the HV variable. The
      Makefile in the repository lists kvm, k and mini as the supported values
      and sets kvm as the default. The release of 2026-07-27 (17.0.0-lts)
      publishes two flavors, kvm and k, for amd64 and arm64. Xen is described
      in docs/HYPERVISORS.md as one of the hypervisors EVE supports, but it is
      not in the HV_SUPPORTED list of the current Makefile and no Xen artifact
      is in the 17.0.0-lts release. A statement that default builds are KVM or
      Xen therefore does not match the current Makefile: the current default
      is KVM.

      The documentation says EVE does not support traditional POSIX style
      applications and processes, and that it was inspired by Qubes OS,
      ChromeOS, CoreOS and SmartOS. The EVE controller is described as
      relating to EVE the way Kubernetes relates to a container engine.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/lf-edge/eve/blob/master/docs/README.md
        type: official-docs
        title: lf-edge/eve docs/README.md
        retrieved: "2026-10-05"
        quote: >-
          EVE is based on a type-1 hypervisor and it does not directly support
          traditional POSIX-like application and processes.
      - url: https://github.com/lf-edge/eve/blob/master/Makefile
        type: source-repo
        title: lf-edge/eve Makefile
        retrieved: "2026-10-05"
        quote: HV_SUPPORTED=kvm k mini
      - url: https://github.com/lf-edge/eve/blob/master/docs/HYPERVISORS.md
        type: official-docs
        title: lf-edge/eve docs/HYPERVISORS.md
        retrieved: "2026-10-05"
        quote: EVE is using it for all the hypervisors it supports.
      - url: https://github.com/lf-edge/eve/blob/master/docs/BUILD.md
        type: official-docs
        title: lf-edge/eve docs/BUILD.md
        retrieved: "2026-10-05"
        quote: "`kvm` (amd64, arm64) or `mini` (riscv64)"
    unknowns:
      - "Whether the Xen build is still maintained. docs/HYPERVISORS.md describes it, the Makefile HV_SUPPORTED list omits it, and the repository README lists only kvm and mini."

  d02_immutability:
    normalized:
      read_only:
        - "IMGA and IMGB root filesystem images (squashfs by default)"
        - "CONFIG partition, from the point of view of EVE"
        - "EFI System partition, in practice"
      writable_and_persistent:
        - "persist partition (P3), holding application volumes and the encrypted vault"
      integrity_mechanism:
        - read-only-mount
      survives_upgrade:
        - "the persist partition"
        - "the CONFIG partition"
      read_only_mechanism: ext4 optional at build; EVE overlays a tmpfs layer at boot
      configurable_paths:
        value: 'no'
        evidence: INFERRED
        inferred_from: The partition list in docs/README.md and the install options in docs/BOOTING.md name no setting that changes which paths are persistent. The install options set which disk holds the persistent data.
        how: Install options choose the disk for persistent data (eve_persist_disk) and its ZFS RAID level. No option found changes which paths are persistent.
        sources:
          - url: https://github.com/lf-edge/eve/blob/e933b99/docs/BOOTING.md
            type: source-repo
            title: 'EVE docs: install options'
            retrieved: '2026-10-12'
            quote: '`eve_persist_disk=DISK` - set particular disk to use for persistent data (volumes, logs, etc.).'
      mounts_sources:
        - url: https://github.com/lf-edge/eve/blob/e933b99/docs/README.md
          type: source-repo
          title: 'EVE docs: the P3 partition'
          retrieved: '2026-10-12'
          quote: P3 (read-write filesystem that extends to the rest of the available storage medium)
        - url: https://github.com/lf-edge/eve/blob/e933b99/docs/BUILD.md
          type: source-repo
          title: 'EVE docs: rootfs image format'
          retrieved: '2026-10-12'
          quote: a live bootable rootfs filesystem image. This can be either
        - url: https://github.com/lf-edge/eve/blob/0e1afbf619e8800745d4481b91b6abd4b765d73b/docs/BOOTING.md
          type: source-repo
          title: 'EVE docs: BOOTING.md, stacked root filesystem'
          retrieved: '2026-10-12'
          quote: EVE leverages Alpine's ability to create an overlayfs-based stacked rootfilesystem by specifying
    summary: >-
      The root filesystem is a read-only image, squashfs by default, held in
      one of two partitions. Writable state sits on a separate persist
      partition. The documentation describes no dm-verity protection of the
      root image.
    notes: >-
      The partition layout is an EFI System partition, IMGA, IMGB, CONFIG and
      a read-write partition that takes the rest of the disk. At boot, EVE
      builds an overlayfs rootfs with a tmpfs layer over the image, so files
      the installer adds appear without changing the image. The disk layout
      page says corrupting IMGA or IMGB is hard because EVE treats them as
      read-only.

      The word integrity needs care here. A read-only mount does not verify
      the image at runtime. The repository documentation contains no mention
      of dm-verity, so the profile records read-only-mount only. That is a
      statement about what was found, not a documented absence. The
      measured-boot design (d10) measures boot components and the CONFIG
      partition into TPM registers, which provides detection at boot time but
      is a different mechanism from block-level verification.

      The rootfs format is configurable at build time. The build document
      lists squashfs as the default and ext4 as the alternative, and ext4 is
      used for a development-only live update feature.

      The writable and reset on reboot line is empty on purpose.
      docs/BOOTING.md (lf-edge/eve at 0e1afbf) says EVE uses Alpine's
      overlaytmpfs option to build a stacked root filesystem in the
      initramfs, but no EVE document read says which paths are discarded on
      reboot.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/lf-edge/eve/blob/master/docs/README.md
        type: official-docs
        title: lf-edge/eve docs/README.md, partitioning
        retrieved: "2026-10-05"
        quote: IMGA (first copy of EVE's read-only root filesystem)
      - url: https://github.com/lf-edge/eve/blob/master/docs/BUILD.md
        type: official-docs
        title: lf-edge/eve docs/BUILD.md
        retrieved: "2026-10-05"
        quote: "`imga`/`imgb`: contents of `/parts/rootfs.img`"
      - url: https://github.com/lf-edge/eve/blob/master/docs/BOOTING.md
        type: official-docs
        title: lf-edge/eve docs/BOOTING.md
        retrieved: "2026-10-05"
        quote: >-
          EVE leverages Alpine's ability to create an overlayfs-based stacked
          rootfilesystem
    unknowns:
      - "Whether any integrity check of the root image beyond the read-only mount exists at runtime. Searched all files in docs/ of lf-edge/eve for the strings verity and dm-verity: no match."

  d03_artifact:
    normalized:
      primary_artifact: "installer image (raw disk, ISO or network installer) and rootfs image, per hypervisor flavor, architecture and platform"
      oci_registry_distribution: "partial: the lfedge/eve OCI image is the build tool that produces the artifacts; released artifacts are files on GitHub Releases"
      content_addressable: unknown
      mirrorable: true
      signed: unknown
      sbom: "SPDX json, one per image variant"
      reproducible_builds: "functionally identical, not bit-identical"
      air_gapped_capable: "yes, with a Local Operator Console or a controller on the local network"
    summary: >-
      Each release publishes installer images (raw, ISO, network), live
      images and a rootfs image for every combination of hypervisor flavor,
      architecture and platform, with checksums, sizes and a source archive.
      The lfedge/eve container image produces the deployable artifacts.
    notes: >-
      The 17.0.0-lts release lists 68 assets (gh api, 2026-10-05). File names follow the pattern
      architecture.flavor.platform.type, for example amd64.k.generic.installer.iso
      and arm64.kvm.nvidia-jp6.rootfs.img. Platforms in that release are
      generic and nvidia-jp5, nvidia-jp6 and nvidia-jp7. Only the generic
      platform carries an ISO and a network installer tar.

      The documentation says the lfedge/eve Docker container is used to
      produce the deployment artifacts, and that tags encode the hypervisor
      and architecture, for example a tag ending in -kvm-arm64.

      The SBOM page says the SBOM is in SPDX format, delivered as a json
      file, available from the EVE-OS container and from the GitHub release
      page, with one SBOM per image variant. The sources page describes a
      gzipped tar of collected sources with a manifest.

      The reproducibility page states that functionally identical images are
      a requirement and that the build should either produce a functionally
      identical image or fail. It states that images are not precisely
      reproducible, because of timestamps and random data.

      Where the device downloads its operating system update from is a
      datastore chosen by the controller operator (see d04), so an operator
      can mirror the image on infrastructure they run.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/lf-edge/eve/releases/tag/17.0.0-lts
        type: release-notes
        title: lf-edge/eve release 17.0.0-lts, asset list
        retrieved: "2026-10-05"
        quote: amd64.k.generic.installer.iso
      - url: https://github.com/lf-edge/eve/blob/master/README.md
        type: source-repo
        title: lf-edge/eve README
        retrieved: "2026-10-05"
        quote: >-
          EVE Docker container `lfedge/eve:<version>` is used to produce these
          deployment artifacts.
      - url: https://github.com/lf-edge/eve/blob/master/docs/SBOM-AND-SOURCES.md
        type: official-docs
        title: lf-edge/eve SBOM and sources
        retrieved: "2026-10-05"
        quote: one SPDX json file per image variant is attached to the release page on github
      - url: https://github.com/lf-edge/eve/blob/master/docs/EVE-IMAGE-REPRODUCIBILITY.md
        type: official-docs
        title: lf-edge/eve image reproducibility
        retrieved: "2026-10-05"
        quote: functionally identical images are a requirement for EVE
      - url: https://github.com/lf-edge/eve/blob/master/docs/BUILD.md
        type: official-docs
        title: lf-edge/eve docs/BUILD.md
        retrieved: "2026-10-05"
        quote: a final bootable live disk image in raw format
    unknowns:
      - "Whether release artifacts carry a detached signature or a container image signature. docs/SBOM-AND-SOURCES.md does not address signing, and a search of docs/ for cosign, sigstore and slsa found no match. Signing may exist outside the repository documentation."
      - "Whether the rootfs image and installer are addressed by content digest anywhere beyond the sha256sums file in each release."
      - "The SBOM page says one SPDX json file per image variant is attached to each release page, named architecture.flavor.platform.rootfs.spdx.json. The asset list of 17.0.0-lts, read through the GitHub API on 2026-10-05, holds no spdx.json file. Whether the SBOM is attached to other releases, or published elsewhere for this one, was not determined."

  d04_upgrade:
    normalized:
      fleet_upgrade:
        self_update: "The OS polls its controller. It has no schedule of its own."
        paths:
          - kind: fleet-server
            name: "Adam"
            license: "Apache-2.0"
            class: open-source
            reconciliation: in-place
            filter: true
            note: "A reference controller. The reconciliation mode is inferred from the controller model."
            evidence: INFERRED
            sources:
              - url: https://github.com/lf-edge/adam
                title: "Adam repository"
                retrieved: "2026-10-06"
                quote: >-
                  Adam is a reference implementation ... has not been built or tested to withstand penetration attacks, DDoS
              - url: https://github.com/lf-edge/eve
                title: "EVE repository"
                retrieved: "2026-10-06"
                quote: >-
                  How to use EVE with a controller (recommended)
          - kind: fleet-server
            name: "ZEDEDA Cloud"
            license: "proprietary"
            class: service
            reconciliation: in-place
            filter: true
            note: "A vendor service that acts as the EVE controller. The licence is not published as a file."
            evidence: INFERRED
            sources:
              - url: https://zededa.com
                title: "ZEDEDA"
                retrieved: "2026-10-06"
      version_identity:
        identifier: "Release string in /etc/eve-release, for example 8.10.0-kvm-amd64"
        condition: "none for official release builds"
        evidence: DOCUMENTED
        sources:
          - url: https://github.com/lf-edge/eve/blob/master/docs/EVE-IMAGE-SOURCES.md
            type: official-docs
            title: "EVE image sources"
            retrieved: "2026-10-06"
          - url: https://github.com/lf-edge/eve/blob/master/docs/BUILD.md
            type: official-docs
            title: "EVE build"
            retrieved: "2026-10-06"
            quote: >-
              calculated from the git commit
      mechanism:
        - ab-partition-switch
      scope: whole-os-image
      scope_sources:
        - url: https://github.com/lf-edge/eve/blob/master/docs/BASEIMAGE-UPDATE.md
          type: official-docs
          title: lf-edge/eve baseimage update
          retrieved: '2026-10-06'
          quote: dual partitions and priority boot support in grub
      initiator: node-polls-controller
      requires_kubernetes: false
      requires_vendor_infrastructure: false
      requires_controller: true
      self_hostable_update_server: true
      self_hostable_update_source: "Your own controller (Adam) and datastore"
      self_hostable_update_server_evidence: DOCUMENTED
      self_hostable_update_server_note: "There is no dedicated update server. The controller tells the device which image to fetch, and the device downloads it from a datastore the controller names. Datastore types in the API include HTTP, HTTPS, S3, SFTP and container registry. An operator can run the controller (Adam is the reference implementation) and the datastore on their own network. Adam is documented as not built for scale or hardened against attack."
      artifact_verification: "sha256 digest carried in the controller configuration"
      health_check_seconds_default: 600
      kubernetes_upgrade_separate: unknown
    summary: >-
      The controller sets a base OS image in the device configuration. The
      device downloads and verifies it, writes it to the unused root
      partition, reboots, and commits only after the new version stays
      healthy for 10 minutes.
    notes: >-
      The baseimage update document describes the sequence. If the activate
      flag is false, the image is downloaded and verified. When it becomes
      true, EVE writes the image to the unused partition, reboots and tests
      the new image for 10 minutes. The test passes when the device can
      connect to the controller and no agent crashes or hangs. The timer is a
      configuration property (timer.test.baseimage.update) with a documented
      default of 600 seconds, a minimum of 30 and a maximum of 3600. The
      document says a planned handshake would let a user run their own
      application tests before the commit, which indicates it was not
      implemented when the page was written.

      Updating needs the controller connection. The disconnected operation
      page states that deploying an application, updating the base image and
      rotating credentials all wait for the connection.

      Where the image comes from. The microservice classification page says
      the downloader fetches EVE updates and application content from
      datastores. The datastore definition in the public API lists HTTP,
      HTTPS, S3, SFTP, container registry, Azure blob and Google storage
      types. This is the basis for the self-hostable value above. The
      update source is therefore a file or registry location, not a
      stateful update service of the kind the Omaha based systems use.

      The controller is required in every case. A device with no controller
      does not receive updates. Two controller options are documented. The
      ZEDEDA Cloud controller is a commercial product (d12). Adam is an
      open-source reference implementation that its own README says was not
      built or tested to withstand penetration attacks or scale. A Local
      Operator Console substitutes for the controller in air-gapped
      deployments, per the disconnected operation page.

      EVE-k. The same mechanism upgrades an HV=k device. The EVE-k document
      adds constraints: upgrading from another flavor to HV=k is supported
      only while the device holds no volumes, and upgrading from HV=k to
      another flavor is not supported.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/lf-edge/eve/blob/master/docs/BASEIMAGE-UPDATE.md
        type: official-docs
        title: lf-edge/eve baseimage update
        retrieved: "2026-10-05"
        quote: >-
          using dual partitions and priority boot support in grub
      - url: https://github.com/lf-edge/eve/blob/master/docs/BASEIMAGE-UPDATE.md
        type: official-docs
        title: lf-edge/eve baseimage update, health check
        retrieved: "2026-10-05"
        quote: >-
          can connect to the controller and no agent crashes or hangs) for 10
          minutes running the new version
      - url: https://github.com/lf-edge/eve/blob/master/docs/CONFIG-PROPERTIES.md
        type: official-docs
        title: lf-edge/eve configuration properties
        retrieved: "2026-10-05"
        quote: timer.test.baseimage.update
      - url: https://github.com/lf-edge/eve/blob/master/docs/MICROSERVICE-CLASSIFICATION.md
        type: official-docs
        title: lf-edge/eve microservice classification
        retrieved: "2026-10-05"
        quote: Downloads content from datastores (EVE updates and app content)
      - url: https://github.com/lf-edge/eve-api/blob/main/proto/config/storage.proto
