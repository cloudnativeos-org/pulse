    summary: >-
      There is no package manager and no general application environment on
      the host. Behavior changes come from controller configuration, from
      the Edge Containers that run on top, or from a custom build of the
      packages and kernel.
    notes: >-
      The documentation says applications must be Edge Containers and that
      EVE does not support traditional POSIX style processes. Customization
      of the host itself is therefore a build activity. The custom-build
      page describes two routes: modify a package and rebuild, or include
      external packages. The kernel lives in a separate repository
      (lf-edge/eve-kernel) and a custom kernel is selected with a KERNEL_TAG
      build variable.

      The build supports platform variants selected with the PLATFORM
      variable, for example generic, rt, nvidia-jp6 and imx8mp_pollux. The
      porting page describes a six step process for a new CPU architecture.

      Customizing at build time moves the build, test and patch burden to the
      adopter for the resulting image, which is the general cost of any
      rebuild path. The custom-build page says the project's CI publishes
      packages to Docker Hub, so an adopter can rebuild only the packages
      they change.

      Per-device behavior is controlled by configuration properties set
      through the controller. The properties page lists the names, types,
      defaults and limits.
