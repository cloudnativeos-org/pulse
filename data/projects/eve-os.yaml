      works_without_controller: "applications keep running; configuration changes and updates wait"
    summary: >-
      Production builds have no ssh. Operators work through the controller,
      through an edge-view remote channel, or on a debug build. Applications
      and the last applied configuration keep running when the controller is
      unreachable.
    notes: >-
      The debugging page shows commands such as eve app list, eve app enter,
      eve app console and eve enter debug, and a diagnostic output file that
      summarizes controller connectivity and device status. These commands run
      in an environment reached by ssh or edge-view on a device where remote
      access is enabled.

      The disconnected operation page states that nothing about the loss of
      the controller stops application instances, that the last applied
      configuration is checkpointed in /persist/checkpoint/lastconfig and
      replayed at boot with no age limit, and that the vault unseals locally
      from the TPM. A Local Profile Server can complement the controller for
      local operations (select a profile, restart an application, radio
      silence, graceful shutdown). A Local Operator Console can substitute
      for the controller in air-gapped deployments.

      The disconnected state limits change: deploying an application,
      updating the base image and rotating credentials all wait for the
      connection, and no new configuration, application or base image can be
      introduced by anyone while the device is disconnected.

      Nothing in this dimension depends on Kubernetes. On EVE-k, the
      kube service is an addition and the host tools above do not require it.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/lf-edge/eve/blob/master/docs/DEBUGGING.md
