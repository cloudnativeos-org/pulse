      type: official-docs
      title: "Portal:MicroOS, design"
      retrieved: "2026-09-22"
      quote: "Most of our pre-built MicroOS system images use Ignition for configuration on first boot."
  - date: "2026-09-22"
    field: dimensions.d05_rollback_recovery.normalized.retained_versions
    change: "Said unknown, and notes said the default policy was published nowhere. The commercial vehicle's 6.2 snapper article, live at collection, publishes the defaults (NUMBER_LIMIT 2 to 10, NUMBER_LIMIT_IMPORTANT 4 to 10). Value is now configurable, with a per-vehicle field for the commercial default and unknown kept for openSUSE MicroOS. tradeoffs.costs and open_questions adjusted to match."
    source:
      url: https://documentation.suse.com/sle-micro/6.2/html/Micro-snapper-basic-concepts/index.html
      type: vendor-docs
      title: SUSE Linux Micro 6.2, snapper default settings
      retrieved: "2026-09-22"
      quote: "The default values are 2–10 for NUMBER_LIMIT and 4–10 for NUMBER_LIMIT_IMPORTANT, meaning that only the youngest snapshots are kept."
  - date: "2026-09-22"
    field: dimensions.d02_immutability.notes
    change: "Said the commercial pages did not state how /etc and /var are layered. The 6.2 transactional-update article, already cited, states /var is not included in the snapshot and that /etc overlay layers live under /var/lib/overlay. Notes and the unknown now record that; the / versus /usr boundary question stays open."
    source:
      url: https://documentation.suse.com/sle-micro/6.2/html/Micro-transactional-updates/index.html
      type: vendor-docs
      title: SUSE Linux Micro 6.2, transactional updates
      retrieved: "2026-09-22"
      quote: "From within the snapshot, you cannot access the /var directory. This directory is also not included in the snapshot."
  - date: "2026-09-22"
    field: dimensions.d04_upgrade.normalized.initiator
    change: "Said systemd timer without a name. The 6.2 transactional-update article names transactional-update.timer, daily and enabled by default, on the commercial vehicle. Value and unknown now say so; the community vehicle's default remains unknown."
    source:
      url: https://documentation.suse.com/sle-micro/6.2/html/Micro-transactional-updates/index.html
      type: vendor-docs
      title: SUSE Linux Micro 6.2, transactional updates, automatic updates
      retrieved: "2026-09-22"
      quote: "The automatic updates are enabled by default."
  - date: "2026-09-22"
    field: dimensions.d01_os_model.notes
    change: "Said the community vehicles are not affected by the SLES 16.1 convergence statement. The openSUSE roadmap states Leap Micro 6.3 will be an appliance image of Leap 16.1 installable as Immutable, and that Leap Micro 6.2 adopts the Leap 16.0 schedule. Notes now record that for Leap Micro and say nothing was found for the rolling vehicle."
    source:
      url: https://en.opensuse.org/openSUSE:Roadmap
      type: official-docs
      title: openSUSE roadmap
      retrieved: "2026-09-22"
      quote: "Important: Leap Micro 6.2 adopts the Leap 16.0 schedule. Leap Micro 6.3 will follow Leap 16.1."
  - date: "2026-09-22"
    field: dimensions.d01_os_model.notes
    change: "Convergence paragraph now carries the dated facts the cited pages already held at collection: the announcement places SLES 16.1 in November 2026, the lifecycle page lists 16.1 FCS as Nov 2026, a public beta opened 2026-05-28, and the 6.2 release notes (published 2026-09-08) call the successor SL Micro 6.3 (SLE merge). The successor's name is added as an unknown and an open question. The 6.2 release notes quote in sources was a paraphrase of a table and is now the verbatim sentence."
    source:
      url: https://documentation.suse.com/releasenotes/sle-micro/html/releasenotes_sle-micro_6.2/index.html
      type: vendor-docs
      title: SUSE Linux Micro 6.2 release notes
      retrieved: "2026-09-22"
      quote: "In the future, when upgrading from SL Micro to SL Micro 6.3 (so-called \"SLE merge\"), some systems will have net.ifnames=0 set on their kernel command line"
  - date: "2026-09-22"
    field: dimensions.d13_governance.normalized.contribution_diversity.value
    change: "Moved since collection: transactional-update 966 commits with top two at 861 (2026-09-15) to 1042 with top two at 938 (2026-09-22); health-checker 97 with top two at 78 to 106 with top two at 85. combustion unchanged at 73 and 68. Contributor counts unchanged at 26, 11 and 4."
