        If you have a server with some space left, and want to help with making the openSUSE experience better for other users, become a mirror!
  - date: "2026-10-05"
    field: dimensions.d05_rollback_recovery.normalized
    change: >-
      Added health_checker_installed_by_default and health_checker_enabled_by_default. Installation is documented: the microos_base pattern requires health-checker and its MicroOS plugins. Default enablement stays unknown. This settles half of the open review flag on the automatic rollback cell.
