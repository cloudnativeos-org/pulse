taxonomy:
  workload_scope: general-purpose-host
  construction_model:
    - vendor-fixed-image
    - package-repository-assembly
  root_state_substrate:
    - transactional-snapshot
  notes: >-
    Kubernetes is neither required nor bundled in any of the three release
    vehicles, which places this at the general-purpose-host position. The shipped
    MicroOS profiles are "Base System" and "Base System + Container Runtime
    Environment", the latter carrying Podman.

    The substrate is the distinguishing fact of this entry. Nothing else in the
    2026 edition uses `transactional-snapshot`: a btrfs snapshot is taken per
    transaction, changes are applied inside it, and the snapshot becomes the next
    boot target. It is neither an A/B pair nor an OSTree deployment, and the
    difference shows up most clearly in d05, where retention is a snapper policy
    rather than a fixed slot count.

    Construction is both vendor-fixed and package-repository assembly, and the two
    are genuinely simultaneous rather than alternatives. Official images are built
    with KIWI in the openSUSE Build Service, and the running system then assembles
    from the same zypper repositories openSUSE Tumbleweed uses.

dimensions:
  d01_os_model:
    normalized:
      workload_scope: general-purpose-host
      ships_kubernetes: false
      profiles_offered:
        - "Base System"
        - "Base System + Container Runtime Environment (Podman)"
      release_vehicles:
        - "openSUSE MicroOS: rolling, built from every Tumbleweed snapshot"
        - "openSUSE Leap Micro: versioned community build, a rebrand of SUSE Linux Micro"
        - "SUSE Linux Micro: versioned commercial product, named SLE Micro until 6.1"
      package_manager_at_runtime: "yes, but only inside a new snapshot"
    summary: >-
      A container-oriented immutable host built on a read-only btrfs root with
      transactional updates. It ships no Kubernetes, offers a base profile and a
      Podman container-host profile, and exists as a rolling community build, a
      versioned community build and a versioned commercial product.
    notes: >-
      The project describes itself as "designed for but not limited to container
      hosts and edge devices", and its design documentation frames the install
      media around packages needed to boot, to run containers, and to run a
      container-as-a-service stack. It does not describe itself around a specific
      orchestrator.

      The commercial vehicle positions itself differently, as "a lightweight and
      secure operating system for the edge" that "merges the enterprise-hardened
      components of SUSE Linux with the features that developers want in a modern,
      immutable operating system", with named use cases in aerospace, telecom,
      automotive, defence, healthcare and manufacturing.

      A naming change is worth recording because it makes older documentation hard
      to match against current product. The commercial product was called SUSE
      Linux Enterprise Micro, or SLE Micro, through the 6.1 public beta on
      2024-08-22, and appears as SUSE Linux Micro in the 6.1 general availability
      announcement on 2024-11-14. No announcement stating the rename or giving a
      reason was found, and the documentation URL path still reads /sle-micro/, so
      the path is not a reliable signal of the current name.

      One further convergence is documented and dated, and a reader deciding today
      should know it. SUSE published on 2026-02-23 that SUSE Linux Enterprise
      Server 16.1 adds an Immutable Mode carrying SUSE Linux Micro's
      characteristics, and committed to "a seamless upgrade path from SUSE Linux
      Micro 6.2 to SUSE Linux Enterprise Server 16.1 (Immutable)". The same post
      places the 16.1 release in November 2026, the vendor's lifecycle page lists
      16.1 with an FCS date of "Nov 2026", and a public beta opened on 2026-05-28.
      SUSE Linux Micro 6.2 already identifies itself as SLES 16.0 in
      /etc/os-release, with PRETTY_NAME "SUSE Linux Enterprise Server 16.0" and
      VARIANT "Micro". The commercial vehicle is therefore being folded into the
      general-purpose enterprise distribution. The name of the successor is not
      settled in the vendor's own pages: the 6.2 release notes refer to an upgrade
      "from SL Micro to SL Micro 6.3 (so-called "SLE merge")", while the
      announcement calls it SUSE Linux Enterprise Server 16.1 (Immutable). No
      lifecycle entry for a SUSE Linux Micro 6.3 exists on the lifecycle page.

      The versioned community vehicle has a parallel plan. The openSUSE roadmap
      states that "Leap Micro 6.3 will be incorporated as an Appliance image of
      Leap 16.1 which can be newly installed as Immutable", and that Leap Micro 6.2
      adopts the Leap 16.0 schedule. No statement was found about the rolling
      vehicle, openSUSE MicroOS, in either direction.
    evidence: DOCUMENTED
    sources:
      - url: https://en.opensuse.org/Portal:MicroOS/Intro
        type: official-docs
        title: "Portal:MicroOS, introduction"
        retrieved: "2026-09-22"
        quote: >-
          It's designed for but not limited to container hosts and edge devices.
          ... openSUSE MicroOS inherits the openSUSE Tumbleweed and SUSE Linux
          Enterprise knowledge while redefining the operating system into a small,
          efficient and reliable distribution.
      - url: https://documentation.suse.com/sle-micro/6.2/
        type: vendor-docs
        title: SUSE Linux Micro 6.2 documentation
        retrieved: "2026-09-22"
        quote: >-
          SUSE Linux Micro is a lightweight and secure operating system for the
          edge.
      - url: https://www.suse.com/c/the-next-leap-unifying-the-immutable-future-with-suse-linux-enterprise-server-16-1/
        type: announcement
        title: "SLES 16.1 immutable mode, and the SUSE Linux Micro upgrade path"
        retrieved: "2026-09-22"
        quote: >-
          We are committed to providing a seamless upgrade path from SUSE Linux
          Micro 6.2 to SUSE Linux Enterprise Server 16.1 (Immutable).
      - url: https://www.suse.com/c/suse-linux-16-1-public-beta/
        type: announcement
        title: "SUSE Linux 16.1 public beta"
        retrieved: "2026-09-22"
        quote: >-
          By integrating the immutable architecture pioneered by SUSE Linux Micro
          directly into SUSE
      - url: https://www.suse.com/lifecycle/
        type: vendor-docs
        title: "SUSE product lifecycle, SUSE Linux Enterprise Server 16.1"
        retrieved: "2026-09-22"
        quote: "SUSE Linux Enterprise Server 16.1 Nov 2026 30 Nov 2028 30 Nov 2031"
      - url: https://documentation.suse.com/releasenotes/sle-micro/html/releasenotes_sle-micro_6.2/index.html
        type: vendor-docs
        title: SUSE Linux Micro 6.2 release notes, product identification
        retrieved: "2026-09-22"
        quote: "The identification variables in /etc/os-release have been changed."
      - url: https://documentation.suse.com/releasenotes/sle-micro/html/releasenotes_sle-micro_6.2/index.html
        type: vendor-docs
        title: SUSE Linux Micro 6.2 release notes, SLE merge note
        retrieved: "2026-09-22"
        quote: >-
          In the future, when upgrading from SL Micro to SL Micro 6.3 (so-called
          "SLE merge"), some systems will have net.ifnames=0 set on their kernel
          command line
      - url: https://en.opensuse.org/openSUSE:Roadmap
        type: official-docs
        title: "openSUSE roadmap, Leap Micro 6.3 and Leap 16.1"
        retrieved: "2026-09-22"
        quote: >-
          Leap Micro 6.3 will be incorporated as an Appliance image of Leap 16.1
          which can be newly installed as Immutable.
    unknowns:
      - "No primary source states that openSUSE MicroOS is the upstream of SUSE Linux Micro. The documented relationship is Leap Micro as a rebrand of SUSE Linux Micro."
      - "No SUSE announcement states the SLE Micro to SUSE Linux Micro rename or gives a reason. It is observable only by diffing dated pages."
      - "Whether the successor to SUSE Linux Micro 6.2 ships as SUSE Linux Micro 6.3 or as SUSE Linux Enterprise Server 16.1 (Immutable). The 6.2 release notes use the first name, the announcement the second, and the lifecycle page lists neither a 6.3 nor an Immutable variant."
      - "Whether openSUSE MicroOS, the rolling vehicle, is affected by the Leap Micro 6.3 to Leap 16.1 appliance plan. No statement was found."

  d02_immutability:
    normalized:
      read_only:
        - /
      read_only_mechanism: "read-only btrfs subvolume, made writable only inside a new snapshot"
      etc_mechanism: "overlayfs, with a per-snapshot work directory under /var/lib/overlay/<snapshot>/etc"
      var_mechanism: "separate writable btrfs subvolume, deliberately excluded from snapshots"
      integrity_mechanism:
        - read-only-mount
      dm_verity: "not used"
      runtime_integrity_verification: "none"
      immutability_can_be_disabled: unknown
      writable_and_persistent:
        - /var (separate btrfs subvolume, left out of snapshots)
        - /etc (overlay)
        - /home, /root, /opt, /srv and /usr/local (separate btrfs subvolumes in the image definition)
        - /boot/writable (separate btrfs subvolume, in 20 of the 22 image profiles; not in kvm-and-xen-sdboot or kvm-and-xen-grub-bls)
      configurable_paths:
        value: unknown
        evidence: UNKNOWN
        how: Unknown
        searched: The Kubic transactional-update guide (tu-setup), the SUSE Linux Micro 6.2 transactional-update article and the MicroOS home page. None says whether the adopter can change which paths are writable or persistent.
        sources: []
      mounts_sources:
        - url: https://api.opensuse.org/public/source/openSUSE:Factory/openSUSE-MicroOS/openSUSE-MicroOS.kiwi?rev=103
          type: source-repo
          title: 'openSUSE-MicroOS image definition (kiwi), openSUSE:Factory, revision 103: separate subvolumes'
          retrieved: '2026-10-12'
          quote: <volume name="home"/>
        - url: https://kubic.opensuse.org/documentation/transactional-update-guide/tu-setup.html
          type: official-docs
          title: 'transactional-update guide: /var'
          retrieved: '2026-10-12'
          quote: On a read-only system this directory has to be writable in any case, variable data is stored inside.
        - url: https://kubic.opensuse.org/documentation/transactional-update-guide/tu-setup.html
          type: official-docs
          title: 'transactional-update guide: /etc'
          retrieved: '2026-10-12'
          quote: To do so an overlayfs layer is put on top of the system's /etc directory.
        - url: https://kubic.opensuse.org/documentation/transactional-update-guide/tu-setup.html
          type: official-docs
          title: 'transactional-update guide: read-only root'
          retrieved: '2026-10-12'
          quote: transactional-update is typically used on a read-only root file system, even though it also supports regular read-write systems.
    summary: >-
      The root filesystem is a read-only btrfs subvolume. Configuration lives in
      an overlayfs on /etc that is snapshotted with the root, and variable data
      lives in a separate /var subvolume that is deliberately left out of
      snapshots so that a rollback does not take container data with it.
    notes: >-
      The /etc and /var split is the design decision that distinguishes this model
      from whole-root A/B, and it is documented with its reasoning. /etc is an
      overlay whose work directory is per snapshot, so a rollback reverts
      configuration along with the OS. /var is excluded from snapshots explicitly
      because "snapshots and rollback have qgroups enabled on the root filesystem,
      which would be a massive performance bottleneck especially for containers".

      A consequence worth stating plainly, because it is the FR-13 question in a
      concrete form: rolling back reverts the OS and /etc together, and does not
      revert /var. That is a different answer from Flatcar, which reverts /usr and
      keeps /etc, and from Fedora CoreOS, which reverts the deployment and merges
      /etc. A reader comparing rollback across this edition should read those three
      rows together.

      There is no dm-verity and no runtime integrity verification of the OS root on
      any of the three release vehicles. Integrity rests on the read-only mount and
      on snapshot discipline, plus signature verification of the packages that
      built the snapshot. That is a real architectural difference from the
      verity-based systems in this survey and is recorded here rather than only
      under d10.

      The commercial vehicle's documentation states the same read-only root
      property, and its 6.2 transactional-update article states the same layering:
      /var is "not included in the snapshot" and is not reachable from inside a
      transaction, and /etc changes live in overlay layers under /var/lib/overlay
      that a cleanup command removes when unreferenced. The fetched pages do not
      say in as many words whether the read-only boundary is / or only /usr; the
      wording "read-only root file system" is recorded as given.

      Whether immutability can be switched off is not documented on any page found
      for any of the three vehicles.
    evidence: DOCUMENTED
    sources:
      - url: https://en.opensuse.org/Portal:MicroOS/Design
        type: official-docs
        title: "Portal:MicroOS, design"
        retrieved: "2026-09-22"
        quote: >-
          The only available and supported filesystem for the root filesystem is
          btrfs... The root filesystem is read-only. To store modified
          configuration files, overlayfs is used for /etc.
      - url: https://en.opensuse.org/Portal:MicroOS/Design
        type: official-docs
        title: "Portal:MicroOS, design, /var subvolume"
        retrieved: "2026-09-22"
        quote: >-
          to store variable data should be an own btrfs partition. This is since
          snapshots and rollback have qgroups enabled on the root filesystem, which
          would be a massive performance bottleneck especially for containers.
      - url: https://documentation.suse.com/sle-micro/6.2/html/Micro-transactional-updates/index.html
        type: vendor-docs
        title: "SUSE Linux Micro 6.2, transactional updates"
        retrieved: "2026-09-22"
        quote: >-
          To keep the base operating system stable and consistent, the SUSE Linux
          Micro uses a read-only root file system.
      - url: https://documentation.suse.com/sle-micro/6.2/html/Micro-transactional-updates/index.html
        type: vendor-docs
        title: "SUSE Linux Micro 6.2, transactional updates, /var and /etc overlay"
        retrieved: "2026-09-22"
        quote: >-
          From within the snapshot, you cannot access the /var directory. This
          directory is also not included in the snapshot.
    unknowns:
      - "Whether SUSE Linux Micro 6.x makes / read-only or only /usr. The commercial documentation says \"read-only root file system\" and documents the /etc overlay and the /var exclusion, but does not name the boundary."
      - "Whether immutability can be disabled on any of the three release vehicles. No page found addresses it."
      - "The default snapper retention policy on openSUSE MicroOS. The commercial vehicle's 6.2 documentation publishes its defaults (see d05); no community page does."

  d03_artifact:
    normalized:
      primary_artifact: disk-image
      artifact_formats:
        - iso
        - self-installing-iso
        - qcow2
        - raw
        - vmdk
        - vhdx
      oci_registry_distribution: false
      content_addressable: false
      mirrorable: true
      signed: "detached PGP signature over a SHA256 checksum, per image"
      sbom: "CycloneDX and SPDX, shipped beside every official image"
      air_gapped_upgrade: "possible by mirroring the zypper repositories; no bundled offline update mechanism documented"
    summary: >-
      The deployable artifact is a disk image or ISO, not an OCI image. Every
      official image ships with a PGP-signed checksum and with machine-readable
      CycloneDX and SPDX bills of materials generated by the build service.
    notes: >-
      The supply-chain artifacts here were verified directly rather than taken from
      a documentation claim. Each published image carries a .sha256 file, a
      detached .sha256.asc PGP signature, a .cdx.json CycloneDX SBOM and a
      .spdx.json SPDX SBOM, and the SBOM names its own generator as the build
      service's obs_build_generate_sbom tool and references the originating build
      project. **Every image, on every architecture, including the ports.** This is
      the most complete SBOM and provenance story observed in this edition, and it
      is present by default rather than opt-in.

      Distribution is through the openSUSE mirror network. Every file carries a
      .mirrorlist companion, so mirroring is the normal path rather than a
      special-cased one.

      The OS is not distributed through an OCI registry. That is a real difference
      from the container-native entries in this edition and is recorded as an
      absence of a capability rather than as a deficiency: the artifact is a disk
      image, and the update path is package based, so a registry would not carry
      the OS state.

      The commercial vehicle publishes raw disk images, a self-install ISO, a PXE
      installation image, virtual machine images and cloud images. From 6.0 it
      publishes no installer: its release notes state that it "only supports
      deployment via images. An installer based installation method is not
      offered". Image signing for the commercial vehicle was not established from
      the pages found.
    evidence: DOCUMENTED
    sources:
      - url: https://download.opensuse.org/tumbleweed/appliances/
        type: release-notes
        title: "Published appliance directory, signatures and SBOMs (filenames observed 2026-09-22; the same four companions were observed for Snapshot20260914 at collection)"
        retrieved: "2026-09-22"
        quote: >-
          openSUSE-MicroOS.x86_64-16.0.0-kvm-and-xen-Snapshot20260919.qcow2.sha256
          openSUSE-MicroOS.x86_64-16.0.0-kvm-and-xen-Snapshot20260919.qcow2.sha256.asc
          openSUSE-MicroOS.x86_64-16.0.0-kvm-and-xen-Snapshot20260919.cdx.json
          openSUSE-MicroOS.x86_64-16.0.0-kvm-and-xen-Snapshot20260919.spdx.json
      - url: https://get.opensuse.org/microos/
        type: official-docs
        title: Get openSUSE MicroOS, image list
        retrieved: "2026-09-22"
      - url: https://documentation.suse.com/sle-micro/6.1/html/Micro-deployment-images/index.html
        type: vendor-docs
        title: "SUSE Linux Micro 6.1, deployment images"
        retrieved: "2026-09-22"
        quote: "Raw disk image, Self-install image, PXE installation image, Virtual machine image, Cloud image."
      - url: https://documentation.suse.com/releasenotes/sle-micro/html/releasenotes_sle-micro_6.0/index.html
        type: vendor-docs
        title: "SUSE Linux Micro 6.0 release notes, image-only deployment"
        retrieved: "2026-09-22"
        quote: >-
          SUSE Linux Micro 6.0 only supports deployment via images. An installer
          based installation method is not offered.
    unknowns:
      - "Whether SUSE Linux Micro images carry signatures equivalent to the community images. No signing statement was found on the product pages."
      - "Whether any OCI-packaged MicroOS build exists experimentally."

