          If you have a server with some space left, and want to help with making the openSUSE experience better for other users, become a mirror!
    unknowns:
      - "Whether transactional-update.timer is enabled by default on a stock openSUSE MicroOS image. The commercial vehicle documents it as daily and enabled by default; no community page found names the timer."
      - "Repository and package signature verification was inferred from the shared Tumbleweed repositories rather than confirmed from a MicroOS-specific statement."

  d05_rollback_recovery:
    normalized:
      rollback_to_previous: available
      rollback_mechanism: "transactional-update rollback, or select an older snapshot from the GRUB2 boot menu"
      automatic_rollback_on_boot_failure: available
      automatic_rollback_trigger: "health-checker plugin failure during boot"
      health_checker_installed_by_default: "yes on the community vehicle: the microos_base pattern requires health-checker and health-checker-plugins-MicroOS"
      health_checker_enabled_by_default: unknown
      automatic_rollback_attempts: "3 by default on BLS bootloaders, configurable in /etc/kernel/tries"
      success_criterion: "health-checker completes with no plugin failure; on BLS systems systemd-bless-boot then marks the snapshot good"
      retained_versions: configurable
      retained_versions_suse_linux_micro: "snapper defaults of 2 to 10 for NUMBER_LIMIT and 4 to 10 for NUMBER_LIMIT_IMPORTANT, per the 6.2 documentation"
      retained_versions_microos: unknown
      recovery_environment: live-media
      factory_reset: unknown
      network_independent_recovery: "yes for rollback, which is local to the disk"
      remote_recovery: unknown
    summary: >-
      Rollback is a snapshot boot, so any retained snapshot is a rollback target
      rather than only the previous one. health-checker runs plugin checks during
      boot and rolls back automatically to the last known-good snapshot when a new
      snapshot fails them.
    notes: >-
      The escalation rules are documented and they distinguish two failure cases
      that most projects collapse: "Error with new snapshot: Rollback to last known
      working snapshot if one exists. Error with already successfully booted
      snapshot: Try rebooting the system. If the error persist shut down services,
      inform the system administrator." The system does not loop indefinitely; it
      stops and leaves the machine reachable for an operator.

      **The success criterion is stronger than a whole-root A/B system's, and that
      is the interesting comparison.** health-checker runs plugins that check
      particular services and conditions, so what counts as a good boot is
      extensible and can be made to mean more than "the root mounted". Several
      other entries in this edition mark a boot successful at a much earlier point.
      What the shipped plugin set actually checks was not established, so the
      strength of the default criterion is unknown even though the mechanism is
      documented.

      Retention is the field where this substrate differs most from an A/B system.
      An A/B system keeps one or two slots; here retention is a snapper policy, so
      the number of rollback targets is whatever that policy is set to. The
      commercial vehicle's 6.2 snapper article publishes the defaults: 2 to 10
      numbered snapshots for NUMBER_LIMIT and 4 to 10 for NUMBER_LIMIT_IMPORTANT,
      "meaning that only the youngest snapshots are kept", with the exact count
      inside each range decided by the free-space rules. The default policy for
      openSUSE MicroOS was not found on any community page, and it is not assumed
      to match. That matters to an operator, because it is the answer to "how far
      back can I go".

      Recovery is the installation media acting as rescue media, which is standard
      openSUSE behaviour rather than a MicroOS-specific recovery partition. No
      factory reset feature and no remote or out-of-band recovery path was found
      documented for any of the three vehicles.

      health-checker is documented for the 5.x line of the commercial vehicle. No
      6.x page for it was located: the 6.2 documentation index lists per-topic
      articles and none is about health-checker, and the 6.0, 6.1 and 6.2 release
      notes do not mention it. Whether the 6.x product still ships the mechanism
      is recorded as unknown rather than assumed either way.
    evidence: DOCUMENTED
    sources:
      - url: https://en.opensuse.org/Portal:MicroOS/Design
        type: official-docs
        title: "Portal:MicroOS, health check rules (nested list items joined with colons)"
        retrieved: "2026-09-22"
        quote: >-
          Error with new snapshot: Rollback to last known working snapshot if one
          exists. Error with already successfully booted snapshot: Try rebooting
          the system. If the error persist shut down services, inform the system
          administrator.
      - url: https://github.com/openSUSE/health-checker
        type: source-repo
        title: health-checker
        retrieved: "2026-09-22"
        quote: >-
          a systemd service ... that validates system integrity following reboots
          and updates. It executes plugins to assess various services and
          conditions.
      - url: https://documentation.suse.com/sle-micro/5.5/html/SLE-Micro-all/cha-health-checker.html
        type: vendor-docs
        title: "SLE Micro 5.5, health checker"
        retrieved: "2026-09-22"
        quote: >-
          If the current snapshot is different from the last one that worked
          properly, an automatic rollback to the last working snapshot is
          performed.
      - url: https://documentation.suse.com/sle-micro/6.2/html/Micro-transactional-updates/index.html
        type: vendor-docs
        title: "SUSE Linux Micro 6.2, GRUB2 snapshot boot"
        retrieved: "2026-09-22"
        quote: >-
          GRUB 2 enables booting from btrfs snapshots and thus allows you to use
          any older functional snapshot in case the new snapshot does not work
          correctly.
      - url: https://documentation.suse.com/sle-micro/6.2/html/Micro-snapper-basic-concepts/index.html
        type: vendor-docs
        title: "SUSE Linux Micro 6.2, snapper default settings"
        retrieved: "2026-09-22"
        quote: >-
          The default values are 2–10 for NUMBER_LIMIT and 4–10 for
          NUMBER_LIMIT_IMPORTANT, meaning that only the youngest snapshots are
          kept.
      - url: https://api.opensuse.org/public/source/openSUSE:Factory/patterns-microos/patterns-microos.spec
        type: source-repo
        title: "patterns-microos spec, package base (microos_base)"
        retrieved: "2026-10-05"
        quote: >-
          Requires: health-checker
    unknowns:
      - "Whether health-checker.service is enabled by default in a stock openSUSE MicroOS image. The microos_base pattern installs the package. The package spec uses the standard service macros, and the default-openSUSE and default-SUSE systemd preset files name no health-checker unit. The image build configuration was not read."
      - "The default snapshot retention count on openSUSE MicroOS. It is a snapper policy rather than a fixed slot count; the commercial vehicle publishes its defaults and no community page does."
      - "What the shipped health-checker plugin set actually checks, which is what sets the real strength of the success criterion."
      - "Whether SUSE Linux Micro 6.x still ships health-checker. It is documented for 5.x, the 6.2 article index has no article for it, and the 6.x release notes do not mention it."
      - "Whether a factory reset or any remote or network-independent recovery path is documented for any vehicle."

  d06_customization:
    normalized:
      runtime_package_install: "yes, into a new snapshot rather than the running system"
      mechanisms:
        - transactional-update-pkg-install
        - systemd-sysext
        - combustion-first-boot
        - ignition-first-boot
        - cloud-init-first-boot
        - kiwi-image-build
        - edge-image-builder
      customization_points:
        - image-build
        - first-boot
        - runtime
      stable_abi: "none promised"
      add_software:
      - kind: transactional-packages
        how: transactional-update installs RPM packages into a new snapshot. The system boots that snapshot on the next boot.
        evidence: DOCUMENTED
        sources:
        - url: https://en.opensuse.org/Portal:MicroOS/Design
          type: official-docs
          title: openSUSE MicroOS design
          retrieved: '2026-10-12'
          quote: A MicroOS installation can be updated and new RPM packages can be installed using the transactional-update or the pkcon application.
        - url: https://github.com/openSUSE/transactional-update/blob/ef8af9f43526c7e482a4a290439a24fd1cb22ffc/README.md
          type: source-repo
          title: transactional-update README
          retrieved: '2026-10-12'
          quote: On next boot, the system will boot the new snapshot.
      - kind: systemd-sysext
        how: sysextmgrcli downloads and version-checks sysext images, and systemd-sysext merges them. The images match the booted snapshot.
        evidence: DOCUMENTED
        sources:
        - url: https://news.opensuse.org/2026/05/21/sysextmgr
          type: announcement
          title: Managing System Extensions with sysextmgrcli
          retrieved: '2026-10-12'
          quote: sysextmgrcli is a command-line client for managing systemd-sysext images
        - url: https://news.opensuse.org/2026/05/21/sysextmgr
          type: announcement
          title: Managing System Extensions with sysextmgrcli
          retrieved: '2026-10-12'
          quote: This ensures the active sysext images always match the OS version you are currently booted into.
    summary: >-
      Packages can be installed at runtime, but into a new snapshot that takes
      effect on reboot rather than into the running system. Beyond that, the
      expected paths are first-boot configuration with Combustion or Ignition, and
      systemd system extensions.
    notes: >-
      This is the clearest difference between this entry and the image-based
      entries in the edition. The full package set of a general-purpose
      distribution is available through the ordinary package manager, and
      installing from it does not break the immutability property, because the
      install happens inside a snapshot. An adopter who needs a driver, an agent or
      a debugging tool on the host has a first-class path to it that does not
      require rebuilding an image. Several other entries in this edition do not.

      The cost is stated by the project rather than discovered: there is no stable
      ABI promise at the base OS layer, and "packages will be introduced if needed
      and removed if no longer needed". On the rolling vehicle, that responsibility
      lands on the adopter's own testing and rollback discipline.

      System extensions arrived as a managed story in May 2026 with sysextmgrcli
      and a sysextmgrd Varlink daemon. The design detail worth recording is the
      storage split: extension images live in /var/lib/sysext-store and persist
      across snapshots, while /etc/extensions holds symlinks that roll back with
      system state, "so the active sysext images always match the OS version you
      are currently booted into". The tool is deliberately "a manager, not an
      activator"; activation stays with systemd-sysext merge.

      First-boot configuration has three mechanisms and they are not
      interchangeable. Combustion runs a shell script from a filesystem labelled
      combustion, inside a new transactional-update snapshot, with no reboot needed
      on success. Ignition reads a JSON config from a volume labelled ignition and
      is the mechanism most prebuilt images use. cloud-init is used on the
      OpenStack cloud images. All three run at first boot only. There is no
      reconciliation loop, so day-2 configuration changes land in the writable
      subvolumes and nothing detects drift.

      On the commercial vehicle, Edge Image Builder is the documented tool for
      building customized images with Kubernetes and agents baked in. Who owns and
      supports an image an adopter builds themselves was not stated on any page
      found, for either vehicle.
    evidence: DOCUMENTED
    sources:
      - url: https://en.opensuse.org/Portal:MicroOS/Design
        type: official-docs
        title: "Portal:MicroOS, design, runtime package install and ABI"
        retrieved: "2026-09-22"
        quote: >-
          A MicroOS installation can be updated and new RPM packages can be
          installed using the transactional-update or the pkcon application.
      - url: https://news.opensuse.org/2026/05/21/sysextmgr
        type: announcement
        title: "sysextmgr, managing systemd system extensions on MicroOS"
        retrieved: "2026-09-22"
        quote: >-
          the active sysext images always match the OS version you are currently
          booted into
      - url: https://en.opensuse.org/Portal:MicroOS/Combustion
        type: official-docs
        title: "Portal:MicroOS, Combustion"
        retrieved: "2026-09-22"
        quote: >-
          Combustion is a minimal module for dracut, which runs a user provided
          script on the first boot of a system.
      - url: https://en.opensuse.org/Portal:MicroOS/Ignition
        type: official-docs
        title: "Portal:MicroOS, Ignition"
        retrieved: "2026-09-22"
        quote: >-
          has its origins in Fedora CoreOS and is fully supported by openSUSE
          MicroOS
      - url: https://en.opensuse.org/Portal:MicroOS/Design
        type: official-docs
        title: "Portal:MicroOS, design, first-boot configuration"
        retrieved: "2026-09-22"
        quote: >-
          Most of our pre-built MicroOS system images use Ignition for
          configuration on first boot.
    unknowns:
      - "Who owns support for an image an adopter builds with KIWI or Edge Image Builder, and whether customization affects the commercial support entitlement."
      - "Whether systemd system extensions are available on the commercial vehicle. No page mentioning them was found there."

  d07_kubernetes:
    normalized:
      requirement: optional
      bundled: "none"
      independent_lifecycle: "yes"
      os_manages_kubernetes: "no"
      kubernetes_manages_os: unknown
      distributions_documented_microos:
        - "k3s, on a wiki page the project marks unmaintained"
      distributions_documented_suse_linux_micro:
        - RKE2
      history: "openSUSE Kubic, a kubeadm-based Kubernetes variant on MicroOS, is archived"
    summary: >-
      Kubernetes is optional and no vehicle bundles it. The commercial vehicle
      pairs with RKE2 through a separate product; the community vehicle's only
      documented Kubernetes path is a k3s guide the project itself marks as
      unmaintained.
    notes: >-
      The community Kubernetes story is thin and the project says so. openSUSE
      Kubic, which combined MicroOS with kubeadm and started in May 2017, is
      archived and its wiki page now redirects to the archive. The page that was
      written to replace it, deploying k3s on MicroOS with Combustion, carries a
      banner reading "This is unmaintained". That is a real, documented capability
      whose upkeep nobody currently owns, and it is recorded as such rather than as
      either working or absent.

      The commercial vehicle went the other way and removed Kubernetes from the
      base. k3s appears in the 6.1 release notes as a discontinued package, and
      RKE2 is documented as layered on top through SUSE Edge: "RKE2 is a
      fundamental piece of the SUSE Edge stack. It sits on top of SUSE Linux Micro,
      providing a standard Kubernetes interface required to deploy Edge workloads."

      Because nothing is bundled on any vehicle, the OS and Kubernetes lifecycles
      are independent by construction. That is an unusual answer in this edition,
      and it comes from the OS simply not being in the Kubernetes business rather
      than from any decoupling work.

      Whether Kubernetes can manage the OS is recorded as unknown for the OS
      itself. Elemental's register and system-agent components onboard commercial
      hosts to Rancher, but that is a capability of a separate product and is
      recorded under d12, not here.
