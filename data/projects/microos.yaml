    field: dimensions.d04_upgrade.normalized.self_hostable_update_server
    change: >-
      Added a value for the self-hostable update source column, which rendered as Not collected. The value is true and the label is INFERRED. MicroOS shares the Tumbleweed repositories, and the project invites anyone to mirror them. No page states the private mirror case for MicroOS itself. The commercial vehicle needs product registration and is not covered by this value.
