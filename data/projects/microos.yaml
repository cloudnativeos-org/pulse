    summary: >-
      Installation covers ISO, self-installing images, raw images for boards and
      clouds, and network boot on the commercial vehicle. Configuration arrives at
      first boot through Combustion, Ignition or cloud-init, and is not reapplied
      afterwards.
    notes: >-
      Combustion is the openSUSE-native mechanism and it is unusually direct: a
      dracut module reads a shell script from a filesystem labelled combustion and
      runs it inside a new transactional-update snapshot, with no reboot needed on
      success. A comment line requesting networking triggers network setup before
      the script runs, and a QEMU fw_cfg blob can carry the script into a virtual
      machine with no attached media.

      Ignition is the mechanism most prebuilt images use, which makes the images
      compatible with configuration written for the CoreOS ecosystem. Butane is
      documented as the YAML to JSON transpiler.

      A practical trap is documented and worth repeating: neither mechanism runs by
      default from the DVD, and a configuration providing at least a root password
      is required on first boot, with the jeos-firstboot wizard as the interactive
      fallback. An operator expecting a prebuilt image to come up with a usable
      login without supplying configuration will not get one.

      Network boot is documented for the commercial vehicle, which publishes a PXE
      installation image and a network boot guide. Its 6.1 release notes add the
      limit: PXE boot images are provided "for all architectures except ppc64le".
      No PXE page specific to the community vehicle was found. AutoYaST does not
      apply to the commercial 6.x line, which ships no installer.
    evidence: DOCUMENTED
