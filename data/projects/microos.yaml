  d10_security:
    normalized:
      boot_trust_chain:
        level: 2
        how: opt-in
        note: Measured boot applies with TPM2 full-disk encryption. No UKI or dm-verity
          root is documented
        evidence: DOCUMENTED
        sources:
        - url: https://microos.opensuse.org/blog/2025-08-11-fde-tpm2-yast2/
          type: official-docs
          title: 'MicroOS: FDE with TPM2'
          retrieved: '2026-10-06'
          quote: make FDE+TPM2 the default for MicroOS
        - url: https://news.opensuse.org/2023/12/20/systemd-fde/
          type: official-docs
          title: 'openSUSE: systemd-based FDE'
          retrieved: '2026-10-06'
          quote: will register all the secure boot certificates
      secure_boot: "shim signed by Microsoft, chaining to an openSUSE certificate for GRUB2 and the kernel"
      measured_boot: "PCR-based, used to gate TPM2 key release for full disk encryption"
      tpm: "TPM 2.0; FIDO2 also supported as an unlock factor"
      integrity: read-only-mount
      dm_verity: "not used"
      disk_encryption: "LUKS2 via systemd-cryptsetup, opt-in, TPM2 or FIDO2 unlock"
      artifact_verification: "PGP-signed checksums on images; RPM and repository signing for packages"
      sbom: "CycloneDX and SPDX with every official image"
      provenance: "SBOM references the originating build-service project"
      fips: "no certificate for either Micro product; the commercial vehicle documents how to enable FIPS mode"
      common_criteria: "none found for either Micro product"
      mandatory_access_control: "community vehicle: SELinux enforcing by default for new installations from Tumbleweed snapshot 20250211, AppArmor also fully supported; SUSE Linux Micro: SELinux in enforcing mode by default from 6.0, AppArmor not supported"
      attestation: "Keylime documented for the commercial vehicle"
      default_on:
        - read-only-root
        - selinux-enforcing
        - signed-images-and-sboms
      opt_in:
        - full-disk-encryption
        - fips-mode
    summary: >-
      Secure Boot works on stock firmware through a Microsoft-signed shim.
      Integrity of the running root is a read-only mount with no dm-verity and no
      runtime verification. Full disk encryption is opt-in, LUKS2, and can bind to
      a TPM or a FIDO2 token.
    notes: >-
      **Secure Boot is one of the two answers in this edition that works on
      unmodified firmware.** The shared openSUSE chain is documented plainly: shim
      "carries a signature by Microsoft in order to be recognized by the firmware",
      shim knows the openSUSE certificate that signed GRUB2, and GRUB2 loads
      kernels signed by openSUSE certificates. No key enrolment is required of the
      operator. Read that against the FR-14 question and against the entries in
      this edition that sign with their own key.

      The full disk encryption design is documented with its architectural
      constraints rather than as a feature list. The key is sealed to PCR values
      covering firmware, Secure Boot certificates, bootloader, kernel, initrd and
      command line, and "the TPM2 will unlock the secret if the system is in a
      healthy state". Unlocking happens from inside the initrd through
      systemd-cryptsetup rather than in GRUB2, which is why the scheme needs a
      BLS-compliant bootloader reading from the ESP: "systemd-boot does not speak
      btrfs". Encryption is opt-in and no source states it is a default.

      There is no dm-verity anywhere in the boot chain for either Micro product,
      and no runtime re-verification of the root. Against an attacker with local
      write access to the disk, a read-only mount is a weaker property than a
      verified root, and this profile records that rather than letting "immutable"
      carry the weight.

      The mandatory access control default changed distribution-wide: Tumbleweed
      snapshot 20250211, announced 2025-02-13, switched new installations to
      SELinux in enforcing mode, and the announcement names minimal VM images among
      those affected. Because MicroOS tracks Tumbleweed snapshots one to one and
      its own design page lists SELinux as fully supported for the base and
      container-host roles, the balance of evidence is that new MicroOS
      installations default to SELinux enforcing from that date. No MicroOS-specific
      announcement was found, so this is recorded as an inference and listed under
      unknowns rather than stated as a MicroOS fact. The commercial vehicle is
      explicit: its 6.0 release notes state that "SUSE Linux Micro 6.0 will have
      SELinux in enforced mode as a default" and that "On SUSE Linux Micro we do
      not support AppArmor", and the 6.2 SELinux article states that "SELinux is
      present on the pre-built images by default". The design page for the
      community vehicle lists both AppArmor and SELinux as fully supported, so the
      two vehicles differ on AppArmor.

      **No FIPS 140-3 certificate exists for either Micro product.** The vendor's
      own certifications page attributes its FIPS 140-3 validation to a SUSE Linux
      Enterprise Server 15 SP6 OpenSSL module and its Common Criteria certificates
      to SUSE Linux Enterprise Server 15 SP4, not to the Micro line, while the
      Micro release notes refer to "FIPS 140-3 certification requirements" when
      running in FIPS mode. Whether FIPS mode inherits the enterprise server's
      validated modules is not stated anywhere found. A compliance-driven reader
      should treat that gap as the finding. The commercial vehicle does carry its
      own USGv6 and IPv6 Ready certification, listed for 6.2 and dated 2026-01-26;
      no 6.1 entry appears on the page.

      Two security defaults tightened in recent commercial releases and are worth
      recording as dated facts: 6.1 stopped allowing password-based remote root
      login, which also affects the Cockpit web interface, and 6.2 enabled firewalld
      by default and turned on post-quantum key exchange for SSH in the system-wide
      cryptographic policy.

      No published vulnerability response commitment or service level was found for
      either Micro product.
    evidence: DOCUMENTED
    sources:
      - url: https://en.opensuse.org/openSUSE:UEFI
        type: official-docs
        title: "openSUSE UEFI and Secure Boot"
        retrieved: "2026-09-22"
        quote: >-
          'shim' carries a signature by Microsoft in order to be recognized by the
          firmware. 'shim' in turn knows about the openSUSE certificate that was
          used to sign grub2.
      - url: https://microos.opensuse.org/blog/2023-12-20-sdboot-fde/
        type: official-docs
        title: "Full disk encryption with systemd-boot"
        retrieved: "2026-09-22"
        quote: >-
          the TPM2 will unlock the secret if the system is in a healthy state
      - url: https://news.opensuse.org/2025/02/13/tw-plans-to-adopt-selinux-as-default/
        type: announcement
        title: "Tumbleweed adopts SELinux as the default"
        retrieved: "2026-09-22"
        quote: >-
          SELinux will be enabled in enforcing mode by default only for new
          installations. Existing installations will not be affected by the change.
      - url: https://documentation.suse.com/releasenotes/sle-micro/html/releasenotes_sle-micro_6.0/index.html
        type: vendor-docs
        title: "SUSE Linux Micro 6.0 release notes, security framework"
        retrieved: "2026-09-22"
        quote: >-
          On SUSE Linux Micro we do not support AppArmor. SUSE Linux Micro only
          supports SELinux and in addition we ship a supported policy. ... SUSE
          Linux Micro 6.0 will have SELinux in enforced mode as a default.
      - url: https://documentation.suse.com/sle-micro/6.2/html/Micro-selinux/index.html
        type: vendor-docs
        title: "SUSE Linux Micro 6.2, SELinux"
        retrieved: "2026-09-22"
        quote: "SELinux is present on the pre-built images by default."
      - url: https://www.suse.com/support/security/certifications/
        type: vendor-docs
        title: "SUSE certifications, SUSE Linux Micro entry"
        retrieved: "2026-09-22"
        quote: >-
          SUSE receives USGv6 and IPv6 Ready Program certifications for SUSE Linux
          Micro 6.2 from the University of New Hampshire Interoperability
          Laboratory
      - url: https://www.suse.com/support/security/certifications/
        type: vendor-docs
        title: "SUSE certifications, FIPS 140-3 entry"
        retrieved: "2026-09-22"
        quote: >-
          NIST FIPS 140-3 validation for the SUSE Linux Enterprise Server 15 SP6
          OpenSSL 3 Cryptographic Module
      - url: https://documentation.suse.com/releasenotes/sle-micro/html/releasenotes_sle-micro_6.1/index.html
        type: vendor-docs
        title: "SUSE Linux Micro 6.1 release notes, root login change"
        retrieved: "2026-09-22"
        quote: >-
          new installations of SUSE Linux Micro 6.1 do not allow password-based
          remote root login anymore, which also affects Cockpit.
    unknowns:
      - "Whether SELinux enforcing by default was ever announced for MicroOS by name, or is purely inherited from the shared Tumbleweed installer default."
      - "Whether FIPS mode on the commercial vehicle inherits the enterprise server's validated cryptographic modules. No source states it either way."
      - "No published vulnerability response commitment or service level was found for either Micro product."

  d11_operations_debugging:
    normalized:
      ssh: available
      local_shell: available
      serial_console: unknown
      recovery_shell: "emergency shell after health-checker retries are exhausted"
      web_ui: "Cockpit, on the commercial vehicle"
      api: "Varlink services for rebootmgr and sysextmgrd"
      support_bundle: "supportconfig, a general SUSE tool; behaviour on a read-only root not documented"
      works_without_kubernetes: "yes"
      live_patching: "user space live patching with transactional updates, commercial vehicle 6.2"
    summary: >-
      A conventional Linux operations model with a full shell, SSH and the
      distribution's ordinary tooling, plus a documented emergency shell when
      automatic rollback has exhausted its retries.
    notes: >-
      Because the root assembles from a general-purpose distribution's
      repositories, existing operational knowledge transfers directly and the usual
      diagnostic tools are installable through the same snapshot mechanism as
      anything else. That is the practical benefit of this substrate and it is the
      mirror of the appliance-model entries in this edition, which give up the shell
      and get a smaller attack surface.

      The commercial vehicle documents a Cockpit web interface, and from 6.1 its
      login requires an unprivileged user with optional one-time-password two-factor
      authentication rather than a root password. 6.2 added user space live patching
      integrated with transactional updates, which lets a userland fix apply without
      a full reboot. Kernel live patching status for the Micro line was not
      established.

      There is no logging, metrics or monitoring documentation specific to either
      Micro product. The community design page says only that packages for logging
      and monitoring are available on the installation media, and names no stack.

      supportconfig exists as a general vendor tool and the commercial vehicle ships
      a guide for it. Whether it behaves correctly against a read-only, overlay-based
      root is not documented, and that is exactly the kind of question an immutable
      layout raises for tooling written for a mutable one.

      No serial console configuration page was found for either vehicle.
    evidence: DOCUMENTED
    sources:
