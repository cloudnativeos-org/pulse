              Installs additional software
      mechanism:
        - transactional-snapshot
      scope: root-snapshot-etc
      scope_sources:
        - url: https://github.com/openSUSE/transactional-update/blob/ef8af9f/doc/transactional-update.xml
          type: source-repo
          title: openSUSE transactional-update documentation, /etc
          retrieved: '2026-10-06'
          quote: /etc is created as a nested BTRFS subvolume of the root file system.
      steps: "snapshot the root, apply changes inside a chroot, return the snapshot to read-only, set it as the next default boot target"
      initiator: "transactional-update.timer, daily and enabled by default on SUSE Linux Micro 6.2, or an operator running transactional-update; the timer is not named on any community page found"
      requires_kubernetes: false
      requires_vendor_infrastructure: "no for MicroOS; yes for SUSE Linux Micro, which needs product registration for its update repositories"
      self_hostable_update_server: true
      self_hostable_update_source: "A mirror of the Tumbleweed repositories"
      self_hostable_update_server_evidence: INFERRED
      self_hostable_update_server_note: "There is no update server. MicroOS updates from the Tumbleweed zypper repositories. The openSUSE project invites anyone to run a mirror of them."
      self_hostable_update_server_inferred_from: "Two documented facts. MicroOS uses the exact same repositories as Tumbleweed (profile source, Portal:MicroOS zypper page). The openSUSE mirror list says anyone can become a mirror. No page states that a MicroOS host can be pointed at a private mirror. SUSE Linux Micro needs registration, so this value covers the community vehicle only."
      artifact_verification: "RPM and repository signing, inherited from the shared Tumbleweed repositories"
      reboot_coordination: "rebootmgr, with a configurable maintenance window"
      soft_reboot: "SUSE Linux Micro 6.1 and later, for userland-only changes"
    summary: >-
      An update creates a new btrfs snapshot of the root, applies package changes
      inside a chroot into that snapshot, returns it to read-only, and makes it the
      default boot target. The running system is untouched until the reboot.
    notes: >-
      The running system is never modified, which is the property the mechanism
      exists to provide: "Changes are applied in a separate snapshot and so do not
      influence the running system", and the update "is applied only if it
      completes successfully".

      Reboot scheduling is a separate component rather than part of the updater.
      rebootmgr is a service that executes a controlled reboot inside a defined
      maintenance window, with strategies of instantly, maint-window, best-effort
      and off, best-effort being the default. On the commercial vehicle
      transactional-update.timer runs once per day, is enabled by default, and
      then informs rebootmgrd.

      SUSE Linux Micro 6.1 added a soft reboot that restarts only the userland when
      a change contains no new kernel or bootloader, which materially reduces the
      downtime an update costs. No equivalent statement was found for the community
      vehicle.

      **The infrastructure dependency differs between the vehicles and it is the
      sharpest practical difference between them.** MicroOS updates from the same
      public zypper repositories openSUSE Tumbleweed uses, mirrored worldwide, with
      no registration. SUSE Linux Micro "obtains software packages from
      repositories that are available after the product registration", so its
      update path requires a subscription and either the vendor's customer centre
      or a local mirror of it.

      Payload verification is the standard RPM and repository signing that the
      shared Tumbleweed repositories carry. This was not independently re-verified
      by fetching signed repository metadata, and it is recorded as an inference
      from the shared-repository fact rather than as a quoted claim about MicroOS
      specifically.
    evidence: DOCUMENTED
    sources:
      - url: https://documentation.suse.com/sle-micro/6.2/html/Micro-transactional-updates/index.html
        type: vendor-docs
        title: "SUSE Linux Micro 6.2, transactional updates"
        retrieved: "2026-09-22"
        quote: >-
          A new read-write snapshot is created from your current root file system...
          All changes are applied (updates, patches or package installation). The
          snapshot is switched back to read-only mode... the new root file system
          snapshot is set as default. After rebooting, the system boots into the
          new snapshot.
      - url: https://documentation.suse.com/sle-micro/6.2/html/Micro-transactional-updates/index.html
        type: vendor-docs
        title: "SUSE Linux Micro 6.2, transactional updates, automatic update timer"
        retrieved: "2026-09-22"
        quote: >-
          Automatic updates are controlled by systemd.timer that runs once per
          day. This applies all updates and informs rebootmgrd that the machine
          should be rebooted.
      - url: https://github.com/openSUSE/transactional-update
        type: source-repo
        title: transactional-update
        retrieved: "2026-09-22"
        quote: >-
          Only if the update was the successful as a whole the system will boot
          into the new snapshot.
      - url: https://github.com/SUSE/rebootmgr
        type: source-repo
        title: rebootmgr
        retrieved: "2026-09-22"
        quote: >-
          a sd-varlink service to execute a controlled reboot after updates in a
          defined maintenance window
      - url: https://en.opensuse.org/Portal:MicroOS/Zypper
        type: official-docs
        title: "Portal:MicroOS, zypper repositories"
        retrieved: "2026-09-22"
