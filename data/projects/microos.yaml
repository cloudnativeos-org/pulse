    summary: >-
      Six architectures carry released, signed community images, including riscv64
      and s390x. The commercial vehicle ships four and does not include riscv64.
      Peripheral hardware is extended through the ordinary package set rather than
      through a board enumeration.
    notes: >-
      **riscv64 is a released OS image here, and that is worth stating precisely
      because this survey applies the artifacts-not-intentions rule to every
      project.** The riscv64 port directory carries current qcow2 images with
      checksums, PGP signatures and SBOMs. It is a released platform, not a
      tooling-only one. Only one other entry in this edition has a genuinely usable
      riscv64 story, and none of the Kubernetes-oriented hosts do.

      The same check found the limit of it. At the time of collection the riscv64
      images were dated 15 days behind the x86_64, aarch64, armv7l and s390x
      images, which were all current to the previous day. A re-check on
      2026-09-22 found x86_64, aarch64, armv7l and s390x at Snapshot20260919,
      riscv64 still at Snapshot20260830 (20 days behind) and the ppc64le
      appliance and DVD at Snapshot20260817 (33 days behind). The ppc64le port
      directory holds one build per image, and the only build present predates
      the collection date, so the collection-day record that ppc64le was current
      to 2026-09-14 could not be confirmed and is corrected. The design statement is
      that every Tumbleweed snapshot produces a new MicroOS release for every
      architecture. In practice the cadence is not uniform across architectures,
      and that was observed directly rather than inferred.

      s390x images are published under the ports path and are not listed on the
      main download page, so the published architecture set is wider than the
      project's own download page advertises. That is the opposite of the failure
      mode this survey usually finds, and it is recorded in the project's favour.

      The commercial vehicle added ppc64le at 6.1 and carries no riscv64. Its own
      6.1 release notes contain an unresolved internal tension about the ppc64le
      baseline, stating both that the platform "requires at least IBM Power9" and,
      elsewhere, that POWER9 can run but is not supported with POWER10 as the
      supported baseline. Both statements are recorded rather than reconciled.

      Hardware support extends through the ordinary package set, because the
      running system assembles from the same repositories a general-purpose
      distribution uses. There is no board enumeration to add an entry to. That is
      a materially different extension story from the image-based entries in this
      edition.
    evidence: DOCUMENTED
    sources:
