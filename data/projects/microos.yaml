open_questions:
  - "Is openSUSE MicroOS the upstream of SUSE Linux Micro, or are they siblings sharing components? No primary source found states a lineage, and the only documented relationship is Leap Micro as a rebrand of SUSE Linux Micro."
  - "What is the default snapshot retention policy on openSUSE MicroOS, and therefore how many rollback targets does a stock community installation keep? The commercial vehicle's 6.2 documentation publishes snapper defaults of 2 to 10; no community page does."
  - "Does SUSE Linux Micro 6.x still ship health-checker and automatic rollback on boot failure? It is documented for 5.x, the 6.2 article index has no article for it, and the 6.x release notes do not mention it."
  - "What does the shipped health-checker plugin set actually check, and therefore what does a successful boot really assert?"
  - "Is / read-only on SUSE Linux Micro 6.x, or only /usr? The 6.2 documentation says read-only root file system, documents the /etc overlay under /var/lib/overlay and the /var exclusion, but does not name the boundary."
  - "Can immutability be disabled on any of the three vehicles, and if so how?"
  - "Is transactional-update.timer enabled by default on a stock openSUSE MicroOS image? The commercial vehicle documents it as daily and enabled by default; no community page names it."
  - "Is there a documented factory reset, or any remote or out-of-band recovery path, for any of the three vehicles?"
  - "Does FIPS mode on SUSE Linux Micro inherit the enterprise server's validated cryptographic modules, and is that inheritance documented anywhere?"
  - "Was SELinux enforcing by default ever announced for MicroOS by name, or is it purely inherited from the shared Tumbleweed installer default?"
  - "Why do the rolling image filenames carry a Leap-style 16.0.0 token, and what governs when it increments?"
  - "Are the riscv64 and ppc64le image cadence lags structural? riscv64 had no new build between 2026-08-30 and 2026-09-22; ppc64le had none between 2026-08-17 and 2026-09-22."
  - "Will the successor to SUSE Linux Micro 6.2 ship as SUSE Linux Micro 6.3, the name the 6.2 release notes use for the SLE merge, or as SUSE Linux Enterprise Server 16.1 (Immutable), the name the February 2026 announcement uses? The lifecycle page lists neither."
  - "What is the ppc64le baseline for SUSE Linux Micro, where the 6.1 release notes say both at least Power9 and POWER10 or higher?"
  - "Has any openSUSE trademark or infrastructure ownership moved to the Geeko Foundation, or is its role limited to sponsorship? Two current project pages disagree on whether a foundation exists."
  - "Is the SUSE Linux Micro product build itself done in a public build-service project, or only the shared core it draws from?"
  - "Does RKE2 have any documented deployment path on the community vehicles?"
  - "Who owns support for an image an adopter builds with KIWI or Edge Image Builder, and does customization affect a commercial entitlement?"
  - "What happens to openSUSE MicroOS, the rolling vehicle, as the commercial one converges into the enterprise server's immutable mode and Leap Micro 6.3 becomes an appliance image of Leap 16.1? No statement about the rolling vehicle was found."
  - "Does any vehicle publish logging, metrics or monitoring documentation?"
  - "Can SUSE Linux Micro be updated as one centrally built image through Elemental, and does that make the commercial vehicle meet R1 on its own? This profile judges the update tool of the vehicle, transactional-update. The Elemental path is profiled as its own entry, data/projects/elemental.yaml."

