  d12_fleet_management:
    normalized:
      core_project:
        - "transactional-update, the snapshot-based updater"
        - "health-checker, boot validation with automatic rollback"
        - "rebootmgr, controlled reboot inside a maintenance window"
        - "sysextmgrcli and sysextmgrd, system extension management"
      oss_companion:
        - name: transactional-update
          repo: https://github.com/openSUSE/transactional-update
          license: "GPL-2.0 and LGPL-2.1"
          org: openSUSE
          note: "Single node. The updater itself, not a fleet tool."
        - name: health-checker
          repo: https://github.com/openSUSE/health-checker
          license: GPL-2.0
          org: openSUSE
          note: "Single node. Boot validation plugins and automatic rollback."
        - name: rebootmgr
          repo: https://github.com/SUSE/rebootmgr
          license: "GPL-2.0 and LGPL-2.1"
          org: SUSE
          note: "Single node. Lives in the vendor's GitHub organisation rather than the community one, though community documentation links it."
        - name: combustion
          repo: https://github.com/openSUSE/combustion
          license: GPL-2.0
          org: openSUSE
          note: "First boot only."
        - name: Edge Image Builder
          repo: https://github.com/suse-edge/edge-image-builder
          license: Apache-2.0
          org: suse-edge
          note: "Builds customized images for the commercial vehicle. On 2026-09-22 the repository root carries a LICENSE file that GitHub's licence detection reports as Apache-2.0; at collection the licence had been read from package metadata."
      commercial:
        - name: SUSE Multi-Linux Manager
          vendor: SUSE
          license: proprietary
          self_hostable: true
          note: "Formerly SUSE Manager. Documented as supporting SUSE Linux Micro 6.1 and 6.2 as client operating systems, with patching, content lifecycle management and monitoring."
        - name: SUSE Edge with Rancher and Elemental
          vendor: SUSE
          license: "mixed, with open-source components"
          self_hostable: true
          note: "elemental-register and elemental-system-agent onboard SUSE Linux Micro hosts to Rancher for phone-home provisioning. A separate product, not an OS capability."
      cluster_api:
        os_specific_provider: "none"
        maintainer: not-applicable
        upstream_provider_list: "not listed under any provider type, for any of the three release vehicles"
        provisions: not-applicable
        bootstrap_target: "for the commercial vehicle, the RKE2 bootstrap and control-plane providers, which the vendor's own organisation maintains and which are Kubernetes-distribution-scoped rather than operating-system-scoped"
        image_builder_target: "none. image-builder contains no SUSE target on any platform."
        community_vehicles: "no Cluster API story at all for openSUSE MicroOS or Leap Micro"
        abandoned_attempt: "cluster-api-provider-elemental, a Cluster API infrastructure provider for Elemental-built hosts, reached v0.7.0 in September 2024 and was archived on 2026-05-12"
    summary: >-
      The project itself ships single-node lifecycle tools and no fleet manager.
      Every multi-node capability, inventory, scheduled rollout, drift detection and
      onboarding, belongs to a separate commercial product and applies to the
      commercial vehicle.
    notes: >-
      The four core tools are genuinely good at what they do and none of them is a
      fleet tool. transactional-update updates one machine, health-checker validates
      one boot, rebootmgr schedules one reboot inside a window, sysextmgr manages one
      machine's extensions. Composed, they let an unattended machine patch itself and
      recover from a bad update without an operator, which is a real fleet-relevant
      property even though no fleet component exists.

      No fleet-scale open-source companion built for the community vehicle was found.
      That is recorded as not found rather than as absent, since a general
      configuration-management integration may exist without a page describing it for
      this substrate specifically.

      The commercial products are kept in their own bucket deliberately. Multi-Linux
      Manager's patching and lifecycle management, and Elemental's onboarding to
      Rancher, are capabilities of those products. An adopter running the community
      vehicle inherits the four single-node tools and builds the rest.

      The Cluster API answer splits along the same community-versus-commercial
      line the rest of this profile does, and the split is sharp.

      The community vehicles have no Cluster API story. No provider exists in
      the community organisation, nothing is listed upstream, and image-builder
      contains no target for any of this vendor's operating systems on any
      platform.

      The commercial vehicle has a working path, and none of it is
      operating-system-specific. The vendor's own subsidiary maintains the RKE2
      bootstrap and control-plane providers, which are listed upstream and
      actively released, and they are scoped to a Kubernetes distribution rather
      than to an operating system: their own examples use a different
      distribution's images. The vendor publishes a guide for building a virtual
      machine template of its commercial vehicle by hand, for use with a generic
      vSphere infrastructure provider plus those RKE2 providers. So the path is
      generic infrastructure provider, plus a distribution-scoped bootstrap
      provider, plus a template the operator builds themselves.

      One abandoned attempt belongs in the record because it is the only
      operating-system-native Cluster API provider this vendor ever built. Its
      Elemental Cluster API infrastructure provider registered bare-metal hosts,
      installed the operating system and handled Cluster API bootstrap. It
      described itself as an early prototype, reached v0.7.0 in September 2024,
      and was archived on 2026-05-12. The non-Cluster-API Elemental product
      continues, and its Cluster API integration layer is an operator rather
      than a provider and does not provision anything itself.
