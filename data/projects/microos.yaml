schema_version: "1.0.0"
edition: "2026"
id: microos
name: openSUSE MicroOS
homepage: https://microos.opensuse.org/
repository: https://github.com/openSUSE/transactional-update
collected_at: "2026-09-15"

entry_kind:
  - distribution

category_fit:
  comparable: full
  note: >-
    Comparable on all fourteen dimensions. This profile is the transactional
    snapshot model's only entry in the 2026 edition, and it is the only entry
    whose root state substrate is `transactional-snapshot`.

    **Three release vehicles share one architecture, and this profile covers all
    three.** openSUSE MicroOS is the rolling, Tumbleweed-based community build.
    openSUSE Leap Micro is a versioned community build that the project's own
    roadmap describes as "a re-brand of SLE Micro RPMs with minor configuration
    tweaks". SUSE Linux Micro (named SLE Micro until the 6.1 release) is the
    versioned commercial product. Dimensions d02 through d06, which is to say the
    whole immutability, artifact, upgrade, rollback and customization
    architecture, are the same mechanism across all three: a read-only btrfs root,
    `transactional-update` applying changes in a new snapshot, snapper retention
    and GRUB2 snapshot boot.

    They are recorded in one profile rather than two or three because the
    architecture is one architecture, and separate entries would make `transactional-snapshot`
    appear two or three times in every comparison table and read as that much more
    prevalent than it is. Where the vehicles genuinely differ, and they differ
    sharply on support model, certification, architectures, Kubernetes pairing,
    fleet tooling and governance, each dimension records them as separate named
    fields rather than averaging them.

    The counter-argument was considered and is recorded rather than hidden: the
    support model, subscription requirement and certification claims diverge by
    dated, primary-source evidence, which is a real argument for separate entries.
    It was not taken, because the survey already profiles Fedora CoreOS without a
    separate entry for its commercial downstream, and applying that distinction to
    SUSE but not to Red Hat would apply it where it is convenient rather than
    consistently.

    No primary source found in this research states that openSUSE MicroOS is the
    upstream of SUSE Linux Micro. The documented relationship is that Leap Micro
    is a rebrand of SUSE Linux Micro, and that MicroOS is the Tumbleweed-based
    sibling. The lineage question is recorded in `open_questions` rather than
    asserted.

self_description:
  text: >-
    Micro Service OS providing Transactional (Atomic) Updates upon a read-only
    btrfs root filesystem. Designed to host container workloads with automated
    administration & patching.
  source:
    url: https://get.opensuse.org/microos/
    type: official-docs
    title: Get openSUSE MicroOS
    retrieved: "2026-09-22"
    quote: >-
      Micro Service OS providing Transactional (Atomic) Updates upon a read-only
      btrfs root filesystem

