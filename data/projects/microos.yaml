    field: dimensions.d08_hardware_platform.normalized.gpu
    change: "Said NVIDIA open driver in the commercial vehicle's core repositories from 6.2. No cited source supported the repository or the from-6.2 claim. The SUSE Edge 3.5 guide documents pre-built open-source NVIDIA drivers on SUSE Linux Micro 6.2 behind a subscription; the value now says that and the guide is added as a source."
