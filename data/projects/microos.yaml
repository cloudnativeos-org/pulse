      quote: >-
        Requires: health-checker
  - date: "2026-10-06"
    field: "tradeoffs.costs"
    change: "Methodology section 9, rule 16: a single-vendor entry says single vendor once, and a commit share is added only when it is measured the same way for every entry. Was 'The snapshot tooling has a small contributor base: 26 contributors on the updater, with two holding most commits, 11 on the health checker, and 4 on the first-boot tool.' Now 'Ownership is single-vendor: a vendor legal entity holds the trademark and the infrastructure.' (d13 vendor_neutral_ownership: single-vendor, and the d13 summary). The contributor and commit counts stay in d13 contribution_diversity."
  - date: '2026-10-12'
    field: dimensions.d02_immutability.normalized.writable_and_persistent
    change: Narrowed from /var, /etc, /root, /home and /boot/writable to /var and /etc (overlay). The Kubic transactional-update guide, which I could read, documents /var and the /etc overlay. It does not name /home, /root or /boot/writable, and the openSUSE wiki Design page that may name them blocks automated retrieval with a proof-of-work challenge on 2026-10-12. Those three are now unverified, not removed as wrong. Added configurable_paths (unknown).
    source:
      url: https://kubic.opensuse.org/documentation/transactional-update-guide/tu-setup.html
      type: official-docs
      title: 'transactional-update guide: /var'
      retrieved: '2026-10-12'
      quote: On a read-only system this directory has to be writable in any case, variable data is stored inside.
  - date: '2026-10-12'
    field: dimensions.d02_immutability.normalized.writable_and_persistent
    change: Restored /home and /root, and added /opt, /srv, /usr/local and /boot/writable, from the image definition, which lists each as a separate btrfs subvolume beside the read-only root snapshot (btrfs_root_is_readonly_snapshot="true"). /boot/writable appears in 20 of the 22 image profiles; the kvm-and-xen-sdboot and kvm-and-xen-grub-bls profiles do not have it. This replaces the earlier note that these paths were unverified because the openSUSE wiki blocked retrieval.
    source:
      url: https://api.opensuse.org/public/source/openSUSE:Factory/openSUSE-MicroOS/openSUSE-MicroOS.kiwi?rev=103
      type: source-repo
      title: openSUSE-MicroOS image definition (kiwi), openSUSE:Factory, revision 103
      retrieved: '2026-10-12'
      quote: <volume name="boot/writable"/>
  - date: '2026-10-12'
    field: dimensions.d06_customization.normalized.add_software
    change: 'Added the add_software field. It records how an adopter adds software to the OS itself, not workloads. Values: Transactional packages, systemd-sysext. Each value has its sources, read on 2026-10-12.'
    source:
      url: https://en.opensuse.org/Portal:MicroOS/Design
      type: official-docs
      title: openSUSE MicroOS design
      retrieved: '2026-10-12'
      quote: A MicroOS installation can be updated and new RPM packages can be installed using the transactional-update or the pkcon application.
