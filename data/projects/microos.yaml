  d13_governance:
    normalized:
      license: "GPL-2.0 as the collective-work licence; components carry their own licences"
      open_source: true
      open_governance: documented
      vendor_neutral_ownership: single-vendor
      foundation: "the Geeko Foundation exists and sponsors project events; no source states it holds the trademark"
      trademark_and_infrastructure_steward: "SUSE Software Solutions Ireland Limited"
      primary_commercial_sponsor: SUSE
      board: "elected by the community; the chair is appointed by the sponsor"
      contribution_diversity:
        method: >-
          GitHub contributors API against the three repositories that carry this
          entry's distinguishing mechanism: openSUSE/transactional-update,
          openSUSE/health-checker and openSUSE/combustion. All-time commit counts per
          individual, not per organization. Employer affiliation is not published for
          these repositories and is therefore not claimed here, although several
          account names carry vendor suffixes. This method counts only the lifecycle
          tooling, not the thousands of packages the distribution inherits from
          openSUSE Tumbleweed, so it measures the mechanism's maintainer base rather
          than the distribution's.
        value: >-
          Measured 2026-09-22. transactional-update: 26 contributors, 1042 commits,
          the top two holding 938 of them. health-checker: 11 contributors, 106
          commits, the top two holding 85. combustion: 4 contributors, 73 commits,
          the top one holding 68. At collection on 2026-09-15 the counts were 966,
          861, 97, 78, 73 and 68 respectively, with the same contributor totals.
          The mechanism that distinguishes this entry rests on a small number of
          people.
    summary: >-
      A community distribution with an elected board and a published decision
      process, whose trademark and infrastructure are held by a vendor legal entity.
      The commercial vehicle is a vendor product with no published governance of its
      own.
    notes: >-
      The four governance properties separate cleanly here and the honest reading is
      mixed. Open source: yes. Open governance: documented, and genuinely so, through
      an elected board that includes community volunteers alongside employees, with
      the chair appointed by the sponsor. Vendor-neutral ownership: no. Contribution
      diversity on the distinguishing mechanism: low.

      The ownership position is stated by the project itself with unusual clarity,
      and both halves of it deserve quoting. The sponsor "acts as an open-source
      software steward by providing infrastructure, resources and sponsorship", and
      the distributions "are separate from and independent of SUSE's commercial
      enterprise product offerings" and "are supported by the openSUSE community;
      they are not commercially supported by SUSE". That is a clearer statement of
      the boundary than several other entries in this edition publish at all.

      Two of the project's own pages disagree about the foundation question, and both
      are current. A board working document frames a foundation as an open request to
      the sponsor, citing volunteer bandwidth and past difficulty accepting hardware
      donations. Another page states flatly that "The Geeko Foundation has been
      established to help the project". The Geeko Foundation is a real legal entity, a
      not-for-profit company in England and Wales, and its own site shows it
      sponsoring project events. Nothing found states that it holds the trademark or
      the project assets. So the accurate answer today is that the trademark steward
      is a vendor entity and a separate not-for-profit exists alongside it.

      The commercial vehicle has no published governance of its own. Its stated build
      lineage runs through a build-service project that describes itself as public,
      but the product-specific build was not confirmed to be public, and no decision
      process a non-employee could join was found for the product.
    evidence: DOCUMENTED
    sources:
      - url: https://en.opensuse.org/openSUSE:License
        type: governance-doc
        title: "openSUSE licence and stewardship"
        retrieved: "2026-09-22"
        quote: >-
          SUSE Software Solutions Ireland Limited ... acts as an open-source software
          steward by providing infrastructure, resources and sponsorship to support
          The openSUSE Project... openSUSE Distributions are supported by the openSUSE
          community; they are not commercially supported by SUSE.
      - url: https://en.opensuse.org/openSUSE:Board
        type: governance-doc
        title: "openSUSE Board"
        retrieved: "2026-09-22"
        quote: >-
          The purpose of the openSUSE Board is to lead the overall project... The
          board members are elected by the community and the chair person is appointed
          by SUSE.
      - url: https://en.opensuse.org/Portal:Foundation/Intro
        type: governance-doc
        title: "openSUSE foundation portal"
        retrieved: "2026-09-22"
        quote: "The Geeko Foundation has been established to help the project."
      - url: https://geekos.org/
        type: foundation-page
        title: The Geeko Foundation
        retrieved: "2026-09-22"
        quote: >-
          a not-for-profit enterprise limited by guarantee in England and Wales
    unknowns:
      - "Whether any openSUSE trademark or infrastructure ownership has moved to the Geeko Foundation, or whether its role is limited to sponsorship."
      - "Whether the commercial product's own build, as distinct from the shared core project, is done in public."
      - "Employer affiliation of contributors to the lifecycle repositories is not published, so the diversity figure counts individuals only."

  d14_maturity:
    normalized:
      first_release: "2017-05 (project start); integrated into the Tumbleweed release process by 2018-08"
      current_version: "16.0.0-Snapshot20260919"
      current_version_date: "2026-09-19"
      release_cadence: "one image set per Tumbleweed snapshot, but not uniform across architectures"
      observed_intervals: "at collection, x86_64, aarch64, armv7l and s390x current to 2026-09-14 and riscv64 15 days behind at Snapshot20260830; on 2026-09-22, x86_64, aarch64, armv7l and s390x at Snapshot20260919, riscv64 still at Snapshot20260830 (20 days), ppc64le at Snapshot20260817 (33 days)"
      support_model: rolling-no-lts
      support_window: "none for the rolling vehicle; Leap Micro and SUSE Linux Micro publish dates"
      commercial_support: "none for MicroOS; available for SUSE Linux Micro"
      commercial_support_window: "roughly four years of general support per minor version"
    summary: >-
      Nine years old, rolling, with a new image set for every upstream snapshot and
      no end-of-life date to plan against. The versioned vehicles beside it publish
      concrete dates, and the commercial one carries roughly four years of general
      support per minor version.
    notes: >-
      The cadence claim and the observed cadence mostly agree, which is not the usual
      finding in this edition. The design statement is that every Tumbleweed snapshot
      produces a new MicroOS release, and four of the six architectures were current
      to the previous day at collection. riscv64 was 15 days behind, so the claim
      holds per snapshot but not per architecture. A re-check one week later found
      the same four architectures at the 2026-09-19 snapshot, riscv64 unchanged at
      Snapshot20260830, and ppc64le at Snapshot20260817, a build that predates the
      collection date; the collection-day record had counted ppc64le among the
      current architectures and is corrected (see d08).

      **The support-window column is where the three vehicles diverge most, and it is
      the reason to read them as one architecture with three commitments rather than
      as one product.** The rolling vehicle publishes no end-of-life date at all,
      because a rolling release does not have one, and it is explicitly not
      commercially supported. Leap Micro publishes GA and planned end-of-life dates
      and a twice-yearly cadence. SUSE Linux Micro publishes a lifecycle table with
      roughly four years of general support per minor version, running to 2029-11-30
      for 6.2. A team with an auditor to answer to is choosing between those three
      commitments, not between three architectures.

      The commercial cadence observed from the lifecycle table was roughly semi-annual
      through the 5.x line and stretched to about eleven months between 6.1 and 6.2.

      One documentation observation is recorded because it affects a reader trying to
      repeat this research. The release-notes pages carry publication dates later than
      the general availability dates on the lifecycle page, by more than a year in two
      cases. They read as last-rendered timestamps rather than release dates. The
      lifecycle page dates were used here.
    evidence: DOCUMENTED
    sources:
      - url: https://www.suse.com/lifecycle/
        type: vendor-docs
        title: "SUSE product lifecycle, SUSE Linux Micro rows (version, FCS date, general support end)"
        retrieved: "2026-09-22"
        quote: >-
          SUSE Linux Micro 6.0 06 Jun 2024 30 Jun 2028 SUSE Linux Micro 6.1 26 Nov
          2024 30 Nov 2028 SUSE Linux Micro 6.2 04 Nov 2025 30 Nov 2029
      - url: https://en.opensuse.org/Portal:MicroOS/Features
        type: official-docs
        title: "Portal:MicroOS, features"
        retrieved: "2026-09-22"
        quote: >-
          Rolling Release: Every new openSUSE Tumbleweed snapshot also automatically
          produces a new openSUSE MicroOS release.
      - url: https://news.opensuse.org/2018/08/09/opensuse-kubic-moves-in-a-new-direction/
        type: announcement
        title: "openSUSE Kubic moves in a new direction"
        retrieved: "2026-09-22"
        quote: >-
          When we started in May 2017 ... Kubic MicroOS now a fully integrated part
          of the openSUSE Tumbleweed release process.
      - url: https://en.opensuse.org/openSUSE:Roadmap
        type: official-docs
        title: "openSUSE roadmap, Leap Micro releases"
        retrieved: "2026-09-22"
        quote: >-
          Leap Micro is a re-brand of SLE Micro RPMs with minor configuration tweaks.
          Typically trails SLE Micro releases by ~1 month.
      - url: https://en.opensuse.org/Lifetime
        type: official-docs
        title: "openSUSE Lifetime, Leap Micro support model"
        retrieved: "2026-09-22"
        quote: >-
          This updated lifecycle also applies to Leap Micro 6.2 and newer, which
          now follow the same support model as Leap.
    unknowns:
      - "Why the rolling image filenames now carry a Leap-style 16.0.0 version token, and what governs when it increments."
      - "Whether the riscv64 and ppc64le cadence lags are structural. riscv64 was 15 days behind at collection and 20 days behind one week later, with no new build in between; ppc64le was 33 days behind on 2026-09-22."

tradeoffs:
  buys:
    - "A full general-purpose package set is installable on the host without giving up the immutability property. An install happens inside a snapshot, so a driver, an agent or a debugging tool is a first-class path rather than an image rebuild."
    - "Rollback is a snapshot boot rather than a slot swap, so the number of rollback targets is a retention policy rather than a fixed one or two, and any retained snapshot is reachable from the boot menu."
    - "Automatic rollback keyed to extensible health checks rather than to a fixed early boot milestone. What counts as a good boot can be made to mean more than the root mounting."
    - "Secure Boot works on stock firmware with no key enrolment, through a Microsoft-signed shim chaining to an openSUSE certificate."
    - "Machine-readable CycloneDX and SPDX bills of materials, plus a PGP-signed checksum, ship beside every official image on every architecture, by default. This was verified against live artifacts rather than taken from a documentation claim."
    - "Released, signed OS images on six architectures including riscv64 and s390x, more than the project's own download page advertises."
    - "Configuration reverts with the OS, because /etc is snapshotted, while container and application data in /var deliberately does not."
    - "An elected board with a published decision process and community volunteers on it, and a published statement of where community stewardship ends and commercial support begins."
    - "Three release vehicles over one architecture let an adopter move between a free rolling build and a four-year commercial commitment without changing the operational model."
  costs:
    - "No dm-verity and no runtime integrity verification of the root on any vehicle. Immutability rests on a read-only mount and snapshots."
    - "The community Kubernetes story is a wiki page the project itself marks unmaintained, after the archiving of the Kubernetes variant that preceded it."
    - "The commercial vehicle requires product registration for its update repositories, so its update path depends on a subscription and vendor infrastructure or a local mirror of it."
    - "No FIPS 140-3 or Common Criteria certificate names either Micro product. The vendor's certificates belong to its enterprise server."
    - "Every fleet-scale capability belongs to a separate commercial product. The open-source projects ship four single-node tools and nothing that manages a fleet."
    - "Ownership is single-vendor: a vendor legal entity holds the trademark and the infrastructure."
    - "Published architecture cadence is not uniform. riscv64 was 15 days behind the other architectures at collection and 20 days behind a week later, and ppc64le was 33 days behind on 2026-09-22, against a design claim that every snapshot produces every image."
    - "No published vulnerability response commitment or service level for either Micro product."
    - "The downloads page calls the versioned community vehicle experimental, while that vehicle's portal publishes GA and end-of-life dates."
