      version_identity:
        identifier: "os-release VERSION_ID, the Tumbleweed snapshot date, for example 20261003"
        condition: "Deploy every node from one appliance image, add no packages with transactional-update pkg install, use no system extensions, and move nodes together to a pinned snapshot repository."
        meets_r1: false
        r1_reason: "Each node builds its next snapshot from packages with transactional-update, also from a pinned repository. No artifact is built once for the fleet."
        evidence: DOCUMENTED
        sources:
          - url: https://download.opensuse.org/tumbleweed/appliances/
            type: official-docs
