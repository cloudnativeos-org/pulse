schema_version: "1.0.0"
edition: "2026"
id: hadron
name: Hadron Linux
homepage: https://hadron-linux.io/
repository: https://github.com/kairos-io/hadron
collected_at: "2026-09-22"

entry_kind:
  - distribution
  - base-images

category_fit:
  comparable: partial
  note: >-
    Hadron is a from-scratch Linux distribution that publishes versioned base
    images, and it is the base that the Kairos framework is applied to. It is
    profiled separately from Kairos for the same reason bootc is profiled
    separately from Fedora CoreOS: the base and the lifecycle layer are
    different kinds of object, and one profile that covered both would let each
    borrow the other's properties.

    The relationship is stated by the project itself, and it decides how this
    profile is read. The home page says "Topped with Kairos, it becomes
    immutable and has powerful lifecycle management." The announcement calls it
    "the purpose-built, optimal flavor for Kairos, a clean, lean, and
    predictable base OS." The documentation says a raw Hadron image "cannot be
    used to upgrade a running Kairos node directly" until kairos-init has been
    applied to it. So Hadron on its own is not an immutable operating system and
    has no install, upgrade, rollback or recovery mechanism of its own. Those
    are supplied by Kairos, and every Hadron artifact a person can actually
    boot today is a Kairos artifact.

    That is why the fit is partial rather than full. Dimensions d02, d04, d05,
    d09, d11 and d12 are answered here as "provided by the framework layered on
    top", with the sources that say so, and each of them cross-references
    kairos.yaml rather than restating it. A comparison table must not count the
    A/B substrate or the boot-assessment mechanism twice, once for Kairos and
    once for Hadron, because it is one mechanism. What is Hadron's own is the
    base: what is in the image, how it is built, what it costs to extend, what
    hardware the kernel and firmware set reach, the hardening baseline, and the
    governance of the repository.

    This profile was written by people who work on Kairos, in the same
    organization and with the same sponsor as Hadron. The research was
    commissioned with the same instruction as for kairos.yaml: hunt for
    limitations, thin documentation and responsibilities pushed onto the
    adopter. The survey's methodology says a base-images entry is applied to
    the authors' own project on the same terms as to anyone else, and this
    entry is where that is tested.

self_description:
  text: >-
    Hadron is a minimal, from-scratch Linux distro using vanilla components,
    engineered for trusted and flexible boot environments.
  source:
    url: https://github.com/kairos-io/hadron
    type: source-repo
    title: kairos-io/hadron repository description
    retrieved: "2026-09-22"
    quote: >-
      Hadron is a minimal, from-scratch Linux distro using vanilla components,
      engineered for trusted and flexible boot environments.

version_observed:
  version: "v0.5.3"
  released: "2026-09-18"
  channel: stable
  method: >-
    Latest non-prerelease GitHub release on kairos-io/hadron via the releases
    API, cross-checked against the multi-architecture manifest of
