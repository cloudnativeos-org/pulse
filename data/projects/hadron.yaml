  d13_governance:
    normalized:
      license: Apache-2.0
      open_source: true
      open_governance: partial
      vendor_neutral_ownership: unknown
      foundation:
        name: "CNCF, claimed through the Kairos project"
        level: "not separately listed"
      trademark_holder: unknown
      primary_commercial_sponsor: Spectro Cloud
      contributor_agreement: "DCO, through the Kairos organization conventions"
      governance_document: "none in the repository; CODEOWNERS assigns kairos-io/maintainers"
      contribution_diversity:
        method: >-
          git log against a freshly fetched origin/main of kairos-io/hadron for
          the twelve months to 2026-09-22, grouped by author name, with bot,
          agent and assistant accounts excluded by name pattern. Author names
          were cross-referenced against the Kairos MAINTAINERS.md affiliation
          column. Author email domains were also grouped and give the same
          picture, but 266 of 497 commits use GitHub no-reply addresses, so
          names are the more useful key here.
        value: >-
          497 commits in twelve months, of which 245 are from human accounts
          and 252 from dependency bots, a project bot, a code assistant and the
          maintainers' agent accounts. Of the 245 human commits, 242 are from
          four authors who are all listed as Spectro Cloud maintainers in the
          Kairos maintainers file, and 3 are from two other individuals. The
          organization's contributors file credits one of those two with a
          Hadron pull request.
    summary: >-
      Apache-2.0, in the CNCF-hosted Kairos organization, governed by the
      Kairos maintainers through CODEOWNERS. No governance document names
      Hadron, no primary source says who holds the Hadron name and domain, and
      99 percent of human commits in the last year come from four employees
      of one company.
    notes: >-
      The four governance readings separate as sharply here as anywhere in
      the edition. Open source: yes, Apache-2.0 in the LICENSE file and in the
      image labels. Open governance: partial, inherited. The repository has no
      governance, maintainers, contributing or security file of its own. Its
      CODEOWNERS assigns every path to the kairos-io/maintainers team, so the
      Kairos governance document, with the limits kairos.yaml records, is the
      governance that applies, by implication rather than by statement. The
      Kairos governance document does not enumerate the repositories it
      covers.

      Vendor-neutral ownership is recorded as unknown, and the reasoning is
      the important part. The announcement states that "As part of the CNCF
      project Kairos, Hadron guarantees vendor neutrality and a clear
      governance model." No primary source found for this profile establishes
      that: the CNCF project page for Kairos does not list Hadron, the site
      footer at hadron-linux.io says "Kairos authors" rather than naming LF
      Projects as kairos.io's footer does, and no page says who registered the
      hadron-linux.io domain or holds the Hadron name. The README says Hadron
      "is Engineered by Spectro Cloud from the Kairos team". Those are
      compatible with the announcement's claim and do not prove it. kairos.yaml
      already carries this as an open question from the Kairos side; it is
      recorded here from Hadron's side with the same wording.

      Contribution diversity is lower than Kairos's, which is itself recorded
      as low. The commit history is roughly half automation by count: a
      dependency bot, a project bot that opens version bumps, a code assistant
      credited as co-author, and agent accounts operated by the maintainers.
      The organization publishes conventions for those agents, and this is
      recorded, as in kairos.yaml, as a fact about how the history is produced
      rather than as a judgement. Among human authors, one maintainer accounts
      for 154 of 245 commits.
    evidence: DOCUMENTED
