    change: "Author's note (2026-10-06): 'there's also a list of extensions that are published officially so it's not all or nothing'. Cost c0 reworded to name the official lists. Was 'Software beyond the base and the five prebuilt layers is compiled by the adopter in the toolchain image. The adopter rebuilds it for each base release and, under Trusted Boot, re-signs every extension.' Now 'Software beyond the base and the officially published layers and extensions (the hadron-layers catalogue of five layers: drbd, fwupd, git, gpg and tailscale, all but git also as system extensions; and per-target linux-firmware images and extensions from hadron-firmware) is compiled by the adopter in the toolchain image, and rebuilt for each base release.' The hadron-layers README and its releases.json (generated 2026-09-29) list five layers, and the README says the git layer is excluded from sysext publication; the hadron-firmware project publishes per-target firmware images and sysexts. Methodology section 9, rule 18: re-signing under Trusted Boot is a status of the Trusted Boot variant, so it moved into buy b4 as 'Under Trusted Boot, extensions are signed with the adopter's keys.'"
    source:
      url: "https://github.com/kairos-io/hadron-layers/blob/23312b6e6edec6bf0d6394b0570e3750d34752c2/README.md"
      type: "source-repo"
      title: "hadron-layers README, Available layers (git, gpg, fwupd, drbd, tailscale)"
      retrieved: "2026-10-06"
      quote: "The Git layer is temporarily excluded because its exported OCI layer contains hardlink entries that AuroraBoot v0.26.2 cannot extract."
  - date: "2026-10-06"
    field: "tradeoffs.costs"
    change: "Methodology section 9, rule 18: a GPU driver rebuild applies to Bottlerocket, Talos, Kairos and bootc too and is costed on none of them, so it is not a cost here. Cost c1 reworded to the riscv64 sentence only. Was 'No riscv64 images are released: the architecture is in the source, and every riscv64 pipeline job is switched off. GPU drivers are compiled into the image, so a driver update is an image rebuild.' Now 'No riscv64 images are released: the architecture is in the source, and every riscv64 pipeline job is switched off.' The GPU fact stays in d08."
  - date: "2026-10-06"
    field: "tradeoffs.costs"
    change: "Cost c3 reworded to name the repositories. Was 'The two companion repositories an adopter will depend on for layers and firmware have no LICENSE file.' Now 'kairos-io/hadron-layers and kairos-io/hadron-firmware, which provide layers and firmware, have no LICENSE file.' Source: kairos.yaml d13 license_note (2026-09-22). Re-checked on 2026-10-06: gh api repos/kairos-io/hadron-layers/license and repos/kairos-io/hadron-firmware/license both return 404 Not Found, and neither repository root lists a LICENSE file."
    source:
      url: "https://github.com/kairos-io/hadron-layers"
      type: "source-repo"
      title: "hadron-layers repository root (no LICENSE file; license API returns 404)"
      retrieved: "2026-10-06"
  - date: "2026-10-06"
    field: "tradeoffs.buys"
    change: "Author's note (2026-10-06): the relationship to Kairos is not an adopter benefit. Removed buy b5 'Every Kairos-published artifact since v4 is built on it.' The fact stays in category_fit ('every Hadron artifact a person can actually boot today is a Kairos artifact') and in d14 notes."
  - date: "2026-10-06"
    field: "open_questions"
    change: "Added open question 'Do the NVIDIA modules built by the Hadron example load with Secure Boot or Trusted Boot on? The example disables module signing.' From d08 (nvidia-gpu note, INFERRED): the example Dockerfile disables module signing, and the kernel config has MODULE_SIG=y and IMA_ARCH_POLICY=y."
  - date: '2026-10-12'
    field: dimensions.d02_immutability.normalized
    change: 'Added mount_layout and configurable_paths for the Mounts row. Hadron documents no mount layout of its own: the Hadron site says it becomes immutable when topped with Kairos, and the Hadron documentation lists no read-only, ephemeral or persistent paths. The row therefore points to the Kairos data sheet.'
    source:
      url: https://hadron-linux.io/
      type: official-docs
      title: Hadron home page
      retrieved: '2026-10-12'
      quote: Topped with Kairos, it becomes immutable and has powerful lifecycle management.
  - date: '2026-10-12'
    field: dimensions.d06_customization.normalized.add_software
    change: 'Added the add_software field. It records how an adopter adds software to the OS itself, not workloads. Values: Derive the image, systemd-sysext. Each value has its sources, read on 2026-10-12.'
