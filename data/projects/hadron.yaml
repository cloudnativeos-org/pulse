taxonomy:
  workload_scope: general-purpose-host
  construction_model:
    - vendor-base-plus-derivation
  root_state_substrate:
    - ab-partition-image
  notes: >-
    Kubernetes is absent from every Hadron image and optional in the images
    built from it, which places this at the general-purpose-host position. The
    hardening baseline is nonetheless tuned for a Kubernetes node: the shipped
    sysctl file says so in its header, and lists the STIG rules it deliberately
    omits because they would break a CNI or kubelet.

    The construction model is vendor-base-plus-derivation and nothing else.
    The project publishes a base image and a toolchain image, and every
    documented way to use them is to derive: COPY a layer or firmware image on
    top, or compile a package in the toolchain and copy the result in. Hadron
    does not publish a fixed bootable image of its own, so vendor-fixed-image
    does not apply; the fixed images that exist are Kairos releases.

    The substrate is recorded as ab-partition-image because the only
    documented deployment path is through Kairos, whose A/B layout is described
    in kairos.yaml. It is the same substrate, not a second one, and the
    taxonomy axes here describe what a Hadron base becomes when deployed, in
    the way bootc.yaml's axes describe what bootc enables rather than a
    machine bootc ships.

dimensions:
  d01_os_model:
    normalized:
      workload_scope: general-purpose-host
      ships_kubernetes: false
      built_from: "scratch, via mussel, on an Alpine build container"
      libc: musl
      init: systemd
      kernel: "vanilla upstream, two carried patches"
      package_manager: "none"
      image_variants:
        - "hadron (GRUB, default kernel)"
        - "hadron-cloud (GRUB, cloud kernel)"
        - "hadron-trusted (systemd-boot, for UKI)"
        - "hadron-cloud-trusted"
        - "hadron-fips, hadron-cloud-fips, hadron-fips-trusted, hadron-cloud-fips-trusted"
        - "hadron-container (minimal, no kernel)"
        - "hadron-toolchain (build environment)"
      lifecycle_provided_by: kairos
    summary: >-
      A from-scratch base distribution, musl plus systemd plus an unpatched
      upstream kernel, with no package manager, published as OCI base images in
      eight bootloader, kernel and FIPS variants. It becomes an installable,
      immutable, upgradeable system only after the Kairos toolchain is applied
      to it.
    notes: >-
      The project is consistent about what it is, which is more than can be
      said for several entries in this edition. The repository description, the
      README, the home page and the announcement all describe a minimal base
      built from scratch for image-based systems, and all four name Kairos as
      the thing that provides the lifecycle. The README lists "Upgrade System:
      Managed via Kairos agent for A/B style atomic upgrades." The announcement
      table lists "Lifecycle management: Kairos" in the row where Ubuntu has
      apt and Snap and the Red Hat families have dnf, bootc and rpm-ostree.

      Two positioning statements deserve to be recorded because a reader might
      assume the opposite. The announcement says Hadron "is not positioned as a
      replacement or competitor to established general-purpose distributions
      like Ubuntu, Debian, or Alpine" but "an alternative base layer". And it
      is not, on its own, comparable to the whole-system immutable
      distributions in this survey: the home page's own words are that it
      becomes immutable when topped with Kairos.

      "From scratch" is accurate in the sense that no upstream distribution's
      packages are used. The Dockerfile's first line states that it builds "a
      small LFS system, starting from Alpine Linux" and uses the mussel
      cross-compiler builder; Alpine is the build container, not the result,
      and the image-structure test asserts that no glibc is present.

      "Vanilla" and "minimal patches" are checkable and hold, with a precise
      count: two kernel patches and four userspace patches are carried in the
      repository at v0.5.3. The kernel is a stock upstream release, 7.2.6 in
      the v0.5.3 component table, built in a default and a cloud configuration.

      The musl-plus-systemd combination is unusual and the project says so.
      It is achieved with the OpenEmbedded musl patches for systemd, credited
      in the README acknowledgements.

      The relationship to Kairos is the point that matters for the taxonomy of
      this edition, so it is stated exactly. The Kairos build tool recognizes
      Hadron as one of its base families in code. The Hadron repository's own
      make build target pulls the published Hadron image, fetches the Kairos
      Dockerfile at a pinned commit, and applies kairos-init to the Hadron base
      to produce the image it then turns into an ISO. Hadron's acceptance tests
      boot that Kairos-on-Hadron image, not a bare Hadron image. Since Kairos
      v4, Hadron is the only base for which Kairos publishes prebuilt artifacts.
      Kairos to Hadron is therefore the relationship of a framework to the base
      it is applied to, and Kairos treats Hadron the same way it treats an
      Ubuntu base, with one difference: Hadron is built by the same team, in
      the same organization, and is the default.
    evidence: DOCUMENTED
    sources:
      - url: https://hadron-linux.io/
        type: official-docs
        title: Hadron Linux home page
        retrieved: "2026-09-22"
        quote: >-
          Topped with Kairos, it becomes immutable and has powerful lifecycle
          management
      - url: https://github.com/kairos-io/hadron/blob/main/README.md
        type: source-repo
        title: Hadron README
        retrieved: "2026-09-22"
        quote: >-
          Upgrade System: Managed via Kairos agent for A/B style atomic
          upgrades
      - url: https://kairos.io/blog/2025/12/17/introducing-hadron-the-minimal-upstream-first-linux-base-for-kairos
        type: announcement
        title: Introducing Hadron, 2025-12-17
        retrieved: "2026-09-22"
        quote: >-
          Hadron is the purpose-built, optimal flavor for Kairos, a clean,
          lean, and predictable base OS.
      - url: https://github.com/kairos-io/hadron/blob/main/Dockerfile
        type: source-repo
        title: Hadron Dockerfile, header and stage list
        retrieved: "2026-09-22"
        quote: >-
          This is Dockerfile, that at the end of the process it builds a small
          LFS system, starting from Alpine Linux. It uses mussel to build the
          system.
      - url: https://github.com/kairos-io/hadron/blob/main/Makefile
        type: source-repo
        title: Hadron Makefile, build-kairos target
        retrieved: "2026-09-22"
        quote: >-
          build: pull-image build-kairos build-iso ... curl -sSL
          https://raw.githubusercontent.com/kairos-io/kairos/${KAIROS_DOCKERFILE_REF}/images/Dockerfile
      - url: https://github.com/kairos-io/kairos/blob/master/kairos-init/pkg/values/values.go
        type: source-repo
        title: kairos-init recognized distributions
        retrieved: "2026-09-22"
        quote: 'Hadron Distro = "hadron" ... HadronFamily Family = "hadron"'

  d02_immutability:
    normalized:
      provided_by: kairos
      read_only_own_image: "none"
      integrity_mechanism_own_image:
        - "none"
      integrity_mechanism_when_deployed:
        - read-only-mount
      runtime_integrity_verification: "none"
      immutability_can_be_disabled: true
      immutability_disable_where: the kernel command line, through Kairos
      mount_layout: Set by the lifecycle manager (Kairos); see the Kairos data sheet
      configurable_paths:
        value: via-lifecycle-manager
        evidence: DOCUMENTED
        how: Set by the lifecycle manager (Kairos); see the Kairos data sheet
        sources:
          - url: https://hadron-linux.io/
            type: official-docs
            title: Hadron home page
            retrieved: '2026-10-12'
            quote: Topped with Kairos, it becomes immutable and has powerful lifecycle management.
    summary: >-
      The Hadron image enforces nothing on its own. Immutability, the read-only
      root, the overlay for writable paths and the persistent bind mounts all
      come from Kairos once kairos-init has been applied, and are exactly the
      mechanism recorded in kairos.yaml d02.
    notes: >-
      The absence is documented rather than inferred: the home page says
      Hadron becomes immutable when topped with Kairos, and the Hadron
      documentation says a derived Hadron image "is just a Hadron rootfs" until
      it is kairosified. A bare Hadron image is an ordinary root filesystem
      with a writable everything.

      Everything after that point belongs to Kairos, and the properties travel
      with it, including the unflattering ones: a read-only loopback-mounted
      ext2 image rather than dm-verity, no runtime integrity verification of
      the root, no drift detection, and kernel command-line flags that switch
      immutability off. None of those are Hadron design decisions, and none of
      them are fixed by choosing Hadron over another base. See kairos.yaml d02
      for the full record and its sources.

      What Hadron does contribute to the immutability story is a smaller
      writable surface by construction: no package manager, no package
      database, and a filesystem that the build strips of headers, static
      archives, documentation and locale data. That reduces what there is to
      drift, but it is a size property, not an enforcement mechanism, and the
      profile does not record it as one.
    evidence: DOCUMENTED
    sources:
      - url: https://hadron-linux.io/
        type: official-docs
        title: Hadron Linux home page
        retrieved: "2026-09-22"
        quote: >-
          Topped with Kairos, it becomes immutable and has powerful lifecycle
          management
      - url: https://kairos.io/hadron-docs/linux-firmware
        type: official-docs
        title: Adding Linux firmware to Hadron, "not bootable yet" warning
        retrieved: "2026-09-22"
        quote: >-
          The image produced above is not a bootable/upgradeable Kairos image
          yet, it is just a Hadron rootfs with extra firmware. A raw Hadron
          image cannot be used to upgrade a running Kairos node directly.
      - url: https://github.com/kairos-io/hadron/blob/main/Dockerfile
        type: source-repo
        title: Hadron Dockerfile, full-image-final stage
        retrieved: "2026-09-22"
        quote: >-
          RUN find / -name '*.a' -delete ... RUN rm -rf /usr/share/man ... RUN
          rm -rf /usr/share/locale

  d03_artifact:
    normalized:
      primary_artifact: oci-image
      derived_artifacts:
        - "Kairos OCI image, after kairos-init"
        - "Kairos ISO, raw disk image and UKI, via AuroraBoot"
      oci_registry_distribution: true
      registry: ghcr.io/kairos-io
      content_addressable: true
      mirrorable: true
      signed: "not observed: the build workflow has no signing step and the registry holds no signature tags"
      provenance: "SLSA v1 provenance attestation attached to the image index"
      sbom: unknown
      github_release_assets: "none"
      bootable_as_published: false
    summary: >-
      Ten OCI images per release on GitHub Container Registry, for amd64 and
      arm64, with a SLSA provenance attestation attached. None of them is
      bootable or installable as published; the bootable artifacts are Kairos
      releases built from them.
    notes: >-
      The published set was enumerated from the registry rather than from the
      documentation, because no page enumerates it. At v0.5.3 there are eight
      bootable-base variants, produced by a matrix of bootloader (GRUB or
      systemd-boot), kernel (default or cloud) and FIPS, plus the minimal
      container image and the toolchain image. Every one is a two-architecture
      index, amd64 and arm64. The GitHub release carries no file assets at all;
      the release page is a changelog and a shipped-components table.

      Provenance is present and was verified by reading the image index: each
      architecture manifest has a companion attestation manifest whose single
      layer carries the https://slsa.dev/provenance/v1 predicate. That is the
      default output of the build action the workflow uses, not a documented
      project commitment, and no page mentions it. No SBOM predicate is attached
      and no SBOM is published anywhere that could be found, so sbom is
      recorded as unknown rather than none.

      Signing is recorded as not observed. The workflow has no
      signing step, the registry holds no signature tags for the image
      repository, and no documentation page says the images are or are not
      signed. That is different from Kairos's own releases, which are signed
      with Sigstore and were verified as such in kairos.yaml. An adopter who
      derives from ghcr.io/kairos-io/hadron today has nothing to verify the
      base against except the digest.

      The naming is worth a warning because it is easy to misread. Kairos
      publishes its own Hadron-based images to a different registry under a
      different naming scheme, for example quay.io/kairos/hadron with a tag that
      encodes the Hadron version, the Kairos version, the architecture and the
      bootloader. The ghcr.io/kairos-io/hadron images profiled here are the
      bases those are built from. No documentation page explains the split, a
      gap kairos.yaml also records from its side.

      Component transparency is good: the release notes carry a full table of
      shipped component versions, and each image ships the same data as a JSON
      manifest at /usr/lib/hadron/components.json, which the image-structure
      test asserts is present and parseable.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/kairos-io/hadron/pkgs/container/hadron
        type: source-repo
        title: ghcr.io/kairos-io/hadron package page
        retrieved: "2026-09-22"
        quote: >-
          Manifest list for v0.5.3 inspected on 2026-09-22: linux/amd64,
          linux/arm64, plus two attestation manifests carrying
          https://slsa.dev/provenance/v1. No signature tags in the repository.
      - url: https://github.com/kairos-io/hadron/blob/main/.github/workflows/build-multiarch-images.yml
        type: source-repo
        title: Build main and release images workflow
        retrieved: "2026-09-22"
        quote: >-
          tags: ghcr.io/${{ github.repository }}${{ matrix.kernel == 'cloud'
          && '-cloud' || '' }}${{ matrix.fips == 'fips' && '-fips' || ''
          }}-trusted:${{ github.ref_name }}-amd64
      - url: https://github.com/kairos-io/hadron/releases/tag/v0.5.3
        type: release-notes
        title: Hadron v0.5.3, no file assets
        retrieved: "2026-09-22"
        quote: "Release asset count via the releases API: 0."
      - url: https://github.com/kairos-io/hadron/blob/main/tests/image_structure_test.go
        type: source-repo
        title: Image structure test, component manifest
        retrieved: "2026-09-22"
        quote: It("ships a parseable per-image component manifest"
    unknowns:
      - "Whether an SBOM is produced for the base images. Only a provenance attestation is attached."

  d04_upgrade:
    normalized:
      provided_by: kairos
      mechanism:
        - ab-partition-switch
      scope: whole-os-image
      scope_note: Hadron is upgraded through Kairos, so the Kairos entry's note on persistent paths applies.
      scope_sources:
        - url: https://github.com/kairos-io/kairos-docs/blob/main/docs/architecture/immutable.md
          type: official-docs
          title: 'Kairos docs: immutable architecture'
          retrieved: '2026-10-06'
          quote: a single layer which gets pulled and swapped atomically during upgrades
      own_mechanism: "none"
      requires_kubernetes: false
      requires_vendor_infrastructure: false
      base_version_pinning: "the Kairos release pins a Hadron version; Kairos v4.3.0 ships Hadron v0.5.1 while Hadron is at v0.5.3"
    summary: >-
      Hadron has no upgrade mechanism of its own. A Hadron-based system
      upgrades through the Kairos agent's A/B image swap, with every property
      and every gap recorded in kairos.yaml d04, including the unverified
      default path and the bootloader that is not refreshed at v4.3.0.
    notes: >-
      The README states it in one line: upgrades are managed via the Kairos
      agent. The announcement's comparison table gives the upgrade model as
      "Image-based (via Kairos)". Nothing in the Hadron repository installs,
      swaps or boots an image.

      What is Hadron's own, and matters to an adopter planning upgrades, is
      the version coupling. A Kairos release pins one Hadron version and builds
      its artifacts from it, and the documentation site's per-version
      configuration shows the pairing: Kairos v4.2.0 and v4.3.0 both ship
      Hadron v0.5.1. Hadron has released v0.5.2 and v0.5.3 since, on 2026-09-09
      and 2026-09-18. So an adopter consuming project-published Kairos
      artifacts gets Hadron's kernel, systemd and OpenSSL at whatever versions
      the pinned Hadron release carried, and moves forward only when Kairos
      re-pins. An adopter who wants a newer base sooner builds their own image,
      which is the path the project recommends for every non-default case and
      whose costs kairos.yaml d06 records.

      The reverse coupling also exists and is pinned deliberately: the Hadron
      repository's own build fetches the Kairos Dockerfile at a fixed commit,
      with a comment explaining that tracking the Kairos main branch made
      Hadron's continuous integration fail on changes that were not Hadron's.
      Two projects released separately, each pinning the other, is a
      reasonable engineering arrangement; it is also one that no documentation
      page describes, so a reader has to reconstruct it from a Makefile comment
      and a site configuration file.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/kairos-io/hadron/blob/main/README.md
        type: source-repo
        title: Hadron README, upgrade system
        retrieved: "2026-09-22"
        quote: >-
          Upgrade System: Managed via Kairos agent for A/B style atomic
          upgrades
      - url: https://github.com/kairos-io/kairos-docs/blob/main/docusaurus.config.ts
        type: source-repo
        title: Kairos docs site configuration, per-version Hadron pairing
        retrieved: "2026-09-22"
        quote: "'v4.3.0': { ... hadronFlavorRelease: 'v0.5.1' ... }"
      - url: https://github.com/kairos-io/hadron/blob/main/Makefile
        type: source-repo
        title: Hadron Makefile, KAIROS_DOCKERFILE_REF pin
        retrieved: "2026-09-22"
        quote: >-
          Pinned commit, not a branch: build-kairos fetches this file live at
          build time, so leaving it on master means every hadron CI run depends
          on whatever kairos/master happens to be at the moment it runs
    unknowns:
      - "No page states the policy for when a Kairos release re-pins its Hadron version, or whether a Hadron patch release ever triggers a Kairos patch release."

  d05_rollback_recovery:
    normalized:
      provided_by: kairos
      rollback_to_previous: available
      automatic_rollback_on_boot_failure: available
      retained_versions: 2
      retained_versions_note: "versions on disk, counting the running one, as in kairos.yaml"
      recovery_environment: dedicated-partition
      factory_reset: available
      network_independent_recovery: "yes"
      trusted_boot_boot_assessment_tested_in_hadron_ci: true
    summary: >-
      Every rollback and recovery property is Kairos's: one retained previous version,
      boot assessment with one retry on the GRUB path, a recovery partition and
      a factory reset, all documented and all with the gaps recorded in
      kairos.yaml d05. Hadron adds one fact of its own: its acceptance suite
      tests Trusted Boot boot assessment, which the Kairos documentation says
      in one place does not exist.
    notes: >-
      The values are copied from kairos.yaml d05 so that a table row for
      Hadron is not blank, and they carry the same caveats: a boot counts as
      successful on reaching an early configuration stage, the retained-version
      count is published nowhere, and no rollback procedure page exists. A
      reader evaluating Hadron for its recovery story is evaluating Kairos.

      The one contribution Hadron makes to this dimension is evidentiary.
      kairos.yaml records that two Kairos documentation pages disagree on
      whether boot assessment works under Trusted Boot, one describing it and
      one saying it is not implemented. Hadron's test suite contains a test
      labelled acceptance-trusted-boot-assessment whose description is "works
      and boots in passive as failover from a broken active", run against a
      Kairos-on-Hadron UKI image. That is source-level evidence that the
      mechanism exists and is exercised, which supports the first page and
      contradicts the second. It is recorded here as a test that exists, not as
      a result this survey reproduced, because this edition runs no
      experiments.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/kairos-io/hadron/blob/main/tests/uki_test.go
        type: source-repo
        title: Hadron UKI acceptance tests
        retrieved: "2026-09-22"
        quote: >-
          Describe("Uki boot assessment tests", Label("acceptance-trusted",
          "acceptance-trusted-boot-assessment") ... It("works and boots in
          passive as failover from a broken active"
      - url: https://github.com/kairos-io/hadron/blob/main/README.md
        type: source-repo
        title: Hadron README, upgrade system
        retrieved: "2026-09-22"
        quote: >-
          Upgrade System: Managed via Kairos agent for A/B style atomic
          upgrades

  d06_customization:
    normalized:
      runtime_package_install: "none"
      mechanisms:
        - dockerfile-derivation
        - hadron-layers
        - hadron-firmware
        - toolchain-image-source-build
        - systemd-sysext
      customization_points:
        - build-time
        - runtime
      published_layers: "git, gpg, fwupd, drbd, tailscale"
      firmware_delivery: "per-target OCI images and sysexts from a separate repository"
      sysext_signing: "published sysexts are unsigned; Trusted Boot requires the adopter to re-sign"
      add_software:
      - kind: derive-image
        how: A Dockerfile that starts FROM the Hadron image. Pre-built Hadron layers and firmware images are copied in with COPY --from.
        evidence: DOCUMENTED
        sources:
        - url: https://github.com/kairos-io/kairos-docs/blob/53e6883b7904253438ce0fa1b573da6bda926041/hadron-docs/layers.md
          type: official-docs
          title: 'Hadron docs: Adding Hadron layers'
          retrieved: '2026-10-12'
          quote: Start from the Hadron image you already use.
        - url: https://github.com/kairos-io/kairos-docs/blob/53e6883b7904253438ce0fa1b573da6bda926041/hadron-docs/layers.md
          type: official-docs
          title: 'Hadron docs: Adding Hadron layers'
          retrieved: '2026-10-12'
          quote: drop them on top of your Hadron base with a
      - kind: systemd-sysext
        how: Build a sysext from a container image with AuroraBoot. Only the last image layer is converted, and the result is signed by the adopter.
        evidence: DOCUMENTED
        sources:
        - url: https://github.com/kairos-io/kairos-docs/blob/53e6883b7904253438ce0fa1b573da6bda926041/hadron-docs/expand-with-sysext.md
          type: official-docs
          title: 'Hadron docs: Extending Hadron with extensions'
          retrieved: '2026-10-12'
          quote: Notice that when converting a docker image into a system extension, the last layer is the only one converted
        - url: https://github.com/kairos-io/kairos-docs/blob/53e6883b7904253438ce0fa1b573da6bda926041/hadron-docs/expand-with-sysext.md
          type: official-docs
          title: 'Hadron docs: Extending Hadron with extensions'
          retrieved: '2026-10-12'
          quote: Private key to sign the system extension.
    summary: >-
      There is no package manager, by design, and the project says so. Adding
      software means deriving an image with a Dockerfile, copying in a
      published layer or firmware image, compiling from source in the toolchain
      image, or loading a system extension at runtime through Kairos.
    notes: >-
      The no-package-manager position is stated on every surface and is
      presented as a feature: "no vendor lock-in", "use the package manager you
      like". The practical meaning is that every addition is a build step, and
      the project has built real tooling for that. A toolchain image ships the
      musl cross toolchain, the build flags Hadron itself uses, and the kernel
      metadata needed to build out-of-tree modules against the shipped kernel.
      A layers repository compiles common tools from source and publishes them
      as scratch images to COPY in. A firmware repository splits the upstream
      linux-firmware tree into per-target images and sysexts.

      The costs are real and mostly documented, which is to the project's
      credit. Kernel-module layers are tied to the exact kernel of the
      toolchain they were built with, so the consumer must pin the layer to a
      matching Hadron release. A driver bump for NVIDIA hardware is an image
      rebuild, which the documentation says to "plan like OS upgrades". The
      layers are not sysext-ready, because they may place files outside /usr,
      and the documentation warns that a direct conversion would silently drop
      those. The published sysexts are unsigned, so under Trusted Boot the
      adopter builds and signs their own; the layers README says the same and
      adds that a default Kairos node downloads an unsigned extension but does
      not merge it.

      Five layers exist at the collection date. That is the whole catalogue of
      prebuilt software beyond what the base image contains, and one of the
      five, git, is temporarily excluded from sysext publication because the
      current AuroraBoot cannot extract its hardlinks. An adopter needing
      anything else compiles it. The build-from-source examples show the kind
      of friction involved: the git example carries a comment explaining why
      autoconf's cross-compilation detection has to be overridden.

      Two things the documentation does not cover. There is no page that says
      what a derived image's maintainer now owns, which is the same gap
      kairos.yaml d06 records for Kairos: rebuilding the base for a CVE in
      OpenSSL, re-running the toolchain for every layer, and re-signing every
      sysext are the adopter's, and no page says so. And a package built with
      the toolchain against one Hadron release has no documented compatibility
      statement for the next, beyond the kernel-module case.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/kairos-io/hadron/blob/main/README.md
        type: source-repo
        title: Hadron README, no package manager
        retrieved: "2026-09-22"
        quote: >-
          Hadron doesn't ship a package manager by default, and it's not based
          on any other Linux distribution. You can build packages on top of
          Hadron, or use the package manager you like.
      - url: https://kairos.io/hadron-docs/layers
        type: official-docs
        title: Adding Hadron layers
        retrieved: "2026-09-22"
        quote: >-
          Layers that ship an out-of-tree kernel module (currently drbd) are
          tied to the exact kernel version of the toolchain image they were
          built against.
      - url: https://kairos.io/hadron-docs/toolchain
        type: official-docs
        title: Hadron toolchain image
        retrieved: "2026-09-22"
        quote: >-
          intended to be the canonical, reproducible build environment for
          extending Hadron
      - url: https://github.com/kairos-io/hadron-layers/blob/main/README.md
        type: source-repo
        title: hadron-layers README
        retrieved: "2026-09-22"
        quote: >-
          These public artifacts are unsigned because Trusted Boot requires
          keys that belong to the target deployment.
      - url: https://github.com/kairos-io/hadron-firmware/blob/main/README.md
        type: source-repo
        title: hadron-firmware README
        retrieved: "2026-09-22"
        quote: >-
          Hadron ships with a deliberately small firmware set to keep the base
          image lean.
      - url: https://kairos.io/hadron-docs/nvidia/
        type: official-docs
        title: NVIDIA GPU support on Hadron
        retrieved: "2026-09-22"
        quote: >-
          an upgrade to a new NVIDIA driver version is a Hadron image rebuild,
          not a Kubernetes-side upgrade. Plan driver bumps like OS upgrades.
    unknowns:
      - "No page assigns ownership of base rebuilds, layer rebuilds and sysext re-signing for an adopter who derives from Hadron."
      - "No compatibility statement exists for toolchain-built userspace across Hadron releases."

