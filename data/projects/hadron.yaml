    summary: >-
      Released base images exist for amd64 and arm64, in two kernel
      configurations. riscv64 has kernel configurations, a toolchain stage and
      a workflow, and the workflow is switched off. Firmware is deliberately
      minimal in the image and delivered separately.
    notes: >-
      The riscv64 position is recorded under the rule that artifacts count and
      intentions do not. The repository carries riscv64 kernel configurations,
      the Makefile accepts the architecture, the release workflow contains a
      complete riscv64 pipeline, and every job in it is gated with a false
      condition. The pull-request workflow for riscv64 runs a single job that
      prints "RISC-V64 CI pipeline is temporarily disabled." The registry holds
      one historical riscv64 tag, v0.1.1-riscv64, on the container image only.
      The Dockerfile also skips the shim build on riscv64 with the comment that
      the architecture "doesn't have Secure Boot support yet". Recorded as in
      progress, not as supported, which is stricter than the Makefile's own
      error message that lists riscv64 as a valid choice.

      Hardware reach is decided by the kernel configuration and the firmware
      set, and both are deliberately narrow. The cloud kernel is described as
      "a minimal kernel built for VM/cloud environments" and the default kernel
      as "more generic with more drivers included". The in-image firmware set
      is small by stated design, and the firmware repository exists because
      "some devices (GPUs, Wi-Fi/Bluetooth chips, NICs, etc.) need extra
      firmware blobs". An adopter with such hardware derives an image or loads
      a sysext. Nothing lists which devices work out of the box.

      GPU support is documented in more depth than for any other hardware,
      and its cost is stated: because Hadron is musl-based and from scratch,
      NVIDIA's prebuilt driver containers do not apply, the driver is compiled
      into the image, and the GPU Operator runs driver-less. A driver update
      is an image rebuild. The documentation pins the GPU Operator to one
      version and says not to upgrade past it.

      Single-board computers are not documented from the Hadron side. The
      Kairos Raspberry Pi page states its commands are written for Hadron, and
      kairos.yaml records the Pi model limits. Cloud images exist as Kairos
      artifacts, and the Hadron repository's Hetzner example depends on a
      support ticket to get an ISO onto that provider.
