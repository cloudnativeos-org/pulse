              type: source-repo
              retrieved: '2026-09-22'
              quote: 'KUBERNETES_DISTRO: Choose between k3s, k0s or leave empty for no Kubernetes distribution'
    summary: >-
      No Hadron image contains Kubernetes. The Hadron build can pass k3s or k0s
      to kairos-init to produce a Kairos standard image, and the Kairos release
      pipeline publishes exactly those, so every Kubernetes property of a
      Hadron-based node is a Kairos property.
    notes: >-
      The README documents the KUBERNETES_DISTRO build variable with the
      choices k3s, k0s "or leave empty for no Kubernetes distribution". The
      variable is passed through to the Kairos Dockerfile; Hadron itself has no
      Kubernetes code. Kairos v4.3.0 publishes Hadron-based standard ISOs for
      both distributions on amd64 and for k3s on arm64, with the Kubernetes
      version in the artifact name, which is why independent lifecycle is
      recorded as no, on the same reasoning as kairos.yaml d07.

      The sysctl hardening file is the one place Hadron itself shows awareness
      of Kubernetes: its header says the baseline is "tuned to be SAFE on a
      Kubernetes node" and lists the settings it omits because a CNI or the
      kubelet owns them. That is a design consideration for the base, not a
      Kubernetes integration.

      The Hetzner example in the repository is a set of Kairos cloud-configs
      for a single-node k3s cluster with the Hetzner cloud controller manager,
      and its README describes it as Kairos configuration. It shows what
      Hadron-plus-Kairos is used for; it is not a Hadron feature.
    evidence: DOCUMENTED
