      retrieved: "2026-09-22"
      quote: "Ettore Di Giacinto ... Spectro Cloud ... Dimitris Karakasilis ... Spectro Cloud ... Itxaka Serrano Garcia ... Spectro Cloud ... Mauro Morales ... Spectro Cloud"
known_issues: []
open_questions:
  - "Is the shim compiled in the Hadron image signed by any CA present in stock firmware, and has a shim review been submitted? The shim is compiled from source with no signing step, and no page states whether it validates against the firmware CA. This is the same question kairos.yaml asks, and Hadron is where the answer lives."
  - "Is an SBOM produced for the ghcr.io/kairos-io/hadron base images? Only a provenance attestation is attached, and no SBOM was found."
  - "Is Hadron within the scope of the CNCF Kairos project, and who holds the Hadron name and the hadron-linux.io domain? The announcement claims vendor neutrality through the CNCF project and no primary source establishes it."
  - "What is the support policy for a Hadron release after Kairos pins a newer one, and when does a Kairos release re-pin?"
  - "What do the FIPS image variants promise, and is any validation planned?"
  - "Is riscv64 intended to return as a released architecture?"
  - "Should hadron-layers and hadron-firmware carry a LICENSE file?"
  - "Was the Trusted Boot behaviour on production firmware measured? (The fix, kairos-io/go-ukify#66, shipped in AuroraBoot v0.28.0 on 2026-10-07.)"
  - "Should Hadron carry its own SECURITY.md, or should the Kairos security policy state that it covers the organization's repositories?"
  - "Do the NVIDIA modules built by the Hadron example load with Secure Boot or Trusted Boot on? The example disables module signing."

