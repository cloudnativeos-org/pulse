  d11_operations_debugging:
    normalized:
      provided_by: kairos
      ssh: available
      local_shell: available
      shell: "bash, with busybox applets for most utilities"
      debugging_tools_in_image: "procps sysctl, less, getent, nslookup; no strace or gdb"
      recovery_shell: "through Kairos recovery"
      works_without_kubernetes: "yes"
      documentation: "five pages on the Kairos site plus a README; no operations page"
      issue_tracker: "none; issues go to kairos-io/kairos"
    summary: >-
      Operating a Hadron node is operating a Kairos node, with the same
      command line, the same recovery entry and the same missing debugging
      story under Trusted Boot. What Hadron adds is a deliberately thin
      userspace: bash and busybox, sshd, and a short list of tools the release
      notes added because people missed them.
    notes: >-
      The userspace is small enough that what is missing is a design fact
      rather than an oversight, and the release notes show the project
      adjusting it by feedback: v0.5.2 added getent and nslookup as "two small
      but frequently-missed tools for anyone debugging DNS or NSS", and
      replaced the busybox pager with real less; v0.5.3 added the audit
      userspace tools. strace and gdb are built in the Dockerfile for the
      toolchain but not copied into the bootable image. The README notes that
      the full procps sysctl ships because a downstream consumer relies on it
      during preflight.

      Documentation is the thin point. The Hadron section of the Kairos site
      has five pages, on firmware, layers, extensions, NVIDIA and the
      toolchain, and an index page whose body is empty apart from a last-
      updated stamp. hadron-linux.io is a landing page and a component list.
      There is no page about operating, debugging, logging or troubleshooting
      a Hadron system, and the Kairos troubleshooting page, which kairos.yaml
      already records as lacking any logging or monitoring guidance, is what an
      operator gets. The repository has issues, discussions and wiki disabled;
      the README says every issue goes to kairos-io/kairos "so you never have
      to work out which repository to file against", which is a reasonable
      choice that also means there is no Hadron-specific issue history to
      search.
