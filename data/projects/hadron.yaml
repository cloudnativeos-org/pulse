  d09_provisioning:
    normalized:
      provided_by: kairos
      methods:
        - "every Kairos path: interactive, unattended cloud-config, ISO, netboot, cloud image, raw image"
      own_tooling: "make targets that call kairos-init and AuroraBoot"
      trusted_boot_media: "built with adopter keys; the repository's test keys are labelled insecure"
    summary: >-
      Hadron ships no installer and no media. The repository's make targets
      produce a Kairos image and then call AuroraBoot to produce a GRUB ISO or a
      Trusted Boot UKI ISO, and every installation path is the Kairos one
      recorded in kairos.yaml d09.
    notes: >-
      The make help text is candid about the test keys: the default KEYS_DIR
      points at keys "that we use for testing, which are INSECURE and should
      not be used in production". An adopter building Trusted Boot media
      supplies a Secure Boot signing key and certificate, a TPM PCR policy key
      and the enrollment bundles, which is the Kairos key model, and losing them
      has the consequence kairos.yaml d10 records.

      The Kairos-side documentation for Trusted Boot installation is written
      for Hadron, states that adapted commands should work on Ubuntu 24.04 and
      Fedora 40, and names Hadron-based UKI images. The Kairos Raspberry Pi and
      cloud pages likewise use Hadron as the worked example since v4. There is
      no Hadron-specific provisioning page and none is needed, but a reader
      arriving from hadron-linux.io is sent to the Kairos quickstart without
      being told that this is where installation lives.
