  d14_maturity:
    normalized:
      first_release: "2026-01-29"
      first_prerelease: "2025-11-28"
      repository_created: "2025-06-28"
      current_version: "v0.5.3"
      current_version_date: "2026-09-18"
      release_cadence: "nineteen stable releases in under eight months; bursty, from same-week patches to a two-month gap"
      observed_intervals: "3, 3, 5, 2, 1, 4, 21, 2, 62, 9 days across v0.3.0 to v0.5.3"
      support_model: "none published"
      support_window: "none published"
      version_shipped_by_kairos: "v0.5.1, in Kairos v4.2.0 and v4.3.0"
      commercial_support: "through Kairos commercial support; Hadron is not named on that page"
      self_declared_maturity: "the announcement calls it mature and production-ready for its core purpose; the version is pre-1.0"
    summary: >-
      Fifteen months old as a repository, nine months since the first stable
      tag, and at v0.5.3. There is no support policy, no end-of-life statement
      and no statement of what a version number promises, and the version an
      adopter gets from Kairos artifacts is two releases behind Hadron's own.
    notes: >-
      The cadence is fast and irregular, and it is a young project's cadence.
      Six stable releases shipped in the twelve days from v0.3.0 to v0.3.5 in
      late May and June 2026, then one in each of July, September and again
      September, with a 62-day gap between v0.5.1 and v0.5.2. Release notes
      since v0.5.2 are substantial and well organized, with highlights,
      per-area changes and a full component table, which is better than the
      Kairos release notes kairos.yaml describes.

      Two statements about maturity sit side by side. The announcement says
      "Hadron is mature and production-ready for its core purpose: to be a
      minimal, predictable base for Kairos." The version numbers are pre-1.0,
      no page says what a minor or patch increment means, and the Kairos
      release that ships it pins a version two releases old. A reader should
      take the first statement as the project's assessment of fitness for its
      narrow purpose and not as a semantic-versioning stability promise, which
      the project has not made.

      There is no support lifecycle. The Kairos statement that only the latest
      release branch receives patches is written about Kairos; nothing says
      whether a Hadron release receives patches once Kairos pins a newer one,
      and the Kairos commercial support page, which is the only long-term
      maintenance offering in the organization, does not mention Hadron. The
      practical support window is therefore whichever Hadron version the
      current Kairos release pins, for as long as that Kairos release is the
      latest.

      Every version since v0.3.0 has been paired with a Kairos release in the
      documentation site's configuration, and that pairing is the most useful
      maturity signal available: the base has been the default for
      project-published Kairos artifacts since v4.0.0 in February 2026, so it
      has seven months of being the thing Kairos ships.
    evidence: DOCUMENTED
    sources:
