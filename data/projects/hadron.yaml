  d10_security:
    normalized:
      secure_boot: unknown
      shim: "16.1, compiled from upstream source, no signing step"
      sbat: "systemd-boot and stub carry sbat-distro Hadron with a stable generation counter"
      measured_boot: "available under Trusted Boot, through Kairos"
      tpm: "TPM 2.0, through Kairos"
      integrity: "provided by Kairos: read-only-mount, no dm-verity on the root"
      disk_encryption: "through Kairos: opt-in on GRUB installs, automatic under Trusted Boot"
      artifact_verification_base_images: unknown
      artifact_verification_kairos_releases: sigstore-keyless-cosign
      provenance: "SLSA v1 attestation on the base images"
      sbom: unknown
      fips: "separate image variants with the OpenSSL 3.1.2 FIPS provider and a kernel HMAC; no validation claimed"
      hardening_baseline:
        - "sshd STIG drop-in: root login prohibit-password, no empty passwords, password authentication left enabled"
        - "sysctl baseline derived from the RHEL 9 STIG, with Kubernetes-breaking rules omitted"
        - "legacy network protocols blacklisted in modprobe"
        - "audit userspace tools shipped since v0.5.3"
      vulnerability_tracking: "organization CVE dashboard; four high findings for Hadron as of 2026-09-10"
      trusted_boot_issue: "kairos-io/kairos#4885, closed 2026-09-22; fix kairos-io/go-ukify#66 merged 2026-09-22, released in go-ukify v0.5.1 and v0.5.2 (2026-09-22); shipped in AuroraBoot v0.28.0 (2026-10-07), which pins go-ukify v0.5.2; media built with AuroraBoot v0.27.1 or older carry the defect"
    summary: >-
      Hadron contributes a hardening baseline, a from-source shim and
      systemd-boot with its own SBAT identity, and FIPS variants. Everything
      that verifies, measures or encrypts is Kairos's. Secure Boot on stock
      firmware is unknown for the same reason as in kairos.yaml, and the
      Trusted Boot path has a documented open defect at the collection date.
    notes: >-
      **Secure Boot is unknown, and Hadron is the reason it is unknown for
      Kairos too.** The shim is built from the upstream 16.1 tarball in the
      Dockerfile, with one build-system patch, and copied into the image at
      /usr/share/efi. There is no signing step in the Dockerfile or the
      workflow, no reference to a shim-review submission, and no page that
      states whether the shim validates against the Microsoft third-party CA
      that stock firmware ships. The Kairos Secure Boot architecture page,
      dated January 2024 in its front matter, describes piggybacking on
      upstream distributions' signed artifacts, which cannot describe a base
      that compiles its own shim, and does not mention Hadron. Recorded as
      unknown rather than none because no primary source says either way, and
      raised as the first open question below.

      Trusted Boot is the documented high-assurance path and is where the
      project has invested: a dedicated hadron-trusted variant with
      systemd-boot and the systemd stub, SBAT metadata identifying the distro
      as Hadron with a generation counter the Dockerfile says to bump only on
      a security-relevant revocation, and acceptance tests that boot UKI
      images under Secure Boot with test keys. The keys are the adopter's,
      enrollment is the adopter's, and the Kairos documentation says losing
      them prevents building further upgrades.

      **At the collection date the Trusted Boot path has a live, root-caused
      defect.** kairos-io/kairos#4885, opened 2026-09-22, documents that the
      UKI assembler places its appended PE sections at 512-byte rather than
      page alignment while the stub declares a 4096-byte section alignment;
      on firmware built with memory-protection asserts, the OVMF Secure Boot
      build among them, the image dead-loops before the kernel and the boot
      watchdog resets the machine after five minutes. The same issue states
      that production firmware without asserts skips the failed protection and
      boots, so the reported effect on hardware is a delay rather than a
      failure, and that was not tested. It supersedes kairos-io/kairos#4618,
      opened 2026-09-11 and closed 2026-09-16 before the cause was found. The
      fix, kairos-io/go-ukify#66, merged on 2026-09-22 and the issue closed the
      same day. At collection the latest AuroraBoot release, v0.27.1 of
      2026-09-11, predated the fix. AuroraBoot v0.28.0, released on 2026-10-07,
      ships it: its go.mod pins go-ukify v0.5.2, released after the fix merged.
      Media built with v0.27.1 or older carry the defect. Both the issue and
      the fix were filed by the same team that wrote this survey, which is
      stated here so the reader can weigh it; the facts are dated and linked,
      and they are recorded under the same discipline as the Talos provider
      deprecation in talos.yaml. A future edition should check whether the fix
      shipped and whether the behaviour on real hardware was measured.

      FIPS is handled candidly in the source. Separate image
      variants build the OpenSSL FIPS provider and generate the kernel HMAC
      that dracut checks, and the Dockerfile explicitly declines to build
      cryptsetup with its FIPS flag because "its not certified" and doing so
      "will still give you a cryptsetup that reports as FIPS capable while its
      not". No page claims FIPS validation of anything, and no page explains
      what the FIPS variants are for. The sshd crypto drop-in is split into a
      FIPS and a non-FIPS file with a comment explaining that the Kairos
      hardening drop-in must not override the FIPS-approved list.

      The hardening baseline is the most concrete security contribution and
      is documented only in file headers. The sshd drop-in references STIG,
      prohibits root password login, and deliberately leaves password
      authentication on because "Kairos provisions node users with passwords",
      inviting downstream deployments to add their own drop-in to disable it.
      The sysctl file cites RHEL 9 STIG rule identifiers per line and lists the
      rules it omits and why. Both files carry comments about ordering
      conflicts with the Kairos hardening drop-in that were found by failing
      tests, which is the kind of detail that says the two projects are
      developed together and integrated by trial.

      Vulnerability handling is the organization's, not the repository's.
      Hadron has no security policy file, no issue tracker of its own, and its
      README routes bugs to the Kairos repository. The organization's CVE
      dashboard covers Hadron and on 2026-09-10 listed four high findings, in
      expat and rsync, both of which the v0.5.3 component table shows at newer
      versions. kairos.yaml records the limits of the organization-level
      policy, and they apply here unchanged.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/kairos-io/hadron/blob/main/Dockerfile
        type: source-repo
        title: Hadron Dockerfile, shim, SBAT and FIPS stages
        retrieved: "2026-09-22"
        quote: >-
          Still, its not certified and building with the flag AND openssl will
          still give you a cryptsetupt hat reports as FIPS capable while its
          not, so we avoid confusion and just build without fips support at
          all here.
      - url: https://kairos.io/docs/architecture/secureboot/
        type: official-docs
        title: Kairos Secure Boot architecture
        retrieved: "2026-09-22"
        quote: >-
          We piggyback on the upstream artifacts to be properly signed in order
          to support SecureBoot.
      - url: https://github.com/kairos-io/kairos/issues/4885
        type: source-repo
        title: "Hadron/Kairos UKI Trusted Boot: go-ukify appends PE sections misaligned, open"
        retrieved: "2026-09-22"
        quote: >-
          go-ukify's assemble() places every section it appends to the systemd
          stub ... at a 512-byte aligned virtual address, while the stub's PE
          header declares SectionAlignment 0x1000.
      - url: https://github.com/kairos-io/go-ukify/pull/66
        type: source-repo
        title: "fix(uki): align appended sections to the PE SectionAlignment, merged 2026-09-22"
        retrieved: "2026-10-19"
        quote: "fix(uki): align appended sections to the PE SectionAlignment"
      - url: https://github.com/kairos-io/AuroraBoot/releases/tag/v0.28.0
        type: release-notes
        title: AuroraBoot v0.28.0, released 2026-10-07
        retrieved: "2026-10-19"
        quote: v0.28.0
      - url: https://github.com/kairos-io/AuroraBoot/blob/v0.28.0/go.mod
        type: source-repo
        title: AuroraBoot go.mod at v0.28.0, go-ukify pin
        retrieved: "2026-10-19"
        quote: github.com/kairos-io/go-ukify v0.5.2
      - url: https://github.com/kairos-io/AuroraBoot/blob/v0.27.1/go.mod
        type: source-repo
        title: AuroraBoot go.mod at v0.27.1, go-ukify pin
        retrieved: "2026-10-19"
        quote: github.com/kairos-io/go-ukify v0.5.0
      - url: https://github.com/kairos-io/hadron/blob/main/files/ssh/sshd_config.d/01-hadron-stig.conf
        type: source-repo
        title: Hadron sshd STIG drop-in
        retrieved: "2026-09-22"
        quote: >-
