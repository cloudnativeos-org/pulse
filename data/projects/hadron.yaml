tradeoffs:
  buys:
    - "A base with no inherited distribution state. No package manager, no package database, no downstream patches, and a component list that fits in one table with every version named. What is in the image is exactly what the Dockerfile built."
    - "Upstream alignment that is checkable: a stock kernel with two carried patches, systemd and musl at current upstream versions, and a per-image component manifest shipped inside the image."
    - "A reproducible build environment for extending it: a published toolchain image with the same flags, triplets and kernel metadata the base was built with, so out-of-tree modules and compiled additions match the shipped kernel exactly."
    - "Provenance attached to every published image index, and a component table in every release."
    - "A hardening baseline shipped in the image, with each rule attributed to a STIG identifier and each omission explained, and a Trusted Boot variant with its own SBAT identity. Under Trusted Boot, extensions are signed with the adopter's keys."
  costs:
    - "Software beyond the base and the officially published layers and extensions (the hadron-layers catalogue of five layers: drbd, fwupd, git, gpg and tailscale, all but git also as system extensions; and per-target linux-firmware images and extensions from hadron-firmware) is compiled by the adopter in the toolchain image, and rebuilt for each base release."
    - "No riscv64 images are released: the architecture is in the source, and every riscv64 pipeline job is switched off."
    - "The base-image workflow has no signing step and the registry holds no signature tags, so an adopter who derives from the base can verify it by digest only."
    - "kairos-io/hadron-layers and kairos-io/hadron-firmware, which provide layers and firmware, have no LICENSE file."
maintainers_fact:
  text: "Maintained by the Kairos maintainers (CODEOWNERS), five of six of whom work for Spectro Cloud."
  evidence: DOCUMENTED
  sources:
    - url: "https://github.com/kairos-io/hadron/blob/main/.github/CODEOWNERS"
      type: "governance-doc"
      title: "Hadron CODEOWNERS"
      retrieved: "2026-09-22"
      quote: "* @kairos-io/maintainers"
    - url: "https://github.com/kairos-io/community/blob/main/MAINTAINERS.md"
      type: "governance-doc"
