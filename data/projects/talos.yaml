        title: Security insights, maintainer roster
        retrieved: "2026-09-22"
      - url: https://github.com/siderolabs/talos/blob/main/CONTRIBUTING.md
        type: governance-doc
        title: Contributing
        retrieved: "2026-09-22"
        quote: All commits require a DCO sign-off.
      - url: https://github.com/cncf/landscape/blob/master/landscape.yml
        type: foundation-page
