  d14_maturity:
    normalized:
      first_release: "2018-04-03"
      first_stable: "2022-03-29"
      current_version: "v1.14.1"
      current_version_date: "2026-09-15"
      release_cadence: "minor releases every four months, aligned to the Kubernetes cycle; patches every two weeks for the current minor and monthly for the previous"
      observed_intervals: "minor releases at 134, 124, 112, 126 and 129 days, mean 125 days; current-line patches at 12 to 17 days, including v1.14.0 to v1.14.1 at 12 days"
      support_model: versioned-with-eol
      support_window: "two minor versions in community support, roughly eight months; security updates for the two latest minor releases"
      commercial_support: available
    summary: >-
      Eight years old, stable since March 2022, and the cadence policy matches
      the measured intervals closely. Exactly two minor versions are in community
      support at a time, an effective window of about eight months.
    notes: >-
      The measured intervals match the published policy, which is unusual in this
      edition. Minor releases averaged 125 days against a stated four-month
      target, and current-line patches land every two weeks as documented.

      The community support window is short by the standards of the other
      projects here: about two cycles. The commercially supported window is
      broader, covering the current stable version, all stable versions released
      in the previous nine months, and versions within two minor releases of
      current. Commercial support publishes concrete response-time commitments
      ranging from one hour to two business days by tier and severity.

      Talos Enterprise Linux is priced per node per year with a minimum node
      count, and the community edition is free with unlimited clusters and nodes.

      Two documentation facts affect anyone repeating this research. The
      documentation host moved: the old domain no longer serves current versions
      and returns a bare not-found for v1.14 with no redirect, while older
      versions do redirect and slugs changed. And the support matrix page is
      stale against the shipped release, giving a release date a week earlier
      than actual and marking both end-of-life dates as to be determined.
