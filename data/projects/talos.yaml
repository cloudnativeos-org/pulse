        type: official-docs
        title: Customizing the kernel
        retrieved: "2026-09-22"
        quote: >-
          The signing key is generated during the build process, it is unique to
          each build, and it is not available to the user.
      - url: https://github.com/siderolabs/extensions/blob/main/README.md
        type: source-repo
        title: Extensions catalog and rootfs restrictions
        retrieved: "2026-09-22"
        quote: >-
          The following restrictions are applied to the contents of the rootfs
          of the system extension:
      - url: https://docs.siderolabs.com/talos/v1.14/build-and-extend-talos/custom-images-and-development/overlays
        type: official-docs
        title: Overlays
        retrieved: "2026-09-22"
        quote: >-
          Overlays are similar to extensions, but they are used to customize the
          installation process, while extensions are used to customize the root
          filesystem.

  d07_kubernetes:
    normalized:
      requirement: required
      bundled: bundled
      independent_lifecycle: "yes"
      os_manages_kubernetes: "yes"
      kubernetes_manages_os: "none in the open-source project; offered by the commercial product"
      distributions:
        - "upstream Kubernetes, rendered as static pods"
      kubernetes_versions_supported: "1.37, 1.36, 1.35, 1.34, 1.33 on v1.14"
    summary: >-
      Kubernetes is effectively required: machine types are control plane or
      worker, and no documented way to disable the kubelet exists. The OS manages
      Kubernetes comprehensively, and the two upgrade independently.
    notes: >-
      Lifecycle independence here is a genuine strength and is the opposite of
      several projects in this edition. The OS and Kubernetes have separate
      commands, separate version streams and separate support matrices, and an OS
      upgrade has not changed the Kubernetes version since v1.0.

      The OS manages Kubernetes deeply: it starts etcd and the kubelet, renders
      control plane static pod manifests, injects bootstrap manifests under an
      etcd mutex, and keeps the Kubernetes PKI separate from its own. All of it
      is driven by controllers reacting to configuration and environment changes.

      Kubernetes does not manage the OS. The Kubernetes-side controller that once
      did is archived and unreferenced. Fleet-level, Kubernetes-integrated OS
      lifecycle is the commercial product's territory; see d12.

      Kubernetes can reach the Talos API only if explicitly opted in, scoped by
      namespace and role.

      A documented design property worth recording: the Talos API stays available
      when Kubernetes is down, because it runs under the init process on the host
      network and does not depend on etcd or the API server.
    evidence: DOCUMENTED
    sources:
      - url: https://docs.siderolabs.com/talos/v1.14/configure-your-talos-cluster/lifecycle-management/upgrading-talos
        type: official-docs
        title: Upgrading Talos, Kubernetes separation
        retrieved: "2026-09-22"
        quote: >-
          An upgrade of the Talos Linux OS will not (since v1.0) apply an upgrade
          to the Kubernetes version by default.
      - url: https://docs.siderolabs.com/talos/v1.14/learn-more/control-plane
        type: official-docs
        title: Control plane
        retrieved: "2026-09-22"
        quote: >-
          The bootstrap node acquires an etcd mutex and injects the bootstrap
          manifests into the API server.
      - url: https://docs.siderolabs.com/talos/v1.14/getting-started/support-matrix
        type: official-docs
        title: Support matrix
        retrieved: "2026-09-22"
        quote: "1.37, 1.36, 1.35, 1.34, 1.33"
    unknowns:
      - "No documented option to disable the kubelet or run a machine with no Kubernetes role."

