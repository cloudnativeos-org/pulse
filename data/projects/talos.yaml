collected_at: "2026-09-15"

entry_kind:
  - distribution

category_fit:
  comparable: full
  note: >-
    A released distribution with versions, a documented support matrix and its
    own upgrade system. Comparable on all fourteen dimensions.

    Two events inside the collection window affect dimensions 12 to 14 and are
    recorded as dated facts with no inference attached. Sidero Labs announced its
    acquisition by Yardi on 2026-09-14, and Talos Enterprise Linux, a commercial
    licence, launched on 2026-09-15, the day this data was collected.

self_description:
  text: >-
    Talos is a modern OS for running Kubernetes: secure, immutable, and minimal.
    Talos is fully open source, production-ready, and supported by the people at
    Sidero Labs. All system management is done via an API - there is no shell or
    interactive console.
  source:
    url: https://github.com/siderolabs/talos/blob/main/README.md
    type: source-repo
    title: Talos README
    retrieved: "2026-09-22"

