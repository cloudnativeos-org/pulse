      - url: https://docs.siderolabs.com/kubernetes-guides/advanced-guides/upgrading-kubernetes
        type: official-docs
        title: Upgrading Kubernetes
        retrieved: "2026-09-22"
        quote: >-
          The recommended method to upgrade Kubernetes on a Talos-native cluster
          is to use the talosctl upgrade-k8s command.
      - url: https://docs.siderolabs.com/talos/v1.14/configure-your-talos-cluster/lifecycle-management/unattended-install
        type: official-docs
        title: Unattended install
        retrieved: "2026-09-22"
        quote: >-
          Talos Linux can install itself to disk from a multi-document machine
          configuration by using UnattendedInstallConfig.
      - url: https://docs.siderolabs.com/talos/v1.14/learn-more/image-factory
        type: official-docs
        title: "Image Factory, on-premises deployment"
        retrieved: "2026-10-05"
        quote: >-
          Image Factory can be deployed on-premises to provide in-house asset generation.
      - url: https://docs.siderolabs.com/talos/v1.14/platform-specific-installations/air-gapped.md
        type: official-docs
        title: "Air-gapped environments, registry mirrors"
        retrieved: "2026-10-05"
        quote: >-
          Talos Linux provides support for redirecting image pull requests to internal registries via registry mirrors feature.
    unknowns:
      - "Whether upgrade is supported on a node that never joined a Kubernetes cluster."
      - "The lifecycle API used since v1.13 is absent from the published gRPC API reference."

  d05_rollback_recovery:
    normalized:
      rollback_to_previous: available
      automatic_rollback_on_boot_failure: available
      automatic_rollback_trigger: "fatal error or panic in the init process before the machine reaches ready"
      automatic_rollback_attempts: 1
      retained_versions: 1
      recovery_environment: "maintenance mode, plus a bootloader wipe entry"
      factory_reset: available
      network_independent_recovery: partial
      interactive_shell_for_recovery: "none"
    summary: >-
      One previous OS version is retained, and automatic rollback fires once. A
      bootloader entry offers a wipe-and-return-to-maintenance-mode path, and the
      video console carries a read-only dashboard that can repair network
      configuration on bare metal.
    notes: >-
      The automatic rollback trigger is narrower than "fails to boot" suggests,
      and this is the sharpest finding in this profile. The revert runs from the
      init process's own fatal-error and panic handler, and the fallback marker
      is deleted both when the revert runs and when the machine reaches ready.
      So there is one attempt, and a kernel panic before the init process starts,
      or a silent hang, may not be covered by it. The bootloader's own fallback
      entry covers an entry that fails to load, which is a different failure.
      None of this is stated in the documentation; it was read from source, and
      it is an open question for a maintainer.

      Recovery has no shell, by design, and the substitutes are specific.
      Maintenance mode is the state a node boots into with no complete
      configuration, serving the API over a self-signed certificate with a
      deliberately small set of permitted calls. A bootloader entry labelled for
      resetting the installation boots with wipe arguments. The interactive
      dashboard runs on the physical video console and exists precisely for the
      case where the network is down and the CLI cannot be used; on bare metal it
      can edit network configuration in place, and it deliberately shows only
      non-sensitive resources.

      network_independent_recovery is partial for a precise reason: the console
      paths above work with no network, but there is no interactive offline
      repair, because there is no console login or shell. Recovering a node
      beyond wiping it, selecting the other slot, or fixing network settings
      requires the API, which requires the network.

      etcd disaster recovery is documented including the hard case: if quorum is
      already lost, a snapshot can be copied directly off a control plane node,
      with the caveat that it may not be fully consistent.

      Factory reset carries a documented hazard on cloud VMs, where the default
      wipes the whole disk and can leave the machine unbootable.
    evidence: DOCUMENTED
    sources:
      - url: https://docs.siderolabs.com/talos/v1.14/configure-your-talos-cluster/lifecycle-management/upgrading-talos
        type: official-docs
        title: Upgrading Talos, rollback
        retrieved: "2026-09-22"
        quote: >-
          the node will be rebooted, and the bootloader will automatically use
          the previous Talos kernel and image, thus effectively rolling back the
          upgrade
      - url: https://docs.siderolabs.com/talos/v1.14/build-and-extend-talos/cluster-operations-and-maintenance/disaster-recovery
        type: official-docs
        title: Disaster recovery
        retrieved: "2026-09-22"
        quote: >-
          This snapshot might not be fully consistent (if the etcd process is
          running), but it allows for disaster recovery when latest regular
          snapshot is not available.
      - url: https://docs.siderolabs.com/talos/v1.14/deploy-and-manage-workloads/interactive-dashboard
        type: official-docs
        title: Interactive dashboard
        retrieved: "2026-09-22"
        quote: >-
          provides a way to inspect the running Talos machine state when using
          the video console is the only option (e.g. when the network is not
          working and talosctl cannot be used)
      - url: https://docs.siderolabs.com/talos/v1.14/configure-your-talos-cluster/lifecycle-management/resetting-a-machine
        type: official-docs
        title: Resetting a machine
        retrieved: "2026-09-22"
        quote: >-
          Running talosctl reset on cloud VMs might result in the VM being
          unable to boot as this wipes the entire disk.
    unknowns:
      - "What exactly triggers automatic rollback, how many attempts occur, and whether a pre-init panic or a silent hang is covered. Read from source, undocumented."
