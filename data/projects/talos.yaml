taxonomy:
  workload_scope: kubernetes-appliance
  construction_model:
    - vendor-fixed-image
    - framework
  root_state_substrate:
    - ab-partition-image
  notes: >-
    The clearest example of the Kubernetes appliance position in this edition,
    and the project says so itself: "Talos integrates tightly with Kubernetes,
    and is not meant to be a general-purpose operating system." Its philosophy
    page goes further: "There is only a cluster."

    That position is descriptive, not a demerit. The tradeoffs field records what
    it buys.

    framework appears as a second construction model because the imager container
    is a documented, supported path to building your own boot assets from source,
    including from the main branch and with custom extensions, outside the Image
    Factory service.

dimensions:
  d01_os_model:
    normalized:
      workload_scope: kubernetes-appliance
      ships_kubernetes: true
      general_purpose: false
      shell: "none"
      ssh: "none"
      package_manager: "none"
      non_kubernetes_workloads: "ContainerConfig, new in v1.14"
    summary: >-
      A ground-up rewrite of the userspace from PID 1, in Go, with no systemd, no
      GNU utilities, no shell, no SSH and no packages. Management is a single
      declarative gRPC API.
    notes: >-
      The project positions itself explicitly against the first generation of
      container-optimized systems: "We think of ourselves as being the
      second-generation of container-optimised operating systems, where things
      like CoreOS, Flatcar, and Rancher represent the first generation (but the
      technology is not derived from any of those.)"

      v1.14 changes a long-standing answer. A new ContainerConfig document
      declares a container "to be run by Talos directly, without Kubernetes",
      started as soon as the configuration is applied, with no image rebuild and
      no reboot. It runs against containerd in a dedicated namespace and restarts
      automatically. It is not a Kubernetes replacement and not an orchestrator:
      containers declared this way are not Talos services and do not appear in
      the service list.

      Maintainers stated in December 2024, before that feature existed, that
      Talos "will always stay a single-purpose Kubernetes distribution" and that
      a machine type with no Kubernetes was contemplated but "We're not there
      yet." Both the statement and the subsequent feature are recorded; whether
      the position has moved is an open question for a maintainer.
    evidence: DOCUMENTED
    sources:
      - url: https://docs.siderolabs.com/talos/v1.14/troubleshooting/faqs
        type: official-docs
        title: Talos FAQ
        retrieved: "2026-09-22"
        quote: >-
          Talos integrates tightly with Kubernetes, and is not meant to be a
          general-purpose operating system.
      - url: https://docs.siderolabs.com/talos/v1.14/learn-more/philosophy
        type: official-docs
        title: Talos philosophy
        retrieved: "2026-09-22"
        quote: >-
          Talos Linux is actually a ground-up rewrite of the userspace, from PID
          1 ... There is no systemd on our system. There are no GNU utilities, no
          shell, no SSH, no packages.
      - url: https://docs.siderolabs.com/talos/v1.14/reference/configuration/container/containerconfig
        type: official-docs
        title: ContainerConfig reference
        retrieved: "2026-09-22"
        quote: >-
          ContainerConfig declares a container to be run by Talos directly,
          without Kubernetes.

  d02_immutability:
    normalized:
      read_only:
        - /
      read_only_mechanism: "read-only squashfs mounted as a loop device"
      integrity_mechanism:
        - read-only-mount
      dm_verity: "none"
      integrity_under_secureboot: "UEFI signature over the whole UKI"
      survives_upgrade:
        - "/var, including etcd, kubelet and container data"
        - "STATE, holding the machine configuration"
      ephemeral:
        - /system
        - /tmp
        - /run
      ephemeral_mechanism: tmpfs, recreated on every boot
      writable_and_persistent:
        - /var (the EPHEMERAL partition, XFS)
        - STATE
        - META
        - /etc/kubernetes and similar directories (overlay, backed by /var)
      configurable_paths:
        value: 'yes'
        evidence: DOCUMENTED
        how: 'Only to add storage: a UserVolumeConfig document in the machine configuration creates a persistent volume mounted at /var/mnt/<name>.'
        sources:
          - url: https://docs.siderolabs.com/talos/v1.14/configure-your-talos-cluster/storage-and-disk-management/disk-management/user
            type: official-docs
            title: Talos user volumes
            retrieved: '2026-10-12'
            quote: The volume mount location is /var/mnt/<volume-name>
      mounts_sources:
        - url: https://docs.siderolabs.com/talos/v1.14/learn-more/architecture
          type: official-docs
          title: 'Talos architecture: tmpfs layer'
          retrieved: '2026-10-12'
          quote: The next layer is a set of tmpfs file systems for runtime specific needs.
        - url: https://docs.siderolabs.com/talos/v1.14/learn-more/architecture
          type: official-docs
          title: 'Talos architecture: /system'
          retrieved: '2026-10-12'
          quote: All files under /system are completely recreated on each boot.
        - url: https://docs.siderolabs.com/talos/v1.14/learn-more/architecture
          type: official-docs
          title: 'Talos architecture: persistent overlays'
          retrieved: '2026-10-12'
          quote: Directories like this are overlayfs backed by an XFS file system mounted at /var.
        - url: https://docs.siderolabs.com/talos/v1.14/learn-more/architecture
          type: official-docs
          title: 'Talos architecture: read-only root'
          retrieved: '2026-10-12'
          quote: At its core the rootfs is a read-only squashfs.
    summary: >-
      The root filesystem is a read-only squashfs of under 80 MB, mounted as a
      loop device into memory. Only specific files under /etc are bind-mounted
      writable rather than making all of /etc writable.
    notes: >-
      Three layers are documented: the read-only squashfs base, a set of tmpfs
      filesystems recreated on every boot, and selective overlayfs directories
      backed by the XFS partition at /var for the few things that must persist.

      dm-verity is not used. The kernel config has it disabled. Under Secure Boot
      the integrity guarantee comes from the UEFI signature over the entire UKI,
      since the whole operating system is contained in it. On a non-Secure-Boot
      install there is no documented runtime cryptographic re-verification of the
      squashfs. That is an INFERRED gap from the kernel config plus the absence
      of any verity documentation, and it is an open question for a maintainer.

      The writable partition is named EPHEMERAL deliberately, and the project
      explains why: "Everything Talos writes to its disk is either replicated or
      reconstructable ... We even call the writable partition 'ephemeral' to keep
      this idea always in focus."

      Four separate mechanisms prevent modification of the running system, and
      they are worth listing because together they are stronger than a read-only
      mount alone. Kernel modules must be signed with a key generated during the
      build, unique per build and not available to the user. CAP_SYS_MODULE and
      CAP_SYS_BOOT are denied to every process including privileged Kubernetes
      pods. An SELinux policy denies access to machine configuration and prevents
      debuggers attaching to system processes, though it is permissive by
      default. And v1.14 adds sandboxd, which runs the container runtime plane in
      its own PID and mount namespace, default-on for newly generated configs
      only.

      The documentation is honest about what a configuration change does not
      reach: etcd cluster settings, environment variables for running services,
      kernel module parameters, volume encryption keys and sandboxd settings all
      need a reboot, and the docs say the list "is not exhaustive".
    evidence: DOCUMENTED
    sources:
      - url: https://docs.siderolabs.com/talos/v1.14/learn-more/architecture
        type: official-docs
        title: Talos architecture
        retrieved: "2026-09-22"
        quote: >-
          At its core the rootfs is a read-only squashfs. The squashfs is then
          mounted as a loop device into memory. This provides Talos with an
          immutable base.
      - url: https://docs.siderolabs.com/talos/v1.14/learn-more/philosophy
        type: official-docs
        title: Talos philosophy, ephemeral partition
        retrieved: "2026-09-22"
        quote: >-
          We even call the writable partition "ephemeral" to keep this idea
          always in focus.
      - url: https://docs.siderolabs.com/talos/v1.14/learn-more/process-capabilities
        type: official-docs
        title: Process capabilities
        retrieved: "2026-09-22"
        quote: >-
          any process including privileged Kubernetes pods will not be able to
          get these capabilities
      - url: https://docs.siderolabs.com/talos/v1.14/security/selinux
        type: official-docs
        title: SELinux
        retrieved: "2026-09-22"
        quote: >-
          The policy denies access to machine configuration, prevents debuggers
          from attaching to system processes
    unknowns:
      - "Whether any runtime integrity check of the rootfs exists on a non-Secure-Boot install, or whether the signed installer image is the sole trust anchor."

  d03_artifact:
    normalized:
      primary_artifact: installer-container-image
      derived_artifacts:
        - iso
        - uki
        - kernel-and-initramfs
        - cloud-disk-images
      oci_registry_distribution: true
      content_addressable: "schematics are content-addressed by ID"
      mirrorable: true
      signed: cosign-keyless
      air_gapped_capable: true
      build_service: "Image Factory, self-hostable under MPL-2.0"
    summary: >-
      The installer container image is the unit of both install and upgrade. The
      Image Factory generates it, along with ISOs, UKIs and cloud images, from a
      content-addressed schematic that captures extensions and kernel arguments.
    notes: >-
      A v1.14 change matters for anyone pinning references: the project no longer
      publishes a generic installer image. Installers are now built and served by
      the Image Factory at a per-schematic address and are signed by the Image
      Factory service account rather than by the release pipeline.

      Schematics are content-addressable, so the same customization always
      produces the same ID, and a node's schematic is recoverable from the
      running system. The Factory deliberately does not allow listing all
      schematics, because they can contain sensitive kernel arguments.

      The Image Factory verifies signatures on every source image it fetches and
      signs what it produces. It is self-hostable under MPL-2.0, with an
      enterprise-licensed folder excluded from the open-source build. Two
      capabilities are enterprise-only in that build and this matters for an
      air-gapped operator: per-asset checksums and signature files return a
      payment-required error, and authentication is likewise enterprise.

      Air-gapped operation is documented end to end on both sides, with a listed
      set of images to mirror and helper tooling. This is among the most complete
      air-gap stories in the edition. The honest caveat the docs themselves give
      is that a self-hosted Discovery Service requires a commercial licence.

      Reproducible builds are claimed for the kernel, initramfs, CLI, ISO and
      container images. Every GitHub release asset carries a matching Sigstore
      bundle.
    evidence: DOCUMENTED
    sources:
      - url: https://docs.siderolabs.com/talos/v1.14/learn-more/image-factory
        type: official-docs
        title: Image Factory
        retrieved: "2026-09-22"
        quote: >-
          Schematics are content-addressable, that is, the content of the
          schematic is used to generate a unique ID.
      - url: https://docs.siderolabs.com/talos/v1.14/security/source-talos-images
        type: official-docs
        title: Source Talos images
        retrieved: "2026-09-22"
        quote: >-
          Starting with Talos 1.14, the ghcr.io/siderolabs/installer image is no
          longer published
      - url: https://github.com/siderolabs/image-factory/blob/main/docs/air-gapped.md
        type: source-repo
        title: Image Factory air-gapped mode
        retrieved: "2026-09-22"
        quote: >-
          The Image Factory can be run in air-gapped mode, where it uses a local
          registry to pull the required images and their signatures.
      - url: https://github.com/siderolabs/image-factory/blob/main/README.md
        type: source-repo
        title: Image Factory licence
        retrieved: "2026-09-22"
        quote: >-
          licensed under the Mozilla Public License, version 2.0, except for the
