  - date: "2026-10-06"
    field: "tradeoffs.costs"
    change: "Methodology section 9, rule 16: a single-vendor entry says single vendor once, and a commit share is added only when it is measured the same way for every entry. Was 'No governance document, no maintainers file, no CODEOWNERS file and no foundation. The commit history is concentrated in three contributors at one company.' Now 'No governance document, no maintainers file, no CODEOWNERS file and no foundation. Ownership is single-vendor.' (d13 vendor_neutral_ownership: single-vendor). The commit figure stays in d13 contribution_diversity."
  - date: "2026-10-06"
    field: "tradeoffs.costs"
    change: "Methodology section 9, rule 17: where a capability is documented is not a cost. Removed the clause 'the extension path restrictions live outside versioned docs'. The allowlist is published in the extensions repository README (d06 notes), which the project maintains. The other gaps stay: each is an absent or a wrong document."
  - date: "2026-10-06"
    field: "tradeoffs.buys"
    change: "Cluster API parity: every entry with Cluster API providers recorded in its profile gets a buy in the same shape, with its own status words. Added buy 'Its own Cluster API providers (MPL-2.0): a bootstrap provider and a control-plane provider, both released and listed upstream, plus a bare-metal infrastructure provider. The vendor no longer develops them actively, and their README notices point to Omni.' From d12 cluster_api and oss_companion (CABPT, CACPPT, Sidero Metal), with the deprecation notices as recorded there."
  - date: "2026-10-06"
    field: "tradeoffs.costs"
    change: "Methodology section 9, rule 18: the number of retained versions is documented by the A/B design and is not a limitation assessed for every entry. Cost c3 reworded. Was 'One previous version is retained and automatic rollback fires once. What triggers it is narrower than the documentation implies, and had to be read from source.' Now 'What triggers automatic rollback, a fatal error or panic in init before the machine is ready, is narrower than the documentation implies, and had to be read from source.' The trigger is as recorded in d05."
  - date: "2026-10-06"
    field: "tradeoffs.costs"
    change: "Methodology section 9, rule 18: a stated stop of maintenance counts wherever it appears. Added cost 'The vendor no longer actively develops its Cluster API providers, and their README notices point to Omni, which is not a Cluster API product. Releases still follow Talos versions; support is otherwise community.' Buy b7 keeps its status ending 'The vendor no longer develops them actively.' Verified verbatim on 2026-10-06 against the CABPT and CACPPT READMEs; latest releases CABPT v0.6.13 (2026-09-18) and CACPPT v0.5.14 (2026-09-21), both for Talos 1.14, as recorded in d12."
    source:
      url: "https://github.com/siderolabs/cluster-api-bootstrap-provider-talos"
      type: "source-repo"
      title: "CABPT README, deprecation notice"
      retrieved: "2026-10-06"
      quote: "Unless you have an existing support contract covering Cluster API Bootstrap Provider Talos, all support will be provided by the community (including questions in our Slack workspace)."
  - date: "2026-10-06"
    field: "tradeoffs.costs"
    change: "Methodology section 9, rule 18, parity with bootc cost c0 (signature verification ships off): an unverified security path counts wherever it appears. Added cost 'To require signed images, an operator must add a deny rule. The verification policy is permissive by default, and keyless verification does not work air-gapped.' From d04 notes and d10 artifact_verification. The air-gapped clause is in the d04 source page, verified verbatim on 2026-10-06."
    source:
      url: "https://docs.siderolabs.com/talos/v1.14/security/verifying-image-signatures"
      type: "official-docs"
      title: "Verifying image signatures"
      retrieved: "2026-10-06"
      quote: "Keyless verification will not work on air-gapped clusters that do not have access to the Internet."
