tradeoffs:
  buys:
    - "A single machine contract. With no shell, no SSH and no package manager, the set of states a node can be in is small, enumerable and testable. Configuration drift is not managed, it is structurally prevented."
    - "No shell or SSH, and no runtime software installation: every change goes through one mutual-TLS API with four least-privilege roles and short-lived rotating certificates."
    - "Safety interlocks in the OS rather than in a fleet product. Etcd quorum is protected, concurrent control plane upgrades are serialized, and an upgrade boots once before committing so a failure reverts without anything outside the machine deciding."
    - "OS and Kubernetes lifecycles are independent, with separate commands, version streams and support matrices."
    - "The Talos API stays available when Kubernetes is down, by design, because it does not depend on etcd or the API server."
    - "A published vulnerability response commitment: three business days to respond, thirty days to fix, for the two latest minor releases."
    - "An air-gap path on both the image build and the update path, with a self-hostable build service under MPL-2.0."
    - "Its own Cluster API providers (MPL-2.0): a bootstrap provider and a control-plane provider, both released and listed upstream, plus a bare-metal infrastructure provider. The vendor no longer develops them actively, and their README notices point to Omni."
  costs:
    - "There is no documented way to run a machine with no Kubernetes role, and the container escape hatch added in v1.14 is unorchestrated and explicitly not a Kubernetes replacement."
    - "Out-of-tree kernel modules require rebuilding the kernel, because the module signing key is generated per build and is not available to users."
    - "Recovery depends on the API and therefore on the network. With the network down, the console offers a read-only dashboard, a wipe entry and slot selection, and no interactive repair, because there is no shell."
    - "What triggers automatic rollback, a fatal error or panic in init before the machine is ready, is narrower than the documentation implies, and had to be read from source."
    - "No dm-verity and no documented runtime integrity re-verification of the root on a non-Secure-Boot install."
    - "To require signed images, an operator must add a deny rule. The verification policy is permissive by default, and keyless verification does not work air-gapped."
    - "Ships with SELinux permissive, described as experimental, because storage and networking add-ons are incompatible with enforcing."
    - "No governance document, no maintainers file, no CODEOWNERS file and no foundation. Ownership is single-vendor."
    - "The community support window is about eight months. Longer support is a commercial product."
    - "Fleet inventory and desired-state management need a product whose licence is not open source."
    - "The vendor no longer actively develops its Cluster API providers, and their README notices point to Omni, which is not a Cluster API product. Releases still follow Talos versions; support is otherwise community."
    - "Documentation gaps in load-bearing places: the upgrade API used since v1.13 is absent from the API reference, the Kubernetes upgrade procedure is unversioned and its in-document link is broken, and the support matrix is stale against the shipped release."
