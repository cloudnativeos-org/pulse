        - name: Cluster API Bootstrap Provider Talos (CABPT)
          repo: https://github.com/siderolabs/cluster-api-bootstrap-provider-talos
          license: MPL-2.0
          org: siderolabs
          note: "Bootstrap provider. Generates Talos machine config rather than cloud-init. Latest release v0.6.13 on 2026-09-18, for Talos 1.14 compatibility, with a v0.7.0-alpha.3 pre-release on 2026-09-17. A deprecation notice was added to the README on 2026-08-13: the vendor no longer develops it actively and points to Omni, with community support otherwise. Still listed upstream as a Cluster API bootstrap provider."
        - name: Cluster API Control Plane Provider Talos (CACPPT)
          repo: https://github.com/siderolabs/cluster-api-control-plane-provider-talos
