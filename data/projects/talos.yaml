          repo: https://github.com/siderolabs/talos-backup
          license: MPL-2.0
          org: siderolabs
          note: "No stable release; newest tag is a beta from 2024."
      commercial:
        - name: Omni
          vendor: Sidero Labs
          license: "BUSL-1.1, converting to MPL-2.0 roughly four years after each version's release"
          self_hostable: true
          note: "Source-available, not open source by the licence's own text. Non-production and home-lab use is granted free; production requires a commercial licence. Self-hosting is documented including air-gapped, and it has been tested to 5,000 nodes per instance."
        - name: Talos Enterprise Linux
          vendor: Sidero Labs
          license: commercial
          self_hostable: false
          note: "Launched 2026-09-15. Adds schematic-specific SBOMs, curated VEX data, signed build attestations, FIPS-compliant builds, CVE response commitments and IP indemnity. The vendor states the codebase is the same and that other than FIPS builds there is no feature difference."
      cluster_api:
        os_specific_provider: "CABPT (bootstrap), CACPPT (control plane), Sidero Metal (bare-metal infrastructure)"
        provider_types:
          - bootstrap
          - control-plane
          - infrastructure
        maintainer: project-native
        upstream_provider_list: "listed in the published book under Bootstrap, Control Plane and Infrastructure, with no deprecation marker"
        provisions: "OS configuration and bootstrap through Talos machine config, plus control-plane lifecycle. Sidero Metal provisions physical machines."
        bootstrap_target: "Talos machine config, not kubeadm and not cloud-init"
        image_builder_target: "not-applicable"
        maturity: "released, and no longer actively developed by the maintainer, whose README notices point to Omni, which is not a Cluster API product: Sidero Metal on 2024-03-25, CABPT on 2026-08-13, CACPPT on 2026-08-14"
    summary: >-
      The open-source project gives a capable per-node and multi-node CLI plus
      real safety interlocks in the OS itself. Fleet inventory, desired-state
      management and a user interface are the commercial product's territory.
    notes: >-
      The licensing boundary deserves precision because it is easy to get wrong.
      Talos Linux is MPL-2.0 open source. Omni is Business Source Licence 1.1,
      which is not an open source licence by its own text, and which converts to
      MPL-2.0 on a per-version change date roughly four years out. The use grant
      widened over time: earlier versions granted no additional use, and from
      v1.6.0, released 2026-03-16, a non-production and home-lab grant is
      present. The vendor
      publishes explicit interpretive guidance on where the production boundary
      falls and labels it as interpretation rather than licence text.

      Two vendor events fall inside the collection window and are recorded as
      dated facts only. Sidero Labs announced its acquisition by Yardi on
      2026-09-14, stating that Talos Linux remains fully open source under
      MPL-2.0 with the same repositories and licence, and that Sidero Labs
      continues to operate as a standalone company. A commercial licence, Talos
      Enterprise Linux, launched on 2026-09-15, and the announcement states that
      Talos Linux "remains fully open source under the MPL-2.0 license,
      unchanged."

      These are the vendor's own statements, made one day and zero days before
      collection respectively. No inference about their durability is drawn here,
      and none should be. A future edition of this Pulse will record what
      actually happened, which is the point of running it again.

      The Cluster API position is the sharpest example in this edition of why a
      provider list is not a maturity signal. This project owns the only
      operating-system-native provider set that the published Cluster API
      provider list actually names: CABPT under Bootstrap, CACPPT under Control
      Plane, Sidero Metal under Infrastructure. All three carry a deprecation
      notice in their READMEs, in identical words: the vendor no longer
      develops them actively, points to Omni as the alternative, and states
      that support comes from the community unless an existing support
      contract covers them. The dates differ: Sidero Metal's notice dates from
      2024-03-25, CABPT's from 2026-08-13 and CACPPT's from 2026-08-14. Omni
      is not a Cluster API implementation and does not appear on that list.

      An earlier version of this profile recorded that the Cluster API
      providers were migrating to kubernetes-sigs. That is corrected here. No
      Talos Cluster API repository exists in the kubernetes-sigs organization,
      and the deprecation notices point to Omni rather than to any upstream
      migration. The providers still receive commits and releases after the
      notices: CABPT v0.6.13 on 2026-09-18 and CACPPT v0.5.14 on 2026-09-21,
      both for Talos 1.14 compatibility, and a Sidero Metal compatibility
      commit on 2026-09-21. They are deprecated rather than dead.

      The upstream provider list still carries all three with no deprecation
      marker, checked again on 2026-09-22, five weeks after the August notices
      and two and a half years after Sidero Metal's. A reader who uses that
      list as a health check will get the wrong answer here.
