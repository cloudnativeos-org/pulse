        identifier: "Talos version plus the Image Factory schematic ID"
        condition: "none on the Image Factory path"
        evidence: DOCUMENTED
        sources:
          - url: https://docs.siderolabs.com/talos/v1.13/learn-more/image-factory
            type: official-docs
            title: "Talos Image Factory"
            retrieved: "2026-10-06"
