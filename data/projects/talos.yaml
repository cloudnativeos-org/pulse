              Schematics are content-addressable, that is, the content of the schematic is used to generate a unique ID.
      mechanism:
        - ab-partition-switch
      scope: whole-os-image
      scope_note: The bootloader is refreshed on every upgrade.
      scope_sources:
        - url: https://docs.siderolabs.com/talos/v1.14/configure-your-talos-cluster/lifecycle-management/upgrading-talos
          type: official-docs
          title: Upgrading Talos
          retrieved: '2026-10-06'
          quote: Upgrades use an A-B image scheme
        - url: https://docs.siderolabs.com/talos/v1.14/platform-specific-installations/bare-metal-platforms/bootloader
          type: official-docs
          title: Talos bootloader
          retrieved: '2026-10-06'
          quote: GRUB is used for legacy BIOS systems on x86_64, while `systemd-boot` is used for UEFI systems on x86_64 and arm64.
      initiator: api-call
      requires_kubernetes: false
      requires_vendor_infrastructure: false
      self_hostable_update_server: true
      self_hostable_update_source: "Any OCI registry; Image Factory can run on-premises"
      self_hostable_update_server_evidence: DOCUMENTED
      self_hostable_update_server_note: "There is no update server. The node pulls an installer image from an OCI registry. Image Factory can run on-premises, and registry mirrors redirect pulls to an internal registry."
      self_hostable_build_service: true
      artifact_verification: "policy-based, permissive by default"
      kubernetes_upgrade_separate: true
      quorum_protection: true
    summary: >-
      An API call passes the node an installer image. The node cordons and drains
      itself, unmounts filesystems, writes the new image, sets the bootloader to
      boot once with it, and reboots via kexec. On success the change becomes
      permanent and the node rejoins and uncordons.
    notes: >-
      Two safety properties stand out and both are in the OS rather than in a
      fleet product. Talos refuses to upgrade a control plane node if that would
      cost etcd quorum, and if several control plane nodes are asked at once it
      serializes them. And the boot-once-then-commit sequence means a failed boot
      reverts without anything outside the machine deciding.

      The docs are candid about the limit of that protection: nothing prevents
      simultaneous upgrades across nodes, and other quorum-keeping software in
      the cluster may not survive more than one node rebooting at a time.

      Upgrades are testable only between adjacent minor releases, so the
      recommended path is through each intermediate minor's latest patch.

      Kubernetes upgrades are deliberately separate and have been since v1.0. An
      OS upgrade does not change the Kubernetes version. That separation is a
      real property and is recorded again under d07.

      Artifact verification is configurable machine-wide and covers every image
      pull including those Kubernetes initiates. Two documented limits matter:
      the default policy is permissive, so fail-closed requires an explicit deny
      rule, and keyless verification does not work on air-gapped clusters.

      Since v1.13 the upgrade goes through a new lifecycle API; the previous one
      is deprecated. That new API does not yet appear in the published API
      reference.
    evidence: DOCUMENTED
    sources:
      - url: https://docs.siderolabs.com/talos/v1.14/configure-your-talos-cluster/lifecycle-management/upgrading-talos
        type: official-docs
        title: Upgrading Talos
        retrieved: "2026-09-22"
        quote: >-
          Upgrades use an A-B image scheme in order to facilitate rollbacks ... If
          an upgrade fails to boot, Talos will roll back to the previous version.
      - url: https://docs.siderolabs.com/talos/v1.14/security/verifying-image-signatures
        type: official-docs
        title: Verifying image signatures
        retrieved: "2026-09-22"
        quote: >-
          Any other images that do not match any of the rules will be allowed by
