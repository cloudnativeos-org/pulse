  d13_governance:
    normalized:
      license: MPL-2.0
      license_note: "Omni is BUSL-1.1 and the Image Factory has a BUSL-1.1 enterprise folder. The shipped OS bundles GPL-family third-party components."
      open_source: true
      open_governance: undocumented
      vendor_neutral_ownership: single-vendor
      foundation: "none"
      foundation_note: "Present in the CNCF landscape as a non-hosted entry with no maturity level. Sidero Labs is a CNCF silver member."
      trademark_holder: unknown
      primary_commercial_sponsor: "Sidero Labs, acquired by Yardi on 2026-09-14"
      contributor_agreement: DCO
      contribution_diversity:
        method: >-
          All-time commit counts from the GitHub contributors API, plus the
          public company field on contributor profiles. Counts individuals, not
          organizations. Most top contributors leave the company field blank, so
          affiliation cannot be established from primary sources and is not
          inferred.
        value: >-
          Heavily concentrated: the top three contributors account for roughly
          4,687 of about 6,250 commits among the top thirty, measured on
          2026-09-22. The v1.14.0 release notes credit 60 contributors for that
          cycle, though how that list is generated is not documented. The only
          published maintainer roster names three people, all at one company.
    summary: >-
      MPL-2.0, single-vendor owned, no foundation and no governance document.
      There is no maintainers file and no code owners file anywhere in the
      repository. Contribution uses DCO rather than a CLA.
    notes: >-
      The four governance properties separate as follows. Open source: yes, and
      the core project's licence is unchanged by this month's commercial
      announcements. Open governance: undocumented. There is no governance
      document, no maintainers file, no code owners file, no process for becoming
      a maintainer and no escalation or conflict-resolution process; all were
      probed directly and return not found. Vendor-neutral ownership: no.
      Contribution diversity: concentrated.

      The only published maintainer roster sits inside a compliance metadata file
      and names three people, all affiliated with the same company.

      Talos is not a CNCF project. It appears in the CNCF landscape as an entry
      with no maturity field, alongside roughly 2,168 other non-hosted entries,
      and it is a Certified Kubernetes Distribution and Installer. Sidero Labs is
      a CNCF silver member, which is a membership, not a project hosting
      relationship. Stating this precisely matters, because a landscape entry is
      easy to mistake for CNCF hosting.

      No trademark policy or usage guidelines were found anywhere.

      The acquisition announcement addresses licence, repositories and
      contribution process. It does not address trademark or copyright
      ownership, and that is recorded as an open question rather than as a
      concern.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/siderolabs/talos/blob/main/LICENSE
        type: governance-doc
        title: Talos licence
        retrieved: "2026-09-22"
        quote: Mozilla Public License Version 2.0
