open_questions:
  - "With ContainerConfig shipping in v1.14, has the position on a Kubernetes-free Talos changed? Is a machine type with no Kubernetes still contemplated?"
  - "Is upgrade or rollback supported on a node that never joined a Kubernetes cluster?"
  - "Is there any runtime integrity check of the root squashfs on a non-Secure-Boot install, and was dm-verity considered and rejected?"
  - "What exactly triggers automatic rollback? Does a panic before the init process starts, or a silent hang, also trigger it? Is there a watchdog for that case?"
  - "How many boot attempts occur before fallback, and is the one-shot behaviour intentional and permanent?"
  - "Is rolling back across a machine-configuration schema migration supported?"
  - "What is in the per-asset Sigstore bundles, and what is the documented command to verify a downloaded ISO or UKI?"
  - "Does the project claim a SLSA level, and if not, is one planned?"
  - "Can a community self-hosted Image Factory emit checksums or signatures for its generated assets at all?"
  - "The enterprise Image Factory page, rewritten on 2026-09-15, names the Go Cryptographic Module under CMVP certificate 5247 in non-strict mode. Is strict or enforcing FIPS mode still a separate offering, as the earlier version of the page said?"
  - "What is the current status of SELinux enforcing mode after the v1.13 and v1.14 policy work?"
  - "Is the hardening page's forced-module-signing claim correct, given the shipped kernel config shows it unset and enforcement comes from an overridable kernel parameter?"
  - "How are the embedded default support-bundle encryption recipients rotated, and can an operator enumerate them before collecting?"
  - "Is Raspberry Pi 5 supported? Four official sources say different things."
  - "Is a governance document planned? What is the process for a non-employee to become a maintainer, and has anyone outside the company ever held commit rights?"
  - "Does the acquisition change trademark or copyright ownership for Talos Linux? The announcement addresses licence and repositories but not the mark."
  - "Has CNCF donation ever been considered?"
  - "What is the end-of-life commitment for Sidero Metal and the two Cluster API providers, all marked no longer actively developed while still receiving pushes?"

