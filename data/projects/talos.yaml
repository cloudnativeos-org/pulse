  d06_customization:
    normalized:
      runtime_package_install: "none"
      mechanisms:
        - image-factory-schematic
        - imager-container
        - system-extensions
        - overlays
        - extension-services
        - machine-config-patches
        - container-config
      customization_points:
        - build-time
        - install-time
        - boot-time
        - runtime
      extension_activation: "install or upgrade only"
      custom_kernel_modules: "requires rebuilding the kernel, because the module signing key is per-build and not available to users"
      add_software:
      - kind: vendor-extensions
        how: Talos system extensions extend the root filesystem. They are built into boot assets or the installer image, and they activate only at install or upgrade.
        evidence: DOCUMENTED
        sources:
        - url: https://docs.siderolabs.com/talos/v1.14/build-and-extend-talos/custom-images-and-development/system-extensions
          type: official-docs
          title: 'Talos docs: System extensions'
          retrieved: '2026-10-12'
          quote: System extensions allow extending the Talos root filesystem, which enables a variety of features, such as including custom container runtimes, loading additional firmware, etc.
        - url: https://docs.siderolabs.com/talos/v1.14/build-and-extend-talos/custom-images-and-development/system-extensions
          type: official-docs
          title: 'Talos docs: System extensions'
          retrieved: '2026-10-12'
          quote: System extensions are only activated during the installation or upgrade of Talos Linux.
    summary: >-
      Customization is layered and each layer has a defined moment. Extensions
      extend the root filesystem and activate only at install or upgrade.
      Overlays customize the install process. Machine configuration patches apply
      to running nodes.
    notes: >-
      The official extension catalog has 91 entries across four support tiers,
      with the tiers stated plainly: fully supported, some level of support,
      community-supported with no support, documentation, tests, SBOM or CVE
      scan, and one deprecated. All extensions are signed and pinned per release.

      The hardest constraint is kernel modules, and the reasoning is stated: the
      module signing key is generated during the build, is unique to each build,
      and is not available to the user. Adding an out-of-tree module therefore
      means building your own kernel and all required modules so the signatures
      match. That is a real cost and it is documented rather than hidden.

      What an extension may contain is bounded by an allowlist of filesystem
      hierarchies, published in the extensions repository README rather than in
      the versioned documentation. The list is broad enough in practice to permit
      arbitrary userspace binaries under a local hierarchy, but anything outside
      it is out of contract. That the single most important "what can I not do"
      fact lives outside versioned documentation is worth noting.

      v1.14's ContainerConfig is the first mechanism here that takes effect
      immediately at runtime with no rebuild and no reboot.
    evidence: DOCUMENTED
    sources:
      - url: https://docs.siderolabs.com/talos/v1.14/build-and-extend-talos/custom-images-and-development/system-extensions
        type: official-docs
        title: System extensions
        retrieved: "2026-09-22"
        quote: >-
