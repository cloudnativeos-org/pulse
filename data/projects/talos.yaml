  d10_security:
    normalized:
      boot_trust_chain:
        level: 3
        how: per-install-mode
        route: usi
        artifact: signed UKI
        modes:
          SecureBoot (UKI): 3
          GRUB: 0
        note: SecureBoot images come signed by Sidero from Image Factory, or signed with your own keys. The
          squashfs root is inside the UKI initramfs. With TPM disk encryption, keys are sealed to the signed
          PCR 11 policy plus PCR 7
        evidence: DOCUMENTED
        sources:
        - url: https://docs.siderolabs.com/talos/v1.12/platform-specific-installations/bare-metal-platforms/secureboot
          type: official-docs
          title: Talos SecureBoot
          retrieved: '2026-10-06'
          quote: The Talos kernel, initramfs and cmdline arguments are combined into the Unified Kernel Image (UKI) format.
        - url: https://github.com/siderolabs/talos/blob/e18d5ce093d98f6076f220dbf88bc4dc45be7651/Dockerfile#L1132-L1144
          type: source-code
          title: 'Talos Dockerfile: initramfs'
          retrieved: '2026-10-06'
          quote: COPY --link --from=squashfs-amd64 /rootfs.sqsh .
      secure_boot: available
      measured_boot: available
      tpm: "disk encryption key binding under Secure Boot"
      integrity: read-only-mount
      dm_verity: "none"
      disk_encryption: "available, TPM-bound under Secure Boot"
      artifact_verification: "configurable policy, permissive by default"
      sbom: "SPDX published per release"
      provenance: "Sigstore bundle per release asset; no SLSA level claimed"
      fips: "FIPS-enabled builds, enterprise only; the FIPS 140-3 validation attaches to the Go Cryptographic Module (CMVP certificate 5247), not to Talos Linux as a whole"
      mandatory_access_control: "SELinux, permissive by default"
      kernel_module_signing: enforced
      shell_present: false
      default_on:
        - read-only-squashfs-root
        - kernel-module-signature-enforcement
        - capability-denial
        - mutual-tls-api
        - kspp-hardening
        - pod-security-admission-baseline
        - etcd-encryption-at-rest
        - audit-logging
      opt_in:
        - secure-boot
        - selinux-enforcing
        - disk-encryption
        - fail-closed-image-verification
    summary: >-
      A dense default hardening posture built on the absence of things: no SSH,
      no shell, no package manager, read-only root, API-only management with
      mutual TLS everywhere, and short-lived automatically rotating certificates.
    notes: >-
      The project's own framing of what the constraints buy is worth recording in
      full, because it is the clearest statement in this edition of a constraint
      being a guarantee: "No SSH, no remote shell access vector; No interactive
      shell, no local shell access vector; Immutable root filesystem, the OS
      cannot be modified at runtime; No package manager, software cannot be
      installed at runtime; API-only management, all node operations go through
      the authenticated Talos API."

      A consequence the docs draw honestly: most of the CIS distribution-
      independent Linux benchmark simply does not apply, because its checks
      assume SSH, a shell, a package manager or a writable filesystem. The CIS
      page is unusually candid, enumerating architectural false positives in a
      common benchmarking tool and supplying validated skip lists rather than
      claiming a score.

      Kubernetes-side CIS defaults are on without configuration: anonymous auth
      off, Node plus RBAC authorization that cannot be removed, audit logging,
      etcd secrets encrypted at rest, profiling disabled, seccomp default
      profile, and Pod Security Admission enforcing baseline with restricted
      audited.

      Two honest qualifications. SELinux is enabled but permissive by default,
      because some storage and networking add-ons are incompatible with
      enforcing, and the documentation still calls it experimental. And the
      hardening page's claim about forced module signing does not match the
      shipped kernel config: enforcement comes from an overridable kernel command
      line parameter rather than a compiled-in force, so a reader gets two
      different answers about whether it can be turned off.

      FIPS-enabled builds exist but are an enterprise offering and are not
      published on the public factory. The enterprise Image Factory page names
      the module: the Go Cryptographic Module, validated under FIPS 140-3 as
      CMVP certificate 5247, used in non-strict mode, and it states that the
      validation attaches to that module and not to Talos Linux as a whole.
      Until 2026-09-15 the same page said instead that FIPS-enabled builds were
      distinct from CMVP certification and that certified builds were a
      separate offering; the rewrite landed on collection day. The page is
      unusually frank in both versions: "This is a compliance attribute rather
      than a stronger security posture."

      The security policy commits to a three business day response and a fix
      within thirty days, for the two latest minor releases. That is a concrete
      commitment and more than most projects in this edition publish.

      A v1.14 change worth flagging for operators: support bundles are now
      encrypted by default to recipients embedded in the CLI, so a bundle
      produced with defaults can only be decrypted by the vendor. It is
      overridable, and the docs say so, but the default is worth knowing.
    evidence: DOCUMENTED
    sources:
      - url: https://docs.siderolabs.com/talos/v1.14/security/talos-default-hardening-and-cis-compliance
        type: official-docs
        title: Default hardening and CIS compliance
        retrieved: "2026-09-22"
        quote: >-
          Because of this design, the majority of the CIS Distribution
          Independent Linux Benchmark does not apply to Talos nodes.
      - url: https://github.com/siderolabs/talos/blob/main/SECURITY.md
        type: governance-doc
        title: Talos security policy
        retrieved: "2026-09-22"
        quote: >-
          The expected response time is within 3 business days, and the fix is
          expected to be delivered within 30 days.
      - url: https://docs.siderolabs.com/talos/v1.14/security/selinux
        type: official-docs
        title: SELinux
        retrieved: "2026-09-22"
        quote: >-
          The default mode is permissive ... SELinux is still in an experimental
          state in Talos Linux.
      - url: https://docs.siderolabs.com/talos/v1.14/learn-more/enterprise-image-factory
        type: official-docs
        title: Enterprise Image Factory, FIPS
        retrieved: "2026-09-22"
        quote: >-
          This is a compliance attribute rather than a stronger security posture
      - url: https://docs.siderolabs.com/talos/v1.14/troubleshooting/support-bundle
        type: official-docs
        title: Support bundle
        retrieved: "2026-09-22"
        quote: >-
          The default recipients are the public SSH keys of the public members
          of the siderolabs GitHub organization, embedded in talosctl, so a
          bundle produced with the defaults can only be decrypted by the Sidero
          Labs team.
    unknowns:
      - "Whether strict or enforcing FIPS mode remains a separate offering after the 2026-09-15 documentation rewrite, which describes non-strict mode only."
      - "No SLSA level is claimed despite reproducible builds and per-asset Sigstore bundles."
      - "No documented verification command for release assets."

  d11_operations_debugging:
    normalized:
      ssh: "none"
      local_shell: "none"
      api: "declarative gRPC, mutual TLS, port 50000, with role-based access control"
      serial_console: available
      video_console_dashboard: available
      debug_container: "talosctl debug, privileged, from v1.13"
      support_bundle: "talosctl support, encrypted by default from v1.14"
      works_without_kubernetes: "yes"
    summary: >-
      No SSH and no shell. Everything runs through an authenticated API with
      four access roles, plus a video console dashboard, a support bundle
      collector, and a sanctioned privileged debug container.
    notes: >-
      The absence of a shell is recorded here as a design choice with both sides
      stated, as the methodology requires.

      What it buys, in the project's words: management operations are all
      possible through the API, the API applies least privilege and exposes only
      a limited set of methods, and the intent is that operators think about the
      cluster rather than individual nodes. Concretely, there is no remote or
      local shell access vector, and the API is mutual-TLS authenticated with
      short-lived rotating certificates and four roles: reader, operator,
      admin, and a narrow etcd backup role.

      What it costs: recovering a machine requires the API, and therefore the
      network, except for the console paths recorded under d05. Diagnosis depends
      on the tools the project chose to expose, which are extensive but finite.

      The tooling is genuinely broad. Logs including a mirrored kernel log,
      kernel message buffer, a resource API modelled on kubectl get, packet
      capture, process and memory and network views mapped explicitly to their
      Linux command equivalents, a cluster dashboard, and control plane
      inspection through static pod and manifest resources.

      Three documented escape hatches exist and all are official. The debug
      container is the interesting one: it starts a privileged container from an
      image you supply, with host PID and network namespaces and the host
      filesystem mounted, and removes it on exit. It can accept an image pushed
      over the API rather than pulled from a registry, specifically for the case
      where connectivity is the thing being debugged. The documentation even
      walks through relaxing a hardening setting to trace a packet drop.

      The answer to operating without Kubernetes is direct and is quoted in the
      FAQ: Kubernetes might be down for many reasons "while Talos API access will
      always be available."
    evidence: DOCUMENTED
    sources:
      - url: https://docs.siderolabs.com/talos/v1.14/troubleshooting/faqs
        type: official-docs
        title: FAQ, why no shell or SSH
        retrieved: "2026-09-22"
        quote: >-
          Since Talos is fully API-driven, all maintenance and debugging
