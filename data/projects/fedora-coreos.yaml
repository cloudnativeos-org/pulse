known_issues: []
open_questions:
  - "What is the realistic timeline and technical shape of the unification working group? A working group opened three weeks before this snapshot proposes merging Fedora CoreOS with the Fedora bootc base images, with no technical design published yet. Will the stream model, the update agent and the update graph survive the merge, or be replaced by the simpler timer-based bootc model?"
  - "Is there a target for closing the migration to an OCI-native update graph, and does it block the bootc integration work?"
  - "Will Fedora CoreOS ever ship a supported GPU driver mechanism, or is that intentionally left to Fedora bootc derivatives?"
  - "Is automatic, health-gated rollback ever planned to be on by default, given the design question has been open since 2018?"
  - "Is there any plan to publish working group membership with affiliations, as the bootc project does? Contributor and maintainer affiliation is unpublished today."
  - "Will signature-backed runtime filesystem integrity land on a committed timeline after composefs?"
  - "Is Fedora CoreOS itself ever intended to gain a commercial support option? No primary source found either offers one or states that none exists."
  - "Does the project ship or recommend any diagnostic collection tool? None is documented, and no source states that none exists."
  - "Which container signature policy does podman on the host actually read? The shipped strict policy is bind-mounted into the rpm-ostree daemon only; the host-wide default was not verified on a running system."

