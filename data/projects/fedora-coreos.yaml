  d07_kubernetes:
    normalized:
      requirement: optional
      bundled: "none"
      independent_lifecycle: "yes"
      os_manages_kubernetes: "no"
      kubernetes_manages_os: "none in Fedora CoreOS; the Machine Config Operator is OpenShift and OKD specific"
      distributions: []
    summary: >-
      Kubernetes is optional and not included. The FAQ answers directly: yes you
      can run Kubernetes, but no specific orchestrator or version ships by
      default. Docker and podman do.
    notes: >-
      The relationship to the downstream products needs stating precisely,
      because it is often blurred. Red Hat CoreOS is a separate downstream
      product, supported only as an OpenShift component and life-cycled with that
      platform. Fedora CoreOS is the upstream basis for it and is not life-cycled
      with any Kubernetes distribution.

      The Machine Config Operator belongs to OpenShift and OKD, not to Fedora
      CoreOS, and the FAQ names it as such.

      One correction worth recording, because a stale vendor page says otherwise:
      OKD's architecture chapter still states that Fedora CoreOS is the only
      supported node operating system, while OKD's own project pages state that
      OKD has used CentOS Stream CoreOS rather than Fedora CoreOS since OKD 4.16
      in December 2024. The project pages are authoritative here.

      The update agent has no Kubernetes-specific logic. Cluster-wide reboot
      coordination goes through a generic HTTP protocol, for which a
      Kubernetes-based lock manager is one third-party option among several.
    evidence: DOCUMENTED
    sources:
      - url: https://docs.fedoraproject.org/en-US/fedora-coreos/faq/
        type: official-docs
        title: FAQ, Kubernetes and RHCOS
        retrieved: "2026-09-22"
        quote: >-
          Yes. However, Fedora CoreOS does not include a specific container
          orchestrator (or version of Kubernetes) by default.
      - url: https://okd.io/docs/project/scos-migration-faq/
        type: official-docs
        title: OKD SCOS migration FAQ
        retrieved: "2026-09-22"
        quote: >-
          The upgrade path requires that your FCOS-based cluster be running
          4.15. From there, clusters can be updated to 4.16 SCOS.
      - url: https://okd.io/blog/2024/12/16/okd-4-16-and-4-17-release/
        type: announcement
        title: OKD 4.17 and 4.16 releases, 2024-12-16
        retrieved: "2026-09-22"
        quote: >-
          Node operating systems are now based off CentOS Stream CoreOS (SCOS)
          rather than Fedora CoreOS (FCOS).
      - url: https://docs.okd.io/latest/architecture/architecture-rhcos.html
        type: official-docs
        title: OKD architecture chapter, the stale statement
        retrieved: "2026-09-22"
        quote: >-
          FCOS is the only supported operating system for all node types in OKD.

