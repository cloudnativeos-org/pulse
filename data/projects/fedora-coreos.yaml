      version_identity:
        identifier: "Release version, for example 44.20260829.3.1"
        condition: "No package layering or overrides."
        evidence: DOCUMENTED
        sources:
          - url: https://github.com/coreos/fedora-coreos-docs/blob/main/modules/ROOT/pages/os-extensions.adoc
            type: official-docs
            title: "Fedora CoreOS os-extensions"
            retrieved: "2026-10-06"
