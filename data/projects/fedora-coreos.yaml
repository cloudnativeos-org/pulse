schema_version: "1.0.0"
edition: "2026"
id: fedora-coreos
name: Fedora CoreOS
homepage: https://docs.fedoraproject.org/en-US/fedora-coreos/
repository: https://github.com/coreos/fedora-coreos-config
collected_at: "2026-09-15"

entry_kind:
  - distribution

category_fit:
  comparable: full
  note: >-
    A Fedora Edition with streams and releases. Comparable on all fourteen
    dimensions.

    Read alongside the bootc profile. They are separate entries because a
    distribution and a mechanism are not peers, and this edition's methodology
    section 3 explains why. A Fedora working group opened on 2026-08-26 proposes
    merging Fedora CoreOS and the Fedora bootc base images, targeting Fedora 46.
    That is announced and in progress, with no technical design or shipped
    artifact yet, and it is recorded as such rather than as a completed move.

self_description:
  text: >-
    Fedora CoreOS is an automatically updating, minimal, monolithic,
    container-focused operating system, designed for clusters but also operable
    standalone, optimized for Kubernetes but also great without it.
  source:
    url: https://docs.fedoraproject.org/en-US/fedora-coreos/
    type: official-docs
    title: Fedora CoreOS documentation
    retrieved: "2026-09-22"

version_observed:
  version: "44.20260829.3.1"
  released: "2026-09-15"
  channel: stable
  method: >-
    Live stream metadata at builds.coreos.fedoraproject.org/streams/stable.json,
    which the documentation names as the canonical URL on its stream metadata
    page. The download page is client-side rendered and carries no version
    strings. The release date is the rollout date: the "Roll out stable" commit
    to streams/stable.json in the fedora-coreos-streams repository, cross-checked
    against the rollout start_epoch in
    builds.coreos.fedoraproject.org/updates/stable.json. The version string's
    embedded date (20260829) is the build date, not the release date.
  source:
    url: https://builds.coreos.fedoraproject.org/streams/stable.json
    type: release-notes
    title: Fedora CoreOS stable stream metadata
    retrieved: "2026-09-22"
  additional_channels:
    - channel: testing
      version: "44.20260913.2.1"
      released: "2026-09-15"
    - channel: next
      version: "45.20260913.1.1"
      released: "2026-09-15"

taxonomy:
  workload_scope: general-purpose-host
  construction_model:
    - vendor-fixed-image
  root_state_substrate:
    - ostree-deployment
  notes: >-
    A container host that is optimized for Kubernetes but ships none, and whose
    own description stresses it is "operable standalone". That places it at the
    general-purpose-host position rather than the Kubernetes-oriented one.

    The construction model is deliberately single-valued here, and it is the
    difference the Fedora bootc documentation itself draws: Fedora CoreOS
    "generally emphasizes users configuring an image pre-built by Fedora", while
    Fedora bootc "emphasizes users deriving from our container base image".

    The substrate is an OSTree deployment. Since late 2025 the update payload is
    fetched as an OCI image, but what lands on disk is still an OSTree
    deployment applied by rpm-ostree, not a bootc deployment.

dimensions:
  d01_os_model:
    normalized:
      workload_scope: general-purpose-host
      ships_kubernetes: false
      streams:
        - stable
        - testing
        - next
      edition_status: "official Fedora Edition since Fedora 37"
    summary: >-
      A minimal, automatically updating container host, shipped as three
      continuously updating streams with no versioned or long-term branch.
      Podman and Docker ship; no orchestrator does.
    notes: >-
      The three streams flow next to testing to stable. A system following a
      stream updates automatically when a new release rolls out on it. There is
      no maintenance branch and no per-release end-of-life, because there are no
      releases to support in that sense.

      It became an official Fedora Edition for Fedora 37, by a recorded
      engineering committee vote, with separate Fedora Council trademark
      approval.
    evidence: DOCUMENTED
    sources:
      - url: https://docs.fedoraproject.org/en-US/fedora-coreos/update-streams/
        type: official-docs
        title: Update streams
        retrieved: "2026-09-22"
        quote: >-
          When following a stream, a system is updated automatically when a new
          release is rolled out on that stream.
      - url: https://pagure.io/fesco/issue/2823
        type: governance-doc
        title: "FESCo #2823, make Fedora CoreOS an Edition"
        retrieved: "2026-09-22"
        quote: "Closed: Accepted Jul 19, 2022 ... the vote is APPROVED (+5,0,-0)"
      - url: https://docs.fedoraproject.org/en-US/bootc/fedora-coreos/
        type: official-docs
        title: Fedora bootc documentation, Fedora CoreOS versus Fedora bootc
        retrieved: "2026-09-22"
        quote: >-
          Fedora CoreOS (much like Fedora Atomic Desktops) generally emphasizes
          users configuring an image pre-built by Fedora

  d02_immutability:
    normalized:
      read_only:
        - /
        - /usr
        - /boot
      writable_and_persistent:
        - /etc
        - /var
      integrity_mechanism:
        - ostree-immutable-checkout
        - read-only-mount
      composefs: "default since Fedora 41"
      dm_verity: "none"
      etc_merge: three-way
      retained_deployments: 2
      survives_upgrade:
        - "/var, untouched by upgrades and rollbacks"
        - "/etc, through a three-way merge that preserves local modifications"
      read_only_mechanism: "OSTree-managed, with / mounted through composefs since Fedora 41, which makes it a truly read-only filesystem; file contents are not verified at runtime: the Fedora change calls composefs the first step toward runtime verification"
      configurable_paths:
        value: 'yes'
        evidence: DOCUMENTED
        how: 'Only to add storage: mount a separate partition, disk or network filesystem at /var or a subdirectory of it, with a Butane config and Ignition. The writable set stays /etc and /var.'
        sources:
          - url: https://docs.fedoraproject.org/en-US/fedora-coreos/storage/
            type: official-docs
            title: 'Fedora CoreOS storage: separate /var mounts'
            retrieved: '2026-10-12'
            quote: You can of course mount only a subset of /var into a separate partition.
      mounts_sources:
        - url: https://docs.fedoraproject.org/en-US/fedora-coreos/storage/
          type: official-docs
          title: 'Fedora CoreOS storage: immutable root'
          retrieved: '2026-10-12'
          quote: As OSTree is used to manage all files belonging to the operating system, the / and /usr mountpoints are not writable.
        - url: https://docs.fedoraproject.org/en-US/fedora-coreos/storage/
          type: official-docs
          title: 'Fedora CoreOS storage: writable locations'
          retrieved: '2026-10-12'
          quote: The only supported writable locations are /etc and /var.
        - url: https://fedoraproject.org/wiki/Changes/ComposefsAtomicCoreOSIoT
          type: design-doc
          title: 'Fedora Change: composefs by default for CoreOS and IoT (targeted release Fedora Linux 41)'
          retrieved: '2026-10-19'
          quote: This makes the root mount of the system ( / ) a truly read only filesystem, increasing the system integrity and robustness. This is the first step toward a full at runtime verification of filesystem integrity.
    summary: >-
      OSTree owns every file in the operating system, so / and /usr are not
      writable, and neither is /boot. The documented statement is unusually
      crisp: the only supported writable locations are /etc and /var.
    notes: >-
      Traditional state directories such as /home and /srv are symlinks into
      /var. Adding a top-level directory is disallowed by the immutable
      attribute.

      /etc is the interesting case and its handling is better than a blanket
      read-only mount for operators: OSTree performs a three-way merge on
      upgrade, applying the difference between the previous and current default
      /etc onto the new one, so locally modified files are retained.

      Composefs has been enabled by default since Fedora 41, which the change
      proposal says makes the root mount "a truly read only filesystem". The
      same proposal is honest about its limit, describing it as "the first step
      toward a full at runtime verification of filesystem integrity". It is not
      dm-verity, and signature-backed runtime integrity remains an open design
      question in the project's own tracker, open since 2022.

      Two deployments are retained by default. Individual deployments can be
      pinned against garbage collection, but that mechanism is documented only
      upstream in OSTree and not in the Fedora CoreOS documentation at all.
    evidence: DOCUMENTED
    sources:
      - url: https://docs.fedoraproject.org/en-US/fedora-coreos/storage/
        type: official-docs
        title: Storage and mounted filesystems
        retrieved: "2026-09-22"
        quote: >-
          The only supported writable locations are /etc and /var. ... All data
          must be kept under /var and will not be touched by system upgrades.
      - url: https://fedoraproject.org/wiki/Changes/ComposefsAtomicCoreOSIoT
        type: design-doc
        title: "Fedora Change: composefs by default"
        retrieved: "2026-09-22"
        quote: >-
          This is the first step toward a full at runtime verification of
          filesystem integrity.
      - url: https://github.com/coreos/fedora-coreos-tracker/issues/1252
        type: source-repo
        title: fs-verity signature checking design question
        retrieved: "2026-09-22"
        quote: >-
          the primary question is: are we interested in leveraging any of these
          technologies to strengthen our security?
    unknowns:
      - "Deployment pinning is undocumented in the project's own documentation, appearing only in upstream OSTree material."

  d03_artifact:
    normalized:
      primary_artifact: oci-image
      legacy_artifact: ostree-commit
      oci_registry_distribution: true
      content_addressable: true
      mirrorable: true
      signed: gpg
      signature_policy: "GPG signature required for the OS update image only; the policy is bind-mounted into the rpm-ostree daemon, not applied host-wide"
      air_gapped_capable: unknown
    summary: >-
      Since 2025 the update payload is an OCI image on a public registry,
      replacing the OSTree HTTP transport. It is GPG-signed, and the OS update
      path runs under a shipped container policy that requires a signature
      under Fedora signing keys for the project's own repository.
    notes: >-
      The transition landed per stream through 2025 and is complete on all three.
      The signature policy needs stating precisely. The shipped policy file sets
      a top-level default of reject, then sets the docker transport default to
      insecureAcceptAnything and requires a GPG signature only for
      quay.io/fedora/fedora-coreos. It is bind-mounted into the rpm-ostree
      daemon's service, so it governs OS image pulls and not the host-wide
      container policy that podman reads. Within that scope it is stricter than
      the generic default in this space: bootc's own documentation notes that
      the upstream default policy does not require signatures, and recommends
      operators enable them.

      Signing key rotation is handled through documented update barriers, so a
      machine cannot skip past a key change.

      Four architectures ship, with a wide platform matrix: 21 platform artifact
      sets on x86_64, 10 on aarch64, 4 on ppc64le and 5 on s390x, including live
      ISO and PXE artifacts as first-class published assets.

      No Fedora CoreOS specific air-gap procedure was found. Generic offline
      update by carrying an OCI directory is documented on the bootc side.
    evidence: DOCUMENTED
    sources:
      - url: https://fedoraproject.org/wiki/Changes/CoreOSOstree2OCIUpdates
        type: design-doc
        title: "Fedora Change: move updates from OSTree to OCI"
        retrieved: "2026-09-22"
        quote: >-
          the hosts will pull updates from the Quay.io container registry
          instead ... We will notably keep using rpm-ostree for updates (and not
          yet bootc).
      - url: https://docs.fedoraproject.org/en-US/fedora-coreos/update-barrier-signing-keys/
        type: official-docs
        title: Update barriers and signing keys
        retrieved: "2026-09-22"
        quote: >-
          All binary artifacts, ostree commits, and OS images belonging to Fedora
          and Fedora CoreOS (FCOS) are signed via GPG.
      - url: https://builds.coreos.fedoraproject.org/streams/stable.json
        type: release-notes
        title: Stable stream artifact metadata
        retrieved: "2026-09-22"
      - url: https://github.com/coreos/fedora-coreos-config/tree/testing-devel/overlay.d/17fcos-container-signing
        type: source-repo
        title: Shipped container signature policy for OS image pulls
        retrieved: "2026-09-22"
        quote: >-
          Bind mount in our containers policy.json that configures how to do
          signature verification for quay.io/fedora/fedora-coreos
    unknowns:
      - "No Fedora CoreOS specific air-gapped procedure is documented."

