  d12_fleet_management:
    normalized:
      core_project:
        - "Automatic updates on by default, with phased rollout orchestrated by the update graph"
        - "Per-node rollout wariness, so a machine can ask to be early or late in a rollout"
        - "Weekly maintenance windows"
        - "Cluster-wide reboot coordination through a documented HTTP lock protocol; the OS ships the client side only"
        - "Prometheus-format metrics from the update agent"
