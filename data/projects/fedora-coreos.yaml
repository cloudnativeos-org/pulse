  d10_security:
    normalized:
      boot_trust_chain:
        level: 1
        how: platform-provided
        note: Secure Boot through the signed shim, when the firmware enforces it. Binding a disk key to PCR
          7 is opt-in. No measured-boot chain is documented
        evidence: DOCUMENTED
        sources:
        - url: https://raw.githubusercontent.com/coreos/fedora-coreos-docs/main/modules/ROOT/pages/storage.adoc
          type: official-docs
          title: Fedora CoreOS storage docs
          retrieved: '2026-10-06'
          quote: Binding for PCR 7 which corresponds to the UEFI Boot Component used to track the Secure Boot
            certificate from memory
      secure_boot: available
      secure_boot_ca: "shim signed through the Microsoft UEFI CA"
      measured_boot: "none documented"
      tpm: "TPM2 pinning for LUKS"
      integrity: ostree-immutable-checkout
      composefs: "default since Fedora 41"
      dm_verity: "none"
      disk_encryption: "LUKS2, opt-in, with TPM2 and network-bound pins"
      artifact_verification: gpg
      sbom: unknown
      provenance: "build provenance work in progress, partially complete"
      fips: "none"
      mandatory_access_control: "SELinux enforcing, disabling not supported"
      bootloader_updates: automatic
      default_on:
        - selinux-enforcing
        - signature-verified-updates
        - automatic-bootloader-updates
        - auditd
        - ssh-password-authentication-disabled
      opt_in:
        - disk-encryption
    summary: >-
      SELinux is enforcing and the project states plainly that disabling it is
      not supported. Secure Boot works on stock firmware, because the shim comes
      through Fedora and is signed via the Microsoft UEFI CA.
    notes: >-
      The Secure Boot position is the most operator-friendly in this edition and
      deserves saying: no key enrolment is required, because the shim chain is
      signed by a certificate authority already present in firmware. Bootloader
      updates happen automatically by default, which several projects here do not
      do.

      Integrity has a real gap and the project documents it as one. Composefs
      gives a genuinely read-only root but nothing verifies the composefs image
      against a signature at runtime. The tracker issue asking whether to leverage
      fs-verity signatures has been open since 2022.

      FIPS is not supported and there is no documentation page. A maintainer's
      comment in the open issue is candid about why it would be of limited value:
      adding FIPS support does not make the system FIPS certified.

      Disk encryption is opt-in. Root can be converted to LUKS2 on first boot,
      with TPM2 and network-bound pins and Shamir threshold combinations, needing
      at least 4 GiB of RAM to reprovision.

      Software bill of materials and build provenance work is in progress through
      a build system migration and is only partially complete. No per-release
      published location was found.
    evidence: DOCUMENTED
    sources:
