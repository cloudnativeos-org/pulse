tradeoffs:
  buys:
    - "Secure Boot works on stock firmware with no key enrolment, because the shim chain is signed through a certificate authority already present in firmware."
    - "Automatic bootloader updates by default, so shim and GRUB do not drift behind the OS."
    - "A three-way merge on /etc, so local configuration survives an upgrade rather than being discarded or requiring a rebuild."
    - "Phased rollout, per-node rollout wariness and weekly maintenance windows, all in the open-source node agent rather than in a product."
    - "A self-hostable update graph server, and the option to bypass the graph entirely and rebase by hand."
    - "A shipped signature policy for the OS update image, requiring a GPG signature under Fedora keys for the project's own repository before rpm-ostree will apply it."
    - "Ships with SELinux enforcing, and disabling it is explicitly unsupported. Audit logging cannot be stopped."
    - "Community governance with a published charter, documented voting rules and weekly public meetings."
    - "Four architectures, and live ISO and PXE as first-class published artifacts."
  costs:
    - "No automatic rollback. Rollback is manual and requires console access, and the framework that would automate it is not shipped. The design question has been open since 2018."
    - "No factory reset, with the open request itself naming the gap for single-node bare metal where reprovisioning is impractical."
    - "No documented in-band remote recovery. Every recovery path needs console access."
    - "Composefs gives a read-only root but nothing verifies it against a signature at runtime. Signature-backed integrity has been an open question since 2022."
    - "No FIPS support and no documentation page, with a maintainer noting that adding it would not confer certification anyway."
    - "No supported path for GPU drivers. The only work is a work-in-progress repository whose README says it is not ready for production use."
    - "No long-term support branch and no per-release end-of-life."
maintainers_fact:
  text: "Maintainer affiliation is not published."
  evidence: DOCUMENTED
  sources:
