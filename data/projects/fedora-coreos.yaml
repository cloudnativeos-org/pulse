  d13_governance:
    normalized:
      license: "component-dependent; Apache-2.0 for most tooling, MIT for the OS configuration, mixed for rpm-ostree"
      open_source: true
      open_governance: documented
      vendor_neutral_ownership: community-sponsor-trademark
      foundation: "none; Fedora CoreOS is an official Fedora Edition (since Fedora 37, 2022), and the Fedora trademarks are held by Red Hat"
      trademark_holder: "Red Hat, Inc., protected on behalf of the Fedora community with Council oversight"
      primary_commercial_sponsor: "Red Hat"
      contribution_diversity:
        method: >-
          No maintainers file and no employer-labelled membership record exists
          for the working group. The only membership artifact is a meeting ping
          list of 23 handles with no roles or affiliations. Affiliation is
          therefore not established and is not inferred.
        value: "unknown"
    summary: >-
      Governed by a Fedora working group with a published product requirements
      document, documented voting rules and weekly public meetings. Trademark is
      held by Red Hat and protected on behalf of the community with Fedora
      Council oversight.
    notes: >-
      The four governance properties read as follows. Open source: yes, across a
      set of components with different licences. Open governance: documented, and
      genuinely so, with quorum and majority rules, a public weekly meeting and a
      product requirements document that functions as a charter. Vendor-neutral
      ownership: a community project whose sponsor holds the trademark. Red Hat
      is the trademark owner, and the Fedora Council oversees the trademark
      guidelines. Contribution diversity: unknown,
      because no affiliation data is published.

      That last point is the honest one. There is no maintainers file, unlike the
      bootc project which publishes one. The degree of single-company employment
      among the working group is therefore not establishable from primary
      sources, and this profile does not guess at it.
    evidence: DOCUMENTED
    sources:
