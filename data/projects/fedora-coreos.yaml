        title: Fedora Secure Boot feature page (Fedora 18, 2013)
        retrieved: "2026-09-22"
        quote: >-
          Under the first scheme, Fedora will utilize the signing service hosted
          by Microsoft.
      - url: https://github.com/coreos/fedora-coreos-tracker/issues/302
        type: source-repo
        title: FIPS mode tracker, open since 2019
        retrieved: "2026-09-22"
        quote: >-
          Note that adding FIPS support to FCOS does not make FCOS (or more
          precisely the openssl build inside) FIPS certified.
      - url: https://docs.fedoraproject.org/en-US/fedora-coreos/storage/
        type: official-docs
        title: Storage, LUKS and Secure Boot
        retrieved: "2026-09-22"
        quote: >-
