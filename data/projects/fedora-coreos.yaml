        - name: airlock
          repo: https://github.com/coreos/airlock
          license: Apache-2.0
          org: coreos
          note: "FleetLock lock manager backed by etcd3, named in the Zincati documentation. Published under the same GitHub organisation as Zincati, not shipped in the OS. Repository last pushed January 2024."
        - name: greenboot-rs
          repo: https://github.com/fedora-iot/greenboot-rs
          license: BSD-3-Clause
          org: fedora-iot
          note: "Health-check and automatic-rollback framework. Rust rewrite that replaced the shell-based fedora-iot/greenboot repository (LGPL-2.1, deprecated 2026-02-10, maintenance mode). Not shipped in Fedora CoreOS; its README documents adding the package to a derived container image."
      commercial: []
      cluster_api:
        os_specific_provider: "none"
        maintainer: not-applicable
        upstream_provider_list: "not listed under any provider type"
        provisions: not-applicable
        bootstrap_target: "none that works. The kubeadm bootstrap provider can emit Ignition, but its implementation is Ignition v2 and this system requires v3."
        bootstrap_maturity: "the Ignition path is alpha behind a feature gate, introduced at Cluster API v1.1 and still alpha at v1.14.2"
        image_builder_target: "none"
        blocking_issue: "fedora-coreos-tracker#2010, open since 2025-08-20, records that first boot fails because Ignition rejects the unsupported version"
    summary: >-
      An unusually capable open-source fleet update story for a community
      project: phased rollout, per-node wariness, maintenance windows and reboot
      coordination all in shipped components, with a self-hostable graph server.
      No fleet inventory or control plane.
    notes: >-
      Two honest limits. The OS ships the lock protocol client only, so
      cluster-wide reboot coordination requires a separately deployed lock
      manager; the Zincati documentation names airlock, under the same GitHub
      organisation, plus one inside Typhoon and one on DynamoDB. And there is no
      inventory, no dashboard and no desired-state controller.

      No commercial product is listed against this entry, and that is deliberate.
      The commercially supported systems in this family, Red Hat CoreOS and image
      mode for RHEL, are separate products. Attributing their capabilities here
      would be exactly the error the three-bucket split exists to prevent.

      The Cluster API answer is a documented failure rather than a documented
      absence, and the distinction is worth keeping.

      No provider exists for this system and none is listed. The mechanism that
      should apply is the kubeadm bootstrap provider's Ignition support, since
      this system is configured by Ignition. It does not work. The upstream
      documentation states that the implementation uses Ignition v2 and was
      tested with one other distribution only. This system requires Ignition v3,
      so a node bootstrapped this way fails at first boot when Ignition rejects
      the version. The project's own issue tracker records exactly that, in
      issue 2010, open since August 2025.

      Ignition v3 support was requested twice upstream and implemented neither
      time. One request was closed as not planned, one pull request was closed
      unmerged, and a third request, opened specifically for this system, was
      closed with the work folded into a node-bootstrapping working group. The
      feature gate itself has been alpha since Cluster API v1.1 in 2021 and its
      tracking issue still records beta and stable as to be determined.

      The vendor's own Cluster API work does not close this. Its operator
      manages Cluster API infrastructure providers on its commercial Kubernetes
      platform and is documented as running on technology-preview clusters only.
      The Ignition configuration those nodes receive comes from that platform's
      machine-config operator, not from a Cluster API bootstrap provider, so it
      is not a bootstrap-provider story for this operating system.
    evidence: DOCUMENTED
    sources:
