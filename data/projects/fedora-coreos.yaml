        - url: https://docs.fedoraproject.org/en-US/fedora-coreos/faq/
          type: official-docs
          title: 'Fedora CoreOS docs: FAQ'
          retrieved: '2026-10-12'
          quote: but we strongly discourage its use.
      - kind: derive-image
        how: Fedora CoreOS is an OCI image that can be the base for bootable derivative containers. The docs send heavy customization to Fedora bootc.
        evidence: DOCUMENTED
        sources:
        - url: https://github.com/coreos/layering-examples/blob/dc59c03692915de9c3046bb3b51a6a8c1bed8283/README.md
          type: source-repo
          title: coreos/layering-examples README
          retrieved: '2026-10-12'
          quote: Fedora CoreOS is now also an OCI container image that can be used as a base image to create
        - url: https://docs.fedoraproject.org/en-US/fedora-coreos/faq/
          type: official-docs
          title: 'Fedora CoreOS docs: FAQ'
          retrieved: '2026-10-12'
          quote: it might make more sense to instead build on top of Fedora Bootc
    summary: >-
      Containers are the recommended path and the documentation says so
      repeatedly. Package layering exists for the cases containers cannot cover,
      such as drivers and VPN software, and the project strongly discourages it.
    notes: >-
      The project's own words are worth recording because few projects are this
      direct about steering users away from a feature they ship: layering "will
      continue to exist for use in debugging a Fedora CoreOS machine, but we
      strongly discourage its use".

      Layering has real friction beyond the discouragement. There is no native
      first-boot directive for it, so it requires a systemd unit invoking the
      command, and it needs a reboot.

      For heavier customization the documented advice is to leave: the project's
      own FAQ says that beyond what OS extensions provide, "it might make more
      sense to instead build on top of Fedora Bootc directly". That is a clear
      and honest boundary, and it is also why the two entries in this dataset
      make sense.

      Kernel modules have no documentation page. The documented practice comes
      from maintainer guidance in the tracker, a July 2024 comment pointing at a
      separate layering examples repository. The kernel module examples there
      were last changed in 2023, and the repository as a whole in June 2024. GPU
      drivers have no supported path at all; the only work is an explicitly
      work-in-progress repository whose own README says it is not ready for
      production and notes that its modules break Secure Boot because they are
      not signed by Fedora's key.
    evidence: DOCUMENTED
    sources:
