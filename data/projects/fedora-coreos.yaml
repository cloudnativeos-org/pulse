            type: official-docs
            title: "rpm-ostree override replace"
            retrieved: "2026-10-06"
      mechanism:
        - ostree-deployment
      scope: os-tree-etc-merged
      scope_sources:
        - url: https://github.com/coreos/fedora-coreos-docs/blob/main/modules/ROOT/pages/auto-updates.adoc
          type: official-docs
          title: Fedora CoreOS auto-updates
          retrieved: '2026-10-06'
          quote: Zincati continually checks for OS updates and applies them via rpm-ostree.
        - url: https://ostreedev.github.io/ostree/atomic-upgrades/
          type: official-docs
          title: OSTree atomic upgrades, /etc merge
          retrieved: '2026-10-06'
          quote: a 3-way merge is performed between the (by default) currently booted deployment's `/etc`, its default configuration, and the new deployment
      initiator: "node agent polling an update graph"
      requires_kubernetes: false
      requires_vendor_infrastructure: false
      self_hostable_update_server: true
      self_hostable_update_source: "Your own Cincinnati update graph server"
      artifact_verification: gpg-signature
      artifact_verification_scope: "OS update image only: the shipped policy requires a GPG signature for quay.io/fedora/fedora-coreos pulls made by the rpm-ostree daemon. Other registry pulls are not checked by it. See d03 signature_policy."
      update_signature_check:
        how: default-on
        how_sources:
          - url: https://github.com/coreos/fedora-coreos-config/blob/1590d19721f2319b580a92c82520f7db5be9410e/overlay.d/17fcos-container-signing/usr/lib/systemd/system/rpm-ostreed.service.d/coreos-containers-policy.conf
            type: source-repo
            title: Fedora CoreOS config, rpm-ostreed drop-in for the shipped signature policy
            retrieved: '2026-10-19'
            quote: "# Point rpm-ostree at our containers policy.json that configures # container image signature verification"
        checks: the shipped policy requires a GPG signature on the OS update image, and rpm-ostree applies it to that image only
        sources:
          - url: https://github.com/coreos/fedora-coreos-config/blob/1590d19721f2319b580a92c82520f7db5be9410e/overlay.d/17fcos-container-signing/usr/lib/coreos/coreos-containers-policy.json
            type: source-repo
            title: Fedora CoreOS config, shipped containers policy
            retrieved: '2026-10-19'
            quote: '"quay.io/fedora/fedora-coreos": [ { "type": "signedBy", "keyType": "GPGKeys",'
        evidence: DOCUMENTED
      auto_update_default: true
      phased_rollout: true
      reboot_coordination: "FleetLock protocol; the OS ships the client, the lock manager is a separate deployment"
    summary: >-
      Automatic updates are on by default. An agent polls an update graph, stages
      a new OSTree deployment without touching the running filesystem, and
      reboots according to a configurable strategy.
    notes: >-
      This is the only project in the edition where phased rollout, per-node
      rollout wariness and weekly maintenance windows all ship in the
      open-source node agent rather than in a fleet product, alongside
      Bottlerocket's waves.

      Three finalization strategies are documented. Immediate is the default.
      A fleet-lock strategy coordinates cluster-wide reboots through an HTTP
      protocol, and here is the honest limit: the OS ships the client only, and
      the lock manager is an external component the operator deploys. The
      Zincati documentation names three implementations: airlock, an
      etcd3-backed server published under the same coreos GitHub organisation as
      Zincati, whose repository was last pushed in January 2024; a
      Kubernetes-based reboot manager inside Typhoon; and a serverless DynamoDB
      implementation. A periodic strategy gives weekly maintenance windows.

      The update graph server is Fedora-hosted by default and is self-hostable,
      with a published implementation, or can be bypassed entirely by disabling
      the agent and rebasing by hand. A migration to an OCI-native graph that
      would remove the server dependency is open and in progress.

      Downgrades are blocked by default and must be explicitly allowed.

      Nothing in the update path involves Kubernetes.
    evidence: DOCUMENTED
    sources:
      - url: https://docs.fedoraproject.org/en-US/fedora-coreos/auto-updates/
        type: official-docs
        title: Auto updates
        retrieved: "2026-09-22"
        quote: >-
          rpm-ostree handles multiple on-disk OSTree deployments and can switch
          between them at boot-time [and] Zincati continually checks for OS
          updates and applies them via rpm-ostree
      - url: https://coreos.github.io/zincati/usage/updates-strategy/
        type: official-docs
        title: Zincati update strategies
        retrieved: "2026-09-22"
        quote: >-
          Zincati does not mandate any specific lock-manager or database, but
          instead it uses a simple HTTP-based protocol modeling a distributed
          counting semaphore with recursive locking, called FleetLock
      - url: https://coreos.github.io/zincati/usage/auto-updates/
        type: official-docs
        title: Zincati auto-updates, phased rollouts and downgrades
        retrieved: "2026-09-22"
        quote: >-
          By default, this ordering is also used to prevent automatic downgrades.
      - url: https://github.com/coreos/fedora-coreos-cincinnati
        type: source-repo
        title: Self-hostable update graph server
        retrieved: "2026-09-22"
        quote: >-
          This service provides an implementation of the Cincinnati protocol,
          which is consumed by on-host update agents (like Zincati).
      - url: https://github.com/coreos/fedora-coreos-tracker/issues/1872
        type: source-repo
        title: Migration to an OCI-native update graph
        retrieved: "2026-09-22"
        quote: >-
          However, the requirement to host a Cincinnati server is an huge
          impediment.

  d05_rollback_recovery:
    normalized:
      rollback_to_previous: available
      rollback_requires_console: true
      automatic_rollback_on_boot_failure: "none"
      retained_versions: 2
      recovery_environment: live-media
      factory_reset: "none"
      network_independent_recovery: "yes"
      remote_recovery: unknown
    summary: >-
      Rollback works by reordering the two retained deployments and is
      documented as a manual operation requiring human intervention and console
      access. There is no automatic rollback in the shipped system.
    notes: >-
      This is the clearest contrast in the edition with the A/B systems. Rollback
      itself is cheap and local, because both deployments are already on disk and
      no network is involved. But nothing detects a bad boot and reverts on its
      own.

      The health-check framework that would provide that, greenboot, is not part
      of Fedora CoreOS. Its upstream moved to a Rust rewrite, greenboot-rs, in
      February 2026, and the shell-based repository is in maintenance mode. The
      greenboot-rs README documents adding it to Fedora CoreOS by building a
      derived container image with the package installed. The project's design
      question about automatic rollback has been open in its tracker since 2018.
      Recorded as documented absence, not as unknown, because the docs describe
      rollback as manual and the tracker issue names the gap.

      A practical caveat the documentation gives: the update agent keeps looking
      for updates after a rollback and will upgrade again unless it is also
      stopped.

      There is no factory reset. The open feature request from 2020 states the
      problem precisely: reprovisioning is the intended answer, but on
      single-node bare metal without external infrastructure a manual reinstall
      is impractical.

      No in-band remote recovery mechanism is documented. Every documented path
      requires console access, which for a remote machine means lights-out
      management.
    evidence: DOCUMENTED
    sources:
      - url: https://docs.fedoraproject.org/en-US/fedora-coreos/manual-rollbacks/
        type: official-docs
        title: Manual rollbacks
        retrieved: "2026-09-22"
        quote: >-
          This is a manual operation that requires human intervention and console
          access.
      - url: https://github.com/coreos/fedora-coreos-tracker/issues/47
        type: source-repo
        title: Automatic rollback design question, open since 2018
        retrieved: "2026-09-22"
        quote: >-
          Ostree currently does not support automatic rollback
      - url: https://github.com/coreos/fedora-coreos-tracker/issues/399
        type: source-repo
        title: Factory reset feature request, open since 2020
        retrieved: "2026-09-22"
        quote: >-
          But on single-node bare metal setups without external infrastructure,
          manual reinstall is impractical.
      - url: https://github.com/fedora-iot/greenboot-rs
        type: source-repo
        title: greenboot-rs, documented as an addition to a derived image
        retrieved: "2026-09-22"
        quote: >-
          In order to get a full Greenboot installation on any bootc system like
          Fedora Silverblue, Fedora IoT or Fedora CoreOS, make container with:
    unknowns:
      - "No documented in-band remote recovery mechanism."

