  d14_maturity:
    normalized:
      first_release: "2020-01-17"
      current_version: "44.20260829.3.1"
      current_version_date: "2026-09-15"
      release_cadence: "every two weeks per stream, with asynchronous releases for security fixes"
      observed_intervals: "median 14 days, mean 13.3 days across 184 stable releases (2020-01-17 general availability to the 2026-09-15 rollout); rollout commit timestamps in the fedora-coreos-streams repository give a median of 13.9 days"
      support_model: rolling-no-lts
      support_window: "none; streams update continuously and no release has an end-of-life"
      commercial_support: unknown
    summary: >-
      Six years past general availability, 184 stable releases, and a documented
      two-week cadence that the measured intervals match almost exactly. There is
      no long-term support branch and no per-release end-of-life, by design.
    notes: >-
      The rolling model is the whole structure rather than an absence of one:
      three streams that update continuously, with no maintenance branches. The
      project is explicit that it provides best-effort stability and may
      occasionally include regressions or breaking changes for some workloads.

      That is a genuine fit question rather than a defect. For a team that needs
      to name a supported version to an auditor, there is nothing to name. For a
      team that wants current kernels and packages without a migration project
      every few years, it is the point.

      No commercial support offering for Fedora CoreOS itself was found, and no
      primary source states that there is none, so the value is unknown rather
      than none. The FAQ describes RHEL CoreOS as the downstream that is
      "released and life-cycled in tandem with" OpenShift; it says nothing about
      support for Fedora CoreOS.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/coreos/fedora-coreos-tracker/blob/main/RELEASES.md
        type: governance-doc
        title: Release process
        retrieved: "2026-09-22"
