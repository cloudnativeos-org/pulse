schema_version: "1.0.0"
edition: "2026"
id: bootc
name: bootc
homepage: https://bootc.dev/
repository: https://github.com/bootc-dev/bootc
collected_at: "2026-09-15"

entry_kind:
  - mechanism

category_fit:
  comparable: partial
  note: >-
    bootc is a tool, not a distribution. It implements transactional in-place
    operating system updates from OCI container images, and distributions and
    base image sets consume it. It ships no operating system, no hardware
    support and no release of its own beyond the tool.

    It is a separate entry from Fedora CoreOS precisely because comparing a
    mechanism's hardware support or release cadence against a distribution's is
    a category error. Section 3 of this edition's methodology explains the
    reasoning, and the same entry_kind field is applied to Kairos, NixOS and
    Unikraft on identical terms.

    Four dimensions do not apply to a mechanism. They are listed below and each
    carries a note explaining why, rather than being scored as absences.
  dimensions_not_applicable:
    - d01_os_model
    - d08_hardware_platform
    - d09_provisioning
    - d11_operations_debugging

self_description:
  text: >-
    Transactional, in-place operating system updates using OCI/Docker container
    images. bootc is the key component in a broader mission of bootable
    containers.
  source:
    url: https://bootc.dev/bootc/
    type: official-docs
    title: bootc introduction
    retrieved: "2026-09-22"

version_observed:
  version: "v1.16.13"
  released: "2026-09-15"
  channel: stable
  method: >-
    Latest GitHub release on bootc-dev/bootc. Note the repository moved from the
    containers organization, which now redirects.
  source:
    url: https://github.com/bootc-dev/bootc/releases
    type: release-notes
    title: bootc releases
    retrieved: "2026-09-22"

taxonomy:
  workload_scope: general-purpose-host
  construction_model:
    - framework
  root_state_substrate:
    - bootc-container-deployment
    - ostree-deployment
  notes: >-
    The taxonomy axes describe what bootc enables in the systems that adopt it
    rather than a machine bootc itself ships. Workload scope is
    general-purpose-host because bootc is deliberately distribution-independent
    and imposes no workload model. The substrate is a bootc container deployment
    backed by OSTree.

    The project's own statement of its relationship to the older mechanism is
    precise: "bootc uses OSTree as a backing model, and so does rpm-ostree.
    Hence, when using a container source, rpm-ostree upgrade and bootc upgrade
    are effectively equivalent."

dimensions:
  d01_os_model:
    normalized:
      entry_kind: mechanism
      ships_an_os: "not-applicable"
    summary: >-
      A command-line tool and library, written in Rust, that deploys and updates
      a system from an OCI container image. It is not an operating system and
      does not ship one.
    notes: >-
      This dimension is marked not-applicable because the question it asks, what
      kind of operating system is this, has no answer for a mechanism. What bootc
      has instead is a design stance, stated by the project: "The bootc project
      currently takes a relatively hard stance that system state should come from
      a container image." It coexists with the older mechanism rather than
      replacing it: "It will be supported to use both bootc and rpm-ostree
      together; they are not exclusive."

      Adopters span multiple distributions and organizations, which is the
      evidence for the distribution-independence claim: the adopters file lists
      HeliumOS, the AlmaLinux Atomic special interest group, CIQ and Rocky Linux,
      Universal Blue, ALT Atomic and others, alongside Red Hat's own products.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/bootc-dev/bootc/blob/main/docs/src/bootc-relationships.7.md
        type: official-docs
        title: Relationship to other projects
        retrieved: "2026-10-19"
        quote: >-
          bootc uses OSTree as a backing model, and so does rpm-ostree. Hence,
          when using a container source, `rpm-ostree upgrade` and `bootc
          upgrade` are effectively equivalent; you can use either command.
      - url: https://github.com/bootc-dev/bootc/blob/main/ADOPTERS.md
        type: source-repo
        title: bootc adopters
        retrieved: "2026-09-22"

  d02_immutability:
    normalized:
      model: ostree-deployment-backed
      integrity_mechanism:
        - ostree-immutable-checkout
        - composefs
      fsverity: "off by default on the default ostree backend (with its composefs mount); on by default, where available, on the separate native composefs backend"
      etc_merge: three-way
      read_only:
        - /
        - /usr
        - /opt
      read_only_mechanism: "default ostree backend with composefs enabled in prepare-root.conf, as the docs strongly recommend, which makes the whole of / read-only; fs-verity is off by default on this backend, so file contents are not checked at runtime; the separate native composefs backend turns fs-verity on by default"
      writable_and_persistent:
        - /etc (three-way merge on upgrade)
        - /var
      configurable_paths:
        value: 'yes'
        evidence: DOCUMENTED
        how: Opt in to a transient root or a transient /etc in prepare-root.conf. Make /var or its subdirectories separate mounts. Mount other filesystems with /etc/fstab or mount units.
        sources:
          - url: https://bootc.dev/bootc/bootc-filesystem.7.html
            type: official-docs
            title: 'bootc filesystem: transient root'
            retrieved: '2026-10-12'
            quote: This feature enables a fully transient writable rootfs by default.
          - url: https://bootc.dev/bootc/bootc-filesystem.7.html
            type: official-docs
            title: 'bootc filesystem: mounting other filesystems'
            retrieved: '2026-10-12'
            quote: Mounting separate filesystems there can be done by the usual mechanisms of /etc/fstab, systemd .mount units, etc.
      mounts_sources:
        - url: https://bootc.dev/bootc/bootc-filesystem.7.html
          type: official-docs
          title: 'bootc filesystem: read-only root'
          retrieved: '2026-10-12'
          quote: This will ensure that the entire / is a read-only filesystem which is very important for achieving correct semantics.
        - url: https://bootc.dev/bootc/bootc-filesystem.7.html
          type: official-docs
          title: 'bootc filesystem: recommended ostree composefs backend'
          retrieved: '2026-10-19'
          quote: it is strongly recommended that bootc consumers use the ostree composefs backend; to do this, ensure that you have a /usr/lib/ostree/prepare-root.conf that contains at least [composefs] enabled = true
        - url: https://bootc.dev/bootc/bootc-security.7.html
          type: official-docs
          title: 'bootc security: fs-verity by backend'
          retrieved: '2026-10-19'
          quote: The default backend is ostree (with a composefs mount), but fsverity is not enabled by default. The composefs backend enables fsverity by default if available
        - url: https://bootc.dev/bootc/bootc-composefs.7.html
          type: official-docs
          title: 'bootc composefs backend: two storage backends'
          retrieved: '2026-10-19'
          quote: bootc has two storage backends. The default is ostree, and the composefs backend uses composefs-rs instead of ostree to store and manage deployments.
        - url: https://bootc.dev/bootc/bootc-filesystem.7.html
          type: official-docs
          title: 'bootc filesystem: /opt'
          retrieved: '2026-10-12'
          quote: In the default suggested model of using composefs (per above) the /opt directory will be read-only
        - url: https://bootc.dev/bootc/bootc-filesystem.7.html
          type: official-docs
          title: 'bootc filesystem: /etc'
          retrieved: '2026-10-12'
          quote: The /etc directory contains mutable persistent state by default
        - url: https://bootc.dev/bootc/bootc-filesystem.7.html
          type: official-docs
          title: 'bootc filesystem: /var'
          retrieved: '2026-10-12'
          quote: Content in /var persists by default; it is however supported to make it or subdirectories mount points (whether network or tmpfs).
    summary: >-
      The state model comes from OSTree: an image is deployed as a new
      checkout, /etc receives a three-way merge preserving local changes, and
      /var persists untouched.
    notes: >-
      The integrity position is documented with unusual precision and is worth
      quoting because it is the clearest statement in this edition of where
      container-image integrity actually stops: "The composefs backend enables
      fsverity by default if available, but does not verify the composefs image
      (because there's nothing to verify it against by default). The composefs
      backend with sealed UKIs does verify the composefs mount."

      So integrity of the deployed tree is measurable, but binding it to a
      signature requires a sealed unified kernel image, which is an emerging
      rather than default configuration.
    evidence: DOCUMENTED
    sources:
      - url: https://bootc.dev/bootc/security.html
        type: official-docs
        title: bootc security
        retrieved: "2026-09-22"
        quote: >-
          The composefs backend enables fsverity by default if available, but
          does not verify the composefs image (because there's nothing to verify
          it against by default).
      - url: https://bootc.dev/bootc/bootc-filesystem.7.html
        type: official-docs
        title: bootc filesystem model
        retrieved: "2026-09-22"
        quote: >-
          Content in /var persists by default; it is however supported to make
          it or subdirectories mount points (whether network or tmpfs).

  d03_artifact:
    normalized:
      primary_artifact: oci-image
      oci_registry_distribution: true
      content_addressable: true
      mirrorable: true
      signed: "supported, permissive by default"
      air_gapped_capable: true
      kernel_included: true
    summary: >-
      An ordinary OCI container image, containing a Linux kernel, that is
      deployed as the bootable root. Standard registries, standard mirroring,
      standard registry configuration.
    notes: >-
      Because the artifact is an ordinary container image, the whole registry
      ecosystem applies unchanged. The documentation says so directly about
      mirroring and remapping.

      Air-gapped operation is documented concretely: copy the image into an OCI
      directory, carry it on removable media, and switch the system to that
      transport.

      The signature default is the notable finding, and the project is candid
      about it: bootc honours the host's container policy, and the upstream
      default does not require signatures for generic images. The documentation
      adds that it "is however a very good idea for bootc users to enable
      signatures for their images". This is the opposite default to the
      distribution that consumes it most visibly, Fedora CoreOS, which ships a
      reject-by-default policy.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/bootc-dev/bootc/blob/main/docs/src/bootc-registries-and-offline.7.md
        type: official-docs
        title: Registries and offline operation
        retrieved: "2026-10-19"
        quote: >-
          In a usage scenario where the operating system update is in a fully
          disconnected environment and you want to perform updates via e.g.
          inserting a USB drive, one can do this by copying the desired OS
          container image to e.g. an `oci` directory
      - url: https://bootc.dev/bootc/security.html
        type: official-docs
        title: bootc security, signature policy
        retrieved: "2026-09-22"
        quote: >-
          The upstream default at the time of this writing does not require
          signatures for generic images ... It is however a very good idea for
          bootc users to enable signatures for their images.
      - url: https://bootc.dev/bootc/
        type: official-docs
        title: bootc introduction
        retrieved: "2026-09-22"
        quote: >-
          The container image includes a Linux kernel (in e.g. /usr/lib/modules),
          which is used to boot

  d04_upgrade:
    normalized:
      fleet_upgrade:
        self_update: "The bootc-fetch-apply-updates timer is available upstream for operating systems and distributions to enable. The upstream unit runs 1 hour after boot and then every 8 hours, with up to 2 hours of random delay."
        self_update_sources:
          - url: https://github.com/bootc-dev/bootc/blob/v1.16.13/systemd/bootc-fetch-apply-updates.timer
            type: source-repo
            title: "bootc-fetch-apply-updates.timer, upstream unit at v1.16.13"
            retrieved: "2026-10-19"
            quote: "OnBootSec=1h ... OnUnitInactiveSec=8h ... RandomizedDelaySec=2h"
          - url: https://bootc.dev/bootc/bootc-upgrades.7.html
            type: official-docs
            title: "bootc upgrades: the upstream timer"
            retrieved: "2026-10-19"
            quote: There is also an opinionated bootc-fetch-apply-updates.timer and corresponding service available in upstream for operating systems and distributions to enable.
        paths:
          - kind: operator
            name: "bootc-operator"
            license: "Apache-2.0"
            class: open-source
            reconciliation: in-place
            status: "pre-release"
            filter: true
            note: "Version v0.1.1. The README says the project is in early development."
            evidence: DOCUMENTED
            sources:
              - url: https://github.com/bootc-dev/bootc-operator
                title: "bootc-operator README"
                retrieved: "2026-10-06"
                quote: >-
                  This project is in early development and not yet fully functional. APIs may change.
          - kind: fleet-server
            name: "Flight Control"
            license: "Apache-2.0"
            class: open-source
            reconciliation: in-place
            filter: true
            note: "A fleet service that rolls out a device specification to every device in a fleet."
            evidence: DOCUMENTED
            sources:
              - url: https://github.com/flightctl/flightctl
                title: "flightctl repository"
                retrieved: "2026-10-06"
                quote: >-
                  The Flight Control service would then roll out this specification to all devices in the fleet
      version_identity:
        identifier: "Image digest reported in host status (imageDigest)"
        condition: "No client-side package layering."
        evidence: DOCUMENTED
        sources:
          - url: https://github.com/bootc-dev/bootc/blob/7702842/docs/src/host-v1.schema.json
            type: source-code
            title: "bootc host status schema"
            retrieved: "2026-10-06"
            quote: >-
              The digest of the fetched image (e.g. sha256:a0...);
          - url: https://github.com/bootc-dev/bootc/blob/7702842/docs/src/bootc-relationships.7.md
            type: official-docs
            title: "bootc relationships"
            retrieved: "2026-10-06"
            quote: >-
              as soon as you mutate the system in this way, `bootc upgrade` will error out
      mechanism:
        - bootc-container-deployment
      scope: os-tree-etc-merged
      scope_note: /etc is merged three ways on upgrade, unless etc.transient is set; one /var is shared.
      scope_sources:
        - url: https://github.com/bootc-dev/bootc/blob/7702842/docs/src/bootc-filesystem.7.md
          type: source-repo
          title: bootc-filesystem(7), /etc
          retrieved: '2026-10-06'
          quote: inherits the OSTree semantics of performing a 3-way merge across upgrades
      style: "A/B, staged, running system unchanged by default"
      initiator: "operator command or a systemd timer"
      requires_kubernetes: false
      requires_vendor_infrastructure: false
      self_hostable_update_server: true
      self_hostable_update_source: "Any OCI registry; there is no update server"
      self_hostable_update_server_evidence: DOCUMENTED
      self_hostable_update_server_note: "There is no update server. bootc pulls the next image from any OCI registry. The docs cover private registries, registry mirrors, and an offline USB source."
      artifact_verification: "policy-based, permissive by default"
      phased_rollout: "none"
    summary: >-
      An upgrade queries the registry for a newer digest and stages it as a new
      deployment. The running system is not changed by default. Applying it is a
      separate step.
    notes: >-
      The staging split is finer-grained than most: an upgrade can download
      without applying, the staged state is inspectable, and it can be applied
      later from what was already downloaded. That is genuinely useful for
      controlling when a change lands on a fleet.

      What is absent is the orchestration around it, and the project says so.
      There is no phased rollout, no canary and no per-node wariness of its own.
      The Fedora bootc default is a plain systemd timer, and its documentation
      states the intent plainly: "By default, there is a simplistic automatic
      update timer enabled. At any nontrivial scale, it is intended that this is
      replaced with something more sophisticated."

      bootc's own documentation records the gap as a goal rather than a feature,
      aiming to include some of the functionality the Fedora CoreOS update agent
      already has.
    evidence: DOCUMENTED
    sources:
      - url: https://bootc.dev/bootc/upgrades.html
        type: official-docs
        title: bootc upgrades
        retrieved: "2026-09-22"
        quote: >-
          This is backed today by ostree, implementing an A/B style upgrade
          system. Changes to the base image are staged, and the running system is
          not changed by default.
      - url: https://docs.fedoraproject.org/en-US/bootc/management-generic/
        type: official-docs
        title: Fedora bootc, generic management
        retrieved: "2026-09-22"
        quote: >-
          By default, there is a simplistic automatic update timer enabled. At
          any nontrivial scale, it is intended that this is replaced with
          something more sophisticated.
      - url: https://bootc.dev/bootc/bootc-registries-and-offline.7.html
        type: official-docs
        title: "bootc registries and offline updates"
        retrieved: "2026-10-05"
        quote: >-
          It is common to use a private repository when deploying a fleet of bootc instances.
  d05_rollback_recovery:
    normalized:
      rollback_to_previous: available
      rollback_mechanism: "reorders existing deployments; does not create a new one"
      automatic_rollback_on_boot_failure: "backend dependent; documented as boot failure detection, with boot loader entry counting configurable on the OSTree backend and not configured on the composefs backend"
      retained_versions: 2
      recovery_environment: "not-applicable"
      factory_reset: "not-applicable"
    summary: >-
      Rollback reorders the bootloader entries so the previous deployment boots
      next. Boot failure detection exists on the OSTree backend and is
      documented as missing on the newer composefs backend.
    notes: >-
      Recovery environment and factory reset are marked not-applicable because
      they are properties of a distribution's install media and lifecycle, not of
      an update mechanism. A system using bootc has whatever recovery environment
      its distribution ships.

      One documented consequence of the reorder-rather-than-create design is
      worth recording because it surprises people: changes made to files in /etc
      do not carry over to the rolled-back deployment, because rollback reorders
      existing deployments rather than building new ones.

      The backend split matters for anyone evaluating this now. The OSTree
      backend has finalize and boot-complete services. The composefs backend has
      a finalize service but the documentation states it lacks the boot-complete
      equivalent, and that boot entry counting "is likely to be added in the
      future". That is an honest disclosure of an incomplete safety net on the
      newer path.

      What the page documents is detection, not reversion. The finalize and
      boot-complete services record that a staged deployment failed to
      finalize; they do not by themselves boot the previous entry. Automatic
      reversion depends on boot loader entry counting, which the page says a
      recent OSTree makes possible to configure and which the composefs
      backend does not configure. No trigger, attempt count or success
      criterion for an automatic rollback is stated in bootc's own
      documentation, and the rollback manual page itself warns that an active
      update timer may revert a manual rollback. Re-checked 2026-09-22: the
      composefs statement is unchanged on the live page and in the repository
      source, and no open issue or pull request on the boot counting topic was
      found.
    evidence: DOCUMENTED
    sources:
      - url: https://bootc.dev/bootc/boot-failure-detection.html
        type: official-docs
        title: Boot failure detection
        retrieved: "2026-09-22"
        quote: >-
          the composefs backend does not configure boot entry counting, this is
          likely to be added in the future
      - url: https://bootc.dev/bootc/man/bootc-rollback.8.html
        type: official-docs
        title: bootc rollback manual page
        retrieved: "2026-09-22"
        quote: >-
          any changes made to files in the `/etc` directory won't carry over to
          the rolled-back deployment

  d06_customization:
    normalized:
      model: containerfile-derivation
      runtime_package_install: "discouraged by the project's stance, not blocked by the tool"
      customization_points:
        - build-time
      add_software:
      - kind: derive-image
        how: A Containerfile that starts from a bootc base image. Package installs run at build time with the tools of that base distribution. The docs say systemd-sysext is not currently supported on bootc hosts, and bootc usroverlay gives only a transient writable /usr.
        evidence: DOCUMENTED
        sources:
        - url: https://github.com/bootc-dev/bootc/blob/654978a62f5fe50b62d4e8c21c8246bd6409e296/docs/src/bootc-package-managers.7.md
          type: source-repo
          title: 'bootc docs: Package manager integration'
          retrieved: '2026-10-12'
          quote: the default usage of package managers such as `apt` and `dnf` will be at container build time.
        - url: https://github.com/bootc-dev/bootc/blob/654978a62f5fe50b62d4e8c21c8246bd6409e296/docs/src/bootc-filesystem.7.md
          type: source-repo
          title: 'bootc docs: Filesystem, systemd-confext and systemd-sysext'
          retrieved: '2026-10-12'
          quote: are not currently supported on bootc-managed systems.
        - url: https://github.com/bootc-dev/bootc/blob/654978a62f5fe50b62d4e8c21c8246bd6409e296/docs/src/bootc-package-managers.7.md
          type: source-repo
          title: 'bootc docs: Package manager integration'
          retrieved: '2026-10-12'
          quote: command that adds a transient writable overlayfs for
    summary: >-
      Customization is a Containerfile. The expected workflow is to derive from a
      base image using ordinary package manager commands in a build, which the
      documentation says just works.
    notes: >-
      This is the whole point of the mechanism and the clearest contrast with the
      configure-a-prebuilt-image model. An adopter owns the resulting image, and
      with it the build, test, signing and patching of that image, which is the
      framework cost this edition's methodology requires be recorded wherever a
      framework appears.
    evidence: DOCUMENTED
    sources:
      - url: https://bootc.dev/bootc/building/guidance.html
        type: official-docs
        title: Building guidance
        retrieved: "2026-09-22"
        quote: >-
          it is very much expected that the pattern of RUN $pkgsystem install
          somepackage && $pkgsystem clean all ... Just Works here

  d07_kubernetes:
    normalized:
      requirement: unrelated
      bundled: "none"
      independent_lifecycle: "not-applicable"
      os_manages_kubernetes: "no"
      kubernetes_manages_os: "bootc-operator, a Kubernetes operator in the project's own organization; first pre-release v0.1.0 on 2026-09-17, and its README states it is in early development and not yet fully functional"
      distributions: ["MicroShift, on image mode for RHEL (documented by Red Hat)"]
      documented_kubernetes_use: "Red Hat documents MicroShift, its Kubernetes distribution, embedded in bootc images through image mode for RHEL. bootc itself neither requires, ships nor manages Kubernetes."
      distribution_options:
        - distribution: microshift
          offered: build-option
          detail: Red Hat documents embedding MicroShift in a bootc image through image mode for RHEL.
          sources:
            - url: https://docs.redhat.com/en/documentation/red_hat_build_of_microshift/4.22/html/installing_with_image_mode_for_rhel/index
              type: vendor-docs
              retrieved: '2026-10-05'
              quote: You can embed MicroShift into a bootc image by using image mode for Red Hat Enterprise Linux (RHEL).
    summary: >-
      bootc itself neither requires Kubernetes, ships it, nor manages it. Red Hat
      documents MicroShift, its Kubernetes distribution, embedded in bootc images
      through image mode for RHEL. Native Kubernetes integration is a roadmap
      direction, and a separate operator
      in the project's organization reached a first pre-release marked early
      development after this edition's collection date.
    notes: >-
      Lifecycle independence is marked not-applicable because there is no
      operating system release for a Kubernetes version to be coupled to. What
      the mechanism does is orthogonal to whatever orchestrator the resulting
      system runs.

      The operator is recorded here on the same terms as the Kairos operator
      is recorded in that profile: a Kubernetes-side controller that applies an
      OS image to nodes. Its repository was created 2026-03-18, its first
      release is a pre-release dated 2026-09-17, and the README carries a
      warning that the project is in early development and its APIs may
      change. It is a separate repository from the tool and is not part of a
      bootc release.
    evidence: DOCUMENTED
    sources:
      - url: https://docs.redhat.com/en/documentation/red_hat_build_of_microshift/4.22/html/installing_with_image_mode_for_rhel/index
        type: vendor-docs
        title: "Red Hat build of MicroShift 4.22: Installing with image mode for RHEL"
        retrieved: "2026-10-05"
        quote: >-
          You can embed MicroShift into a bootc image by using image mode for
