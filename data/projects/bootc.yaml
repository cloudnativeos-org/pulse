    summary: >-
      Weekly releases cut directly from the main branch. The command-line
      interface and API are declared stable, with a commitment that existing
      systems upgrade in place across future changes.
    notes: >-
      Two maturity questions are open and the project flags both itself, which is
      the right way to handle them. There is no formal support-duration policy,
      raised in a community meeting in August 2026 and deferred for broader input.
      And there are no long-lived release branches: every release is tagged from
      the main branch and there is no backporting process.

      The stability claim is carefully scoped rather than oversold: it covers the
      surface interfaces, not the underlying logic, and experimental features are
      explicitly exempt.

      Aiming for CNCF Incubation is stated in the roadmap and has not happened.
      Re-checked 2026-09-22: the CNCF page still lists Sandbox.

      One date in the release document does not match the release listing. The
      document dates the start of the weekly cadence, at v1.16.0, to June 2024.
      The v1.16.0 release on GitHub is dated 2026-06-10, and the tags before it
