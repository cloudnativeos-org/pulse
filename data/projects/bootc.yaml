      - url: https://github.com/bootc-dev/bootc/blob/main/ROADMAP.md
        type: design-doc
        title: bootc roadmap
        retrieved: "2026-09-22"
        quote: >-
          Develop native Kubernetes integrations to enable cluster-wide OS
          updates, node lifecycle management, and fleet-wide rollout and
          rollback strategies.
      - url: https://github.com/bootc-dev/bootc/blob/main/docs/src/bootc-relationships.7.md
        type: official-docs
        title: Relationship with Kubernetes
        retrieved: "2026-10-19"
        quote: >-
          Just as `podman` does not depend on a Kubernetes API server, `bootc`
