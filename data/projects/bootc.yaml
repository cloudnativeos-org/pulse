      integrity: "composefs with fsverity; signature binding requires a sealed UKI"
      sbom: unknown
      provenance: unknown
      secure_boot: "documented for the sealed UKI path (a UKI signed for Secure Boot); the default ostree path boots through GRUB and shim"
    summary: >-
      Security properties are mostly inherited or delegated. The mechanism's own
      contribution is the integrity model and the container signature policy, and
      the signature policy is permissive by default.
    notes: >-
      The project documents both halves of its integrity story honestly, as
      recorded in d02: fsverity by default where available, but no verification
      against a signature unless a sealed unified kernel image is in use.

      The permissive signature default is the single most consequential security
      fact in this profile for an adopter, because it means an unconfigured bootc
      system will deploy an unsigned image. The documentation recommends enabling
      signatures and does not do it for you.

      The fsverity default applies to the composefs backend only. The same page
      states that the default backend is ostree with a composefs mount, and that
      fsverity is not enabled by default there. An adopter on the default
      backend has neither fsverity nor signature binding unless they configure
      both.
    evidence: DOCUMENTED
    sources:
      - url: https://bootc.dev/bootc/security.html
        type: official-docs
        title: bootc security
        retrieved: "2026-09-22"
        quote: >-
          The default backend is ostree (with a composefs mount), but fsverity
          is not enabled by default.
