      cluster_api:
        os_specific_provider: not-applicable
        maintainer: not-applicable
        upstream_provider_list: "not listed, and a listing would be a category error"
        provisions: not-applicable
        in_flight: "bootc-operator#113, open since 2026-07-15, explores a Cluster API in-place upgrade runtime extension. That is a lifecycle hook, not a provider, and no code exists. A commenter said on 2026-09-15 they would create a proof of concept; none was found in bootc-operator or cluster-api as of 2026-09-22."
    summary: >-
      The mechanism deliberately provides a low-level primitive and expects
      higher-level tooling above it. Its own documentation describes the shipped
      default as simplistic and meant to be replaced at any nontrivial scale.
    notes: >-
      This is the honest position of a mechanism rather than a shortfall, and the
      project states it as such: "The upstream bootc project provides a low-level
      generic tool that can be driven by multiple higher level management
      tooling."

      One distinction matters and is easy to get wrong. The statement that bootc
      is intended to supersede the older mechanism comes from Red Hat's product
      documentation for image mode, not from upstream. Upstream rpm-ostree's own
      README says development focus has shifted but that it "continues to be
      supported". Those are different claims from different parties and this
      profile keeps them apart.

      Cluster API is recorded as not-applicable here, and the project states the
      reason in its own words rather than leaving it to be inferred. Its
      operator's design document has a section on the relationship, which says
      the two are complementary: Cluster API provisions and deletes nodes and
      otherwise treats the operating system on them as a black box, while this
      mechanism knows nothing about provisioning nodes and knows how to manage
      the operating system once they have joined. Those are different layers, so
      asking which Cluster API provider implements this mechanism is the same
      category error the entry kind field exists to prevent.

      One live item is worth recording precisely, because it is easy to
      overstate. An open issue on the operator explores a Cluster API in-place
      upgrade extension, where Cluster API keeps the rollout logic and this
      mechanism acts as an executor. That would be a runtime extension, not a
      bootstrap, control-plane or infrastructure provider, and no code exists
      for it yet.

      Flight Control, recorded above as an open-source companion, has no Cluster
      API involvement at all. Its own description is fleet management for edge
      devices, and this mechanism's design document states there are no plans to
      adopt an operator pattern or to manage cluster nodes themselves. The
      companion entry is a fleet-management fact and carries no Cluster API
      implication.
    evidence: DOCUMENTED
    sources:
