tradeoffs:
  buys:
    - "One artifact format for the whole stack. If you already build container images, you already know how to build and ship an operating system, and the registry ecosystem for mirroring, signing and distribution applies unchanged."
    - "Distribution independence. Adopters span several distributions and organizations. The adopter owns image build, test, signing and patching."
    - "A staged update model: download without applying, inspect the staged state, apply later from what is already downloaded."
    - "With a sealed unified kernel image, the composefs root is verified: fs-verity is enforced and the expected root digest is embedded in a UKI signed for Secure Boot. This newer backend has no boot entry counting yet."
    - "Foundation-held under CNCF, with a published governance document, a maintainer council, and a maintainers file that names each maintainer's employer."
    - "A stability commitment covering the interfaces, with experimental features explicitly exempt."
  costs:
    - "To require signed container images, enable signature verification. It ships off, and the project recommends enabling it."
    - "No phased rollout, canary or per-node rollout control. The shipped default is a timer, and the documentation says it is meant to be replaced at any nontrivial scale."
    - "Rollback reorders deployments rather than creating them, so /etc changes do not travel with a rollback."
    - "No formal support-duration policy, no release branches and no backporting. A fix reaches you by moving to the newest release."
    - "All six listed maintainers work for Red Hat."
maintainers_fact:
  text: "All six listed maintainers work for Red Hat."
  evidence: DOCUMENTED
  sources:
    - url: "https://github.com/bootc-dev/bootc/blob/main/MAINTAINERS.md"
      type: "governance-doc"
      title: "bootc maintainers"
      retrieved: "2026-09-22"
known_issues:
  - text: "To require signed container images, enable signature verification. It ships off, and the project recommends enabling it."
    kind: unverified
    sources:
      - url: "https://bootc.dev/bootc/security.html"
        type: "official-docs"
        title: "bootc security, signature policy"
        retrieved: "2026-09-22"
        quote: "The upstream default at the time of this writing does not require signatures for generic images ... It is however a very good idea for bootc users to enable signatures for their images."
open_questions:
  - "Is a formal support-duration policy expected, after the question was deferred in August 2026?"
  - "Will boot entry counting land on the composefs backend, and on what timeline?"
  - "Is there a plan to make signature verification required by default, or to ship a stricter reference policy?"
  - "What is the roadmap for the phased rollout and per-node control that the project says it aims to absorb?"
  - "What would move the project from CNCF Sandbox towards Incubation, and is an application planned?"
  - "Is an unprivileged or bus-based interface planned, given the tool is root-only today and that is named as a blocker by a downstream distribution?"
  - "Does automatic reversion on boot failure exist on the OSTree backend once boot loader entry counting is configured, and with what trigger and attempt count? bootc's own documentation describes detection only, and does not state a trigger, an attempt count or a success criterion."
  - "What does the bootc-operator's first pre-release (v0.1.0, 2026-09-17) actually roll out today, and which of its README's future features (dynamic config overlays, sysexts, live apply) exist? Its README says early development and not yet fully functional; the profile records the release without testing it."

