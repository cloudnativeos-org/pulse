    summary: >-
      BSD-3-Clause, hosted under the Xen Project rather than directly by a
      foundation, with the trademark held by the commercial entity. A governance
      repository lists maintainers and reviewers per special interest group;
      no document states who decides project direction or how maintainers are
      appointed or removed.
    notes: >-
      The foundation position needs precision. Unikraft is a sub-project of the
      Xen Project, which is itself a Linux Foundation project. It is not a
      directly hosted top-level Linux Foundation project. The incubation label
      the README uses rests on a 2017 announcement; the current foundation page
      assigns no status.

      Open governance is partial rather than documented. What exists is a
      published review process with two roles, automated reviewer assignment by
      special interest group, and a one-maintainer-approval automatic merge rule,
      plus a governance repository whose README describes the project as
      organised into self-governing special interest groups and whose
      configuration files list the maintainers and reviewers of each group by
      name (22 groups on 2026-09-22, last pushed 2025-04-23). What does not exist
      is any statement of who decides project direction, how maintainers are
      appointed or removed, how disputes escalate, or any steering or technical
      body. The governance repository's own licence file names the commercial
      entity and a university as copyright holders.

      Vendor-neutral ownership is mixed rather than foundation-held: the project
      is hosted under a foundation umbrella while the trademark sits with the
      commercial entity.

      One inconsistency is recorded without resolving it: the README's trademark
      line and the site imprint name two different legal forms for that entity,
      and no live source reconciled them. On 2026-09-22 no imprint page was
      found on the project site, and the company domains redirect to a site
      that publishes no imprint, so the second half of that inconsistency could
      not be re-read.

      The academic pipeline is real and structural, with a student programme
      whose output lands in shipped tooling, documented university workshops, and
      continuing publication activity. That is a meaningful contribution model
      and is recorded as a fact rather than as a weakness.
