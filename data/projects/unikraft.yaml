tradeoffs:
  buys:
    - "A minimal attack surface by construction rather than by hardening: no shell, no unneeded services, no unneeded system calls, and dead code removed by link-time optimization. The project states the claim and also states its limit."
    - "The C library, memory allocator, scheduler, network stack, filesystem and even boot code are interchangeable, and interfaces themselves can be removed."
    - "One artifact containing application and operating system, so there is no drift between them and no separate OS lifecycle to manage."
    - "Debugging that inspects application and operating system code together, because they are the same binary."
    - "Standard OCI packaging, so ordinary registries and multi-platform images work without project-specific infrastructure."
  costs:
    - "No security policy, no vulnerability reporting address, no embargo policy, no supported-version statement and no published advisories."
    - "No image signing, no verification on pull, no bill of materials and no provenance. Nothing verifies an artifact between packaging and running."
    - "No support policy, no release branches and no backporting. A fix reaches you by moving to the newest release."
    - "Stated release cadence and measured cadence diverge substantially, and the last four minor intervals were far longer than the target."
    - "The published hardening status table is about four years stale, so a reader cannot tell which protections have landed."
    - "No statement of who decides project direction or how maintainers are appointed or removed. A governance repository holds per-group maintainer lists. The commercial entity holds the trademark, while the project sits under a foundation umbrella."
    - "riscv64 is advertised as coming soon while the implementation has been unmerged since 2022 and the tracking issue open since 2020."
    - "Binary compatibility is limited to one architecture, one hypervisor and position-independent executables, and carries a stated performance cost."
    - "No persistence without an external volume, which the documentation says makes it unsuitable for database-style workloads."
    - "Fleet capability at any scale means the commercial platform, whose control plane is not published."
open_questions:
  - "Which legal entity is correct today? The README trademark line and the site imprint disagree, and who holds the trademark now?"
  - "Where does one report a security vulnerability, and what happens next? Is there a private channel, an embargo period and a disclosure timeline?"
  - "Beyond the per-group maintainer and reviewer lists in the governance repository, is there a governance document that is not published? Who decides project direction, and how are maintainers appointed and removed? Is a single maintainer approval genuinely sufficient to auto-merge, including for security-relevant changes? The governance repository was last pushed in April 2025: are its lists current?"
  - "Which page is the site imprint that names a legal form different from the README's trademark line? On 2026-09-22 no imprint page was found on unikraft.org, and unikraft.io and unikraft.cloud redirect to unikraft.com, whose footer carries no imprint, legal or privacy link."
  - "Is the Hyperlight platform intended to land in the core tree? The build tooling has a driver for it and the kernels are built from a repository outside the project's organization."
  - "Is artifact signing or provenance on the roadmap for packaging and for running? Should an adopter today treat every pulled image as unverified?"
  - "Can the hardening status table be refreshed? Which entries have landed since 2022?"
  - "What is the intended upgrade and rollback story in the project's own words? A short statement that redeploy is the complete answer would close the largest conceptual gap for operators."
  - "What is the real state of riscv64, what is the change blocked on, and should the README's 'soon' be revised meanwhile?"
  - "Has the two-month release cadence been formally revised, or has the project moved to a feature-driven model?"
  - "Is there any support or maintenance-branch policy, even informal? Would a security fix today be backported?"
  - "What is the supported maturity of the Kubernetes runtime path, and is it tested against Kubernetes in continuous integration?"
  - "Which command-line capabilities require a commercial account? A clear split in the documentation would help evaluators."
  - "Is any part of the commercial control plane intended to be open sourced?"
  - "Are there production deployments of the open-source project outside the commercial platform, and would the project call the current release production ready?"
  - "What licences apply to the repositories that carry none, including the catalog of prebuilt applications?"
  - "Is measured boot or image attestation in scope, given there is a firmware driver but no TPM support?"
  - "Is compartmentalization intended to land in the core tree, or does that work now live elsewhere?"
  - "Who employs the maintainers in the governance repository's per-group lists? Contributor and maintainer employer affiliation is not published."

