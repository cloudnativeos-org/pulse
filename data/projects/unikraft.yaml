          vendor: "Unikraft GmbH"
          license: proprietary
          self_hostable: false
          note: "The control plane is not published. The company's organization publishes clients, software development kits, an interface specification, a Terraform provider and a Kubernetes operator, and no server, scheduler or orchestrator."
      cluster_api:
        os_specific_provider: not-applicable
        maintainer: not-applicable
        upstream_provider_list: "not listed, and a listing would be a category error"
        provisions: not-applicable
    summary: >-
      Not applicable to the core project, which is a kernel and a build system
      with no agent, no control plane client and no remote management code. A
      built image has no way to phone home or be enrolled.
    notes: >-
      This is the cleanest example in the edition of why the three buckets exist,
      and it needs stating carefully because the boundary is easy to misread.

      The open-source command-line tool ships subcommands that deploy to the
      commercial platform, covering autoscaling, scale-to-zero, persistent
      volumes, certificates, metrics and multi-instance orchestration. Those
      subcommands are open source. The capabilities behind them are not: they are
      features of a hosted platform reached through an open-source client.

      The evidence that the control plane is closed is what the company's
      organization publishes and what it does not: clients, software development
      kits, an interface specification, a Terraform provider and a Kubernetes
      operator are public, and no server, scheduler or orchestrator repository
      exists.

      The open-source tool's own scope is a single host. Listing instances lists
      them on the machine the command runs on.

      Cluster API is recorded as not-applicable, and the reason is the same one
      that makes several other dimensions not-applicable for this entry: a
      Cluster API bootstrap provider turns a machine into a joined Kubernetes
      node, and this project produces no nodes. There is no host operating
      system and no kubelet to configure, so the question is a category error
      rather than a gap.

      The absence was searched before being recorded. Nothing appears in the
      provider list under any provider type. The project's own organisation and
      its commercial organisation contain no Cluster API repository between
      them. There is no image-builder target.

      One near-miss is worth naming so a later pass does not miscount it. A
      third-party repository carries this project's name and the word provider,
      and it is not a Cluster API provider: it declares no dependency on Cluster
      API and its own description says it watches a company-specific instance
      resource and creates pods. The name collides and nothing else does.

      The project's real Kubernetes integrations run the other way, placing
      workloads into an existing cluster rather than building one. A runtime
      shim lets packaged unikernels run under a standard container runtime, and
      a virtual kubelet connects an existing cluster to the commercial platform.
      Neither makes this system a node operating system.
