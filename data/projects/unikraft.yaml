        retrieved: "2026-09-22"
    unknowns:
      - "No vulnerability reporting address, embargo policy, supported-version window or advisory history exists."
      - "The hardening status table is about four years stale, so in-progress and planned entries cannot be verified as current."

  d11_operations_debugging:
    normalized:
      ssh: "not-applicable"
      local_shell: "not-applicable"
      serial_console: available
      debugger: "GDB, on both platforms, application and OS together"
      tracing: "a tracepoint facility exists inside the debug library and is undocumented"
      support_bundle: "none"
      log_retrieval: available
    summary: >-
      Not applicable for interactive access, and genuinely capable for
      post-mortem and attached debugging. A debugger can inspect application and
      operating system code at the same time, because they are one binary.
    notes: >-
      Shell and remote access are marked not-applicable rather than absent
      because there is no user separation and no session to attach to. Processes
      exist only through an optional build-time library, and they share one
      address space. Both halves of that are recorded, as the methodology requires.
      What it costs: an operator cannot enter a misbehaving instance to diagnose
      it. What it buys: neither can an attacker, and the project's stated
      reduction of attack surface follows from the same fact.

      The debugging that does exist is not a consolation prize. Debugger support
      is documented on both platforms with concrete invocations, requires a build
      configuration change, and produces a separate debug image alongside the
      stripped one. Serial console output is standard. The current release
      overhauled the printing subsystem with a kernel-message-style log buffer.
      For binary-compatible workloads a system-call-tracing image is published for
      debugging.

      Two facilities exist in the tree and are absent from the debugging
      documentation: a tracepoint facility, a configuration option inside the
      debug library rather than a library of its own, and a coverage library.
      The only mention of tracepoints in the documentation is an external link
      to the Linux kernel's tracepoint page in a further-reading list. Recorded
      as a documentation gap.

      A frankly useful piece of documentation records that stopping a running
      instance differs per virtual machine monitor, including that one has no
      keyboard shortcut and needs the process killed, and warns that interrupting
      the tool may leave runtime state and processes behind.
    evidence: DOCUMENTED
    sources:
