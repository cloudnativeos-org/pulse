schema_version: "1.0.0"
edition: "2026"
id: unikraft
name: Unikraft
homepage: https://unikraft.org/
repository: https://github.com/unikraft/unikraft
collected_at: "2026-09-15"

entry_kind:
  - framework

category_fit:
  comparable: adjacent
  note: >-
    A boundary case, included because it asks whether the host operating system
    is the right unit of deployment at all. Unikraft compiles an application and
    the operating system into a single-address space binary, so there is no host
    to manage and no separation between kernel and user address spaces. An
    optional library, selected at build time, adds multiprocess support (vfork,
    execve and wait4), and those processes share the one address space.

    Several dimensions are genuinely not applicable rather than absent, and that
    distinction is the reason this edition's schema has three different kinds of
    no. They are listed below, each with a note saying why the concept does not
    exist here.

    Where a concept does exist in a modified form, it is recorded rather than
    dismissed.
  dimensions_not_applicable:
    - d05_rollback_recovery
    - d09_provisioning
    - d11_operations_debugging
    - d12_fleet_management

self_description:
  text: >-
    The fast, secure and open-source Unikernel Development Kit. Unikraft powers
    the next-generation of cloud native, containerless applications by enabling
    you to radically customize and build custom OS/kernels.
  source:
    url: https://github.com/unikraft/unikraft
    type: source-repo
    title: Unikraft README
    retrieved: "2026-09-22"

version_observed:
  version: "v0.21.0 Ijiraq"
  released: "2026-05-20"
  channel: stable
  method: >-
    Latest release on unikraft/unikraft via the GitHub releases API. Note the
    project's own release blog post is dated a month earlier than the release
    object; the API date is used.
  source:
    url: https://github.com/unikraft/unikraft/releases
    type: release-notes
    title: Unikraft releases
    retrieved: "2026-09-22"
  additional_channels:
    - channel: "build tooling, released separately"
      version: "v0.12.16"
      released: "2026-09-09"

taxonomy:
  workload_scope: single-application-image
  construction_model:
    - framework
  root_state_substrate:
    - unikernel-binary
  notes: >-
    The only single-application-image entry in this edition. The unit of
    deployment is one application fused with the operating system it needs, and
    the project's own words are that the result is "a single-address space binary
    object: it does not have separation between kernel and user address spaces."

    A pure framework: the project ships no operating system, only the parts and
    the build system to compose one.

dimensions:
  d01_os_model:
    normalized:
      workload_scope: single-application-image
      library_os: true
      shell: "none"
      multi_process_userspace: "optional build-time library (LIBPOSIX_PROCESS_MULTIPROCESS: vfork, execve, wait4), in the one address space, with no isolation between processes"
      linux_binary_compatibility: "x86_64, position-independent executables, one hypervisor"
      documented_syscalls: "160 or more"
    summary: >-
      A library operating system plus a configuration and build system. Every
      component, including the scheduler and the network stack, is an
      interchangeable micro-library selected at build time.
    notes: >-
      The modularity goes further than the word usually implies, and the project
      states it: interfaces are themselves removable micro-libraries, so an
      application can switch off the scheduler entirely to implement a
      run-to-completion event loop.

      Two routes exist for running existing software. Recompiling links an
      application's object files against the library operating system. Binary
      compatibility runs unmodified Linux executables through a system call
      shim, with documented limits stated plainly: x86_64 only with work ongoing
      for arm64, position-independent executables only, one hypervisor only, and
      a slight performance cost.

      The project is honest about the porting cost and quantifies it rather than
      waving it away: it reports that 42 percent of invoked system calls can be
      stubbed or faked for test suites and 60 percent for traditional workloads,
      and concludes that the effort "while non-negligible, is not as
      insurmountable as past studies relying on static analysis seemed to
      suggest." Missing system calls return a not-implemented error by default.
    evidence: DOCUMENTED
    sources:
      - url: https://unikraft.org/docs/concepts
        type: official-docs
        title: Unikraft concepts
        retrieved: "2026-09-22"
        quote: >-
          a single-address space binary object: it does not have separation
          between kernel and user address spaces
      - url: https://github.com/unikraft/unikraft/blob/RELEASE-0.21.0/lib/posix-process/Config.uk
        type: source-repo
        title: posix-process build options at RELEASE-0.21.0
        retrieved: "2026-10-19"
        quote: >-
          config LIBPOSIX_PROCESS_MULTIPROCESS bool "Multiprocess support"
      - url: https://github.com/unikraft/unikraft/blob/RELEASE-0.21.0/lib/posix-process/README.md
        type: source-repo
        title: posix-process library README at RELEASE-0.21.0
        retrieved: "2026-10-19"
        quote: >-
          Being a single-address-space operating system, instead of the
          traditional `fork()` that creates a new address space for the child,
          Unikraft implements multiprocess with `vfork()` only.
      - url: https://unikraft.org/docs/internals/architecture
        type: official-docs
        title: Architecture
        retrieved: "2026-09-22"
        quote: >-
          All micro-libraries that implement the same API are interchangeable.
      - url: https://unikraft.org/docs/concepts/compatibility
        type: official-docs
        title: Compatibility
        retrieved: "2026-09-22"
        quote: >-
          Currently, binary-compatibility is available on x86_64 ... Also note
          that KVM is currently the only supported hypervisor

  d02_immutability:
    normalized:
      image_read_only_by_construction: true
      root_filesystem_options:
        - "in-memory initial ramdisk, non-persistent"
        - "embedded initial ramdisk, compiled into the binary"
        - "external volume, for persistence"
      persistence: "external volume only"
      integrity_mechanism:
        - image-by-construction
      read_only:
        - the unikernel image (an embedded initrd is compiled into the binary)
      read_only_mechanism: read-only by construction
      ephemeral:
        - the root filesystem, held in memory (initrd)
      ephemeral_mechanism: RAM, not persistent
      writable_and_persistent:
        - an external volume, the only persistent storage
      configurable_paths:
        value: 'yes'
        evidence: DOCUMENTED
        how: 'Choose the root filesystem at build time: an initrd, an embedded initrd or an external volume. Volume drivers are selected at compile time.'
        sources:
          - url: https://unikraft.org/docs/cli/filesystem
            type: official-docs
            title: 'Unikraft filesystems: root filesystem classes'
            retrieved: '2026-10-12'
            quote: Unikraft supports essentially two classes of root filesystems
          - url: https://unikraft.org/docs/cli/filesystem
            type: official-docs
            title: 'Unikraft filesystems: volumes'
            retrieved: '2026-10-12'
            quote: However, Unikraft supports using volumes as the root filesystem and supports different volume drivers, which are included at compile-time
      mounts_sources:
        - url: https://unikraft.org/docs/cli/filesystem
          type: official-docs
          title: 'Unikraft filesystems: the in-memory root'
          retrieved: '2026-10-12'
          quote: Throughout the lifecycle of the application, this root filesystem is held in memory (via Unikraft's internal library ramfs ) and therefore it is not persistent.
        - url: https://unikraft.org/docs/cli/filesystem
          type: official-docs
          title: 'Unikraft filesystems: embedded initrd'
          retrieved: '2026-10-12'
          quote: Unikraft supports embedding the initram archive file within the kernel binary directly
        - url: https://unikraft.org/docs/cli/filesystem
          type: official-docs
          title: 'Unikraft filesystems: volumes'
          retrieved: '2026-10-12'
          quote: Traditionally, volumes are typically associated with long-term data storage, not just for boot time operations.
    summary: >-
      The default root filesystem is held in memory and is not persistent. An
      embedded variant compiles the filesystem into the binary itself, which the
      project frames explicitly as a tamper-resistance measure.
    notes: >-
      The embedded variant is the strongest immutability construct here and the
      rationale is stated: embedding removes "the possibility of injecting a
      different initrd at boot time", reducing attack surface by shipping one
      binary rather than a binary plus a separate archive.

      Persistence requires attaching an external volume, and the documentation is
      clear about the fit: unsuitable for applications that rely on persistent
      storage such as databases, and well suited to stateless memory-intensive
      services. Volume drivers are selected at compile time.

      There is no writable-overlay-on-read-only-base construct and none is
      documented. Read-only enforcement questions in the host-OS sense, such as a
      verity-protected root or a writable /etc, do not arise: the image is not
      modifiable because nothing exists to modify it with.
    evidence: DOCUMENTED
    sources:
      - url: https://unikraft.org/docs/cli/filesystem
        type: official-docs
        title: Filesystem
        retrieved: "2026-09-22"
        quote: >-
          to prevent corruption or malicious intent by reducing the attack
          surface by removing the possibility of injecting a different initrd at
          boot time
      - url: https://unikraft.org/docs/cli/filesystem
        type: official-docs
        title: Filesystem, persistence
        retrieved: "2026-09-22"
        quote: >-
          the longevity of the initram makes it unsuitable for applications which
          rely on persistent storage

  d03_artifact:
    normalized:
      primary_artifact: "a bootable kernel binary per platform and architecture"
      oci_registry_distribution: true
      content_addressable: "by inference, as an OCI image"
      mirrorable: true
      signed: "none"
      air_gapped_capable: unknown
      kernel_and_application_together: true
    summary: >-
      One statically linked binary per target, fusing application and operating
      system. It can also be packaged and pushed as an OCI image, including
      multi-platform images, to any registry.
    notes: >-
      OCI packaging is first class and uses the standard image specification, so
      ordinary registries work and an alternative registry is a one-line
      configuration change. A second distribution channel exists for build-time
      components, served from a published manifest index.

      Content addressing is recorded as an inference rather than a project claim:
      it follows from being an OCI image, and the documentation never uses the
      words digest or content-addressable.

      Signing is a documented absence and it is the most consequential gap in
      this profile. Searches across the documentation corpus for signing,
      transparency-log and bill-of-materials terminology returned nothing. A
      search of the build tooling source tree on 2026-09-22 found signing
      terms only in the tool's own release pipeline (a release configuration
      that signs the tool's release binaries with cosign) and in an indirect
      Go module dependency; no code signs, verifies or attests unikernel images,
      and the packaging documentation never uses the words signature, digest or
      content-addressable. There is no image signing, no verification on pull,
      no bill of materials and no provenance attestation.

      Air-gapped building is recorded as unknown rather than supported: a mirror
      flag and update-suppression flags exist on the build command, and there is
      no air-gap guide or documented workflow.
    evidence: DOCUMENTED
    sources:
      - url: https://unikraft.org/docs/cli/packaging
        type: official-docs
        title: Packaging
        retrieved: "2026-09-22"
        quote: >-
          It is possible to access pre-built and to distribute yourself unikernel
          images using the OCI Image Specification.
      - url: https://unikraft.org/docs/internals/architecture
        type: official-docs
        title: Architecture, build output
        retrieved: "2026-09-22"
        quote: >-
          The build system then compiles all of the micro-libraries, links them,
          and produces one binary per selected platform.
      - url: https://github.com/unikraft/kraftkit
        type: source-repo
        title: Build tooling, searched for image signing, verification, bill-of-materials and attestation support
        retrieved: "2026-09-22"
    unknowns:
      - "Air-gapped building is not documented as a supported workflow, though a mirror flag exists."

  d04_upgrade:
    normalized:
      mechanism:
        - image-replacement-redeploy
      in_place_upgrade: "not-applicable"
      initiator: "whatever runs the instance"
      artifact_verification: "none"
    summary: >-
      There is no upgrade mechanism and the project documents none. The unit is
      replaced, not upgraded, which follows directly from the kernel and the
      application being one statically linked binary.
    notes: >-
      In-place upgrade is marked not-applicable because there is no persistent
      operating system to upgrade: changing either the application or the
      operating system means relinking the whole image.

      This is recorded as a documentation gap as well as an architectural fact.
      Searches of the command-line and internals documentation for upgrade,
      rollback, atomic and A/B terminology returned no occurrences. The only
      update-adjacent commands refresh the component manifest list or suppress
      self-update checks. The instance lifecycle verbs are run, start, stop,
      pause, list, logs and remove, with no update or upgrade verb.

      So the architectural answer is inferable and defensible, and the project
      never writes it down, not even to say the question does not apply.

      Nothing verifies an artifact at any point between packaging and running,
      which follows from the absence of signing recorded in d03.
    evidence: DOCUMENTED
    sources:
      - url: https://unikraft.org/docs/cli
        type: official-docs
        title: Command reference, the only update verb refreshes the component list
        retrieved: "2026-09-22"
        quote: "Retrieve new lists of Unikraft components, libraries and packages"
      - url: https://unikraft.org/docs/internals/architecture
        type: official-docs
        title: Architecture, single linked binary
        retrieved: "2026-09-22"
        quote: >-
          The build system then compiles all of the micro-libraries, links them,
          and produces one binary per selected platform.
    unknowns:
      - "The redeploy model is never stated in the documentation, not even as a statement that in-place upgrade does not apply."

  d05_rollback_recovery:
    normalized:
      rollback_to_previous: "not-applicable"
      automatic_rollback_on_boot_failure: "not-applicable"
      recovery_environment: "not-applicable"
      factory_reset: "not-applicable"
      crash_handling: "a crash screen and crash management, improved in the current release"
    summary: >-
      Not applicable as host-OS concepts. There is no persistent host to roll
      back, no bootloader slots, no recovery shell to drop into, and no device
      state to reset.
    notes: >-
      Each field is marked not-applicable rather than absent for a specific
      reason. Rollback in this model means deploying the previous image, which is
      an orchestrator action outside the project's scope. Automatic rollback on
      failed boot needs a bootloader tracking attempts across boots of a
      persistent system, and no such subsystem exists in the source tree.
      A recovery environment needs a shell, and the project states a production
      image contains none. Factory reset needs persistent device identity, and
      there is none.

      What does exist is post-mortem rather than recovery: console output, log
      retrieval, and debugger attachment, recorded under d11. The current release
      added an improved crash screen and crash management, which reports rather
      than recovers.

      Recovering a failed instance is destroy and recreate from an image the
      operator already holds. If that image is local, no network is needed. That
      is an inference from the model rather than a documented procedure, because
      no recovery documentation exists.
    evidence: DOCUMENTED
    sources:
      - url: https://unikraft.org/docs/concepts/security
        type: official-docs
        title: Security, no shell in a production image
        retrieved: "2026-09-22"
        quote: >-
          a Unikraft production image contains no shell, no unneeded system
          services, no unneeded system calls or OS features
      - url: https://github.com/unikraft/unikraft/releases
        type: release-notes
        title: Release notes, crash management
        retrieved: "2026-09-22"
        quote: "an improved crash screen and crash management"

  d06_customization:
    normalized:
      customization_points:
        - build-time
      runtime_customization: "none"
      mechanisms:
        - kconfig-configuration
        - kraftfile-project-descriptor
        - micro-library-selection
        - library-ports
      swappable_components:
        - "C standard library"
        - "memory allocator"
        - "scheduler, per CPU core"
        - "network stack"
        - "filesystem"
        - "boot code"
        - "language runtime"
    summary: >-
      Customization is the core capability and it happens exclusively at build
      time. A configuration system ported from the Linux kernel selects which
      micro-libraries compose the image.
    notes: >-
      The depth is real and unmatched in this edition. Documented swappable
      layers include the C library, the memory allocator, the scheduler with
      different schedulers per CPU core, the network stack with an optional
      lower-level higher-throughput interface, the filesystem, and even the boot
      code for anyone optimizing boot time against a defined interface.

      A declarative project descriptor holds the specification, target list,
      libraries, root filesystem, volumes and inline configuration.

      The cost is the mirror image of the capability, and it is the framework
      cost this edition records wherever a framework appears. Everything is build
      time, so there is no runtime configuration of the operating system at all,
      and the adopter owns the resulting artifact including its testing and
      patching. Porting an application is real work, quantified by the project
      itself in d01.

      Analysis tooling exists to support porting decisions, which is a
      thoughtful inclusion rather than an afterthought.
    evidence: DOCUMENTED
    sources:
      - url: https://unikraft.org/docs/internals/architecture
        type: official-docs
        title: Architecture, removable interfaces and pluggable schedulers
        retrieved: "2026-09-22"
        quote: >-
          Schedulers are also pluggable, and each CPU core can run a different
          scheduler.
      - url: https://unikraft.org/docs/cli/reference/kraftfile/latest
        type: official-docs
        title: Project descriptor reference
        retrieved: "2026-09-22"
        quote: >-
          The Kraftfile is the static configuration file used to programmatically
          build, run, package and deploy a unikernel using kraft.
      - url: https://unikraft.org/docs/concepts
        type: official-docs
        title: Concepts, configuration system
        retrieved: "2026-09-22"
        quote: >-
          In Unikraft, this system is enabled by a custom port of Linux's KConfig
          system

  d07_kubernetes:
    normalized:
      requirement: unrelated
      host_os_for_kubernetes: "none"
      runs_as_kubernetes_workload: "through an OCI runtime shipped in the build tooling"
      bundled: "none"
      os_manages_kubernetes: "no"
      kubernetes_manages_os: "not-applicable"
    summary: >-
      Unrelated, and never a host operating system for Kubernetes. A Unikraft
      image can run as a Kubernetes workload through an OCI runtime shipped in
      the build tooling, registered as a runtime class.
    notes: >-
      Kubernetes managing the operating system is marked not-applicable because
      there is no host operating system whose lifecycle could be managed.

      The workload path is documented: register the runtime with a container
      runtime, create a runtime class naming it, and reference that class in a
      pod specification. A maturity caveat exists on the page but is scoped to
      the container-engine path rather than the Kubernetes one, which carries no
      maturity label at all.

      The spectrum position is neither end and that is the informative part.
      Unikraft is not a Kubernetes appliance, because its primary workflow never
      mentions Kubernetes. It is not a general infrastructure substrate, because
      it hosts nothing. It sits one layer below both: an artifact producer whose
      output an orchestrator may schedule.
    evidence: DOCUMENTED
    sources:
      - url: https://unikraft.org/docs/getting-started/integrations/container-runtimes
        type: official-docs
        title: Container runtime integration
        retrieved: "2026-09-22"
        quote: >-
          Inside Kubernetes, register runu as a known runtime using a Runtime
          Class API object.
      - url: https://unikraft.org/docs/concepts/virtualization
        type: official-docs
        title: Virtualization
        retrieved: "2026-09-22"
        quote: >-
          Unikraft can be run as a virtual machine, using KVM (with QEMU or
          Firecracker as VMMs) or Xen.
    unknowns:
      - "The Kubernetes integration carries no maturity label, and it is not documented whether it is tested against Kubernetes in continuous integration."

  d08_hardware_platform:
    normalized:
      architectures_in_tree:
        - x86
        - x86_64
        - arm
        - arm64
      architectures_absent:
        - riscv64
      platforms:
        - kvm
        - xen
        - native
      virtual_machine_monitors:
        - qemu
        - firecracker
        - xen
        - hyperlight
      bare_metal: "work in progress, documented as such"
      gpu: "none"
      tpm: "none"
      extension_mechanism: "write a platform or driver port as a micro-library"
    summary: >-
      Four architecture trees and three platform trees. Devices are
      virtualization-oriented: virtio and Xen front-end drivers, a few console
      devices, and firmware interfaces.
    notes: >-
      riscv64 is a documented absence with an unusually long history, and it is
      recorded precisely because the README advertises it as coming soon. There
      is no architecture directory for it, the tracking issue has been open since
      2020-09-15, and the implementation change has been open since 2022-05-12
      and was last updated on 2026-04-22, so it is not abandoned but it is not
      merged. A second change, opened 2025-08-28 and last updated 2026-06-15,
      ports that work to the current development branch and is also unmerged.
      Both changes come from personal forks.

      GPU and TPM support are documented absences established by searching the
      complete source tree, not assumptions. On 2026-09-22 the only matches were
      an imported Xen interface header for a TPM front end and a virtio
      device-identifier constant, neither of which is a driver.

      Bare metal is honestly labelled work in progress by the project's own
      frequently asked questions, with initial single-board work in a separate
      repository.

      The current release introduced a platform abstraction layer that the
      release post describes as the first and largest part of a major platform
      rearchitecture. In this release the Xen platform is fully adapted to it on
      x86_64 and arm64, a new native platform implements it, and the KVM platform
      is described as mid-transition with full adoption anticipated in upcoming
      releases. A fourth virtual machine monitor, Hyperlight, arrived in the
      build tooling through a student programme in 2026; the contributor's post
      reports boot speed figures relative to the other monitors and lists
      continuous integration as a next step. The core tree has no hyperlight
      platform directory; the kernels for it are built out of tree.

      Extending hardware support means writing a platform or driver port as a
      micro-library, and the architecture documentation explicitly lists
      platforms among the things that can be contributed that way.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/unikraft/unikraft/tree/staging/arch
        type: source-repo
        title: Architecture trees (arm, arm64, x86, x86_64; no riscv64)
        retrieved: "2026-09-22"
      - url: https://github.com/unikraft/unikraft/issues/60
        type: source-repo
        title: RISC-V support tracking issue, open since 2020
        retrieved: "2026-09-22"
        quote: "Add support for RISC-V architecture."
      - url: https://github.com/unikraft/unikraft/pull/461
        type: source-repo
        title: Initial riscv64 support change, open since 2022-05-12, last updated 2026-04-22
        retrieved: "2026-09-22"
        quote: "Introduce initial riscv64 support"
      - url: https://unikraft.org/docs/faq
        type: official-docs
        title: FAQ, bare metal
        retrieved: "2026-09-22"
        quote: We are are working towards having Unikraft run baremetal.
      - url: https://unikraft.org/docs/internals/architecture
        type: official-docs
        title: Architecture, portable platforms
        retrieved: "2026-09-22"
        quote: "or even platforms (e.g., Solo5, Firecracker, Raspberry Pi 3)"
      - url: https://unikraft.org/blog/2026-04-20-unikraft-releases-v0.21.0
        type: announcement
        title: v0.21.0 release post, platform abstraction layer
        retrieved: "2026-09-22"
        quote: >-
          the first and largest part of a major platform rearchitecture effort
          that will continue in upcoming releases
      - url: https://unikraft.org/blog/2026-06-19-unikraft-gsoc-hyperlight-platform
        type: announcement
        title: Student programme post on the Hyperlight driver in the build tooling, contributor authored
        retrieved: "2026-09-22"
        quote: "CI / integration tests for the Hyperlight driver"

  d09_provisioning:
    normalized:
      methods: "not-applicable"
      instance_start: "a virtual machine monitor invocation, or a tooling run command that can pull from a registry"
      iso: "not-applicable"
      pxe: "not-applicable"
    summary: >-
      Not applicable in the install-media sense. Nothing is installed onto a
      machine: the image is handed to a virtual machine monitor as a kernel, or
      pulled from a registry and run.
    notes: >-
      Marked not-applicable because installer media, network boot and
      partitioning presuppose installing an operating system onto persistent
      storage, and this model never does that. Bare-metal boot, where network
      boot would eventually matter, is itself still work in progress per d08.

      What does exist is recorded: four invocation contexts, including running an
      OCI image reference directly, which downloads it first if it is not
      present. Instance state such as environment variables, static network
      parameters and named volumes is declared rather than discovered.

      The documentation is candid about a real operational cost: emulation
      fallback carries a significant performance penalty when hardware
      acceleration is unavailable, and it says so.
    evidence: DOCUMENTED
    sources:
      - url: https://unikraft.org/docs/cli/running
        type: official-docs
        title: Running
        retrieved: "2026-09-22"
        quote: >-
          hardware emulation will be used and it should be noted that this has a
          significant penalty on runtime performance of the application.
      - url: https://unikraft.org/docs/internals/debugging
        type: official-docs
        title: Debugging, direct VMM invocation
        retrieved: "2026-09-22"
        quote: >-
          qemu-system-x86_64 -s -S -cpu host -enable-kvm -m 128 -nodefaults
          -no-acpi -display none -serial stdio -device isa-debug-exit -kernel
          build/app-helloworld_kvm-x86_64 -append verbose

  d10_security:
    normalized:
      attack_surface_argument: "the project's own, quoted rather than asserted"
      memory_protections: "a published status table, stale by about four years"
      single_address_space: true
      compartmentalization: "a research prototype, not in the shipped core"
      image_signing: "none"
      sbom: "none"
      provenance: "none"
      measured_boot: "none"
      encryption: "none in tree; application-level TLS through a library port"
      security_policy: "none"
      cve_process: "none"
    summary: >-
      The security argument is specialization: an image contains only what the
      application needs, so there is no shell, no unneeded services and no
      unneeded system calls. The project states this and also states its limit.
    notes: >-
      The project's own hedge is worth quoting because it is more honest than the
      category usually is: specialization "does not eliminate all attack vectors,
      it severely reduces them, especially compared to a general-purpose OS." The
      documentation also cites an external assessment critical of unikernel
      security rather than ignoring it.

      The single address space is simultaneously the performance argument and the
      reason intra-image isolation does not exist. System calls are effectively
      function calls. Cross-application isolation comes from the hypervisor.

      Several protections that do not apply are marked as such by the project
      itself, explaining that countermeasures assuming a kernel and user split
      are unnecessary where a virtual machine holds one application.

      Two significant caveats. The published hardening status table still says
      most core security features were expected by the end of 2022, roughly four
      years before this snapshot, so every in-progress and planned row is
      unverifiable as current. And compartmentalization, which would introduce
      isolation boundaries inside an image, is a research prototype with no
      corresponding library in the shipped tree.

      The largest gap is process rather than mechanism. There is no security
      policy file in the repository or the organization, no published
      vulnerability reporting address, no embargo policy, no supported-version
      statement, and no published advisories. For a project whose primary claim
      is security, that is the finding a prospective adopter most needs.
    evidence: DOCUMENTED
    sources:
      - url: https://unikraft.org/docs/concepts/security
        type: official-docs
        title: Security
        retrieved: "2026-09-22"
        quote: >-
          While this does not eliminate all attack vectors, it severely reduces
          them, especially compared to a general-purpose OS.
      - url: https://unikraft.org/docs/concepts/security
