  d14_maturity:
    normalized:
      origin: "a research project begun in 2017"
      first_release: "2020-09-11"
      current_version: "v0.21.0"
      current_version_date: "2026-05-20"
      release_cadence: "stated as every two months; measured minor intervals are much longer"
      observed_intervals: "197, 154, 112 and 250 days for the last four minor releases (0.17.0 to 0.18.0, 0.18.0 to 0.19.0, 0.19.0 to 0.20.0, 0.20.0 to 0.21.0)"
      support_model: "none published"
      support_window: "none; no release branches and no backport policy"
      commercial_support: unknown
      production_readiness_statement: "none from the project"
      version_series: "0.x, never 1.0"
    summary: >-
      Nine years from the founding announcement and six from the first release,
      still on a 0.x version. The design paper won a best-paper award, and the
      technical foundation is well regarded.
    notes: >-
      The cadence divergence is worth stating plainly because it is measurable.
      The community page states public releases are planned every two months,
      targeting specific months. The last four minor release intervals were 197,
      154, 112 and 250 days (the 0.19.1 patch release sits 57 days before 0.20.0
      and is not a minor interval), and the current release was 118 days old at
      this snapshot. The stated target has not been met for minor releases since
      at least 2024. This is a measurement, not a judgement.

      The build tooling is released far more often than the core. Its release
      listing carries a stable release about monthly (v0.12.15 on 2026-08-05,
      v0.12.16 on 2026-09-09) and a prerelease snapshot tag every few days
      between them; four tags in the three weeks before this snapshot, one of
      them stable. The project is actively developed even while core minor
      releases are infrequent.

      There is no support policy, no long-term support designation, no release
      branches and no backporting. A security fix would reach an adopter by
      moving to the newest release.

      The project publishes no production-readiness statement of its own. It
      states an aim to target real-world deployments and speaks of a production
      image as a category. The claim that the technology was considered mature
      enough for real-world deployment comes from the company, not the project,
      and the two are kept apart here.
