        retrieved: "2026-09-22"
        quote: >-
          Ubuntu Core uses full disk encryption (FDE) whenever the hardware allows
      - url: https://documentation.ubuntu.com/core/explanation/full-disk-encryption/
        type: vendor-docs
        title: "Full disk encryption, grade and storage-safety table"
        retrieved: "2026-09-22"
        quote: "storage-safety:prefer-encrypted is the same as unset"
      - url: https://documentation.ubuntu.com/security/security-features/platform-protections/secure-boot/
        type: vendor-docs
        title: "Ubuntu Secure Boot"
        retrieved: "2026-09-22"
        quote: >-
          shim works as a pre-bootloader and is signed by Microsoft. Firmware
          validates the shim signature against the certificates in the firmware. shim
          contains an embedded trust database, which includes Canonical’s signing
          certificate.
      - url: https://ubuntu.com/security/disclosure-policy
        type: vendor-docs
