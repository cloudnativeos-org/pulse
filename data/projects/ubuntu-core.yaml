    unknowns:
      - "Whether Ubuntu Core uses the same Microsoft-signed shim as classic Ubuntu. This is inferred from the general Secure Boot documentation plus Core's stated Secure Boot dependency, and no Core-specific page states it."
      - "Whether Ubuntu's FIPS validation extends to Ubuntu Core, or covers only the deb-based editions. The FIPS page does not mention Core."
      - "When the Core 26 SBOM will be published; it was listed as under review, pending release on 2026-09-22. Whether any provenance attestation is published for images or snaps."
      - "Whether dm-verity is used anywhere in the integrity chain."

  d11_operations_debugging:
    normalized:
      ssh: "available; keys pulled from a cloud identity at first boot by console-conf"
      local_shell: available
      serial_console: "supported for first-boot configuration"
      recovery_shell: "recover mode, with login by prior credentials locally or over SSH"
      api: "snapd REST API, OpenAPI compliant from Core 26"
      support_bundle: unknown
      works_without_kubernetes: "yes"
      package_manager_at_runtime: "snap only"
    summary: >-
      A device-shaped operations model: SSH with keys seeded from a cloud identity,
      a serial console path, a documented recovery login, and a REST API that became
      OpenAPI compliant at Core 26.
    notes: >-
      Getting a shell on a fresh device is genuinely different from every other entry
      here and it catches people out. There is no local password to set in the usual
      way: console-conf pulls the SSH public keys already registered against an
      Ubuntu single sign-on account and creates the user from them. The vendor
      describes console-conf as "a development tool as initial configuration of
      production devices is expected to happen in different ways". The alternative,
      for a product that cannot depend on a cloud account at first boot, is to bake a
      user in with a system-user assertion at image build time.

      The snapd REST API is the real management surface, and it covers the recovery
      modes as well as snap operations, so a device can be told to reinstall or
      factory reset programmatically. Core 26 made it OpenAPI compliant, which
      matters for anyone generating a client.

      Recover mode doubles as the debugging environment for a device that will not
      boot, since it leaves existing data intact and allows a normal login. That is a
      better answer than several entries here manage.

      No support bundle or diagnostic collection tool was found documented for Ubuntu
      Core, and no logging or monitoring documentation specific to it was located
      beyond a Core 26 release note mentioning fleet management integration with an
      observability stack.
