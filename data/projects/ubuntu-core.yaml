  d12_fleet_management:
    normalized:
      core_project:
        - "refresh scheduling through refresh.timer"
        - "refresh holds: the refresh.hold system option is capped at 90 days, and snap refresh --hold accepts forever"
        - "refresh.retain, revision retention per snap"
        - "refresh.metered, pausing refreshes on a metered connection"
        - "refresh control: gating snaps and validation sets hold named snaps at publisher-validated revisions; the gating relationship is set up once by the vendor's store team"
        - "the snapd REST API, including recovery mode selection"
      oss_companion: []
      commercial:
        - name: "Snap Store Proxy and Enterprise Store"
          vendor: Canonical
          license: proprietary
          self_hostable: true
          note: "An on-premises edge proxy that caches downloads and enables use in air-gapped or restricted networks. Part of the paid subscription."
        - name: "Brand and dedicated stores"
          vendor: Canonical
          license: proprietary
          self_hostable: false
          note: "Lets a vendor control exactly which snaps are available to its devices and when. Commercial terms are not stated on any documentation page found."
        - name: Landscape
          vendor: Canonical
          license: proprietary
          self_hostable: true
          note: "Systems management, listed as part of the device subscription. A self-hosted server edition is documented; the Core 24 release notes state Landscape 'supports both well-connected and air-gapped environments' and 'is available for Core customers', with a Landscape Client snap on the device."
        - name: "Ubuntu Pro for Devices"
          vendor: Canonical
          license: subscription
          self_hostable: false
          note: "Bundles security maintenance, Landscape, kernel livepatch, security certification and support. Years 11 to 15 need a further paid add-on."
      cluster_api:
        os_specific_provider: "none"
        maintainer: not-applicable
        upstream_provider_list: "not listed. The vendor's own listed bootstrap and control-plane providers target classic Ubuntu Server, not this product."
        provisions: not-applicable
        bootstrap_target: "none. The vendor's Cluster API bootstrap provider installs the Kubernetes snap with classic confinement, and classic snaps are documented as not installable on this system."
        image_builder_target: "none. image-builder builds classic Ubuntu Server cloud images only."
    summary: >-
      The OS itself carries real fleet-relevant controls in snapd: when devices
      refresh, how long they may defer, how many revisions they keep, what happens
      on a metered link, and which revision a gated snap may move to. Everything
      above that, including the store a device trusts, is commercial.
    notes: >-
      The split here is unusually consequential, because of how refreshes are held
      in d04: the system option is capped at 90 days, and a per-snap hold can run
      forever. Holding every snap forever is possible on paper, so the meaningful
      control for a certified system is over what an update contains. Two documented paths exist. Refresh
      control, through gating snaps and validation sets, pins named snaps at
      publisher-validated revisions using signed assertions, and the page separates
      it from "the ability for device managers to control the schedule of refreshes
      and revision control via a snap proxy". Establishing the gating relationship
      is a one-time step that "can only be performed by a user with permission from
      the team operating the store controlling the gating snap", so the mechanism is
      free to use but its enablement passes through the vendor. The second path, a
      brand store or an on-premises proxy, is commercial. The free path without
      either gives a device that updates itself from the public store on a schedule
      the operator can shift, and can hold with snap refresh --hold.

      That is a coherent design for the product's intended audience, a vendor
      shipping devices it wants to keep patched. It is recorded here without
      judgement, and both halves of the consequence appear in the tradeoffs.

      No open-source fleet-management companion for Ubuntu Core was found. The
      Kubernetes distributions are workload orchestration rather than device
      management and are recorded under d07.

      The subscription is described as payable "annually or as a one-time fee for up
      to 10 years", bundling security maintenance, systems management, kernel
      livepatch, security certification, support and trademark use, with a separate
      add-on for years 11 to 15.

      The Cluster API answer is the one in this edition most likely to be
      recorded wrong, because the vendor genuinely does maintain Cluster API
      providers and they are genuinely listed upstream. They do not target this
      product.

      The vendor's bootstrap and control-plane providers for its Kubernetes
      platform, and its separate pair for its small-Kubernetes product, appear
      in the published provider list. Their install path runs snap install for
      the Kubernetes snap with classic confinement, and the default channel they
      select carries the classic suffix. Classic snaps are documented as not
      installable on this product. That is a mechanical incompatibility rather
      than a preference, so those providers cannot provision a node running this
      system. Their cluster templates point at classic server images, and their
      bootstrap data is cloud-init.

      Two further checks came back empty. None of the vendor's Cluster API
      documentation pages names this product, and image-builder's targets are
      classic server cloud images with no target for this one.

      One correction worth carrying: the Cluster API infrastructure provider for
      the vendor's bare-metal provisioning service is maintained by a third-party
      vendor, not by this project's own vendor, and that vendor's own forum
      stated in 2025 that no official one exists. So it should not be credited
      here either.
