      2026-08-21, documents gating snaps and validation sets that hold named snaps
      at publisher-validated revisions through signed assertions, with a one-time
      store-side setup. Added to core_project; d04 notes, d12 summary and notes and
      the tradeoffs cost bullet reworded to record both paths.
    source:
      url: https://documentation.ubuntu.com/core/explanation/refresh-control/
      type: vendor-docs
      title: "Refresh control"
      retrieved: "2026-09-22"
      quote: "Refresh control allows specific snaps to be kept at a specified revision, even when a new or different revision of a snap is released."
  - date: "2026-09-22"
    field: dimensions.d12_fleet_management.normalized.commercial[2].self_hostable
    change: >-
      Landscape was unknown. Landscape's own documentation carries a self-hosted
      server installation guide, and the Core 24 release notes state Landscape
      supports air-gapped environments and is available for Core customers. Now
      true, with the subscription terms for Core devices left as an unknown.
    source:
      url: https://ubuntu.com/landscape/docs/how-to-guides/landscape-installation-and-set-up/quickstart-installation/
      type: vendor-docs
      title: "Landscape quickstart installation, self-hosted"
      retrieved: "2026-09-22"
      quote: "ppa:landscape/self-hosted-26.04"
  - date: "2026-09-22"
    field: dimensions.d06_customization.unknowns
    change: >-
      Said no page assigns testing, vulnerability response or support for a
      brand-built image. The documentation site's CVE remediation page, last updated
      2026-08-21, assigns vulnerability response per snap: Canonical for base,
      snapd, certified kernel and Canonical-maintained gadget snaps, the publisher
      for application and third-party gadget snaps. The unknown, the d06 notes, the
      d10 vulnerability_response value and the tradeoffs cost bullet now say so;
      testing and support remain unassigned.
    source:
      url: https://documentation.ubuntu.com/core/explanation/cve-remediation/
      type: vendor-docs
      title: "CVE remediation in Ubuntu Core"
      retrieved: "2026-09-22"
      quote: "CVEs affecting those dependencies must be addressed by the snap publisher"
  - date: "2026-09-22"
    field: dimensions.d13_governance.normalized.contribution_diversity.value
    change: >-
      Recorded 311 contributors, 60,618 commits and 52,814 for the top twelve. On
      2026-09-22 the contributors API without the anon parameter returned 300
      contributors, 59,005 commits and 51,914 for the top twelve, reproducibly across
      two runs; with anon=1 it returned 377 contributors and 63,625 commits. Neither
      query reproduces the recorded figures and commit counts cannot fall, so the
      earlier lookup was not the query the method described. Value and method now
      state the exact query and both results.
    source:
      url: https://github.com/snapcore/snapd
      type: source-repo
      title: snapd
      retrieved: "2026-09-22"
      quote: "300 contributors and 59,005 commits recorded by the contributors API on 2026-09-22."
  - date: "2026-09-22"
    field: dimensions.d01_os_model.sources[0].quote
    change: >-
      Quote began "the base snap holds" and ended at "root file system."; the page
      reads "base snap holds ... the root file system for Ubuntu Core images."
      Made verbatim. Same class of fix applied to d05 sources[2] (curly quotes
      around the 1 key) and to the d02 prose, which now cites the snapcraft
      confinement page the "complete isolation" wording actually comes from.
    source:
      url: https://documentation.ubuntu.com/core/explanation/core-elements/inside-ubuntu-core/
      type: vendor-docs
      title: Inside Ubuntu Core
      retrieved: "2026-09-22"
      quote: "base snap holds the execution environment inside which applications run. It also serves as the root file system for Ubuntu Core images."
  - date: "2026-10-05"
    field: dimensions.d04_upgrade.normalized.self_hostable_update_server
    change: >-
      Added a value for the self-hostable update source column, which rendered as Not collected. The value is commercial-only. The documented on-premises source is Canonical's proprietary Enterprise Store. No open store server is published.
    source:
      url: https://documentation.ubuntu.com/core/explanation/stores/store-overview/
      type: vendor-docs
      title: "Snap store overview, on-premises proxy"
      retrieved: "2026-10-05"
      quote: >-
        The Enterprise Store is an on-premise edge proxy that creates a local cache of downloaded files.
  - date: "2026-10-05"
    field: dimensions.d04_upgrade.normalized.maximum_deferral
    change: >-
      Said a refresh happens after at most 90 days whatever the hold, and that no configuration makes a device never update. The 90 day cap belongs to the refresh.hold system option. The cited page also documents snap refresh --hold, which accepts forever and defaults to forever. Changed maximum_deferral, can_be_disabled, the d04 and d12 notes, the d12 core_project entry and the costs line. The effect on the kernel, base, gadget and snapd snaps is recorded as unknown.
    source:
      url: https://snapcraft.io/docs/how-to-guides/manage-snaps/manage-updates/
      type: official-docs
      title: "Managing updates, snap refresh --hold"
      retrieved: "2026-10-05"
      quote: >-
        To postpone updates indefinitely, a value of forever is also valid.
  - date: "2026-10-06"
    field: "tradeoffs"
    change: "Methodology section 9, rule 18: build-your-own responsibility is a status of the build-your-own capability. Moved cost c3 ('A brand that builds and signs its own image owns the result. Vulnerability response is assigned per snap, with application and third-party gadget snaps on their publisher, and testing and support for the assembled image are assigned nowhere that was found.') into buy b7, which now ends 'The brand owns the assembled image: vulnerability response is per snap, with application and third-party gadget snaps on their publisher, and testing and support for the image are assigned nowhere that was found.' Every fact kept."
  - date: '2026-10-12'
    field: dimensions.d02_immutability.normalized
    change: 'Removed ''loop-mounted'' from read_only_mechanism: no source read for this edition states a loop mount, so the value now says squashfs images presented read-only, as the documentation says and as snapd''s mount code treats squashfs. Turned the ephemeral string into a list limited to install and recover modes, as the documentation states. Added ephemeral_mechanism, immutability_disable_where and configurable_paths for the Mounts row.'
    source:
      url: https://documentation.ubuntu.com/core/explanation/core-elements/inside-ubuntu-core/
      type: official-docs
      title: 'Inside Ubuntu Core: ephemeral modes'
      retrieved: '2026-10-12'
      quote: will mount a temporary filesystem for this.
  - date: '2026-10-12'
    field: dimensions.d06_customization.normalized.add_software
    change: 'Added the add_software field. It records how an adopter adds software to the OS itself, not workloads. Values: Snaps. Each value has its sources, read on 2026-10-12.'
    source:
      url: https://documentation.ubuntu.com/core/explanation/core-elements/inside-ubuntu-core/
      type: official-docs
      title: 'Ubuntu Core docs: Inside Ubuntu Core'
      retrieved: '2026-10-12'
      quote: The kernel, boot assets, runtime environment, applications and device enablement capabilities are all delivered as snaps that are controlled by snapd
  - date: "2026-10-19"
    field: "dimensions.d05_rollback_recovery.normalized.automatic_rollback_on_boot_failure"
    change: "Was available (\"Yes\"). The only page that describes the test boot and its undo is about remodelling; no page read documents it for an ordinary refresh. Now \"documented for a remodel only\", with the remodel page and the documentation home page as the first d05 sources."
    source:
      url: "https://documentation.ubuntu.com/core/explanation/remodel-essential-snaps/"
      type: "vendor-docs"
      title: "Remodel essential snaps"
