      released: "2024-06-04"
      eol: "standard security maintenance to June 2034, Legacy add-on to June 2039, per the vendor's support-duration table; the Core 24 release notes separately state 12 years, see d14"
    - channel: "Ubuntu Core 22"
      version: "22"
      released: "2022-06-15"
      eol: "standard security maintenance to June 2032, Legacy add-on to June 2037, per the vendor's support-duration table"

taxonomy:
  workload_scope: general-purpose-host
  construction_model:
    - vendor-fixed-image
    - framework
  root_state_substrate:
    - snap-image-set
  notes: >-
    Kubernetes is neither required nor bundled, and the device runs whatever snaps
    the model includes, which places this at the general-purpose-host position on
    axis A. It is the most constrained entry at that position in this edition:
    general-purpose in the sense that Kubernetes is one optional workload among
    many, not in the sense of offering a general-purpose package archive.

    Construction is both vendor-fixed and framework, and which one applies depends
    on who is deploying. Canonical publishes reference images and publishes every
    composing snap. A vendor shipping a product builds its own image from its own
    signed model assertion and gadget snap, and therefore owns the result. The
    framework cost is recorded in `tradeoffs.costs`, as this survey's vocabulary
    requires of any entry claiming that value.

    `snap-image-set` is a vocabulary value added in this edition for this entry.
    The OS state is not one root image, not an OSTree deployment and not a package
    database: it is a set of independently versioned, independently refreshable
    read-only squashfs snaps, of which the base snap serves as the root filesystem,
    on a fixed four-partition layout. Forcing it into `ab-partition-image` or
    `package-repository` would have destroyed the fact that the kernel and the root
    filesystem update independently of each other.

dimensions:
  d01_os_model:
    normalized:
      workload_scope: general-purpose-host
      ships_kubernetes: false
      deb_packages_on_device: false
      composing_snaps:
        - "snapd, the system daemon that supervises the other snaps"
        - "kernel snap, the kernel image and its modules"
        - "base snap, the execution environment and root filesystem"
        - "gadget snap, board-specific bootloader, device tree and configuration"
        - "application snaps"
      target: "appliances, IoT, embedded and edge devices"
    summary: >-
      A device operating system composed entirely of snaps, where the kernel, the
      root filesystem and the board integration layer are each a separately
      versioned read-only image. It ships no Kubernetes and no deb userspace.
    notes: >-
      The five-part composition is the architecture, not an implementation detail,
      and it is what makes several later dimensions unusual. The base snap "holds
      the execution environment inside which applications run. It also serves as
      the root file system". The gadget snap holds "board-specific binaries and
      data, such as bootloader, device tree, configuration files", which is where
      hardware enablement lives. snapd "supervises all other snaps".

      Canonical's own editions page calls it "an all-snap edition designed for
      appliances and IoT", with "a lightweight, strictly confined architecture".
      The device framing is consistent across every page found and is not a
      marketing gloss: the provisioning, fleet and support stories all assume a
      product built by a brand and shipped to a field population, rather than a
      node joined to a cluster.

      A reader comparing this against the Kubernetes-oriented hosts in this edition
      should expect the differences to be real rather than cosmetic. This entry is
      the only one whose primary deployment story is a manufactured product.
    evidence: DOCUMENTED
    sources:
      - url: https://documentation.ubuntu.com/core/explanation/core-elements/inside-ubuntu-core/
        type: vendor-docs
        title: Inside Ubuntu Core
        retrieved: "2026-09-22"
        quote: >-
          base snap holds the execution environment inside which applications run.
          It also serves as the root file system for Ubuntu Core images.
      - url: https://ubuntu.com/about/release-cycle
        type: vendor-docs
        title: "Ubuntu editions and release cycle"
        retrieved: "2026-09-22"
        quote: >-
          Ubuntu Core is an all-snap edition designed for appliances and IoT. With a
          lightweight, strictly confined architecture, it's highly secure and
          reliable
      - url: https://ubuntu.com/core
        type: vendor-docs
        title: Ubuntu Core
        retrieved: "2026-09-22"
        quote: "Ubuntu Core is immutable and strictly confined"
    unknowns:
      - "Whether any supported path exists for installing deb packages on a production device. No page found describes one."

  d02_immutability:
    normalized:
      read_only:
        - "every snap, including the base snap that serves as the root filesystem"
        - ubuntu-seed
        - ubuntu-boot
      writable_and_persistent:
        - "ubuntu-data, holding system and user data"
        - "ubuntu-save, holding device identity and recovery data"
      integrity_mechanism:
        - image-by-construction
      dm_verity: unknown
      runtime_integrity_verification: "assertion signature checking at install and refresh; TPM key sealing to boot state where FDE is active"
      confinement: "AppArmor profiles and seccomp filters generated per app, plus mount namespaces per snap"
      read_only_mechanism: snap images (squashfs), presented read-only
      ephemeral:
        - the whole system, in install and recover modes only
      ephemeral_mechanism: tmpfs
      immutability_can_be_disabled: only by building a grade:dangerous model, which is documented for development only
      immutability_disable_where: build time, with a model of grade dangerous (documented for development only)
      configurable_paths:
        value: 'yes'
        evidence: DOCUMENTED
        how: 'Only to add storage: declare extra partitions in the gadget snap''s volume layout, before ubuntu-boot. The roles and the read-only set stay fixed.'
        sources:
          - url: https://documentation.ubuntu.com/core/reference/gadget-snap-format/
            type: official-docs
            title: 'Gadget snap format: extra partitions'
            retrieved: '2026-10-12'
            quote: If extra partitions are required, they need to be declared and created before ubuntu-boot.
      mounts_sources:
        - url: https://documentation.ubuntu.com/core/explanation/core-elements/snaps-in-ubuntu-core/
          type: official-docs
          title: 'Ubuntu Core snaps: read-only presentation'
          retrieved: '2026-10-12'
          quote: As with the core file system, snaps are presented to the system as read-only
        - url: https://documentation.ubuntu.com/core/explanation/core-elements/inside-ubuntu-core/
          type: official-docs
          title: 'Inside Ubuntu Core: ephemeral modes'
          retrieved: '2026-10-12'
          quote: will mount a temporary filesystem for this.
        - url: https://github.com/canonical/snapd/blob/e1f349c/systemd/systemd.go
          type: source-repo
          title: 'snapd: mount unit for a squashfs snap'
          retrieved: '2026-10-12'
          quote: if fstype == "squashfs" {
        - url: https://documentation.ubuntu.com/core/explanation/core-elements/inside-ubuntu-core/
          type: official-docs
          title: 'Inside Ubuntu Core: ubuntu-data'
          retrieved: '2026-10-12'
          quote: 'ubuntu-data (role: system-data; writable, ext4): stores user and system data.'
    summary: >-
      Every component of the OS is a read-only squashfs image, and writable state is
      confined to two named partitions. Immutability here is a property of the
      artifact format rather than of a mount option or a verity device.
    notes: >-
      The partition layout is fixed and documented by role: ubuntu-seed and
      ubuntu-boot are read-only and hold the recovery systems and the unpacked
      kernels; ubuntu-save is writable and holds device identity and recovery data,
      and is "mandatory on encrypted systems"; ubuntu-data is writable and holds
      system and user data. So /etc and general system state are writable, on
      ubuntu-data, while the OS images themselves cannot be modified at all.

      **Strict confinement is a separate property from immutability and the two are
      easy to conflate.** Immutability says the OS images cannot change.
      Confinement says an application cannot reach outside its sandbox: strictly
      confined snaps "run in complete isolation, up to a minimal access level that's
      deemed always safe" and "can not access files, network, processes or any other
      system resource without requesting specific access via an interface". snapd
      generates an AppArmor profile per app and per service and seccomp filters per
      app, and snaps run in their own mount namespaces. This is on by default rather
      than a hardening step, and it is the strongest application-level sandbox in
      this edition.

      The escape hatch is at build time, not at runtime. A model assertion with
      grade dangerous relaxes the constraints and allows unasserted or devmode
      snaps, and is documented as "meant only for development purposes". There is no
      documented runtime toggle that makes a production device mutable.

      dm-verity is recorded as unknown rather than absent. The full disk encryption
      documentation and the core-elements pages were read and neither uses the term,
      but squashfs images are hash-verified by the store assertion chain at install
      and the FDE key is sealed to boot state, so the integrity story is real even
      though its relationship to verity is undocumented. Missing documentation is not
      treated as proof of absence here.
    evidence: DOCUMENTED
    sources:
      - url: https://documentation.ubuntu.com/core/explanation/core-elements/storage-layout/
        type: vendor-docs
        title: "Ubuntu Core storage layout"
        retrieved: "2026-09-22"
        quote: >-
          Stores device identity backup data and data to facilitate recovery or
          re-install. This partition is mandatory on encrypted systems
      - url: https://documentation.ubuntu.com/security/security-features/privilege-restriction/snap-confinement/
        type: vendor-docs
        title: "Snap confinement"
        retrieved: "2026-09-22"
        quote: >-
          Snapd generates AppArmor profiles for each app (a particular way of invoking
          an executable) and service (daemon managed by snapd) defined in a snap
          package. ... Snapd also generates Seccomp filters for each app in a snap.
      - url: https://snapcraft.io/docs/explanation/security/snap-confinement/
        type: official-docs
        title: "Snap confinement, strict"
        retrieved: "2026-09-22"
        quote: >-
          Strictly confined snaps run in complete isolation, up to a minimal access
          level that’s deemed always safe.
      - url: https://documentation.ubuntu.com/core/reference/assertions/model/
        type: vendor-docs
        title: "Model assertion, grade"
        retrieved: "2026-09-22"
        quote: >-
          dangerous ... allow for the use of unasserted snaps, devmode snaps, or the
          presence of extra snaps ... meant only for development purposes
      - url: https://documentation.ubuntu.com/core/explanation/how-installation-works/
        type: vendor-docs
        title: "How installation works, ephemeral modes"
        retrieved: "2026-09-22"
        quote: "the system is running from tmpfs in an ephemeral state"
    unknowns:
      - "Whether dm-verity is used anywhere in the boot or integrity chain. The FDE and core-elements pages were read and neither mentions it."

  d03_artifact:
    normalized:
      primary_artifact: "a flashable device image built from a signed model assertion"
      composing_artifact: "snap, a squashfs image"
      build_tool: ubuntu-image
      oci_registry_distribution: false
      content_addressable: unknown
      mirrorable: "through a commercial on-premises proxy, not through a published store implementation"
      signed: "assertion chain; the model is signed by the brand account"
      model_grades:
        - "dangerous: development only, unasserted snaps permitted"
        - "signed: the default; no unasserted snaps and none outside the model"
        - "secured: signed, plus full disk encryption and Secure Boot are mandatory"
      air_gapped: "supported through a commercial on-premises store proxy"
    summary: >-
      The deployable artifact is a device image built by ubuntu-image from a signed
      model assertion plus a set of snaps. The model assertion, not the image, is
      the thing that defines and authenticates the device.
    notes: >-
      The model assertion is the distinguishing artifact of this entry and it has no
      close equivalent elsewhere in this edition. It is "a text-based document that
      contains the fundamental definition of a snap-based device" that "describes
      what the system image includes and is signed by the brand account owning the
      device definition", and it is used for "first boot verification of the system
      seed before its snaps are turned into an installed system". The device's
      identity and its permitted software set are one signed document.

      Its grade field is a genuine security control rather than a label. Under
      signed, the default, "no unasserted (unsigned) snaps or snaps not mentioned in
      the model can appear or be used in the recovery system". Under secured, full
      disk encryption and Secure Boot become mandatory. A separate storage-safety
      field can require encryption and fail the install if the hardware cannot
      provide it.

      The OS is not distributed through an OCI registry. Distribution is the Snap
      Store.

      **Mirroring and air-gapped operation are possible, and they are a commercial
      product rather than a property of the OS.** Canonical's on-premises proxy,
      documented as an edge proxy that caches downloads and allows snaps to be used
      "in air-gapped or restricted networking environments", is part of the paid
      subscription. Brand stores let a vendor "control exactly what snaps are
      available, and when". No published implementation of the store server itself
      was found, so an adopter cannot stand up an independent equivalent from
      published sources. The commercial terms of brand stores were not stated on any
      documentation page found.
    evidence: DOCUMENTED
    sources:
      - url: https://documentation.ubuntu.com/core/reference/assertions/model/
        type: vendor-docs
        title: "Model assertion"
        retrieved: "2026-09-22"
        quote: >-
          a text-based document that contains the fundamental definition of a
          snap-based device ... signed by the brand account owning the device
          definition
      - url: https://documentation.ubuntu.com/core/reference/assertions/model/
        type: vendor-docs
        title: "Model assertion, signed grade"
        retrieved: "2026-09-22"
        quote: >-
          no unasserted (unsigned) snaps or snaps not mentioned in the model can
          appear or be used in the recovery system
      - url: https://documentation.ubuntu.com/core/explanation/stores/store-overview/
        type: vendor-docs
        title: "Snap store overview"
        retrieved: "2026-09-22"
        quote: >-
          The Enterprise Store is an on-premise edge proxy that creates a local cache
          of downloaded files. This speeds up subsequent downloads, and allows
          organizations to use snaps in air-gapped or restricted networking
          environments.
      - url: https://documentation.ubuntu.com/core/explanation/stores/dedicated-snap-store/
        type: vendor-docs
        title: "Dedicated snap store"
        retrieved: "2026-09-22"
        quote: >-
          can inherit selected packages from other snap stores, and host a set of
          snaps specific to a brand and device models
    unknowns:
      - "Whether an implementation of the Snap Store server is published anywhere. None was found, and the question is left open rather than answered from a non-primary source."
      - "Whether dedicated brand stores are a paid product, a capability of any publisher account, or something in between. No documentation page states commercial terms."

  d04_upgrade:
    normalized:
      fleet_upgrade:
        self_update: "snapd checks for refreshes 4 times a day."
        paths:
          - kind: fleet-server
            name: "Snap Store or brand store with validation sets"
            license: "proprietary"
            class: service
            reconciliation: in-place
            filter: true
            note: "Validation sets are an optional desired-state pin. They are in-place when enforced."
            evidence: DOCUMENTED
            sources:
              - url: https://documentation.ubuntu.com/snapcraft/
                title: "Snapcraft documentation"
                retrieved: "2026-10-06"
          - kind: fleet-server
            name: "Landscape"
            license: "proprietary"
            class: proprietary
            reconciliation: one-shot
            filter: true
            note: "The server is proprietary and comes with Ubuntu Pro. The client is GPL-2.0. Self-hostable. The Core 24 notes mention canary releases. The reconciliation mode is inferred."
            evidence: INFERRED
            sources:
              - url: https://ubuntu.com/landscape
                title: "Landscape"
                retrieved: "2026-10-06"
          - kind: fleet-server
            name: "Canonical Enterprise Store"
            license: "proprietary"
            class: proprietary
            filter: true
            note: "An on-premises proxy with revision overrides. The reconciliation mode is inferred."
            evidence: INFERRED
            sources:
              - url: https://ubuntu.com/core/docs
                title: "Ubuntu Core documentation"
                retrieved: "2026-10-06"
      version_identity:
        identifier: "By default none for the whole OS: the model assertion plus a revision per snap. With a pinning validation set: account-id/name/sequence"
        condition: "The fleet's OS version is the own-brand model assertion plus an enforced validation set that pins the base, kernel, gadget and snapd snaps at fixed revisions. This works on the public Snap Store, and a brand store is not required: the store header of a model is optional, and a device without it uses the main Ubuntu store. Without an enforced validation set, each device refreshes its snaps on its own, and R1 is not met."
        evidence: DOCUMENTED
        sources:
          - url: https://github.com/canonical/models/blob/78b94dc/ubuntu-core-24-amd64.json
            type: source-code
            title: "Ubuntu Core 24 amd64 model"
            retrieved: "2026-10-06"
          - url: https://documentation.ubuntu.com/core/reference/assertions/model/
            type: vendor-docs
            title: "Ubuntu Core model assertion"
            retrieved: "2026-10-14"
          - url: https://snapcraft.io/docs/manage-validation-sets
            type: vendor-docs
            title: "Manage validation sets"
            retrieved: "2026-10-14"
          - url: https://github.com/canonical/ubuntu-core-docs/blob/9321118/docs/reference/assertions/model.md
            type: official-docs
            title: "Ubuntu Core model assertion"
            retrieved: "2026-10-06"
            quote: >-
              If a sequence _is_ specified, then **only** that sequence is permitted for the lifetime of the device
      mechanism:
        - snap-revision-refresh
      scope: per-snap
      scope_sources:
        - url: https://documentation.ubuntu.com/core/explanation/core-elements/snaps-in-ubuntu-core/
          type: official-docs
          title: Snaps in Ubuntu Core
          retrieved: '2026-10-06'
          quote: the kernel snap may be updated at any time
        - url: https://documentation.ubuntu.com/core/explanation/refresh-control/
          type: official-docs
          title: Ubuntu Core refresh control
          retrieved: '2026-10-06'
          quote: Refresh control allows specific snaps to be kept at a specified revision, even when a new or different revision of a snap is released.
      granularity: "kernel, base, gadget, snapd and applications refresh independently"
      initiator: "snapd, automatically"
      default_schedule: "four refresh checks per day"
      can_be_disabled: "no setting turns refreshes off. Auto-refreshes can be held with snap refresh --hold, which defaults to forever."
      maximum_deferral: "indefinite with snap refresh --hold=forever; the refresh.hold system option is capped at 90 days"
      requires_kubernetes: false
      requires_vendor_infrastructure: "yes by default; a commercial on-premises proxy or a brand store can substitute"
      self_hostable_update_server: commercial-only
      self_hostable_update_source: "Canonical Enterprise Store, a paid on-premises proxy"
      self_hostable_update_server_evidence: DOCUMENTED
      self_hostable_update_server_note: "Yes through Canonical Enterprise Store (formerly Snap Store Proxy), a proprietary on-premises proxy in the paid subscription. No published store server exists."
      artifact_verification: "assertion chain"
      metered_connection_handling: "refreshes pause on a connection marked metered"
    summary: >-
      Each snap refreshes independently on snapd's own schedule, four checks a day
      by default. The kernel and the root filesystem are separate updates, so there
      is no single whole-OS version that moves as one unit.
    notes: >-
      **Automatic updates can be deferred for 90 days with the system option, and
      indefinitely with a per-snap or all-snap hold.** The refresh.hold system option
      is documented as a delay of up to 90 days: "After a refresh, the next refresh
      can be delayed by up to 90 days, after which a refresh will be performed
      regardless of the refresh.hold value". The same page documents a separate
      command, snap refresh --hold=<duration>, and says "To postpone updates
      indefinitely, a value of forever is also valid" and "If no duration is
      specified, the time duration defaults to forever". With no snap named, the hold
      applies to all installed snaps, and is effective only on auto-refreshes. The
      page lists no exception for the kernel, base, gadget or snapd snaps, and no Ubuntu
      Core page was found that confirms or denies a forever hold on them. This is a
      deliberate design position with a real operational consequence, and it
      differs from every other entry in this edition by a setting the operator must
      choose, not by a ceiling.

      Whether that is a benefit or a cost depends entirely on who is asking. For a
      vendor shipping a field population of devices it guarantees that a security
      fix eventually lands everywhere without per-device cooperation. For an
      operator running a change-controlled or certified system it is a constraint
      that has to be designed around, by controlling what a refresh actually
      delivers rather than by stopping refreshes.

      Two documented mechanisms do that without a brand store or proxy. Refresh
      control "allows specific snaps to be kept at a specified revision, even when a
      new or different revision of a snap is released", through a gating snap whose
      publisher signs validation assertions naming the permitted revision, or through
      a validation set. The gating relationship is established once, and the page
      states that "the Canonical Store team does this initial setup", so the
      mechanism is in snapd and the assertion format but its enablement passes
      through the vendor's store. A gated snap without a validation assertion does
      not refresh at all.

      Moving between major Core versions is a separate operation from the refresh
      cycle. "Upgrades are performed by remodeling, which is the process of replacing
      one model assertion with another on a deployed system", and the documented
      procedure is `snap remodel` with a new signed model whose base and system snaps
      point at the next release.

      Per-snap granularity is the other structural difference. Because the kernel
      snap and the base snap are separate, a kernel update and a root filesystem
      update are separate events with separate rollback state. Most entries here
      swap kernel and userspace together as one artifact.

      The default trust root and distribution channel is the vendor's store. The
      documented alternatives, the on-premises proxy and brand stores, are the
      vendor's products too, so avoiding the public store does not mean avoiding the
      vendor's infrastructure.
    evidence: DOCUMENTED
    sources:
      - url: https://snapcraft.io/docs/how-to-guides/manage-snaps/manage-updates/
        type: official-docs
        title: "Managing updates"
        retrieved: "2026-09-22"
        quote: >-
