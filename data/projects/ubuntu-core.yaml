open_questions:
  - "Is there a released, installable Ubuntu Core riscv64 image for any board today, or is riscv architecture support in the build tooling only? On 2026-09-22 the vendor's testing-platforms page and the cdimage directories for Core 22, 24 and 26 listed none."
  - "Is there an armhf image for Core 24 or Core 26? The support-duration table lists armhf for both and the cdimage directories carry only amd64 and arm64 images for them."
  - "How many consecutive failed boots does Ubuntu Core tolerate before rolling back a kernel or base snap, and what exactly counts as a successful boot?"
  - "Can a device enter a recovery mode automatically after repeated failures, or is every entry operator-initiated?"
  - "Does Ubuntu Core use dm-verity anywhere in its boot or integrity chain, or is the integrity story entirely read-only images, the assertion chain and TPM sealing?"
  - "Does Ubuntu Core use the same Microsoft-signed shim as classic Ubuntu? What should an adopter expect for Secure Boot on stock firmware with an image they signed themselves?"
  - "Does Ubuntu's FIPS validation extend to Ubuntu Core, or does it cover only the deb-based editions?"
  - "When will the Core 26 SBOM be published, given it was listed as under review, pending release on 2026-09-22, and is any provenance attestation published for images or snaps?"
  - "Is any implementation of the Snap Store server published, and is there an official statement on its status?"
  - "Are dedicated brand stores a paid product, a capability of any publisher account, or something in between?"
  - "Does the Ubuntu Technical Board's published remit formally cover snapd and Ubuntu Core, or are both governed through internal engineering process only?"
  - "Are the Core 24 release notes' twelve years and the support-duration table's ten plus five for the same release a wording error or a difference in terms?"
  - "Does anything before Ubuntu Core 16 (June 2016) count as a release of this product? The vendor's support-duration table starts there."
  - "Is Canonical Kubernetes, the k8s snap, documented or published for Ubuntu Core? No page found mentions it and only classic-suffixed stable tracks were observed in the store on 2026-09-22."
  - "Is any GPU or accelerator enablement documented for Core 26, and is any accelerator other than NVIDIA documented at all?"
  - "Who owns testing and support for an image a brand builds and signs itself? Vulnerability response is assigned per snap; testing and support of the assembled image are not."
  - "Does the self-hosted Landscape server manage Ubuntu Core devices without a paid subscription?"
  - "How do cloud-init, gadget defaults and console-conf interact when more than one is present, and is any configuration mechanism reapplied after first boot?"
  - "Can snap refresh --hold hold the kernel, base, gadget and snapd snaps forever on Ubuntu Core? refresh.hold is capped at 90 days, and no Core page confirms a forever hold for them."
  - "Does Ubuntu Core ship a support bundle tool, and is there Core-specific logging or monitoring documentation?"

