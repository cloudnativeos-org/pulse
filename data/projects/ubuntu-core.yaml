  d10_security:
    normalized:
      boot_trust_chain:
        level: 2
        how: default-on
        note: Needs a device with UEFI Secure Boot and TPM 2.0. kernel.efi is a signed UKI, and
          disk encryption is sealed to the EFI boot state. The base snap is mounted from disk; snap dm-verity
          exists in snapd but is not enabled at boot
        evidence: DOCUMENTED
        sources:
        - url: https://documentation.ubuntu.com/core/explanation/full-disk-encryption/
          type: official-docs
          title: Ubuntu Core full disk encryption
          retrieved: '2026-10-06'
          quote: Built-in FDE support requires both UEFI Secure Boot and TPM 2.0
        - url: https://github.com/canonical/snapd/blob/e5a0d3605f8c03d6dd51f5d9ad53fd37dab7aa6a/cmd/snap-bootstrap/cmd_initramfs_mounts.go#L1862-L1867
          type: source-code
          title: snapd initramfs mounts
          retrieved: '2026-10-06'
          quote: getVerityOptions(essentialSnap.Path, nil)
      secure_boot: "required for the built-in full disk encryption; the shim chain is Canonical's, with a Microsoft-signed shim on classic Ubuntu"
      measured_boot: "the FDE key is sealed to the full EFI state including the kernel command line"
      tpm: "TPM 2.0 on x86, OP-TEE on Arm"
      integrity: image-by-construction
      dm_verity: unknown
      disk_encryption: "built in, and activated automatically on capable hardware under the default model grade"
      artifact_verification: "assertion chain, with the model signed by the brand account"
      sbom: "published per release on the documentation site for Core 20, 22 and 24; the Core 26 SBOM is listed as under review, pending release"
      provenance: unknown
      fips: "available for Ubuntu under a paid subscription; applicability to Ubuntu Core not stated"
      mandatory_access_control: "AppArmor, generated per app, plus seccomp filters"
      vulnerability_response: "initial response intended within two business days; CVE details published within a week of update notifications; fixes ship as new snap revisions, by Canonical for base, snapd, certified kernel and Canonical-maintained gadget snaps, and by the publisher for application and third-party gadget snaps"
      default_on:
        - strict-confinement
        - apparmor-and-seccomp-per-app
        - automatic-updates
        - full-disk-encryption-on-capable-hardware
      opt_in:
        - secured-model-grade
        - fips
    summary: >-
      Full disk encryption bound to the TPM is on by default on hardware that
      supports it, sealed to the boot state. Application confinement is mandatory
      and generated automatically. Integrity of the OS rests on read-only images and
      the assertion chain rather than on a verity device.
    notes: >-
      **Default-on TPM-backed encryption is the standout security property in this
      edition.** The mechanism is specific rather than a claim: "Ubuntu Core uses
      full disk encryption (FDE) whenever the hardware allows", "TPM-based FDE seals
      the FDE secret key to the full EFI state, including the kernel command line,
      which is subsequently unsealed by the initrd code in the secure-boot protected
      kernel.efi at boot time", and it requires "both UEFI Secure Boot and TPM 2.0".
      The default is stated as a table rather than a sentence: with hardware
      support, grade signed with storage-safety unset yields encrypted, and the page
      notes that "storage-safety:prefer-encrypted is the same as unset". No other
      entry here encrypts by default without the operator choosing it.

      Secure Boot is therefore a hard dependency of the encryption story rather than
      an optional extra. Canonical's classic Ubuntu shim is Microsoft-signed and
      carries "an embedded trust database, which includes Canonical's signing
      certificate", used to validate GRUB and the kernel. That the same chain applies to
      Ubuntu Core is an inference from the two facts together rather than a statement
      found on a Core-specific page, and it is recorded as such, because whose key
      signs what is exactly the FR-14 question and it deserves a Core-specific
      source.

      The confinement model is the strongest application sandbox in this edition and
      it is also its own attack surface, which is worth recording as a dated fact
      rather than a hypothetical. CVE-2026-8933 is a local privilege escalation in
      snap-confine, "used internally by Canonical snapd to construct the secure
      execution environment", rated 7.8, affecting the 22.04, 24.04 and 26.04 bases,
      with fixed versions published per release. A mechanism that mediates every
      application's access to the system is a high-value target, and this is what the
      response to one such finding looked like.

      The published vulnerability response commitment is concrete, which is unusual
      in this edition: an intended initial response "within two business days", CVE
      details published "within one week after we provide update notifications or
      release new versions of software", and a recommended embargo of at least a week
      after fixes are published.

      Vulnerability handling for a running device is documented per snap rather
      than per system. A CVE in a base snap, snapd or a certified kernel snap "is
      fixed by rebuilding and releasing a new revision of that base snap by
      Canonical", an application snap's dependencies "must be addressed by the snap
      publisher", and a third-party gadget snap's bootloader is its publisher's
      responsibility. Fixes arrive as new snap revisions, and the page states that
      "the version field is informational and may not change for rebuilds that
      include CVE fixes", so an operator auditing patch state reads revisions, not
      version strings.

      SBOMs are published per release on the documentation site: Core 20, 22 and 24
      each have a linked SBOM, and the Core 26 entry read "under review, pending
      release" on 2026-09-22, four months after the release. The Core 26 release
      notes list "CRA compliance" as a key update. No provenance attestation for the
      images or the snaps was found.

      FIPS is a paid subscription feature covering "a set of cryptographic packages"
      including the kernel and OpenSSL. The page describing it does not mention
      Ubuntu Core, so whether a snap-based system inherits that validation is
      recorded as unknown rather than assumed either way.
    evidence: DOCUMENTED
    sources:
      - url: https://documentation.ubuntu.com/core/explanation/full-disk-encryption/
        type: vendor-docs
        title: "Full disk encryption"
        retrieved: "2026-09-22"
        quote: >-
          TPM-based FDE seals the FDE secret key to the full EFI state, including the
          kernel command line, which is subsequently unsealed by the initrd code in
          the secure-boot protected kernel.efi at boot time.
      - url: https://documentation.ubuntu.com/core/explanation/full-disk-encryption/
        type: vendor-docs
