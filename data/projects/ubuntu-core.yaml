                only applied during the first boot
      methods:
        - image-flashing
        - virtual-machine
        - factory-provisioning
      install_flow: "boot ubuntu-seed, run install mode from tmpfs, create partitions, optionally encrypt and seal keys, reboot into run mode, seed the snaps"
      config_mechanism: "console-conf at first boot (described by the vendor as a development tool), gadget defaults, system-user assertion, cloud-init"
      factory_support: "a factory-image hint governing factory-only resources, cleared before the first boot into run mode; an install-device gadget hook for early hardware and firmware configuration"
      config_reapplied: unknown
    summary: >-
      Installation runs from an ephemeral system on the read-only seed partition,
      creates and optionally encrypts the partitions, then reboots into the real
      system and seeds its snaps. A documented factory mode exists for manufacturing
      lines.
    notes: >-
      The six-step install sequence is documented end to end, and the property worth
      noting is that the installer itself runs from tmpfs out of a read-only recovery
      system, so the thing that creates the device has no writable state of its own.

      Factory provisioning is documented as a first-class scenario rather than left
      to the adopter, which is consistent with the product framing. An image can
      carry a factory-image hint that governs access to factory-only resources and is
      "cleared directly before rebooting into run mode", and a gadget install-device
      hook runs "before rebooting into run mode" for "early hardware and firmware
      configuration". Very few entries in this edition document a manufacturing step
      at all.

      First-boot device and user configuration has a mechanism that surprises people
      coming from server Linux. console-conf presents a text menu over a display or a
      serial connection, the administrator's "email needs to be registered in
      Ubuntu", and "console-conf will create a user in the device and pull the ssh
      keys registered in Ubuntu", so the keys come from the cloud identity. From
      Core 24 onward console-conf is a separate snap rather than part of the base:
      it "used to be part of the base snap in UC22 and older versions". The vendor
      describes it as "a development tool as initial configuration of production
      devices is expected to happen in different ways", and the documented
      production alternatives are a system-user assertion baked into the image and
      gadget defaults.

      cloud-init is documented as supported. The Core 26 release notes state that
      the bundled Python change "does not affect cloud-init usage, which will remain
      present and fully supported in this release", with cloud-init moving to a
      separate core26 track, and the Core 22 notes list "Initial MAAS & cloud-init
      support". The gadget snap carries "cloud-init configuration for edge
      virtualisation use cases". How cloud-init, gadget defaults and console-conf
      interact when more than one is present was not found documented.
