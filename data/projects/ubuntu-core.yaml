      - url: https://snapcraft.io/docs/how-to-guides/manage-snaps/manage-updates/
        type: official-docs
        title: "Managing updates, refresh schedule"
        retrieved: "2026-09-22"
        quote: >-
          the snapd daemon checks for updates 4 times a day. Each update check is
          called a refresh.
      - url: https://documentation.ubuntu.com/core/reference/release-notes/
        type: vendor-docs
        title: "Release notes, point updates via snaps"
        retrieved: "2026-09-22"
        quote: >-
          snapd, and other essential snaps composing the system (gadget, base and
          kernel snaps)
      - url: https://documentation.ubuntu.com/core/explanation/refresh-control/
        type: vendor-docs
        title: "Refresh control"
        retrieved: "2026-09-22"
        quote: >-
          Refresh control allows specific snaps to be kept at a specified revision,
          even when a new or different revision of a snap is released.
      - url: https://documentation.ubuntu.com/core/how-to-guides/manage-ubuntu-core/upgrade-ubuntu-core/
        type: vendor-docs
        title: "Upgrade Ubuntu Core"
        retrieved: "2026-09-22"
        quote: >-
          Upgrades are performed by remodeling, which is the process of replacing one
          model assertion with another on a deployed system.
      - url: https://documentation.ubuntu.com/core/explanation/stores/store-overview/
        type: vendor-docs
        title: "Snap store overview, on-premises proxy"
        retrieved: "2026-10-05"
        quote: >-
          The Enterprise Store is an on-premise edge proxy that creates a local cache of downloaded files. This speeds up subsequent downloads, and allows organizations to use snaps in air-gapped or restricted networking environments.
      - url: https://snapcraft.io/docs/how-to-guides/manage-snaps/manage-updates/
        type: official-docs
        title: "Managing updates, snap refresh --hold"
        retrieved: "2026-10-05"
        quote: >-
          To postpone updates indefinitely, a value of forever is also valid.
    unknowns:
      - "Whether snap refresh --hold=forever is effective for the kernel, base, gadget and snapd snaps on Ubuntu Core. The snapcraft page lists no exception, and no Ubuntu Core page was found that addresses it."
      - "The verbatim documented statement of signature verification on refresh. The assertion mechanism is documented, but no single sentence stating that a refresh is rejected on a failed signature check was located."

  d05_rollback_recovery:
    normalized:
      rollback_to_previous: available
      rollback_mechanism: "snap revert, per snap"
      retained_versions: "3 revisions per snap on Ubuntu Core, via refresh.retain"
      automatic_rollback_on_boot_failure: "documented for a remodel only; during a remodel the bootloader and snapd test the new kernel or base snap, and a failed boot cancels the remodel and undoes its changes; no page read documents the same test boot for an ordinary refresh, and the documentation home page claims automatic rollback capabilities without a mechanism"
      automatic_rollback_trigger: "during a remodel, the bootloader and snapd coordinate to test a new kernel or base snap; a failed boot cancels the remodel and undoes the change"
      automatic_rollback_state: "kernel_status in the bootloader environment, and the modeenv file"
      automatic_rollback_attempts: unknown
      success_criterion: unknown
      recovery_environment: "recovery systems on the read-only ubuntu-seed partition"
      recovery_modes:
        - "run: boot normally"
        - "recover: a pristine ephemeral system, with existing data left intact and reachable"
        - "install: reinitialise from the image, erasing ubuntu-save as well"
        - "factory-reset: reset to factory state, but ubuntu-save is preserved"
      recovery_entry: "hold the 1 key at boot, or snap reboot --recover/--install/--factory-reset, or the snapd REST API"
      factory_reset: available
      network_independent_recovery: "yes; recovery systems are on local disk and recover mode allows local or SSH login"
      remote_recovery: "the snapd REST API can select a mode"
    summary: >-
      Four named boot modes on a local recovery partition, per-snap revert with three
      revisions retained, and a bootloader that coordinates with snapd to undo a
      kernel or base snap that fails to boot during a remodel.
    notes: >-
      **The recovery mode design is the most carefully specified in this edition, and
      the distinction most likely to be misread is between install and factory
      reset.** Both sound like erasing everything. Install "will erase all system
      data and reset the device to its original fresh from the factory state" and
      also erases ubuntu-save, "reverting the device to its manufactured state".
      Factory reset erases system data too, but "the contents of the ubuntu-save
      partition remains intact", so device identity and recovery data survive. For a
      fielded device with a signed serial assertion, that difference decides whether
      the device can re-register itself afterwards.

      Recover mode is unusual and worth recording: the device boots "as it would from
      a pristine initial installation, including its snaps, via a temporary file
      system" while "the running system data is untouched", so an operator can log in
      with prior credentials, locally or over SSH, to retrieve data from a system
      that will not boot normally. That is a genuinely useful failure mode and it does
      not need a network or external media.

      Entry into any mode is deliberate rather than automatic: holding the 1 key at
      boot opens a system mode selection menu, or `snap reboot --recover`,
      `--install` or `--factory-reset` selects one, or the REST API calls the
      corresponding function. No documentation found describes a device dropping into
      recovery by itself after repeated failures.

      Automatic rollback is documented for the two snaps that can stop a device
      booting, but only on the remodel page, which describes swapping from one model
      assertion to another. No page read documents the same test boot for an
      ordinary kernel or base snap refresh. The documentation home page claims
      "automatic rollback capabilities" and gives no mechanism. Within a remodel,
      the mechanism is documented while its parameters are not. "The bootloader is
      configured to coordinate with snapd to test the kernel", snapd "carefully
      orchestrates the swap to either a new kernel or new base snap in a way that
      enables either of those snaps to be rolled back if an error is detected", and "a
      failed boot will result in the cancelation" with "any changes up to that point
      ... undone", tracked through the bootloader's kernel_status field and the
      modeenv file. How many attempts are allowed, and what precisely counts as a
      successful boot, were not found. Those are recorded as unknowns, because they
      are the two numbers that decide what the mechanism actually catches, and this
      survey asks the same question of every entry.
    evidence: DOCUMENTED
    sources:
      - url: https://documentation.ubuntu.com/core/explanation/remodel-essential-snaps/
        type: vendor-docs
        title: "Remodel essential snaps, boot verification"
        retrieved: "2026-10-19"
        quote: >-
          Remodeling is the process of swapping from one model assertion to another
          on an Ubuntu Core system. ... A failed boot will result in the cancelation
          of the remodel. Any changes up to that point will be undone.
      - url: https://documentation.ubuntu.com/core/
        type: vendor-docs
        title: "Ubuntu Core documentation home page"
        retrieved: "2026-10-19"
        quote: >-
          enabling the creation of production-ready systems with minimal attack
          surface and automatic rollback capabilities
      - url: https://documentation.ubuntu.com/core/explanation/recovery-modes/
        type: vendor-docs
        title: "Recovery modes"
        retrieved: "2026-09-22"
        quote: >-
          The factory reset option will erase all system data and reset the device to
          its original fresh from the factory state. This means that not everything
          is removed. In particular, the contents of the ubuntu-save partition
          remains intact.
      - url: https://documentation.ubuntu.com/core/explanation/recovery-modes/
        type: vendor-docs
        title: "Recovery modes, recover mode"
        retrieved: "2026-09-22"
        quote: >-
          the running system data is untouched. This allows you to log in to the
          system using prior credentials to recover your data, either via SSH or
          locally after setting up a password for the user.
      - url: https://documentation.ubuntu.com/core/how-to-guides/manage-ubuntu-core/use-a-recovery-mode/
        type: vendor-docs
        title: "Using recovery modes"
        retrieved: "2026-09-22"
        quote: >-
          start or reboot the device with the ‘1’ key held on a connected keyboard
      - url: https://documentation.ubuntu.com/core/explanation/remodel-essential-snaps/
        type: vendor-docs
        title: "Remodelling essential snaps, boot testing"
        retrieved: "2026-09-22"
        quote: >-
          Snapd carefully orchestrates the swap to either a new kernel or new base
          snap in a way that enables either of those snaps to be rolled back if an
          error is detected.
      - url: https://snapcraft.io/docs/how-to-guides/manage-snaps/manage-updates/
        type: official-docs
        title: "Managing updates, refresh.retain"
        retrieved: "2026-09-22"
        quote: "refresh.retain=3 on Ubuntu Core systems and refresh.retain=2 on classic Ubuntu systems"
    unknowns:
      - "Whether an ordinary kernel or base snap refresh, outside a remodel, gets the same test boot and automatic rollback."
      - "How many failed boot attempts are tolerated before a kernel or base snap is rolled back automatically."
      - "What counts as a successful boot for the purposes of confirming a new kernel or base snap."
      - "Whether a device can enter a recovery mode automatically after repeated failures, or whether every entry is operator-initiated."

  d06_customization:
    normalized:
      runtime_package_install: "snaps only; no deb path documented"
      mechanisms:
        - custom-model-assertion
        - custom-gadget-snap
        - custom-kernel-snap
        - brand-store
        - snap-packaging
      customization_points:
        - image-build
        - runtime
      signing_requirement: "a brand account and key for any grade above dangerous"
      documented_limits:
        - "No documented path for installing arbitrary deb packages on a production device."
        - "grade:signed permits no snaps outside those named in the model."
      add_software:
      - kind: snaps
        how: Everything on the device is a snap, and snaps can be installed on a running device. The model assertion names the snaps an image holds. In the signed grade, snaps outside the model cannot appear in the recovery system.
        evidence: DOCUMENTED
        sources:
        - url: https://documentation.ubuntu.com/core/explanation/core-elements/inside-ubuntu-core/
          type: official-docs
          title: 'Ubuntu Core docs: Inside Ubuntu Core'
          retrieved: '2026-10-12'
          quote: The kernel, boot assets, runtime environment, applications and device enablement capabilities are all delivered as snaps that are controlled by snapd
        - url: https://documentation.ubuntu.com/core/how-to-guides/container-deployment/deploy-docker-from-a-snap/
          type: official-docs
          title: 'Ubuntu Core docs: Deploy Docker from a snap'
          retrieved: '2026-10-12'
          quote: Ubuntu Core can install and deploy Docker containers from the command line, first by installing the Docker container runtime snap
        - url: https://documentation.ubuntu.com/core/reference/assertions/model/
          type: official-docs
          title: 'Ubuntu Core docs: model assertion'
          retrieved: '2026-10-12'
          quote: no unasserted (unsigned) snaps or snaps not mentioned in the model can appear or be used in the recovery system.
    summary: >-
      Customization happens by writing and signing your own model assertion and
      gadget snap and building an image from them. Everything on the running device
      is a snap, and the model decides which snaps may be present at all.
    notes: >-
      The model assertion is both the customization mechanism and its limit, which is
      an unusually coherent design. A brand decides the kernel, the base, the board
      integration and the application set, signs that decision, and the device
      enforces it: under the default grade, nothing outside the model can be
      installed. An adopter who wants a different trade-off changes the model and
      reissues, rather than reconfiguring the device.

      **The framework cost applies here and it is concrete.** A brand that builds and
      signs its own image owns that image: which snap revisions it contains, when the
      composition is refreshed, and the consequences of a combination Canonical never
      shipped. Vulnerability response is the one part of that ownership the
      documentation does assign, per snap rather than per image: base snaps, snapd
      and certified kernel snaps are "fixed by rebuilding and releasing a new revision
      of that base snap by Canonical", application snaps "must be addressed by the
      snap publisher", and for a third-party gadget snap "responsibility for
      bootloader maintenance (such as U-Boot) and associated CVE remediation lies with
      the gadget snap publisher". Testing and support for the assembled image are not
      assigned anywhere found, which is the same gap this survey records against
      other framework entries.

      Signing above development grade requires a brand account tied to the vendor's
      single sign-on, so there is no documented purely offline or vendor-independent
      signing root for a production image. For an adopter whose threat model or
      procurement rules require holding their own root of trust end to end, that is
      the fact to establish early.

      Hardware customization is the gadget-and-kernel-snap pair rather than a board
      list in someone else's source tree, which means adding a board is packaging
      work an adopter can do without upstream cooperation. That is a genuinely
      permissive extension model and it is recorded as such.
    evidence: DOCUMENTED
    sources:
      - url: https://documentation.ubuntu.com/core/reference/assertions/model/
        type: vendor-docs
        title: "Model assertion, grades and signing"
        retrieved: "2026-09-22"
        quote: >-
          this grade is meant only for development purposes. For example, you could
          define a my-device-devel or my-device-dangerous model for development
          images in parallel to a my-device model for production.
      - url: https://documentation.ubuntu.com/core/explanation/core-elements/inside-ubuntu-core/
        type: vendor-docs
        title: "Inside Ubuntu Core, image composition"
        retrieved: "2026-09-22"
        quote: >-
          combined using the ubuntu-image tool to create the Ubuntu Core
          installation image
      - url: https://documentation.ubuntu.com/core/explanation/full-disk-encryption/
        type: vendor-docs
        title: "Full disk encryption, board-specific enablement"
        retrieved: "2026-09-22"
        quote: >-
          is board-specific and will typically involve creating custom gadget and
          kernel snaps
      - url: https://documentation.ubuntu.com/core/explanation/cve-remediation/
        type: vendor-docs
        title: "CVE remediation in Ubuntu Core"
        retrieved: "2026-09-22"
        quote: >-
          Application snaps bundle their own dependencies. CVEs affecting those
          dependencies must be addressed by the snap publisher
    unknowns:
      - "Who owns testing and support for an image a brand builds and signs itself. Vulnerability response is assigned per snap by the CVE remediation page; testing and support of the assembled image are not assigned on any page found."
      - "Whether any offline or vendor-independent signing root exists for a production-grade model assertion."

  d07_kubernetes:
    normalized:
      requirement: optional
      bundled: "none"
      independent_lifecycle: "yes"
      os_manages_kubernetes: "no"
      kubernetes_manages_os: unknown
      distributions:
        - "MicroK8s, from its strict-confinement tracks"
      installation: "as an ordinary strictly confined snap on top of the OS"
      distribution_options:
        - distribution: microk8s
          offered: add-on
          detail: Installed as an ordinary snap, from the tracks that include strict in their name.
          sources:
            - url: https://canonical.com/microk8s/docs/install-strict
              type: official-docs
              retrieved: '2026-09-22'
              quote: Strictly confined MicroK8s is installed via the tracks that include strict in their name.
            - url: https://documentation.ubuntu.com/core/reference/release-notes/
              type: vendor-docs
              retrieved: '2026-09-22'
              quote: MicroK8s support for an easily deployed, streamlined, embedded Kubernetes experience
    summary: >-
      Kubernetes is optional, unbundled, and installed as an ordinary snap. Because
      it is just another snap, it refreshes on the same per-snap mechanism as the
      rest of the system and its lifecycle is independent of the OS by construction.
      Only a strictly confined build can be installed, which narrows the list to
      MicroK8s.
    notes: >-
      MicroK8s is the one Kubernetes distribution documented for this system. The
      Core 22 release notes list "MicroK8s support for an easily deployed,
      streamlined, embedded Kubernetes experience", the store describes it as "a
      small, fast, secure, certified Kubernetes distribution that installs on just
      about any Linux box", and its own documentation states it "runs in as little as
      540MB of memory". Its default tracks are classic snaps, which the snap
      documentation states are not installable on this system, so the applicable
      builds are the tracks with strict in their name: "Strictly confined MicroK8s is
      installed via the tracks that include strict in their name."

      Canonical Kubernetes, the newer k8s snap, is not recorded as a documented
      distribution for this system. Its documentation describes "a performant,
      lightweight, secure and opinionated distribution of Kubernetes" and does not
      mention Ubuntu Core, and the store's stable channels for it on amd64 and arm64
      carried only tracks with the classic suffix on 2026-09-22. That is the same
      mechanical incompatibility d12 records for the vendor's Cluster API bootstrap
      provider. It is recorded as unknown rather than as absent, because the store
      listing is an observation rather than a documented statement.

      Lifecycle independence is a side effect of the packaging model rather than a
      feature anyone built. Kubernetes is a snap, the OS is other snaps, and they
      refresh separately. Several entries in this edition had to do deliberate work
      to achieve what falls out here for free, and several others bake the Kubernetes
      version into the OS artifact and cannot achieve it at all.

      Nothing found documents Kubernetes managing the OS. There is no OS upgrade
      controller or node operator in the sources read, so that direction is recorded
      as unknown rather than as absent.
    evidence: DOCUMENTED
    sources:
      - url: https://documentation.ubuntu.com/core/reference/release-notes/
        type: vendor-docs
        title: "Ubuntu Core 22 release notes, MicroK8s"
        retrieved: "2026-09-22"
        quote: >-
          MicroK8s support for an easily deployed, streamlined, embedded Kubernetes
          experience
      - url: https://snapcraft.io/microk8s
        type: official-docs
        title: MicroK8s
        retrieved: "2026-09-22"
        quote: >-
          MicroK8s is a small, fast, secure, certified Kubernetes distribution that
          installs on just about any Linux box.
      - url: https://canonical.com/microk8s/docs/getting-started
        type: official-docs
        title: "MicroK8s, getting started"
        retrieved: "2026-09-22"
        quote: "MicroK8s runs in as little as 540MB of memory"
      - url: https://canonical.com/microk8s/docs/install-strict
        type: official-docs
        title: "MicroK8s, install strict"
        retrieved: "2026-09-22"
        quote: >-
          Strictly confined MicroK8s is installed via the tracks that include strict
          in their name.
      - url: https://documentation.ubuntu.com/canonical-kubernetes/
        type: vendor-docs
        title: Canonical Kubernetes
        retrieved: "2026-09-22"
        quote: >-
          a performant, lightweight, secure and opinionated distribution of
          Kubernetes
    unknowns:
      - "Whether any documented mechanism lets Kubernetes drive an OS upgrade or reboot on Ubuntu Core."
      - "Whether Canonical Kubernetes, the k8s snap, is documented or published for Ubuntu Core. No page found mentions it, and only classic-suffixed stable tracks were observed in the store on 2026-09-22."

