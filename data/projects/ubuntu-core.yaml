        value: >-
          300 contributors with linked GitHub accounts and 59,005 commits all time,
          with the top twelve holding 51,914 of them, roughly 88 percent. The
          contributor count is the largest of any mechanism measured in this edition,
          and the concentration is high.
    summary: >-
      A GPL-3.0 daemon and an open codebase, owned and operated by a single company
      that also runs the store the OS depends on, under a contributor licence
      agreement, with no published governance body for the OS or the daemon.
    notes: >-
      The four properties separate sharply and the honest reading is mixed. Open
      source: yes, snapd is GPL-3.0 and developed in public. Open governance:
      unknown, and the gap is specific. Ubuntu has a Technical Board "responsible for
      the technical direction of Ubuntu" that meets publicly, but nothing found
      states that its remit formally covers snapd and Ubuntu Core as opposed to the
      archive and the classic distribution, and no separate governance charter for
      snapd was located. Vendor-neutral ownership: no, on every axis at once, since
      one company holds the trademark, employs the maintainers, and operates the
      store that is the default trust root.

      Contributions are made under the Harmony contributor licence agreement, under
      which contributors retain copyright and grant the company a licence. That is a
      materially different arrangement from the developer certificate of origin used
      by several other entries here, and it is recorded as a fact rather than as a
      deficiency.

      **The store is the governance question that matters most for this entry**,
      because it is not only a distribution channel but the default trust root and
      the thing an operator must route around to control updates. No published
      implementation of the store server was found. That absence is recorded as an
      open question rather than as a finding, because the only statements located
      asserting that the server is proprietary were community forum posts, which this
      survey's evidence standard does not accept as a source for any claim.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/snapcore/snapd/blob/master/COPYING
        type: governance-doc
        title: "snapd licence"
        retrieved: "2026-09-22"
        quote: "GNU GENERAL PUBLIC LICENSE Version 3, 29 June 2007"
      - url: https://canonical.com/legal/contributors
        type: governance-doc
        title: "Canonical contributor agreement"
        retrieved: "2026-09-22"
        quote: >-
          We use the Harmony CLA to protect your rights regarding any contribution
          you make to our open source projects.
      - url: https://github.com/snapcore/snapd
        type: source-repo
        title: snapd
        retrieved: "2026-09-22"
        quote: "300 contributors and 59,005 commits recorded by the contributors API on 2026-09-22."
    unknowns:
      - "Whether the Ubuntu Technical Board's published remit formally covers snapd and Ubuntu Core, or whether both are governed entirely by the company's internal engineering process."
      - "Whether any implementation of the Snap Store server is published. None was found, and no primary source states its status either way."
      - "Employer affiliation of snapd contributors is not published, so the diversity figure counts individuals only."

  d14_maturity:
    normalized:
      first_release: "2016-06"
      current_version: "Ubuntu Core 26"
      current_version_date: "2026-05-14"
      release_cadence: "one major release every two years since Core 22, tracking an Ubuntu LTS; the earlier interval was irregular"
      observed_intervals: "Core 22 2022-06-15 to Core 24 2024-06-04 is 720 days; Core 24 to Core 26 2026-05-14 is 709 days. Earlier, from the support-duration table at month precision: Core 16 June 2016 to Core 18 January 2019 is about 31 months; Core 18 to Core 20 February 2021 is about 25 months; Core 20 to Core 22 June 2022 is about 16 months"
      support_model: lts-stream
      support_window: "Core 26: released May 2026, standard security maintenance to May 2036, Legacy add-on to May 2041. Core 24: June 2024 to June 2034, Legacy to June 2039. Core 22: June 2022 to June 2032, Legacy to June 2037. Core 16 standard maintenance ended June 2026. The Core 24 release notes separately state 12 years."
      commercial_support: available
    summary: >-
      A two-year major release cadence tied to the Ubuntu LTS train since Core 22,
      with the longest stated support horizon in this edition and a published
      calendar end-of-life table. Two of the vendor's own pages describe Core 24's
      horizon differently.
    notes: >-
      The stated cadence and the observed intervals agree closely for the last three
      releases, which is rare in this edition: 720 and 709 days against a documented
      "every two years". The support-duration table extends the lineage back to Core
      16 in June 2016, and the intervals before Core 22 were roughly 31, 25 and 16
      months, so the two-year cadence is a property of the recent releases rather
      than of the project's whole history.

      **The support window is the headline and it needs a caveat.** The vendor's
      support-duration page states that "Each release includes 10 years of security
      maintenance" with "an additional 5 years" through a Legacy add-on sold under
      Ubuntu Pro, and gives a calendar table: Core 26 to May 2036 and May 2041, Core
      24 to June 2034 and June 2039, Core 22 to June 2032 and June 2037. The Core 24
      release notes on the same site describe "12 years of Long Term Support", which
      matches neither the ten nor the fifteen. Both are the vendor's own pages, and
      the discrepancy is recorded rather than reconciled. Even at the shortest
      reading, this is the longest support horizon of any entry in this edition by a
      wide margin, and for a fielded device population that is frequently the
      deciding dimension.

      What the window covers is narrower than the whole image. The support-duration
      page states that "Supported Ubuntu Core components include the snap daemon
      (SnapD), the kernel snap and the base for each respective release", so a
      brand's gadget snap and application snaps sit outside it, consistent with the
      per-snap ownership recorded in d06 and d10.

      One thing a reader should not assume from the major version number: the OS on a
      running device is not pinned by it. Point updates arrive as refreshes of snapd
      and of the gadget, base and kernel snaps, so two devices on the same Core
      version can be running materially different software.

      The first release in the vendor's own table is Ubuntu Core 16, June 2016,
      whose standard security maintenance ended in June 2026, three months before
      this data was checked. The table does not list anything earlier, and the
      release-notes page's history stops at Core 22, so whether anything before Core
      16 counts as a release of this product is not established from these sources.
    evidence: DOCUMENTED
    sources:
      - url: https://documentation.ubuntu.com/core/reference/release-notes/
        type: vendor-docs
        title: "Ubuntu Core release notes"
        retrieved: "2026-09-22"
        quote: >-
          A new version of Ubuntu Core is released every two years, built on the
          foundations of a Ubuntu LTS release.
      - url: https://ubuntu.com/download/core
        type: vendor-docs
        title: "Download Ubuntu Core, support statement"
        retrieved: "2026-09-22"
        quote: >-
          10 years of security and maintenance updates, extended to up to 15 years
          with Ubuntu Pro
      - url: https://documentation.ubuntu.com/core/reference/support-duration/
        type: vendor-docs
        title: "Ubuntu Core support duration"
        retrieved: "2026-09-22"
        quote: >-
          Each release includes 10 years of security maintenance. A Legacy add-on can
          be optionally purchased to cover an additional 5 years of security
          maintenance, resulting in 15 years of coverage overall.
      - url: https://documentation.ubuntu.com/core/reference/support-duration/
        type: vendor-docs
        title: "Ubuntu Core support duration, version table"
        retrieved: "2026-09-22"
        quote: "Ubuntu Core 16 Jun 2016 Jun 2026 Jun 2031 amd64, arm64 2.61.x"
      - url: https://documentation.ubuntu.com/core/reference/release-notes/
        type: vendor-docs
        title: "Ubuntu Core 24 release notes, support statement"
        retrieved: "2026-09-22"
        quote: "With 12 years of Long Term Support"
    unknowns:
      - "Whether any release before Ubuntu Core 16 (June 2016) counts as a release of this product. The vendor's support-duration table starts at Core 16 and the release-notes history stops at Core 22."
      - "Whether the Core 24 release notes' twelve years and the support-duration table's ten plus five for the same release are a wording error or a difference in terms."

tradeoffs:
  buys:
    - "A stated support horizon of ten years, extending to fifteen with a subscription."
    - "Full disk encryption bound to the TPM and sealed to the full EFI state, active automatically on capable hardware under the default model grade."
    - "Mandatory per-application confinement, on by default and generated automatically: an AppArmor profile per app and service, seccomp filters per app, and a mount namespace per snap."
    - "Four named boot modes on a local recovery partition, with a documented and deliberate distinction between reinstalling and factory-resetting: one erases device identity, the other preserves it."
    - "Recover mode boots a pristine ephemeral system while leaving existing data intact and reachable by an ordinary login, locally or over SSH. It gives a way into a device that will not boot normally, with no network and no external media."
    - "The kernel, the root filesystem and the board integration layer update independently, so a kernel fix does not require shipping a new root filesystem."
    - "A signed model assertion makes the device's permitted software set an authenticated document, and the default grade refuses anything outside it."
    - "Hardware enablement is a gadget and kernel snap an adopter builds, so adding a board is packaging work. The brand owns the assembled image: vulnerability response is per snap, with application and third-party gadget snaps on their publisher, and testing and support for the image are assigned nowhere that was found."
    - "Factory provisioning is a documented, first-class scenario, with a factory-image hint and an install-device hook for manufacturing lines."
    - "A published vulnerability response commitment: an intended two business day initial response and CVE details within a week of update notifications."
  costs:
    - "The default trust root and distribution channel is the vendor's store, and the documented alternatives, an on-premises proxy and brand stores, are the vendor's commercial products. Refresh control can pin snaps at validated revisions without either, but establishing a gating relationship is a one-time step performed by the vendor's store team. Avoiding the public store does not mean avoiding the vendor's infrastructure."
    - "Signing anything above development grade requires a brand account tied to the vendor's single sign-on, so there is no documented offline or vendor-independent signing root for a production image."
    - "The userspace is snap-only, with no documented path for installing arbitrary deb packages on a production device."
    - "Open source without open governance or vendor-neutral ownership: one company holds the trademark, employs the maintainers and operates the store, and no governance body was found whose published remit covers snapd or Ubuntu Core."
    - "Contributions require a contributor licence agreement rather than a developer certificate of origin."
    - "riscv is listed as a supported architecture. On 2026-09-22 the testing-platforms page and the cdimage directories for Core 22, 24 and 26 listed no riscv64 image."
    - "The vendor's Core 24 release notes state 12 years of support while its support-duration table gives the same release ten years plus five with a paid add-on, and the two pages are not reconciled. The published support window covers snapd, the kernel snap and the base snap, not a brand's gadget or application snaps."
    - "FIPS, systems management, the air-gap proxy and the last five years of support all sit behind a subscription. The free path does not include them."
