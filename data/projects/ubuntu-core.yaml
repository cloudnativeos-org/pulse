schema_version: "1.0.0"
edition: "2026"
id: ubuntu-core
name: Ubuntu Core
homepage: https://ubuntu.com/core
repository: https://github.com/snapcore/snapd
collected_at: "2026-09-15"

entry_kind:
  - distribution
  - framework

category_fit:
  comparable: full
  note: >-
    Comparable on all fourteen dimensions. It carries two entry kinds for the same
    reason Kairos does: Canonical publishes reference images and the individual
    snaps that compose them, and it also publishes the toolchain and the signed
    model-assertion mechanism with which a brand builds and owns its own image.
    A product shipped on Ubuntu Core is normally the second of those, not the first.

    Two framing notes a reader should carry into the dimensions below, because both
    make this entry's answers look different from its neighbours without making
    them incomparable.

    **Its target is devices, not datacenter nodes.** Canonical positions it for
    appliances, IoT and embedded deployment, and names automotive, industrial
    automation, robotics, signage and smart cities. That shows up most in d07,
    where Kubernetes is an ordinary optional workload rather than the point, and in
    d12, where the fleet story is device management rather than node management.

    **Everything is a snap.** The kernel, the root filesystem, the board
    integration layer and every application are all snaps, which are read-only
    squashfs images. There is no deb userspace on a production device. That makes
    d06's answer genuinely different from every other entry here rather than merely
    more restrictive, and it is why this entry's substrate needed a vocabulary value
    that did not previously exist.

self_description:
  text: >-
    The immutable embedded Linux OS. A minimal, secure, and strictly confined
    operating system powering devices around the world.
  source:
    url: https://ubuntu.com/core
    type: vendor-docs
    title: Ubuntu Core
    retrieved: "2026-09-22"

version_observed:
  version: "Ubuntu Core 26"
  released: "2026-05-14"
  channel: "stable, built on Ubuntu 26.04 LTS"
  method: >-
    Read the release list at
    https://documentation.ubuntu.com/core/reference/release-notes/ and take the
    highest-numbered release, then open its version-specific page
    (https://documentation.ubuntu.com/core/uc26/) to confirm. Note that a major
    version number is not the whole answer: point updates between major releases
    arrive as refreshes of snapd and of the gadget, base and kernel snaps rather
    than as a new image version, so a running device's snap revisions are a
    separate lookup from its Core version.
  source:
    url: https://documentation.ubuntu.com/core/reference/release-notes/
    type: vendor-docs
    title: Ubuntu Core release notes
    retrieved: "2026-09-22"
    quote: >-
      A new version of Ubuntu Core is released every two years, built on the
