      tpm: "TPM 2.0 on x86, or OP-TEE on Arm; external I2C or SPI TPM modules not supported"
      gpu: "NVIDIA CUDA on Core 24 documented through the mesa-2404 snap and kernel GPU components; a Core 22 Tegra Jetson image is published"
      extension_mechanism: "the gadget snap and kernel snap pair, built by the adopter"
      certification: "a hardware certification programme is referenced; no device list was found"
    summary: >-
      Canonical lists four architectures, and released Ubuntu Core images were
      confirmed for three of them, with armhf confined to Core 22 and earlier. The
      extension mechanism is the gadget and kernel snap pair, which an adopter builds
      rather than requesting upstream.
    notes: >-
      **riscv is listed as a supported architecture and no released Ubuntu Core
      riscv64 board image was confirmed, and this survey records artifacts rather
      than intentions.** The download page states support for "amd64, arm64 & arm32,
      and riscv architectures" without qualifying riscv as experimental, and the
      system requirements page lists "riscv64 (64-bit RISC-V)" alongside the other
      three. The vendor's own testing-platforms page lists no riscv64 image, the
      cdimage directories for Core 22, 24 and 26 held only amd64, arm64 and armhf
      images on 2026-09-22, and the support-duration table names "amd64, arm64,
      armhf" as the architectures covered under Legacy support for Core 24 and 26.
      The riscv64 artifacts that were found belong to classic Ubuntu Server, which is
      a different product. Recorded as listed but not confirmed released.

      armhf is confirmed released for Core 22 and Core 20 only. The Core 22
      directory carries an armhf Raspberry Pi image; the Core 24 and Core 26
      directories carry amd64, arm64 and arm64 Raspberry Pi images and no armhf
      image, although the support-duration table lists armhf for both releases.

      That rule is applied identically across this edition, and it is worth being
      explicit that it produces the same kind of finding here as it does for the
      project the authors of this survey maintain. In both cases an architecture is
      genuinely present in the tooling and does not yet have a released OS image that
      could be confirmed from published artifacts. Neither is recorded as support.

      Hardware enablement is the gadget snap and the kernel snap. Because both are
      snaps a brand builds, adding a board is packaging work rather than a change to
      a closed enumeration in someone else's repository. Of the entries in this
      edition that constrain the OS image tightly, this is the most permissive
      hardware extension story.

      The TPM position is documented with an unusual and practical limit: TPM 2.0 on
      x86 or OP-TEE on Arm, and "External I2C/SPI-based TPM modules are not currently
      supported", which rules out a common way of adding a TPM to a board that lacks
      one.

      The vendor's testing-platforms page enumerates the boards with official
      images by Core release: generic x86 for Core 20 through 26, Raspberry Pi 5 for
      Core 24 and 26, Raspberry Pi 4 for Core 20 through 26, Raspberry Pi 3, CM3 and
      Zero 2 W for Core 20 and 22, Raspberry Pi 2 for Core 20 and 22, MediaTek Genio
      and NVIDIA Tegra Jetson for Core 22. So the current release has official
      images for two Raspberry Pi models and generic x86 only; the Genio and Jetson
      images stop at Core 22, and the Jetson install page defers to a separate
      "Ubuntu for Jetson" documentation set.

      GPU enablement is documented for NVIDIA CUDA on Core 24, through the
      mesa-2404 content snap and kernel GPU components, with the note that "Access
      to Nvidia drivers will be available by Q4 this year due to Nvidia's licensing
      policy" in the Core 24 release notes. No page found documents GPU enablement
      for Core 26 specifically, and no accelerator other than NVIDIA is documented.
