schema_version: "1.0.0"
edition: "2026"
id: yocto
name: Yocto Project
homepage: https://www.yoctoproject.org/
repository: https://git.yoctoproject.org/
collected_at: "2026-10-12"

# `build-system` is an entry kind in schema/profile.schema.json and schema/vocabularies.md
# section 4 (added 2026-10-12).
entry_kind:
  - build-system

category_fit:
  comparable: adjacent
  note: >-
    The Yocto Project builds a custom Linux distribution from source recipes, with
    no base distribution. A read-only root filesystem is an image feature in its
    own documentation; whole-image updates with rollback and Kubernetes come from
    separate layers such as meta-rauc, meta-swupdate, meta-mender, meta-updater and
    meta-virtualization.

    The entry is in this survey because the contrast is informative, not because
    it is a peer of a Kubernetes node operating system. The project releases a
    build system and metadata, and the adopter builds the operating system image.
    Most of what R1 to R4 describe is reachable by selecting layers at build time,
    so each dimension below names the layer that supplies a capability and
    separates it from the Yocto Project itself.

    Where a capability comes from a layer, the profile records the layer, its
    licence and its branch for the observed release. Third-party layers are not
    part of the Yocto Project and carry their own maintainers and release
    schedules.

self_description:
  text: >-
    The Yocto Project is an open source collaboration project that helps
    developers create custom Linux-based systems that are designed for embedded
    products regardless of the product’s hardware architecture.
  source:
    url: https://docs.yoctoproject.org/overview-manual/yp-intro.html
    type: official-docs
    title: Overview and Concepts Manual, Introducing the Yocto Project
    retrieved: "2026-10-12"
    quote: >-
      helps developers create custom Linux-based systems that are designed for
      embedded products

