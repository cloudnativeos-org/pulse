taxonomy:
  workload_scope: general-purpose-host
  construction_model:
    - framework
  root_state_substrate:
    - ab-partition-image
    - ostree-deployment
    - package-repository
  notes: >-
    The values describe what an adopter can build, not what the project ships.
    The project ships no operating system image to run as a product. Its own
    words about its reference distribution are "you cannot use it as a product".
    The workload scope is whatever the adopter puts in the image, so
    general-purpose-host is the closest closed value and is not a project claim.
    The vocabulary has no value for "set by the adopter at build time". Notes.md
    asks whether one should be added.

    The root state substrate values each come from a separate layer or feature,
    and none is the default. ab-partition-image is documented by the RAUC, Mender
    and SWUpdate projects, which each have a Yocto layer. ostree-deployment is
    documented by the meta-updater layer. package-repository is the
    package-management image feature in OpenEmbedded-Core. A build that uses none
    of them produces an image with no update mechanism in the project's own
    documentation.

    framework carries the cost the vocabulary names: the adopter owns building,
    testing, signing, CVE response and support for the resulting image. The
    project's documentation says so for the reference distribution and for
    vulnerabilities in OpenEmbedded-Core.

dimensions:
  d01_os_model:
    normalized:
      workload_scope: general-purpose-host
      entry_kind: build-system
      released_os_image: "the reference distribution Poky is documented as not usable as a product"
      core_metadata: "OpenEmbedded-Core, documented as distro-less"
      ships_kubernetes: "not in OpenEmbedded-Core; provided by the meta-virtualization layer"
      packages_kubernetes: "yes, from the meta-virtualization layer"
      init_system_options:
        - sysvinit
        - busybox-init
        - systemd
      init_system_default_in_poky: sysvinit
      package_formats:
        - rpm
        - deb
        - ipk
    summary: >-
      A build system and a body of metadata, not a released operating system. The
      adopter selects source recipes, layers, an init system and image features,
      and the build produces the image.
    notes: >-
      The project's reference distribution, Poky, is documented as a complete
      distribution specification that is tested and put through QA, and also as
      not usable as a product out of the box. OpenEmbedded-Core, the shared
      metadata layer, describes itself as distro-less: it can build a functional
      image with DISTRO set to nodistro and contains only emulated machine
      support. Hardware support comes from board support package layers.

      The init system is a build choice. Poky defaults to SysVinit. BusyBox init
      and systemd are also supported.

      Kubernetes is not in OpenEmbedded-Core. A search of the OpenEmbedded-Core
      wrynose tree for recipe names containing k3s, kube, containerd, runc,
      cloud-init, rauc, swupdate, mender or ostree returned no match. Kubernetes
      comes from the meta-virtualization layer, see d07.
    evidence: DOCUMENTED
    sources:
      - url: https://docs.yoctoproject.org/overview-manual/yp-intro.html
        type: official-docs
        title: Introducing the Yocto Project, reference distribution
        retrieved: "2026-10-12"
        quote: >-
          you cannot use it as a product
      - url: https://docs.yoctoproject.org/overview-manual/yp-intro.html
        type: official-docs
        title: Introducing the Yocto Project, features
        retrieved: "2026-10-12"
        quote: >-
          Unlike a full Linux distribution, you can use the Yocto Project to
          create exactly what you need for embedded devices.
      - url: https://docs.yoctoproject.org/overview-manual/yp-intro.html
        type: official-docs
        title: Introducing the Yocto Project, build workflow
        retrieved: "2026-10-12"
        quote: >-
          The build system fetches and downloads the source code from the
          specified location.
      - url: https://git.openembedded.org/openembedded-core/plain/README.OE-Core.md?h=wrynose
        type: source-repo
        title: OpenEmbedded-Core README, wrynose branch
        retrieved: "2026-10-12"
        quote: >-
          It is distro-less (can build a functional image with DISTRO =
          "nodistro") and contains only emulated machine support.
      - url: https://docs.yoctoproject.org/dev-manual/init-manager.html
        type: official-docs
        title: Selecting an Initialization Manager
        retrieved: "2026-10-12"
        quote: >-
          By default, the Poky distro uses SysVinit as the initialization manager.
    unknowns:
      - "Whether the project documents the absence of any Kubernetes or whole-image update capability in OpenEmbedded-Core. The recipe-name search above is a repository observation, not a documented statement."

  d02_immutability:
    normalized:
      read_only:
        - "/ , only when the adopter adds the read-only-rootfs image feature"
      read_only_mechanism: "root filesystem image built for read-only use. The read-only-rootfs feature sets the root entry in /etc/fstab to ro and appends ro to the kernel command line"
      ephemeral:
        - "/var/volatile (tmpfs in the stock fstab)"
        - "/run (tmpfs in the stock fstab)"
      writable_and_persistent:
        - "adopter-defined: for example a data partition used as the overlayfs upper layer, or a /etc overlay"
      immutability_can_be_disabled: true
      immutability_disable_where: "the read-only-rootfs image feature, which an image recipe or local configuration adds or leaves out"
      configurable_paths:
        value: "yes"
        evidence: DOCUMENTED
        how: >-
          The adopter sets the writable paths at build time: the overlayfs class
          takes a mount point per overlay and a list of writable directories, the
          overlayfs-etc image feature puts /etc in an overlay, the volatile-binds
          recipe takes a list of bind mounts, and the machine fstab sets the mount
          points and options.
        sources:
          - url: https://docs.yoctoproject.org/ref-manual/classes.html
            type: official-docs
            title: Classes, overlayfs mount point
            retrieved: "2026-10-12"
            quote: >-
              To use this class, set a mount point for a partition overlayfs is going
              to use as upper layer in your machine configuration.
          - url: https://docs.yoctoproject.org/ref-manual/features.html
            type: official-docs
            title: Features, overlayfs-etc
            retrieved: "2026-10-12"
            quote: >-
              overlayfs-etc: Configures the /etc directory to be in overlayfs.
          - url: https://git.openembedded.org/openembedded-core/plain/meta/recipes-core/volatile-binds/volatile-binds.bb?h=wrynose
            type: source-repo
            title: volatile-binds recipe
            retrieved: "2026-10-12"
            quote: >-
              Volatile bind mount setup and configuration for read-only-rootfs
          - url: https://git.openembedded.org/openembedded-core/plain/meta/recipes-core/base-files/base-files/fstab?h=wrynose
            type: source-repo
            title: Stock fstab
            retrieved: "2026-10-12"
            quote: >-
              tmpfs /var/volatile tmpfs defaults
      integrity_mechanism:
        - read-only-mount
      dm_verity: "opt-in, from the meta-security layer (dm-verity-img class), not in OpenEmbedded-Core"
      survives_upgrade: "set by the update layer and the partition layout the adopter chooses, see d04"
    summary: >-
      Immutability is an image feature the adopter adds, not a default. With
      read-only-rootfs the root filesystem is read-only, and the adopter decides
      at build time which paths are writable, persistent or in memory.
    notes: >-
      The project's security manual says the feature is added to the image, and
      warns that the system and applications must be configured to write
      elsewhere or fail gracefully. The reference manual states there is no
      default list for image features, so nothing turns the feature on unless an
      image recipe or local configuration does.

      Writable paths come from several separate mechanisms in OpenEmbedded-Core:
      the overlayfs class for directories other than /etc, the overlayfs-etc
      image feature for /etc, volatile bind mounts for /var data, and the
      machine's fstab. The overlayfs class does not support /etc itself.
      overlayfs-etc replaces /sbin/init with a generated script by default, and
      the documentation says package management cannot then be used.

      read-only-rootfs-delayed-postinsts exists for images whose root filesystem
      is made writable for the first boot. The documentation says the feature
      only disables the check for post-install scripts.

      dm-verity is not in OpenEmbedded-Core. The dm-verity-img class is in the
      meta-security layer. Its header says the root hash must be stored in a
      trusted location or cryptographically signed and verified. A repository
      search of the OpenEmbedded-Core wrynose tree found no verity class.

      Stock Kubernetes layers do not enable the feature. The meta-virtualization
      k3s README runs an ext4 image and reads /etc/rancher/k3s/k3s.yaml. A search
      of the meta-virtualization wrynose tree found read-only-rootfs in one file,
      a helper script for its vcontainer feature, and in no Kubernetes
      documentation.
    evidence: DOCUMENTED
    sources:
      - url: https://docs.yoctoproject.org/ref-manual/features.html
        type: official-docs
        title: Features, image features
        retrieved: "2026-10-12"
        quote: >-
          read-only-rootfs: Creates an image whose root filesystem is read-only.
      - url: https://docs.yoctoproject.org/ref-manual/features.html
        type: official-docs
        title: Features, default features
        retrieved: "2026-10-12"
        quote: >-
          there is no IMAGE_FEATURES_DEFAULTS definition
      - url: https://docs.yoctoproject.org/security-manual/read-only-rootfs.html
        type: official-docs
        title: Security Manual, Creating a Read-Only Root Filesystem
        retrieved: "2026-10-12"
        quote: >-
          Supporting a read-only root filesystem requires that the system and
          applications do not try to write to the root filesystem. You must
          configure all parts of the target system to write elsewhere, or to
          gracefully fail in the event of attempting to write to the root
          filesystem.
      - url: https://docs.yoctoproject.org/ref-manual/classes.html
        type: official-docs
        title: Classes, overlayfs
        retrieved: "2026-10-12"
        quote: >-
          The overlayfs class provides a way to achieve that by means of overlayfs
          and at the same time keeping the base root filesystem read-only.
      - url: https://docs.yoctoproject.org/ref-manual/classes.html
        type: official-docs
        title: Classes, overlayfs mount point
        retrieved: "2026-10-12"
        quote: >-
          To use this class, set a mount point for a partition overlayfs is going
          to use as upper layer in your machine configuration.
      - url: https://docs.yoctoproject.org/ref-manual/classes.html
        type: official-docs
        title: Classes, overlayfs and /etc
        retrieved: "2026-10-12"
        quote: >-
          The class does not support the /etc directory itself, because systemd
          depends on it.
      - url: https://docs.yoctoproject.org/ref-manual/classes.html
        type: official-docs
        title: Classes, overlayfs-etc and package management
        retrieved: "2026-10-12"
        quote: >-
          it poses a restriction that package-management can’t be used, because
          updating the init manager would remove the generated script
      - url: https://git.openembedded.org/openembedded-core/plain/meta/classes-recipe/rootfs-postcommands.bbclass?h=wrynose
        type: source-repo
        title: rootfs-postcommands.bbclass, kernel ro parameter
        retrieved: "2026-10-12"
        quote: >-
          otherwise kernel or initramfs end up mounting the rootfs read/write
      - url: https://git.openembedded.org/openembedded-core/plain/meta/classes-recipe/rootfs-postcommands.bbclass?h=wrynose
        type: source-repo
        title: rootfs-postcommands.bbclass, fstab ro option
        retrieved: "2026-10-12"
        quote: >-
          Tweak the mount option and fs_passno for rootfs in fstab
      - url: https://git.openembedded.org/openembedded-core/plain/meta/recipes-core/base-files/base-files/fstab?h=wrynose
        type: source-repo
        title: Stock fstab, /run
        retrieved: "2026-10-12"
        quote: >-
          tmpfs /run tmpfs mode=0755,nodev,nosuid,strictatime
      - url: https://git.openembedded.org/openembedded-core/plain/meta/recipes-core/volatile-binds/volatile-binds.bb?h=wrynose
        type: source-repo
        title: volatile-binds recipe
        retrieved: "2026-10-12"
        quote: >-
          Volatile bind mount setup and configuration for read-only-rootfs
      - url: https://git.openembedded.org/openembedded-core/plain/meta/recipes-core/base-files/base-files/fstab?h=wrynose
        type: source-repo
        title: Stock fstab
        retrieved: "2026-10-12"
        quote: >-
          tmpfs /var/volatile tmpfs defaults
      - url: https://git.yoctoproject.org/meta-security/plain/classes/dm-verity-img.bbclass?h=wrynose
        type: source-repo
        title: dm-verity-img.bbclass, meta-security layer
        retrieved: "2026-10-12"
        quote: >-
          This bbclass allows creating of dm-verity protected partition images.
    unknowns:
      - "Whether the project documents a runtime integrity check of the root filesystem in OpenEmbedded-Core. The dm-verity class is in a separate layer, and no verity class exists in the OpenEmbedded-Core wrynose tree."
      - "Whether any documented configuration combines read-only-rootfs with a Kubernetes layer (k3s or kubernetes) and what writable paths it needs."

  d03_artifact:
    normalized:
      primary_artifact: "adopter-built image, in formats the adopter selects (IMAGE_FSTYPES), including partitioned disk images from wic"
      container_image_type: "an OCI-compliant container image of the build output, from the image-container class"
      oci_registry_distribution: unknown
      content_addressable: unknown
      mirrorable: "source mirrors through the own-mirrors class"
      signed: "not a core feature; set by the update layer (RAUC requires signed bundles)"
      air_gapped_capable: unknown
      reproducible_builds: "documented goal; builds are deterministic down to the binary level since 3.1"
      sbom: "SPDX generated by default"
    summary: >-
      The artifact is whatever image the adopter's build configuration produces.
      The project provides the image formats, a partitioned-image tool (wic) and
      a container image type, and the update layers add their own bundle formats.
    notes: >-
      The wic tool generates partitioned images from build artifacts, driven by a
      kickstart file. The image-container class produces an image for OCI
      container tools, and its documentation says it does not install the tools on
      the target: those come from the meta-virtualization layer. It describes a
      container image of the build output. It does not describe the container
      image as a bootable operating system artifact, so OCI registry distribution
      of a bootable image is UNKNOWN here.

      Update bundle formats come from layers: RAUC bundles (meta-rauc), SWU files
      (meta-swupdate), Mender artifacts (meta-mender) and OSTree commits
      (meta-updater).

      Builds are documented as reproducible. The documentation says the goal has
      been true down to the binary level since release 3.1, and also advises
      adopters to check that their own project builds reproducibly.
    evidence: DOCUMENTED
    sources:
      - url: https://docs.yoctoproject.org/dev-manual/wic.html
        type: official-docs
        title: Creating Partitioned Images Using Wic
        retrieved: "2026-10-12"
        quote: >-
          wic command generates partitioned images from existing OpenEmbedded
          build artifacts.
      - url: https://docs.yoctoproject.org/ref-manual/classes.html
        type: official-docs
        title: Classes, image-container
        retrieved: "2026-10-12"
        quote: >-
          Those tools are available in the meta-virtualization layer.
      - url: https://docs.yoctoproject.org/ref-manual/classes.html
        type: official-docs
        title: Classes, own-mirrors
        retrieved: "2026-10-12"
        quote: >-
          The own-mirrors class makes it easier to set up your own PREMIRRORS from
          which to first fetch source before attempting to fetch it from the
          upstream specified in SRC_URI within each recipe.
      - url: https://docs.yoctoproject.org/test-manual/reproducible-builds.html
        type: official-docs
        title: Reproducible Builds
        retrieved: "2026-10-12"
        quote: >-
          When you build a given input set of metadata, we expect you to get
          consistent output.
      - url: https://docs.yoctoproject.org/dev-manual/sbom.html
        type: official-docs
        title: Creating a Software Bill of Materials
        retrieved: "2026-10-12"
        quote: >-
          The OpenEmbedded build system generates such information by default (by
          inheriting the create-spdx class in INHERIT_DISTRO).
    unknowns:
      - "Whether a bootable Yocto image can be published to and pulled from an OCI registry by a documented path."
      - "Whether the project documents an offline build for an air-gapped host, beyond source mirrors."
      - "Whether image content is addressed by hash in a documented way. The hash equivalence server is a build cache feature and is not read as image addressing."

  d04_upgrade:
    normalized:
      provided_by: "layers the adopter selects, plus the package-management image feature in OpenEmbedded-Core"
      mechanism:
        - ab-partition-switch
        - ostree-deployment
        - package-update
      whole_image_updater_in_openembedded_core: unknown
      layers:
        - layer: meta-rauc
          update_project: RAUC
          layer_license: MIT
          update_model: "image-based updater with redundant slots, signed bundles mandatory"
          wrynose_branch: true
          maintained_by_yocto_project: false
        - layer: meta-swupdate
          update_project: SWUpdate
          layer_license: MIT
          update_model: "single-copy (from an initrd) or double-copy approach, optional signing"
          wrynose_branch: true
          maintained_by_yocto_project: false
        - layer: meta-mender
          update_project: Mender
          layer_license: Apache-2.0
          update_model: "dual redundant (A/B) root filesystem, client with optional server"
          wrynose_branch: true
          maintained_by_yocto_project: false
        - layer: meta-updater
          update_project: "OSTree and aktualizr (Uptane client)"
          layer_license: MIT
          update_model: "OSTree atomic file system upgrades"
          wrynose_branch: true
          maintained_by_yocto_project: false
      initiator: "the update client of the chosen layer"
      artifact_verification: "set by the layer: RAUC requires signed bundles; the others are not recorded here"
    summary: >-
      OpenEmbedded-Core has no whole-image update mechanism in its documentation.
      Whole-image updates come from separate layers (meta-rauc, meta-swupdate,
      meta-mender, meta-updater), each a third-party project. The only in-core
      path found is package-by-package update with the package-management image
      feature.
    notes: >-
      Every update layer below is outside the Yocto Project. The project's
      supported-features list names the layers it tests on its Autobuilder, and
      none of these four appears in it. meta-virtualization does.

      RAUC (meta-rauc, MIT): RAUC describes itself as an image-based updater that
      installs file images on devices or partitions. Its documentation says a key
      design decision is that signing a bundle is mandatory. meta-rauc has a
      wrynose branch and its README lists it.

      SWUpdate (meta-swupdate, MIT): the documentation calls SWUpdate mainly a
      framework, generally used in a single-copy approach running in an initrd,
      with a double-copy approach also possible. meta-swupdate has a wrynose
      branch. Its master branch lists whinlatter, wrynose and blacksail as
      compatible.

      Mender (meta-mender, Apache-2.0): the client writes the new version to the
      inactive partition and flips the partitions on the next boot. A server
      component and a commercial layer exist, see d12. meta-mender has a wrynose
      branch.

      meta-updater (MIT): enables over-the-air updates with OSTree and aktualizr.
      The README describes OSTree as a tool for atomic full file system upgrades
      with rollback capability. meta-updater has a wrynose branch.

      The layer compatibility lines on the default branches of meta-rauc and
      meta-updater name only blacksail, the series in development. Both have a
      separate wrynose branch whose layer.conf names wrynose. A reader who clones
      the default branch of those two layers gets a layer that does not declare
      wrynose compatibility.

      In-core path: the package-management image feature installs package
      management tools and preserves the package manager database. The project's
      own package class documentation mentions on-device upgrades. This path
      changes the running filesystem and cannot be combined with a read-only root
      without further work, see d02.
    evidence: DOCUMENTED
    sources:
      - url: https://rauc.readthedocs.io/en/latest/basic.html
        type: official-docs
        title: RAUC basics
        retrieved: "2026-10-12"
        version: "1.15.1.532-1a41"
        quote: >-
          RAUC is basically an image-based updater, i.e. it installs file images
          on devices or partitions.
      - url: https://rauc.readthedocs.io/en/latest/basic.html
        type: official-docs
        title: RAUC basics, signing
        retrieved: "2026-10-12"
        version: "1.15.1.532-1a41"
        quote: >-
          A key design decision of RAUC is that signing a bundle is mandatory.
      - url: https://raw.githubusercontent.com/rauc/meta-rauc/master/README.rst
        type: source-repo
        title: meta-rauc README
        retrieved: "2026-10-12"
        quote: >-
          This layer integrates RAUC into Yocto builds for both **target usage
          (update client)** and **host usage (bundle creation)**.
      - url: https://raw.githubusercontent.com/rauc/meta-rauc/wrynose/conf/layer.conf
        type: source-repo
        title: meta-rauc layer.conf, wrynose branch
        retrieved: "2026-10-12"
        quote: >-
          LAYERSERIES_COMPAT_rauc = "wrynose"
      - url: https://raw.githubusercontent.com/rauc/meta-rauc/master/conf/layer.conf
        type: source-repo
        title: meta-rauc layer.conf, master branch
        retrieved: "2026-10-12"
        quote: >-
          LAYERSERIES_COMPAT_rauc = "blacksail"
      - url: https://raw.githubusercontent.com/rauc/meta-rauc/master/COPYING.MIT
        type: governance-doc
        title: meta-rauc licence file
        retrieved: "2026-10-12"
        quote: >-
          Permission is hereby granted, free of charge, to any person obtaining a
          copy of this software and associated documentation files
      - url: https://sbabic.github.io/swupdate/swupdate.html
        type: official-docs
        title: SWUpdate overview
        retrieved: "2026-10-12"
        quote: >-
          It is generally used in the single copy approach, running in an initrd
          (recipes are provided to generate with Yocto). However, it is possible
          to use it in a double-copy approach by use of Software collections.
      - url: https://sbabic.github.io/swupdate/swupdate.html
        type: official-docs
        title: SWUpdate overview, framework
        retrieved: "2026-10-12"
        quote: >-
          However, it should be mainly considered as a framework, where further
          protocols or installers (in SWUpdate they are called handlers) can be
          easily added to the application.
      - url: https://raw.githubusercontent.com/sbabic/meta-swupdate/master/README
        type: source-repo
        title: meta-swupdate README
        retrieved: "2026-10-12"
        quote: >-
          This layer's purpose is to add support for a deployment mechanism of
          Yocto's images based on swupdate project.
