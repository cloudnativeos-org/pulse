  d05_rollback_recovery:
    normalized:
      provided_by: "update layers, not OpenEmbedded-Core"
      rollback_to_previous: "set by the update layer: A/B slot fallback documented for RAUC and Mender; OSTree rollback capability documented for meta-updater; SWUpdate not recorded"
      automatic_rollback_on_boot_failure: "set by the layer and the bootloader. RAUC leaves the fallback to the bootloader and advises a hardware watchdog. Mender rolls back when the update is not committed"
      retained_versions: "one previous version in an A/B layout, by design; RAUC also documents three redundant slots"
      recovery_environment: unknown
      factory_reset: unknown
      network_independent_recovery: unknown
    summary: >-
      OpenEmbedded-Core documents no rollback mechanism. Rollback comes from the
      update layer the adopter selects, and the bootloader the adopter configures
      carries part of it.
    notes: >-
      RAUC states that the boot logic needs feedback from the booted system and
      provides commands to mark a slot good or bad. It says detecting an invalid
      boot is often not possible and that a system should use a hardware watchdog
      with bootloader support to treat watchdog resets as failed boots. The
      fallback choice is, in its words, up to the bootloader.

      Mender commits the update on the first boot after an update. If the device
      reboots before the commit, the bootloader flips the partitions back.

      Mender also states a constraint on the filesystem: an OS update replaces
      all files in a filesystem, so the filesystem has to be stateless and
      modified files have to live in a separate partition.

      Recovery environment, factory reset and network-independent recovery are
      not documented at project level, because they depend on the partition
      layout and bootloader the adopter builds.
    evidence: DOCUMENTED
    sources:
      - url: https://rauc.readthedocs.io/en/latest/basic.html
        type: official-docs
        title: RAUC basics, boot confirmation and fallback
        retrieved: "2026-10-12"
        version: "1.15.1.532-1a41"
        quote: >-
          your system should use a hardware watchdog during boot, and have
          support in the bootloader to detect watchdog resets as failed boots.
      - url: https://rauc.readthedocs.io/en/latest/basic.html
        type: official-docs
        title: RAUC basics, fallback is up to the bootloader
        retrieved: "2026-10-12"
        version: "1.15.1.532-1a41"
        quote: >-
          This handling is up to your bootloader.
      - url: https://rauc.readthedocs.io/en/latest/basic.html
        type: official-docs
        title: RAUC basics, redundant slots
        retrieved: "2026-10-12"
        version: "1.15.1.532-1a41"
        quote: >-
          This allows to have setups with three redundant slots (A/B/C update)
      - url: https://docs.mender.io/overview/introduction
        type: vendor-docs
        title: Mender introduction, rollback
        retrieved: "2026-10-12"
        quote: >-
          the bootloader knows that something went wrong and will roll back to the
          previous version by flipping the active and inactive partitions back
          again.
      - url: https://docs.mender.io/overview/introduction
        type: vendor-docs
        title: Mender introduction, stateless filesystem
        retrieved: "2026-10-12"
        quote: >-
          to be updatable, a filesystem needs to be stateless.
      - url: https://raw.githubusercontent.com/uptane/meta-updater/master/README.adoc
        type: source-repo
        title: meta-updater README, OSTree rollback
        retrieved: "2026-10-12"
        quote: >-
          is a tool for atomic full file system upgrades with rollback
          capability.
    unknowns:
      - "Whether SWUpdate documents rollback and boot-failure handling. The overview page read for this edition describes bootloader variable handling but states no rollback guarantee."
      - "Whether OpenEmbedded-Core documents any rollback of its own."
      - "Recovery environment, factory reset and network-independent recovery for any layer."

