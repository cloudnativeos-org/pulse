tradeoffs:
  buys:
    - "The adopter chooses the image contents, the init system, the package formats, the partition layout and the update mechanism at build time, from source recipes."
    - "Documented SPDX SBOM generation by default, a build-time CVE check, and reproducible builds down to the binary level."
    - "A four-year LTS series every two years, with Wrynose supported until April 2030."
    - "A choice of update layers (meta-rauc, meta-swupdate, meta-mender, meta-updater) and a layer for Kubernetes (meta-virtualization) for the current release series."
    - "Hardware support through board support package layers, with ARM, ARM 64-bit, RISC-V 64-bit and x86 tested daily."
  costs:
    - "The project releases no operating system image to run. Its reference distribution is documented as not usable as a product, so the adopter owns building, testing, signing, CVE response and support for the image."
    - "OpenEmbedded-Core documents no whole-image update or rollback mechanism. Each comes from a third-party layer with its own maintainers and schedule, and none of the four update layers appears in the project's tested list."
    - "A read-only root filesystem is not on by default. The documentation says the adopter must configure the system and applications to write elsewhere."
    - "Kubernetes appears only in the meta-virtualization layer's READMEs, with QEMU examples. The Yocto manuals do not mention it."

open_questions:
  - "Does the Yocto Project intend a project-level statement on which update layers it recommends, given that none of meta-rauc, meta-swupdate, meta-mender or meta-updater is in its supported-features list?"
  - "Which date is correct for the Wrynose 6.0 release: April 2026 (releases page) or May 2026 (release process page and the downloads directory listing for 6.0)?"
  - "What is the exact release date of 6.0.3: August 2026 (releases page) or early September 2026 (downloads directory time)?"
  - "Is there a documented, tested combination of read-only-rootfs, an A/B or OSTree update layer and the meta-virtualization k3s profile?"
  - "Does the meta-virtualization layer document cloud-init, or another declarative input, as a first-boot mechanism?"
  - "What is the intended relationship of the cri-o recipe version (1.35.0) to its source branch (release-1.36)?"
  - "How many of the Technical Steering Committee members and maintainers work for one company? The pages read publish names, not affiliations."
  - "Which of the update layers keeps a wrynose branch current, given that the default branches of meta-rauc and meta-updater declare only blacksail?"
  - "Can a bootable Yocto image be distributed through an OCI registry by a documented path?"
