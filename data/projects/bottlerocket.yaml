          repo: https://github.com/bottlerocket-os/bottlerocket-ecs-updater
          license: Apache-2.0 OR MIT
          org: bottlerocket-os
          note: "Installed into an ECS cluster via CloudFormation. Queries container instances for available updates and drains tasks during an update."
        - name: Twoliter
          repo: https://github.com/bottlerocket-os/twoliter
          license: Apache-2.0 OR MIT
          org: bottlerocket-os
          note: "Out-of-tree variant builds, including bring-your-own signing keys and partition layouts."
      commercial:
        - name: AWS Support
          vendor: AWS
          license: support-plan
          self_hostable: false
          note: "AWS-provided builds of Bottlerocket on EC2 are covered under the same AWS Support plans that cover EC2, EKS and ECR. Scope is AWS-provided builds on EC2."
        - name: EKS managed node groups and Karpenter
          vendor: AWS
          license: managed-service
          self_hostable: false
        - name: AWS Systems Manager
          vendor: AWS
          license: managed-service
          self_hostable: false
          note: "Session Manager and Run Command are the transport the default control container depends on."
        - name: Amazon Inspector
          vendor: AWS
          license: managed-service
          self_hostable: false
          note: "The control container uploads a CycloneDX SBOM to Inspector for vulnerability scanning, opt-out by setting."
      cluster_api:
        os_specific_provider: "none"
        maintainer: not-applicable
        upstream_provider_list: "not listed under any provider type"
        provisions: not-applicable
        bootstrap_target: "none upstream. The kubeadm bootstrap provider accepts cloud-config and ignition only, and this system uses neither."
        image_builder_target: "none"
        downstream_fork: "AWS carries a patched fork of Cluster API v1.13.2 in eks-anywhere-build-tooling that adds a bottlerocket bootstrap-data format, plus a patched vSphere provider. Consumed only by EKS Anywhere."
        upstream_attempts: "cluster-api#7840 asked for support in the kubeadm bootstrap provider and was closed in 2024 without implementation. cluster-api-provider-aws#4708 has been open since 2023-12-20."
    summary: >-
      An unusual amount of fleet capability lives in the open-source OS itself.
      Waves, version locking, update state machine and support bundles are all in
      the image, not in a product. The Kubernetes and ECS coordinators are
      separate optional repositories.
    notes: >-
      Waves deserve emphasis because they are the clearest case in this edition
      of a rollout control implemented in the OS rather than in a fleet manager.
      A publisher schedules a release so that a percentage of hosts take it within
      a time window, and each host decides its own position from a seed. No
      management plane is involved.

      The dependency on AWS services is real but sits at the transport and
      convenience layer rather than at the update layer. The default control
      container needs SSM to be useful, and host containers pull from ECR Public
      by default, but the TUF repository is self-hostable and the update API is
      local.

      The Cluster API position is the largest gap between how well something
      works and how portable it is, anywhere in this edition.

      Nothing upstream supports this system. It has no provider of any type, it
      is absent from the provider list, and it has no image-builder target. The
      kubeadm bootstrap provider accepts exactly two bootstrap-data formats,
      cloud-config and ignition, and this system uses neither, so the standard
      path does not merely lack a flavor, it cannot produce usable data. The
      request to add support, cluster-api#7840, was opened in January 2023 and
      closed in May 2024 without implementation, and the maintainers' stated
      reasoning was that adding another operating system to the current
      bootstrapper is not sustainable. The related request on the vendor's own
      infrastructure provider, #4708, has been open since December 2023.

      What does work is a downstream fork. The vendor vendors Cluster API
      v1.13.2 in its edge-Kubernetes build tooling and applies a patch that adds
      a third bootstrap-data format for this system, along with a patched
      vSphere provider. That stack has shipped in the vendor's own on-premises
      Kubernetes product since 2021, so the integration is battle-tested in
      absolute terms. It is simply not upstream and not usable on a stock
      Cluster API installation, and those are different claims.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/bottlerocket-os/bottlerocket-core-kit/blob/develop/sources/updater/README.md
        type: source-repo
        title: Updater, waves
        retrieved: "2026-09-22"
