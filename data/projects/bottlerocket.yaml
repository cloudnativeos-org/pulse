tradeoffs:
  buys:
    - "A whole-root A/B image with dm-verity, an ephemeral /etc and a modelled settings store means the machine's state is determined by its version plus its settings. There is no package database or local file edit that can make an update non-deterministic."
    - "Fail-closed integrity: the kernel restarts on verity corruption rather than continuing in an unknown state."
    - "Ships with SELinux enforcing and no way to disable it, no shell, no interpreters, and kernel lockdown on by default."
    - "Update waves, version locking and the full update state machine live in the open-source OS, so staged rollout across a fleet needs no management product."
    - "TUF gives hash-pinned, multi-role-signed updates with key rotation, and the repository is documented as self-hostable with your own keys."
    - "Twoliter makes deep customization possible without forking, including replacing core packages, opting out of the update system and bringing your own signing keys."
    - "Permissive licensing with contributors retaining copyright, and a trademark policy that explicitly permits naming your own rebuilds and derivatives."
  costs:
    - "To use Secure Boot on bare metal, an operator must enrol a certificate, because Secure Boot uses a Bottlerocket-held key rather than the third-party UEFI CA. This is a deliberate design choice. On some firmware, enrolment is not possible."
    - "The Kubernetes minor version is part of the variant, so changing it is a node replacement, not an upgrade. Teams that cannot replace nodes freely inherit that constraint."
    - "No recovery environment, no rescue shell and no factory reset. The documented answer is host replacement, which leaves no documented way to recover a single machine in place."
    - "Access to a production node depends on the orchestrator, SSM, or a host container enabled in advance."
    - "amd64 and arm64 only, with additional architectures ruled out by written policy. Bare-metal Kubernetes variants were dropped in 2024, and the bare-metal documentation reads as current."
    - "No governance document, no maintainers file, no CODEOWNERS file and no foundation. Ownership is single-vendor, and decision-making is undocumented."
    - "NVIDIA variants turn kernel lockdown off and may include precompiled binaries built without the project's hardening flags."
    - "Encrypted storage is per-variant opt-in and is not enabled on the mainline Kubernetes variants. Its documentation states there is no recovery mechanism if PCR values change unexpectedly."
    - "The README's variant list, NVIDIA driver versions and bare-metal guidance are all out of date against the repository on the same branch."
