schema_version: "1.0.0"
edition: "2026"
id: bottlerocket
name: Bottlerocket
homepage: https://bottlerocket.dev/
repository: https://github.com/bottlerocket-os/bottlerocket
collected_at: "2026-09-15"

entry_kind:
  - distribution
  - platform-os

category_fit:
  comparable: full
  note: >-
    A released distribution with versions, an update system and a documented
    support policy. Comparable on all fourteen dimensions. Carries platform-os as
    a second entry kind because AWS produces it primarily for its own container
    services, and the project charter addresses that framing directly.

self_description:
  text: >-
    Bottlerocket is a free and open-source Linux-based operating system meant for
    hosting containers. Bottlerocket focuses on security and maintainability,
    providing a reliable, consistent, and safe platform for container-based
    workloads.
  source:
    url: https://github.com/bottlerocket-os/bottlerocket/blob/develop/README.md
    type: source-repo
    title: bottlerocket README
    retrieved: "2026-09-22"

version_observed:
  version: "v1.65.0"
  released: "2026-09-09"
  channel: stable
  method: >-
    Latest non-prerelease GitHub release on bottlerocket-os/bottlerocket via the
    releases API. 134 releases published as of this date.
  source:
    url: https://github.com/bottlerocket-os/bottlerocket/releases/tag/v1.65.0
    type: release-notes
    title: Bottlerocket v1.65.0
    retrieved: "2026-09-22"

taxonomy:
  workload_scope: kubernetes-oriented-host
  construction_model:
    - vendor-fixed-image
    - framework
  root_state_substrate:
    - ab-partition-image
  notes: >-
    Not a Kubernetes appliance: ECS variants exist, and a non-orchestrator
    variant family exists in tree. But the project itself says "Bottlerocket is
    best used with a container orchestrator", and every fully supported
    variant runs an orchestrator agent; the variants README labels the
    orchestrator-free aws-mantle-1 family "limited support". That places it on the
    kubernetes-oriented-host position rather than at either extreme.

    framework appears as a second construction model because Twoliter is a
    supported, documented path for building a variant out of tree, with the
    explicit goal of letting maintainers replace core packages, opt out of
    subsystems including the update system, bring their own signing keys and
    define their own partition layouts. That is a framework, and it carries the
    framework's cost.

dimensions:
  d01_os_model:
    normalized:
      workload_scope: kubernetes-oriented-host
      ships_kubernetes: true
      ships_orchestrator_agent: true
      variant_model: true
    summary: >-
      A minimal container host with no package manager, built around variants:
      pre-defined sets of drivers, tools and an orchestrator agent, tailored to a
      platform, an orchestrator and an orchestrator version.
    notes: >-
      The variant is the central concept and it has consequences everywhere else
      in this profile. A variant name encodes platform, orchestrator,
      orchestrator version, optional flavour and architecture. The Kubernetes
      minor version is baked into the variant, so moving between Kubernetes minor
      versions is a node replacement, not an upgrade.

      Flavours documented: nvidia adds NVIDIA GPU support, fips adds FIPS 140-3
      support.

      The charter states the project's own framing: "It is not a Kubernetes
      distro, nor an Amazon distro." That is a values statement and is recorded
      as such. It sits alongside, and does not change, the ownership facts in
      d13.

      The README's variant list is materially out of date against the variants
      tree on the same branch. The tree additionally contains FIPS Kubernetes and
      VMware variants, aws-ecs-4, and an aws-mantle-1 family that runs no
      orchestrator agent and is documented as permitted to make breaking changes
      without warning.
    evidence: DOCUMENTED
    sources:
      - url: https://bottlerocket.dev/en/os/1.64.x/concepts/variants/
        type: official-docs
        title: Variants
        retrieved: "2026-09-22"
        quote: >-
          Bottlerocket is not a general purpose Linux distribution and
          intentionally doesn't have a package manager. Instead Bottlerocket has
          variants.
      - url: https://github.com/bottlerocket-os/bottlerocket/blob/develop/CHARTER.md
        type: governance-doc
        title: Bottlerocket charter
        retrieved: "2026-09-22"
        quote: >-
          It is not a Kubernetes distro, nor an Amazon distro. We obsess over
          shared components like the kernel, and work within the community to
          support new orchestrators and platforms.
      - url: https://github.com/bottlerocket-os/bottlerocket/blob/develop/variants/README.md
        type: source-repo
        title: Variants README
        retrieved: "2026-09-22"
        quote: >-
          This variant is intended for use by AWS Bedrock's Mantle API and may
          make breaking changes without warning.

  d02_immutability:
    normalized:
      read_only:
        - /
      writable_and_persistent:
        - /local
        - /var
        - /opt
      integrity_mechanism:
        - dm-verity
      integrity_scope: root-filesystem
      corruption_behaviour: kernel-restart-fail-closed
      survives_upgrade:
        - "/local, with /var and /opt bind-mounted from it"
        - "API settings, which are migrated through updates"
      ephemeral:
        - /etc
        - /run
      ephemeral_mechanism: tmpfs
      read_only_mechanism: dm-verity device
      configurable_paths:
        value: 'yes'
        evidence: DOCUMENTED
        how: 'Only to add storage: a bootstrap container can mount extra disks under /mnt, a bind mount of /local/mnt. No setting found changes the read-only or ephemeral set.'
        sources:
          - url: https://github.com/bottlerocket-os/bottlerocket/blob/8db07cb/README.md
            type: source-repo
            title: 'Bottlerocket README: mount propagation'
            retrieved: '2026-10-12'
            quote: You can use this feature to configure ephemeral disks attached to your hosts that you may want to use on your workloads.
          - url: https://github.com/bottlerocket-os/bottlerocket/blob/8db07cb/README.md
            type: source-repo
            title: 'Bottlerocket README: /mnt'
            retrieved: '2026-10-12'
            quote: which itself is a bind mount of `/local/mnt`
      mounts_sources:
        - url: https://github.com/bottlerocket-os/bottlerocket/blob/8db07cb/SECURITY_GUIDANCE.md
          type: source-repo
          title: 'Bottlerocket security guidance: system mounts'
          retrieved: '2026-10-12'
          quote: Bottlerocket provides a read-only root filesystem, ephemeral mounts for system directories such as `/etc` and `/run`, and persistent storage under `/local`.
        - url: https://github.com/bottlerocket-os/bottlerocket/blob/8db07cb/SECURITY_GUIDANCE.md
          type: source-repo
          title: 'Bottlerocket security guidance: /local'
          retrieved: '2026-10-12'
          quote: The `/local` directory is where persistent storage is mounted, with `/var` and `/opt` as subdirectories.
    summary: >-
      The whole root filesystem is a read-only dm-verity device, and the kernel
      restarts if corruption is detected, so the system fails closed. /etc is a
      tmpfs and does not survive a reboot. Persistent state lives on a separate
      data volume at /local.
    notes: >-
      The ephemeral /etc is the distinguishing choice and its rationale is
      stated: direct modification of files like /etc/resolv.conf or the
      containerd config is not supported, which makes OS updates more reliable
      because no local edits need to be accounted for, and makes it harder for an
      attacker to persist a change across a reboot.

      Configuration is not lost by this design. API settings persist, are
      migrated through updates, and re-render the system configuration files from
      templates on every boot. The state is held in a modelled store, not in
      files on disk.

      The mutable area is protected by SELinux, not by being read-only. The
      project says so plainly, and notes that a sufficiently privileged user can
      alter SELinux labels.

      The project also states the limit of its own guarantee: dm-verity is
      incomplete unless Secure Boot is enabled, because an attacker with full
      access to the block device could otherwise alter both the verity metadata
      and the filesystem contents.

      A root shell is obtainable, via the admin container and sheltie, but the
      filesystem and verity setup prevent most changes from persisting.

      No mutable build is published, and that is worth stating precisely rather
      than as "there is no mutable Bottlerocket". Every variant the vendor
      publishes carries the same read-only dm-verity root, no variant flag or
      setting makes the root writable, and no such option appears in the
      variant documentation or the security guidance. What stops this from
      being a proven absolute is Twoliter, the out-of-tree variant toolchain
      recorded in this profile's taxonomy notes, which documents replacing core
      packages, opting out of subsystems and defining custom partition layouts.
      So the accurate claim is that the vendor publishes no mutable variant and
      documents no way to make the root writable, not that the codebase makes
      one impossible to build.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/bottlerocket-os/bottlerocket/blob/develop/SECURITY_FEATURES.md
        type: source-repo
        title: Bottlerocket security features
        retrieved: "2026-09-22"
        quote: >-
          Bottlerocket uses tmpfs, a memory-backed filesystem, for /etc. Direct
          modification of system configuration files such as /etc/resolv.conf or
          /etc/containerd/config.toml is not supported.
      - url: https://bottlerocket.dev/en/os/1.64.x/concepts/restricted-filesystem/
        type: official-docs
        title: Restricted filesystem
        retrieved: "2026-09-22"
        quote: >-
          Bottlerocket's root filesystem is a dm-verity device: all dm-verity
          devices are read-only
      - url: https://github.com/bottlerocket-os/bottlerocket/blob/develop/README.md
        type: source-repo
        title: Bottlerocket README, storage layout
        retrieved: "2026-09-22"
        quote: >-
          The data device is used as persistent storage for container images,
          container orchestration, host-containers, and bootstrap containers.

  d03_artifact:
    normalized:
      primary_artifact: disk-image
      distribution: tuf-repository
      oci_registry_distribution: "build inputs and host containers only, not the OS"
      content_addressable: true
      mirrorable: true
      signed: tuf-multi-role
      air_gapped_capable: partial
    summary: >-
      The artifact is a full disk image, registered as an AMI on AWS or written
      directly to disk on metal. Updates are distributed through a TUF
      repository, so payloads are hash-pinned in signed metadata and cannot be
      fetched outside it.
    notes: >-
      TUF gives this profile its content-addressability: the targets metadata
      lists every available file and its hash, and a file can only be downloaded
      via the TUF repository, which prevents a client from downloading untrusted
      data. The root role ships inside the image and can be rotated through
      threshold signing.

      The repository is mirrorable and self-hostable, and this is documented from
      the publisher's side, including signing keys held as local files, SSM
      SecureString parameters or KMS keys. Repository URLs can be changed at
      build time or at run time through user data.

      Air-gapped operation is recorded as partial rather than yes. The TUF half
      is documented. The other half is not: host containers pull from ECR Public
      by default, and the documented outbound requirements include ECR, EKS,
      IMDS, SSM and possibly STS endpoints. There is no end-to-end air-gap
      runbook.

      OCI registries are used, but for build inputs rather than the OS. A kit is
      a Yum repository distributed atomically as a container image, and the core
      and kernel kits are published to ECR Public. Host containers are also OCI
      images.

      GitHub releases carry no binary assets at all. Images come as AMIs or
      through tuftool.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/bottlerocket-os/bottlerocket-core-kit/blob/develop/sources/updater/README.md
        type: source-repo
        title: Bottlerocket updater
        retrieved: "2026-09-22"
        quote: >-
          Any file listed in the manifest is also a TUF 'target' listed in
          targets.json and can only be downloaded via the TUF repository,
          preventing the client from downloading untrusted data.
      - url: https://github.com/bottlerocket-os/bottlerocket/blob/develop/PUBLISHING.md
        type: source-repo
        title: Publishing
        retrieved: "2026-09-22"
        quote: >-
          There are two ways to point your hosts at your own repo - at build
          time or at run time.
      - url: https://github.com/bottlerocket-os/bottlerocket/blob/develop/PROVISIONING-METAL.md
        type: source-repo
        title: Provisioning on bare metal
        retrieved: "2026-09-22"
        quote: >-
          Decompress (unlz4) and write the Bottlerocket image to the desired
          disk
      - url: https://github.com/bottlerocket-os/twoliter/blob/develop/docs/design/README.md
        type: design-doc
        title: Twoliter design
        retrieved: "2026-09-22"
        quote: A kit is a Yum repo distributed in its entirety, atomically, as a container image.
    unknowns:
      - "No end-to-end air-gapped deployment runbook exists, covering both the TUF repository and the host container registry."

  d04_upgrade:
    normalized:
      fleet_upgrade:
        self_update: "No update agent is documented as a default. The README offers the operator, the ECS updater or an apiclient update apply."
        paths:
          - kind: operator
            name: "brupop (Bottlerocket update operator)"
            license: "Apache-2.0 OR MIT"
            class: open-source
            reconciliation: in-place
            status: "maintained"
            filter: true
            note: "Version v1.8.0 of 2025-11-20. Reboot coordination is inside the operator."
            evidence: DOCUMENTED
            sources:
              - url: https://bottlerocket.dev/en/os/1.64.x/update/methods/in-place/
                title: "Bottlerocket in-place updates"
                retrieved: "2026-10-06"
                quote: >-
                  The recommended method to update your Bottlerocket nodes on Kubernetes is with Brupop.
              - url: https://github.com/bottlerocket-os/bottlerocket-update-operator
                title: "bottlerocket-update-operator repository"
                retrieved: "2026-10-06"
          - kind: fleet-server
            name: "Bottlerocket ECS updater"
            license: "Apache-2.0 OR MIT"
            class: open-source
            reconciliation: in-place
            filter: true
            note: "For the ECS variant. The updater checks for updates on a timer."
            evidence: DOCUMENTED
            sources:
              - url: https://github.com/bottlerocket-os/bottlerocket-ecs-updater
                title: "bottlerocket-ecs-updater repository"
                retrieved: "2026-10-06"
                quote: >-
                  By default, the ECS updater checks for updates every 12 hours
          - kind: managed-service
            name: "EKS managed node groups and Karpenter"
            license: "service"
            class: service
            reconciliation: replacement
            filter: true
            note: "AWS services that replace nodes with a newer Bottlerocket image."
            evidence: DOCUMENTED
            sources:
              - url: https://docs.aws.amazon.com/eks/latest/userguide/managed-node-groups.html
                title: "EKS managed node groups"
                retrieved: "2026-10-06"
      version_identity:
        identifier: "VARIANT_ID plus VERSION_ID (plus BUILD_ID) in os-release"
        condition: "none"
        evidence: DOCUMENTED
        sources:
          - url: https://github.com/bottlerocket-os/bottlerocket/blob/develop/SECURITY_FEATURES.md
            type: official-docs
            title: "Bottlerocket security features"
            retrieved: "2026-10-06"
            quote: >-
              The root filesystem is marked as read-only and cannot be directly modified by userspace processes.
      mechanism:
        - ab-partition-switch
      scope: whole-os-image
      scope_sources:
        - url: https://github.com/bottlerocket-os/bottlerocket-core-kit/blob/develop/sources/updater/signpost/README.md
          type: source-repo
          title: Bottlerocket signpost README, partition sets
          retrieved: '2026-10-06'
          quote: two partition sets, each containing three partitions
      initiator: operator-or-automation
      requires_kubernetes: false
      requires_vendor_infrastructure: false
      self_hostable_update_server: true
      self_hostable_update_source: "A mirrored or self-hosted TUF repository"
      artifact_verification: tuf-four-role
      rollout_control: waves
      cross_variant_upgrade: "none"
    summary: >-
      Two identical partition sets. An update writes the full filesystem image to
      the inactive set, then GPT priority bits switch the active set, then the
      machine reboots. There is no package database or shared filesystem tree
      that can become corrupted.
    notes: >-
      The stated rationale is worth recording because it is a direct architectural
      claim: using partition sets and modelled settings removes the dependency on
      correct local state for reliable updates.

      The update path is apiclient against a local Unix socket, so it works
      without Kubernetes. The Kubernetes operator is explicitly optional. An ECS
      updater and SSM Command Documents are the non-Kubernetes automation paths.

      Waves are a first-class rollout control in the OS itself, not in a fleet
      product. Each host computes its position in a wave from a seed value and
      will not report an update as available until its time has passed. Waves can
      be ignored, and a node can be pinned with a version lock.

      Guard rails: updog only considers version increases by default, respects a
      max_version field in the manifest, refuses updates for a different variant,
      and checks that migration files exist to transition safely in both
      directions.

      Two documented limits matter operationally. Moving between Kubernetes minor
      versions, or adding a flavour such as nvidia, is a variant change and
      therefore a node replacement rather than an in-place upgrade. And updating
      between versions that are too far apart can fail with a no-space error, so
      the documented workaround is to update a couple of releases at a time.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/bottlerocket-os/bottlerocket/blob/develop/README.md
        type: source-repo
        title: Bottlerocket README, updates
        retrieved: "2026-09-22"
        quote: >-
          The Bottlerocket image has two identical sets of partitions, A and B.
          When updating Bottlerocket, the partition table is updated to point
          from set A to set B, or vice versa.
      - url: https://github.com/bottlerocket-os/bottlerocket-core-kit/blob/develop/sources/updater/README.md
        type: source-repo
        title: Bottlerocket updater, TUF roles and waves
        retrieved: "2026-09-22"
        quote: >-
          Updog also considers the Bottlerocket "variant" of its current image
          and will not download updates for a different variant.
      - url: https://bottlerocket.dev/en/os/1.64.x/update/guidelines/
        type: official-docs
        title: Update guidelines
        retrieved: "2026-09-22"
        quote: >-
          In order to move between Kubernetes versions (or any variant), you must
          replace the nodes in your cluster.
      - url: https://github.com/bottlerocket-os/bottlerocket/blob/develop/SECURITY_FEATURES.md
        type: source-repo
        title: Security features, update policy
        retrieved: "2026-09-22"
        quote: >-
          Our philosophy for variants is that the right time for an unexpected
          major version update to the kernel or orchestrator agent is "never".

  d05_rollback_recovery:
    normalized:
      rollback_to_previous: available
      automatic_rollback_on_boot_failure: available
      automatic_rollback_trigger: "boot not marked successful"
      automatic_rollback_attempts: "GPT tries-remaining field, one attempt after upgrade-to-inactive"
      retained_versions: 2
      recovery_environment: "none"
      factory_reset: unknown
      network_independent_recovery: partial
      downgrade_to_older_release: available
    summary: >-
      GPT attributes track priority, tries remaining, successful boot and
      whether boot has ever succeeded. An upgrade grants the new partition one
      boot attempt and rolls back automatically if it fails. Two partition sets
      are retained.
    notes: >-
      Manual rollback is signpost rollback-to-inactive followed by a reboot, and
      the project notes it requires no external communication, which makes it the
      one documented network-free recovery action.

      Downgrading to an older release is supported through the update system and
      is visible in the available-updates list, because the project supports
      rolling back. That is a different capability from the two-partition
      rollback and is recorded separately.

      There is no recovery partition, no rescue shell and no factory reset
      documented. The project's stated model is different: SECURITY_GUIDANCE.md
      has a section called "Design for host replacement". That is a coherent
      answer for a fleet of interchangeable nodes, and it is a real gap for a
      single machine that must be recovered in place.

      network_independent_recovery is partial for a specific reason. The rollback
      command itself needs no network, but reaching a shell to run it requires
      either an already-enabled admin container or a serial console on a
      development variant. For a production variant with both host containers
      disabled and no network, no offline recovery path is documented. The
      documented recovery for that state goes back through the orchestrator, by
      mounting the API socket into a privileged pod.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/bottlerocket-os/bottlerocket-core-kit/blob/develop/sources/updater/signpost/README.md
        type: source-repo
        title: signpost
        retrieved: "2026-09-22"
        quote: >-
          Run signpost upgrade-to-inactive to prioritize the inactive partitions
          and allow it one boot attempt before automatically rolling back.
      - url: https://github.com/bottlerocket-os/bottlerocket/blob/develop/README.md
        type: source-repo
        title: Bottlerocket README, rollback
        retrieved: "2026-09-22"
        quote: >-
          This doesn't require any external communication, so it's quicker than
          apiclient, and it's made to be as reliable as possible.
      - url: https://bottlerocket.dev/en/os/1.64.x/login/regaining-access/
        type: official-docs
        title: Regaining access
        retrieved: "2026-09-22"
        quote: >-
          In general, the solution is to mount the API client and API socket
          into a container on the Bottlerocket node and use the API client to
          re-enable the admin container, control container, or both.
      - url: https://github.com/bottlerocket-os/bottlerocket/blob/develop/SECURITY_GUIDANCE.md
        type: source-repo
        title: Security guidance
        retrieved: "2026-09-22"
        quote: >-
          We recommend designing for periodic host replacement even with
          automated updates enabled.
    unknowns:
      - "No documented recovery environment, factory reset, or offline recovery path for a production variant with both host containers disabled and no network."

  d06_customization:
    normalized:
      runtime_package_install: "none"
      mechanisms:
        - settings-api
        - host-containers
        - bootstrap-containers
        - bootstrap-commands
        - variant-build
        - twoliter-out-of-tree-build
        - kmod-kit
      customization_points:
        - build-time
        - provisioning
        - boot-time
        - runtime
      add_software:
      - kind: build-time-only
        how: Software is added when the image is built. An adopter defines a custom variant out of tree with Twoliter. The design document says software cannot be installed after the image is created.
        evidence: DOCUMENTED
        sources:
        - url: https://github.com/bottlerocket-os/twoliter/blob/ff81b1732407cbeb2f6730ec0ce251a762064eb4/docs/design/README.md
          type: design-doc
          title: Twoliter design document
          retrieved: '2026-10-12'
          quote: Because software cannot be installed on Bottlerocket after the image has been created, it lacks a traditional package manager.
        - url: https://github.com/bottlerocket-os/bottlerocket/blob/8db07cb89e233ea931d74e0c0aab331d12a6b5af/BUILDING.md
          type: source-repo
          title: Building Bottlerocket
          retrieved: '2026-10-12'
          quote: If you'd like to build your own image instead of relying on an Amazon-provided image, follow these steps.
    summary: >-
      No package manager, and the project says so deliberately: there are no
      interpreted languages installed or even available as packages. The two
      supported configuration routes are the settings API and containers.
    notes: >-
      Four distinct customization points exist at boot and runtime, in order.
      Bootstrap commands run first and can only invoke apiclient. Bootstrap
      containers run next, concurrently, before the orchestrator, and one marked
      essential that exits non-zero halts the boot. Host containers run
      continuously outside the orchestrator with their own containerd instance.
      Orchestrated containers run last.

      Host containers are not privileged by magic: the control and admin
      containers are ordinary host containers with specific privileges, and the
      documentation says their functionality can be fully replaced with your own.

      Build-time customization has two tiers. In tree, a variant is a Cargo.toml
      listing included packages and an optional image layout. Out of tree,
      Twoliter exists specifically so that customizing Bottlerocket does not
      require forking the repository, with stated requirements covering replacing
      core packages, opting out of subsystems including the update system,
      bringing your own signing keys and defining your own partition layouts.

      Out-of-tree kernel modules are supported through the kmod kit, a
      cross-compilation toolchain and kernel headers downloaded from the TUF
      repository.

      The stated scope limit on official images is explicit: no plan to add
      out-of-tree drivers, no plan to add CPU architectures, no plan to add
      drivers for embedded devices.

      One security consequence of a flavour is worth recording precisely. NVIDIA
      variants need to load unsigned kernel modules at runtime, which kernel
      lockdown in integrity mode prohibits, so on those variants lockdown is set
      to none. The project also notes that NVIDIA variants include precompiled
      binaries that may not have been built with its hardening flags. That is a
      documented trade, stated once in the security document and not repeated in
      the GPU documentation.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/bottlerocket-os/bottlerocket/blob/develop/SECURITY_FEATURES.md
        type: source-repo
        title: Security features
        retrieved: "2026-09-22"
        quote: >-
          Interpreted languages such as Python are not installed or even
          available as packages.
      - url: https://bottlerocket.dev/en/os/1.64.x/concepts/bootstrap-containers/
        type: official-docs
        title: Bootstrap containers
        retrieved: "2026-09-22"
        quote: >-
          any bootstrap container set to essential=true that exits with an
          non-zero exit code halts the boot process
      - url: https://bottlerocket.dev/en/os/1.64.x/concepts/host-containers/
        type: official-docs
        title: Host containers
        retrieved: "2026-09-22"
        quote: >-
          The control and admin containers are not actually special: both are
