open_questions:
  - "Is there a governance document not in the repository? How are maintainers added and removed, and has any non-Amazon party held a maintainer role?"
  - "Has a foundation donation been formally considered, and is there a public position? The charter says 'not an Amazon distro' while ownership, trademarks, security reporting and code of conduct route to Amazon."
  - "Which released variants ship with encrypted-storage enabled, and is there a plan to enable it on the mainline aws-k8s variants?"
  - "Is the aws-mantle-1 family intended to become a generally supported orchestrator-free variant?"
  - "What is the supported story for running fully air-gapped, covering both a mirrored TUF repository and mirrored host container images? Is that configuration tested?"
  - "Are per-variant end-of-support dates published anywhere machine-readable?"
  - "Is bare metal a supported target going forward? The metal Kubernetes variants were dropped in v1.27.0 but the metal documentation reads as current."
  - "Is riscv64 categorically out of scope, or is 'no plan to add additional CPU architectures' a statement about core images that an out-of-tree Twoliter build could address?"
  - "Are per-release SBOMs or SLSA provenance attestations published for official AMIs?"
  - "What is the intended recovery path for a production node with both host containers disabled, no orchestrator and no network? No offline recovery path is documented for a production variant."
  - "The EKS docs disagree on the second FIPS-validated module, naming AWS-LC on one page and Go Cryptographic Module on another. Which applies where?"
  - "Which NIST CMVP certificate covers the kernel cryptographic module in the FIPS variants? No Bottlerocket or EKS source names one. Certificate 4808 is Historical and replaced by 5369, and Bottlerocket ships kernels other than the 6.1.41 build that 5369 covers."
  - "Observed cadence is a two-week median against a stated six-week release train. Has the target changed, and does it affect default wave schedules?"
  - "What does the external-kmod-development flag gate, and does the kmod-kit workflow still work on variants where it is false?"

