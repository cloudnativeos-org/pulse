  d14_maturity:
    normalized:
      first_release: "2020-01-18"
      general_availability: "2020-08-31"
      current_version: "v1.65.0"
      current_version_date: "2026-09-09"
      release_cadence: "median roughly 14 to 15 days over the last ten releases, against a stated intent of about six weeks"
      observed_intervals: "41, 12, 24, 21, 14, 14, 12, 13, 15, 19 days across v1.56.0 to v1.65.0, counting v1.58.0, which GitHub flags as a pre-release and whose notes say its rollout was stopped"
      support_model: versioned-with-eol
      support_window: "Kubernetes variants approximately 14 months from first release of the variant, following the EKS support policy including extended support; ECS variants at least one year"
      commercial_support: available
    summary: >-
      Six years old, GA since August 2020, 134 releases. Support windows are
      expressed per variant rather than per release, which follows from the
      variant model: a variant pegs to a kernel and GPU driver version and
      receives security patches for its window.
    notes: >-
      The support philosophy is stated directly and is unusual enough to quote in
      full effect: the right time for an unexpected major version update to the
      kernel or orchestrator agent is never. New variants introduce newer LTS
      kernels; existing variants stay pegged unless security patches stop being
      available for the pegged component.

      Observed cadence is currently much faster than the stated intent. The
      roadmap describes a loose release train about six weeks apart; the last ten
      intervals have a median around two weeks. One release in that window,
      v1.58.0, carries the GitHub pre-release flag and a note that its rollout
      was stopped for an image-pull regression, with users directed to v1.59.0.
      It is counted in the intervals because it was published; the
      version-observed method, which takes the latest non-pre-release, would
      skip it.

      No per-variant calendar of concrete end-of-support dates is published, only
      the relative windows. That is a real gap for anyone planning a migration,
      and it is the same class of gap seen on several other projects in this
      edition.

      The companion operator has a narrower support policy than the OS: security
      patches for the latest minor version only.
    evidence: DOCUMENTED
    sources:
