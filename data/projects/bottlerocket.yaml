  d09_provisioning:
    normalized:
      config_tools:
        - name: "TOML settings (early-boot-config and the API)"
          license: "Apache-2.0 OR MIT"
          runs: [userspace]
          reruns: any-time
          runs_note: "Runs in userspace after the network is online; early-boot-config runs once and settings re-render config files each boot (INFERRED)."
          early_disk: "In userspace, user data can run apiclient ephemeral-storage init through settings.bootstrap-commands, which sets up devices as a RAID array and formats them; TPM2 data encryption is a build feature (INFERRED)."
          change_after_first_boot: "apiclient set, at any time"
          evidence: DOCUMENTED
          sources:
            - url: https://github.com/bottlerocket-os/bottlerocket-core-kit/blob/2d7f4ea/packages/early-boot-config/early-boot-config.service
              title: "early-boot-config.service"
              retrieved: "2026-10-06"
              quote: >-
                Need network online to talk to IMDS
            - url: https://github.com/bottlerocket-os/bottlerocket-core-kit/blob/2d7f4ea/sources/api/apiclient/README.md
              title: "apiclient README"
              retrieved: "2026-10-06"
              quote: >-
                sets up the storage devices as a RAID array and formats them
            - url: https://bottlerocket.dev/en/os/1.59.x/concepts/bootstrap-commands/
              title: "Bottlerocket bootstrap commands"
              retrieved: "2026-10-06"
      methods:
        - ami-launch-with-user-data
        - vmware-cdrom-or-guestinfo
        - direct-disk-write-metal
        - local-qemu
      config_mechanism: toml-user-data-via-early-boot-config
      config_reapplied: "settings persist in a datastore and re-render config files on every boot"
      pxe: unknown
      iso: unknown
    summary: >-
      Configuration is TOML settings delivered as user data and applied by
      early-boot-config. Sources are read in order with later sources overriding
      earlier ones, starting with an on-disk file, then IMDS on AWS, or CD-ROM
      and guestinfo on VMware.
    notes: >-
      Bare metal provisioning is structurally different and the docs explain why:
      because boot and root are dm-verity checked and the system is immutable at
      runtime, a user cannot provision an image and then write configuration
      files into it. Instead you write the image to disk, mount the private
      partition, and place user-data.toml, a mandatory net.toml and an optional
      bootconfig.data there.

      net.toml being mandatory is a real operational fact: no default network
      configuration is provided, and without it the host containers, containerd
      and kubelet all fail to start. Metal images also enable no host containers
      by default.

      No PXE, netboot, ISO or zero-touch provisioning is documented. The metal
      flow assumes an external provisioning system capable of writing a disk
      image and then mounting a partition.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/bottlerocket-os/bottlerocket/blob/develop/PROVISIONING-METAL.md
        type: source-repo
        title: Provisioning on bare metal
        retrieved: "2026-09-22"
        quote: >-
          Since Bottlerocket has a dm-verity-checked boot and root partition, and
          is immutable at runtime, a user cannot provision an image and directly
          write configuration files.
      - url: https://github.com/bottlerocket-os/bottlerocket/blob/develop/variants/README.md
        type: source-repo
        title: Variants README, user data sources
        retrieved: "2026-09-22"
        quote: >-
          All variants first attempt to read user data from
          /var/lib/bottlerocket/user-data.toml.
      - url: https://github.com/bottlerocket-os/bottlerocket/blob/develop/README.md
        type: source-repo
        title: Bottlerocket README, early-boot-config
        retrieved: "2026-09-22"
        quote: >-
          If you start a virtual machine, like an EC2 instance, it will read
          TOML-formatted Bottlerocket configuration from user data and send it
          to the API server.
    unknowns:
      - "PXE, netboot, ISO and zero-touch provisioning are not documented anywhere in the project's own sources."

  d10_security:
    normalized:
      boot_trust_chain:
        level: 3
        how: default-on
        route: verity-root-hash-in-signed-artifact
        artifact: signed GRUB config
        note: On new variants on UEFI platforms, when the firmware enforces Secure Boot. Firmware measures PCR
          4 and 7, and Bottlerocket services extend PCR 8, 9 and 11 after boot. No Secure Boot on legacy BIOS
          or Xen instances
        evidence: DOCUMENTED
        sources:
        - url: https://raw.githubusercontent.com/bottlerocket-os/bottlerocket/develop/SECURITY_FEATURES.md
          type: official-docs
          title: Bottlerocket security features
          retrieved: '2026-10-06'
          quote: grub verifies that its grub.cfg is signed correctly
        - url: https://bottlerocket.dev/en/os/1.64.x/concepts/chain-of-trust/
          type: official-docs
          title: Bottlerocket chain of trust
          retrieved: '2026-10-06'
          quote: The GRUB configuration contains the dm-verity root hash
      secure_boot: available-own-keys
      secure_boot_ca: "Bottlerocket self-signed certificate, deliberately not the Microsoft third-party UEFI CA"
      measured_boot: available
      tpm: "TPM2, PCRs 8, 9 and 11 extended at defined boot stages"
      integrity: dm-verity
      integrity_scope: root-filesystem
      disk_encryption: "LUKS2 for /local plus fscrypt for the datastore, TPM2-sealed; per-variant opt-in"
      artifact_verification: tuf-four-role
      sbom: "tooling and on-host inventory, no per-release artifact"
      provenance: unknown
      fips: "FIPS variants exist; AWS names the Amazon Linux 2023 Kernel Crypto API Cryptographic Module, with no certificate number given in the cited sources"
      mandatory_access_control: "SELinux enforcing, cannot be disabled"
      kernel_lockdown: "integrity mode by default, set to none on NVIDIA variants"
      shell_present: false
      default_on:
        - dm-verity-read-only-root
        - selinux-enforcing
        - ephemeral-etc
        - no-shell-no-interpreters
        - kernel-lockdown-integrity
        - tuf-verified-updates
        - uefi-secure-boot-where-firmware-supports
        - compiler-hardening
      opt_in:
        - fips-flavour
        - nvidia-flavour
        - encrypted-storage
        - admin-container
    summary: >-
      An unusually dense default security posture: verity root, SELinux enforcing
      with no way to disable it, no shell and no interpreters, kernel lockdown,
      TUF-verified updates, and Secure Boot on by default where firmware supports
      it since 1.15.0.
    notes: >-
      Secure Boot is the dimension where Bottlerocket differs most sharply from
      its peers, and the difference is a deliberate documented choice. Many
      operating systems use a shim signed by the Microsoft third-party UEFI CA.
      Bottlerocket does not use that certificate. It uses a self-signed
      certificate, with the stated intent of letting an operator focus the
      machine's trust on their chosen OS only. The consequence on metal is that
      the machine's NVRAM must contain Bottlerocket's db certificate, which ships
      in the EFI partition. Building with your own keys is documented, with an
      AWS-based profile using private CAs and KMS keys and a local profile the
      project strongly discourages for production.

      Secure Boot does not apply on legacy BIOS boot, which includes Xen-based
      EC2 instance types.

      Measured boot and encrypted storage are real but poorly surfaced. They are
      documented in the core kit rather than in SECURITY_FEATURES.md, which is
      the document the FAQ and the variants page point readers to. PCR 8 measures
      canonicalized OS settings before any external configuration or code runs,
      PCR 9 measures the kernel command line including the verity root hash, and
      PCR 11 measures boot phases.

      Encrypted storage is per-variant opt-in and, as read on this date, is not
      enabled on the mainline Kubernetes variants. In the variants tree on
      develop, the encrypted-storage image feature is set on aws-ecs-4,
      aws-mantle-1 (with ephemeral encryption keys) and aws-dev, and on none of
      the aws-k8s or vmware-k8s variants checked. Its documentation is blunt
      about its own threat model, listing what it does not protect against
      and stating that if PCR values change unexpectedly there is no built-in
      recovery mechanism and the result is restore from backup or data loss.

      SELinux cannot be disabled, and the project scopes its own policy honestly:
      it is currently aimed at hardening the OS against persistent threats, with
      container-from-container protection named as future work.

      FIPS variants exist across Kubernetes, VMware and ECS, introduced in
      v1.27.0. AWS states plainly that using them makes nodes FIPS ready but not
      automatically FIPS compliant. The AWS page names the Amazon Linux 2023
      Kernel Crypto API Cryptographic Module but gives no CMVP certificate
      number, and no Bottlerocket source names one. An earlier draft of this
      profile recorded certificate 4808; NIST lists that certificate as
      Historical, replaced by certificate 5369, so no number is recorded here.

      SBOM tooling exists (SPDX 2.3 and CycloneDX 1.6 in the SDK, plus a runtime
      uploader in the control container), and each host carries a build-time
      package inventory, but no per-release SBOM artifact or build provenance
      attestation was found. GitHub releases carry no assets.
    evidence: DOCUMENTED
    sources:
      - url: https://bottlerocket.dev/en/os/1.64.x/concepts/chain-of-trust/
        type: official-docs
        title: Chain of trust
        retrieved: "2026-09-22"
        quote: >-
          Many operating systems use a version of shim signed by the Microsoft
          3rd Party UEFI CA certificate. Bottlerocket does not use this
          certificate.
      - url: https://github.com/bottlerocket-os/bottlerocket/blob/develop/SECURITY_FEATURES.md
        type: source-repo
        title: Security features
        retrieved: "2026-09-22"
        quote: >-
          Bottlerocket enables SELinux by default, sets it to enforcing mode, and
          loads the policy during boot. There is no way to disable it.
      - url: https://github.com/bottlerocket-os/bottlerocket-core-kit/blob/develop/docs/ENCRYPTED_STORAGE.md
        type: source-repo
        title: Encrypted storage
        retrieved: "2026-09-22"
        quote: >-
          If TPM PCR values change unexpectedly ... No built-in recovery
          mechanism. Requires backup/restore or data loss.
      - url: https://github.com/bottlerocket-os/bottlerocket/blob/develop/sbkeys/README.md
        type: source-repo
        title: Secure Boot keys
        retrieved: "2026-09-22"
        quote: >-
          However, because these local profiles offer direct access to private
          key materials, they are strongly discouraged for any kind of
          production use.
      - url: https://docs.aws.amazon.com/eks/latest/userguide/bottlerocket-fips-amis.html
        type: vendor-docs
        title: Bottlerocket FIPS AMIs
        retrieved: "2026-09-22"
        quote: >-
          Using Bottlerocket FIPS AMIs makes your worker nodes 'FIPS ready' but
          not automatically 'FIPS-compliant'.
      - url: https://github.com/bottlerocket-os/bottlerocket/blob/develop/variants/aws-ecs-4/Cargo.toml
        type: source-repo
        title: aws-ecs-4 variant definition, image features
        retrieved: "2026-09-22"
        quote: "encrypted-storage = true"
    unknowns:
      - "No per-release SBOM artifact or SLSA build-provenance attestation was found."
      - "Two AWS pages disagree on which second module the FIPS AMIs use, naming AWS-LC and Go Cryptographic Module respectively."
      - "Which NIST CMVP certificate covers the kernel cryptographic module in the FIPS variants is not stated in any Bottlerocket or EKS source; the AL2023 FAQ lists certificate 5369 for kernel 6.1.41, and certificate 4808 is Historical."

  d11_operations_debugging:
    normalized:
      ssh: "none in the OS; available through the optional admin container"
      local_shell: "none in the OS; root shell via admin container and sheltie"
      api: "HTTP over a local Unix socket; remote access needs an authenticated transport"
      serial_console: "via the admin container's agetty services, and directly on development variants"
      debug_container: "admin container and control container"
      support_bundle: logdog
      works_without_kubernetes: "yes"
    summary: >-
      No SSH server and no shell in the image. Operations run through a settings
      and update API on a local Unix socket, reached remotely through an
      authenticated transport, and through two host containers that the operator
      controls.
    notes: >-
      Neither the presence nor the absence of a shell is treated as a virtue
      here. What the design buys is stated by the project: a shell and
      interpreters can be exploited by an attacker to pivot from a vulnerability
      that grants local code execution. What it costs is a dependency on either
      the orchestrator, SSM, or a pre-enabled host container to reach the machine
      at all, which is exactly the gap recorded under d05.

      The control container is enabled by default on AWS variants and runs the
      SSM agent. The admin container is disabled by default, has an SSH server,
      an unrestricted SELinux label and a mount of the host filesystem, and the
      documentation says its use should be rare.

      logdog collects a support bundle, retrievable over SSH, over SSM, or
      through the Kubernetes node proxy. Kernel crash dump collection exists but,
      as documented, only VMware variants have kdump support enabled.

      Operator hardening guidance is a first-class document with sections on
      restricting access to the host API socket, limiting host container use,
      limiting privileged SELinux labels, and designing for host replacement.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/bottlerocket-os/bottlerocket/blob/develop/README.md
        type: source-repo
        title: Bottlerocket README, access and logdog
        retrieved: "2026-09-22"
        quote: >-
          To improve security, there's no SSH server in a Bottlerocket image, and
          not even a shell.
      - url: https://github.com/bottlerocket-os/bottlerocket/blob/develop/SECURITY_FEATURES.md
        type: source-repo
        title: Security features, rationale for no shell
        retrieved: "2026-09-22"
        quote: >-
          these properties can also be exploited by an attacker to pivot from a
          vulnerability that grants local code execution
      - url: https://bottlerocket.dev/en/os/1.64.x/concepts/shell-less-host/
        type: official-docs
        title: Shell-less host
        retrieved: "2026-09-22"
        quote: >-
          Using the admin container should be rare: only used as-needed and by
          those required.
      - url: https://github.com/bottlerocket-os/bottlerocket/blob/develop/SECURITY_GUIDANCE.md
        type: source-repo
        title: Security guidance
        retrieved: "2026-09-22"
        quote: >-
          We recommend designing for periodic host replacement even with
          automated updates enabled.

