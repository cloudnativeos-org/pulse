  d07_kubernetes:
    normalized:
      requirement: optional
      bundled: bundled
      independent_lifecycle: partial
      os_manages_kubernetes: "no"
      kubernetes_manages_os: "Bottlerocket Update Operator (brupop), optional, separate repository"
      distributions:
        - EKS
        - self-hosted Kubernetes
        - Karpenter-managed
        - Amazon ECS
      managed_kubernetes_default_node_image: "no; EKS managed node groups on cluster version 1.30 or newer default to Amazon Linux 2023, and Bottlerocket is an opt-in AMI type"
      managed_kubernetes_sole_node_image: "yes on EKS Auto Mode; that mode runs a custom Bottlerocket variant and supports no other AMI"
    summary: >-
      Kubernetes is not required: ECS variants run the ECS agent instead, and a
      non-orchestrator variant family exists. But the orchestrator agent ships in
      the image, and the Kubernetes minor version is part of the variant name.
    notes: >-
      The default-versus-option distinction on the vendor's managed Kubernetes
      is recorded here because it is the fact a reader comparing hyperscalers
      needs, and "supported on EKS" hides it.

      On managed node groups it is **not** the default. Newly created managed
      node groups on cluster version 1.30 or newer default to Amazon Linux 2023,
      a conventional package-managed distribution whose own documentation names
      DNF as its package management tool. Bottlerocket is selected deliberately,
      as an AMI type on a managed node group, on self-managed nodes, or through
      Karpenter. An operator who selects nothing does not get it.

      On EKS Auto Mode it is the **only** option. That mode's nodes run a custom
      Bottlerocket variant, and the vendor's own guidance answers the question of
      customizing the AMI with "No, currently the only supported AMIs are for
      Amazon-provided Bottlerocket". The Auto Mode variant is built on the open
      source distribution and adds Auto Mode packages, disables host containers,
      and removes SSH and the Systems Manager agent. So the same platform offers
      both a mutable default and a mode with no mutable option at all, depending
      on which cluster mode is chosen at creation time.

      Lifecycle independence is partial and the split is precise. The Bottlerocket
      version is independent of the variant, so the OS updates freely within a
      variant. The Kubernetes minor version is not independent: changing it is a
      variant migration, which means replacing the node.

      Each variant declares a compatibility window, for example the aws-k8s-1.33
      variant being compatible with Kubernetes 1.33 through 1.36 clusters.

      Kubernetes manages the OS only if brupop is installed. It lives in a
      separate repository with its own release cadence and a narrower support
      policy, requires cert-manager, and is opt-in per node through a label.
    evidence: DOCUMENTED
    sources:
      - url: https://bottlerocket.dev/en/os/1.64.x/concepts/variants/
        type: official-docs
        title: Variants
        retrieved: "2026-09-22"
        quote: >-
          you cannot update to a different variant: that is a migration (which
          involves replacing a node in the orchestrated cluster)
      - url: https://github.com/bottlerocket-os/bottlerocket-update-operator
        type: source-repo
        title: Bottlerocket Update Operator
        retrieved: "2026-09-22"
