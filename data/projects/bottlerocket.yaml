  d13_governance:
    normalized:
      license: "Apache-2.0 OR MIT"
      license_note: "Dual licensed at the user's option. No copyright assignment is required to contribute."
      open_source: true
      open_governance: undocumented
      vendor_neutral_ownership: single-vendor
      foundation: "none"
      trademark_holder: "Amazon.com, Inc. or its affiliates"
      primary_commercial_sponsor: AWS
      contribution_diversity:
        method: >-
          Commit counts from the GitHub contributors API for
          bottlerocket-os/bottlerocket. This counts individuals, not
          organizations. No MAINTAINERS file, CODEOWNERS or affiliation data is
          published, so organizational spread cannot be established from primary
          sources and is not inferred here.
        value: >-
          A deep contributor list with a long tail: the top contributor has 965
          commits, roughly forty contributors have ten or more, and release notes
          credit outside contributors by handle. Every governance, security,
          trademark and code-of-conduct pointer in the repository routes to
          Amazon.
    summary: >-
      Dual licensed Apache-2.0 or MIT, with no copyright assignment required.
      Amazon owns the trademarks and there is no foundation. There is no
      governance document, no maintainers file and no CODEOWNERS.
    notes: >-
      The four governance properties separate cleanly here and the result is
      mixed rather than simple. Open source: yes, and unusually permissively,
      with contributors retaining copyright. Open governance: undocumented.
      CHARTER.md states values and CONTRIBUTING.md states mechanics; neither says
      who decides, how maintainers are appointed or removed, or how disputes are
      resolved. Vendor-neutral ownership: no. Contribution diversity: a broad
      contributor list, with affiliation unpublished.

      The trademark policy is detailed and permissive in an interesting way. It
      allows use of the name for an unmodified rebuild provided the distribution
      is clearly identified as yours and the commit is named, and for a modified
      version with an added identifier. It even documents the mechanics of
      complying by modifying the os-release file. The policy text itself is
      CC BY-SA and is based on Mozilla's.

      The roadmap is public as a GitHub Project and is honest about its own
      limits, describing itself as a point-in-time snapshot subject to
      reconsideration.
