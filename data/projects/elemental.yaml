        retrieved: "2026-10-14"
        version: "v2.3.4"
        quote: "- riscv64"
      - url: https://github.com/rancher/elemental/blob/v2.3.1/.obs/dockerfile/SL-Micro-base-container/Dockerfile#L8
        type: source-repo
        title: Elemental OS base image Dockerfile, architectures
        retrieved: "2026-10-14"
