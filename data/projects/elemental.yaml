open_questions:
  - "Which SL Micro release do the current Elemental OS images use? The 1.9 channel table lists 6.1. The Elemental Linux v2.3.1 release note says SL Micro 6.2 is GA. The SUSE documentation page for Elemental is written for SLE Micro 5.5."
  - "Are the Elemental OS images signed, and can elemental upgrade --cosign verify them? The fleet upgrade job passes no --cosign or --verify. Is an upgrade pinned to a digest or to a tag, and is a digest recorded when the source is dir:/?"
  - "Does SUSE state Secure Boot support for the Elemental OS images? The toolkit installs shim and MokManager by default (grub.go), but no support statement was found. Are measured boot, disk encryption and FIPS available? These pages were not found in the Elemental docs."
  - "Is dm-verity or any other root integrity check planned or present? No source read mentions it."
  - "Which per-architecture tags are published for the Elemental OS images? The docs state x86-64 as production ready and ARM as development, and the base image Dockerfile has ExclusiveArch x86_64 aarch64. The toolkit builds a riscv64 binary, but the OS image recipe does not list riscv64."
  - "Is a systemd-sysext or other extension mechanism supported on the Elemental OS images?"
  - "What is the support lifecycle of each Elemental release line, and does SUSE publish a lifecycle for SUSE Rancher Prime: OS Manager?"
  - "Who holds the Elemental trademark, and who are the members of the @rancher/elemental team?"
  - "The toolkit reference page immutable_rootfs.md lists /etc as ephemeral and /usr as read-only. The 1.9 installation page lists the full path table. Which path list does the installed Elemental OS image follow for /root and /usr/libexec? The toolkit recovery layout file lists /root as an ephemeral tmpfs path and the 1.9 table lists /root as persistent. That layout file is in cloud-config-defaults, which the Elemental OS base image build does not initialize, so it may not be present in Elemental OS images."

