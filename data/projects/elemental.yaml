tradeoffs:
  buys:
    - "One OCI image per version, applied to every node of a cluster by a ManagedOSImage. The node keeps earlier snapshots and has one boot menu entry for each, so rollback to the previous version is local."
    - "Registration, install and cluster creation are declarative and connected: a MachineRegistration, a SeedImage and a Rancher Cluster take a bare machine to a RKE2 or K3s node with no interactive step."
    - "An air-gap path is documented, with a private registry and a channel image you build."
    - "Operator, toolkit, Fleet, System Upgrade Controller, Rancher Manager and the UI extension are all Apache-2.0 repositories."
    - "Machines authenticate at registration with TPM 2.0 attestation by default."
    - "Two ways to extend the OS: derive an image from the SL Micro base, or add packages with cloud-config hooks that run in every new snapshot."
  costs:
    - "Rancher Manager is required for the managed flow. Operator 1.9.x needs Rancher Manager v2.14 or later, and Kubernetes provisioning does not work with an older Rancher."
    - "The 1.9 release notes list SELinux enforcing mode as not supported, and OS Images based on SL Micro 6.0 (the 1.9 channels ship 6.1) can fail to boot with a kernel panic on virtual machines using an unsupported CPU type, because the x86-64-v2 instruction set is required."
    - "x86-64 is the only production architecture. ARM is in development and tested on Raspberry Pi 4 only."
    - "The default registration method needs a TPM 2.0 device. The alternatives are not recommended for production."
    - "Package hooks reinstall the package on every upgrade, so the running snapshot can differ from the published image."
    - "Measured boot, disk encryption and FIPS are not described in the Elemental docs read for this edition. The toolkit installs shim and MokManager by default, but no Secure Boot support statement was found."
    - "No governance document, maintainer list or support window is published in the repositories read. Most commits carry suse.com addresses."
    - "Building derivatives from other container bases with the toolkit moves testing, signing and CVE response to the adopter."

