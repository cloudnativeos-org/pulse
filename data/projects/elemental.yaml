      - url: https://elemental.docs.rancher.com/airgap
        type: official-docs
        title: Air-gapped installation
        retrieved: "2026-10-14"
        version: "1.9"
        quote: In order to run Elemental in an air-gapped environment the following artifacts are needed
      - url: https://github.com/rancher/elemental-toolkit/blob/v2.3.4/docs/content/en/docs/Reference/installation_state.md
        type: official-docs
        title: Installation state
        retrieved: "2026-10-14"
        version: "v2.3.4"
        quote: "# If the source is an image, digest is provided."
      - url: https://github.com/rancher/elemental-toolkit/blob/v2.3.4/docs/content/en/docs/Getting%20started/install.md
        type: official-docs
        title: Installing
        retrieved: "2026-10-14"
        version: "v2.3.4"
        quote: "| --cosign                     | Enable cosign verification (requires images with signatures)"
      - url: https://github.com/rancher/elemental-toolkit/blob/v2.3.4/.goreleaser.yaml
        type: source-repo
        title: Toolkit goreleaser config
        retrieved: "2026-10-14"
