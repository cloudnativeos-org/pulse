  d06_customization:
    normalized:
      runtime_package_install: "through cloud-config hooks that run in the new snapshot at install, upgrade and reset"
      mechanisms:
        - derive-image-from-oci
        - cloud-config-at-install-upgrade-reset
        - oem-cloud-config
        - extra-rpms-at-install
      customization_points:
        - build-time
        - image-time
        - first-boot
        - upgrade-time
      add_software:
        - kind: derive-image
          how: Write a Dockerfile FROM the SL Micro base OS container, run zypper or rpm in it, set IMAGE in /etc/os-release, re-run elemental init, push the image. The new image is then listed as a ManagedOSVersion.
          evidence: DOCUMENTED
          sources:
            - url: https://elemental.docs.rancher.com/custom-images
              type: official-docs
              title: Build custom OS images
              retrieved: "2026-10-14"
              version: "1.9"
              quote: Since OS images provided by Elemental are container images, they can also be used as a base image
        - kind: transactional-packages
          how: A cloud-config with after-upgrade-chroot, after-install-chroot and after-reset-chroot commands, for example zypper in or rpm -iv, runs in the new snapshot each time. The package is reinstalled on every upgrade.
          evidence: DOCUMENTED
          sources:
            - url: https://github.com/rancher/elemental-toolkit/blob/v2.3.4/docs/content/en/docs/Customizing/runtime_persistent_changes.md
              type: official-docs
              title: Runtime persistent changes
              retrieved: "2026-10-14"
              version: "v2.3.4"
              quote: Elemental allows to apply a set of commands, or cloud-init steps, during upgrade, deploy, install and reset in the context of the target image
            - url: https://elemental.docs.rancher.com/extra-rpms
              type: official-docs
              title: Add third party RPMs
              retrieved: "2026-10-14"
              version: "1.9"
              quote: How to add third party RPMs at install time
    summary: >-
      The main route is to derive a new OCI image from the Elemental base and
      push it. For small changes, cloud-config hooks install packages into each
      new snapshot at install, upgrade and reset. Cloud-config also sets files,
      users, services and network at boot.
    notes: >-
      The toolkit also lets an adopter build a derivative from other container
      bases and ships a green example for that. In that case the adopter owns
      the image, its tests, its signing and its CVE response.

      Four image flavors are published: base, baremetal, kvm and rt. The rt
      flavor carries a real-time kernel.

      Cloud-config files in /oem persist. Files in /system/oem are part of the
      image and are reset on upgrade.

      No systemd-sysext or vendor extension mechanism is documented in the
      sources read.
    evidence: DOCUMENTED
    sources:
      - url: https://elemental.docs.rancher.com/custom-images
        type: official-docs
        title: Build custom OS images
        retrieved: "2026-10-14"
        version: "1.9"
