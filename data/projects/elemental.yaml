      - url: https://elemental.docs.rancher.com/authentication
        type: official-docs
        title: Authentication
        retrieved: "2026-10-14"
        version: "1.9"
        quote: The only officially supported registration method is based on TPM attestation
      - url: https://elemental.docs.rancher.com/installation
        type: official-docs
        title: Installation, installation media
        retrieved: "2026-10-14"
        version: "1.9"
        quote: The live ISO supports PXE booting for direct integration with
      - url: https://elemental.docs.rancher.com/raspi-disk
        type: official-docs
        title: Raw disk images for Raspberry Pi
        retrieved: "2026-10-14"
        version: "1.9"
        quote: On first boot the system will boot into the recovery system
    unknowns:
      - "How a machine without a TPM 2.0 device is supported in production. The docs name TPM attestation as the only supported method."

  d10_security:
    normalized:
      secure_boot: unknown
      measured_boot: unknown
      tpm: "TPM 2.0 attestation authenticates a machine when it registers. TPM use for disk encryption or measured boot is not documented in the sources read."
      integrity: read-only-mount
      disk_encryption: unknown
      artifact_verification: "cosign and mtree flags exist and are off in the code; the fleet upgrade job passes neither, so no signature or mtree verification applies on the ManagedOSImage path as shipped (layer digests are still checked when the image is pulled). Toolkit docs say mtree is on by default for upgrade; the code says off"
      sbom: "operator release builds produce an .sbom file (goreleaser config)"
      fips: unknown
      mandatory_access_control: "SELinux. The 1.9 release notes say enforcing mode is not supported for Elemental today. The toolkit docs describe how a derivative can enable enforcing."
      default_on:
        - read-only-root
        - tpm-registration-authentication
      opt_in:
        - cosign-verification
        - mtree-verification
    summary: >-
      Machine registration is authenticated by TPM 2.0 attestation by default.
      The root is mounted read-only. Image signature checks are optional flags.
      SELinux enforcing mode is listed as not supported in the 1.9 release
      notes.
    notes: >-
      Known issue in the 1.9 release notes: setting SELinux to enforcing is not
      supported as of today. The toolkit doc says a derivative can reach
      enforcing mode with a policy module and a config change. Both statements
      are recorded and they cover different images.

      The SL Micro images in the current channel do not allow root SSH access by
      password. Use an SSH key or add a user.

      Source evidence for Secure Boot: toolkit v2.3.4 grub.go sets secureBoot
      to true for every architecture except riscv64, then installs shim and
      MokManager into the EFI partition. This shows a Secure Boot capable
      boot chain is installed by default. It is not a support statement, and
      it does not show that the Elemental OS images are signed for it. The
      VMware how-to turns on Secure Boot in a test VM, which is not a support
      statement either. secure_boot stays unknown.

      Measured boot, disk encryption and FIPS are not described in the
      Elemental 1.9 docs or the toolkit docs read. They are recorded as
      unknown. The SL Micro 6.1 docs were read on 2026-10-15. They describe
      LUKS disk encryption sealed to the TPM, and Keylime attestation, for
      images that SL Micro deploys itself (the "encrypted" raw images and
      JeOS Firstboot). Elemental partitions the disk with its own installer,
      and no source says these features carry over, so disk_encryption and
      measured_boot stay unknown. They are not recorded as "no".

      mtree conflict: the toolkit upgrading page says elemental upgrade
      --system verifies by default and --verify disables it. The code
      (cmd/flags.go, Bool verify, default false) and the install page say it is
      off by default. The fleet job also passes neither --verify nor --cosign.
    evidence: DOCUMENTED
    sources:
      - url: https://elemental.docs.rancher.com/authentication
        type: official-docs
        title: Authentication
        retrieved: "2026-10-14"
        version: "1.9"
        quote: Elemental by default authenticates hosts through the _Trusted Platform Module_ (TPM)
      - url: https://elemental.docs.rancher.com/release-notes
        type: release-notes
        title: Release notes, SELinux
        retrieved: "2026-10-14"
        version: "1.9"
        quote: Setting selinux in enforcing mode is not supported as of today with Elemental.
      - url: https://elemental.docs.rancher.com/release-notes
        type: release-notes
        title: Release notes, SSH root access
        retrieved: "2026-10-14"
        version: "1.9"
        quote: do not allow ssh root access
