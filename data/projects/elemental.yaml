  d09_provisioning:
    normalized:
      config_tools:
        - name: "MachineRegistration cloud-config (cloud-init and yip syntax)"
          license: "Apache-2.0"
          runs: [initramfs-before-root, userspace]
          reruns: every-boot
          runs_note: "The MachineRegistration cloud-config is not evaluated during install. It is added to the node and evaluated on reboot, and again after a reset."
          early_disk: "install.device or install.device-selector, partition sizes through a config.yaml, snapshotter type and maxSnaps"
          change_after_first_boot: "Edit the MachineRegistration labels and annotations (nodes re-register every 30 minutes), or reset the machine to re-apply the cloud-config"
          evidence: DOCUMENTED
          sources:
            - url: https://elemental.docs.rancher.com/machineregistration-reference
              title: "MachineRegistration reference"
              retrieved: "2026-10-14"
              quote: The cloud-configuration provided in this field is not evaluated during the installation
      methods:
        - iso-live
        - raw-disk-image
        - pxe
        - install-to-disk
      config_mechanism: "MachineRegistration resource and cloud-config"
      config_reapplied: true
      machine_authentication: "TPM 2.0 attestation by default; MAC, SMBIOS UUID and emulated TPM exist and are not recommended for production"
    summary: >-
      A MachineRegistration holds the install settings, the cloud-config and
      the network config. A SeedImage builds an ISO or raw disk image that
      carries the registration URL. A machine that boots it authenticates with
      its TPM, fetches the registration, installs the OS to disk and joins the
      inventory with no interactive step.
    notes: >-
      Declarative networking is in the MachineRegistration (nmc, nmstate or
      nmconnections) with IP pools. The live ISO supports PXE booting for
      integration with SUSE Manager. A raw image for Raspberry Pi boots into the
      recovery system first, grows the partitions, then registers.

      The default authentication needs a TPM 2.0 device on every machine. The
      docs call the alternatives "not recommended for production use".

      Machine labels are templated from SMBIOS and hardware data, and the
      hostname is set from a template, default m-UUID.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/rancher/elemental-operator/blob/v1.9.2/README.md
        type: source-repo
        title: Elemental operator README
        retrieved: "2026-10-14"
