  d05_rollback_recovery:
    normalized:
      rollback_to_previous: available
      rollback_note: "Pick the previous snapshot in the GRUB menu, or set saved_entry. One boot menu entry exists per kept passive snapshot. A fleet-wide rollback means pointing a ManagedOSImage at the older image with FORCE set."
      automatic_rollback_on_boot_failure: available
      automatic_rollback_trigger: "Boot assessment (a toolkit feature, listed in the elemental init features of the Elemental OS base image): after an upgrade, install or reset a health check runs, a failed boot reboots, and GRUB tries the next entry. Fallback order is active, then the passive snapshots, then recovery."
      automatic_rollback_attempts: "one step per boot attempt through the active entry and the passive snapshots"
      retained_versions: configurable
      retained_versions_note: "In the Elemental (operator) flow maxSnaps is 2 by default and at least 2, because the operator CRD defaults the snapshotter to loopdevice with maxSnaps 2 and always passes ELEMENTAL_SNAPSHOTTER_MAX_SNAPS. Only the bare toolkit defaults to 4 on btrfs (2 on loopdevice)"
      recovery_environment: dedicated-partition
      factory_reset: available
      network_independent_recovery: partial
    summary: >-
      Each upgrade keeps the earlier snapshots, up to maxSnaps (default 2 in the
      Elemental flow; 4 on btrfs only for the bare toolkit), and the boot menu has an entry for each passive snapshot. A
      separate recovery partition can reset the machine. An optional boot
      assessment feature reboots into the next entry when a new snapshot fails
      its health check.
    notes: >-
      Boot order after a failure is active, then the passive snapshots, then
      recovery. The default grub.cfg sets fallback to "0 recovery", but only
      when default_fallback is unset. The snapshotter writes default_fallback to
      the grub OEM env file at each snapshot change, as the list active,
      passives, recovery (loopdevice.go L492-502, btrfs.go L404). That matches
      configure_grub.md. Boot assessment ships in the Elemental OS image.

      The operator CRD default is snapshotter loopdevice with maxSnaps 2 and a
      minimum of 2. The operator always passes the value to the elemental CLI.
      The MachineRegistration reference also says 2. The toolkit defaults of
      2 (loopdevice) and 4 (btrfs) apply only when the toolkit is used on its
      own.

      Rollback restores the OS root. COS_PERSISTENT and COS_OEM are not rolled
      back. A reset is different: operator-driven reset is off by default
      (reset enabled is false), and when enabled it formats COS_PERSISTENT and
      COS_OEM by default (reset-persistent and reset-oem are true).

      Reset from the recovery partition rebuilds the state images from the
      recovery image. Through the operator, reset is triggered by deleting a
      MachineInventory or a cluster, and it re-applies the MachineRegistration
      cloud-config. The network value is partial: GRUB rollback and elemental
      reset from the recovery boot need no registry, but the fleet-driven reset
      fetches the registration from Rancher.

      The toolkit test suite has a case "boots in fallback when rootfs is
      damaged", which exercises the boot assessment path.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/rancher/elemental-toolkit/blob/v2.3.4/pkg/features/embedded/grub-config/etc/elemental/grub.cfg#L113-L122
        type: source-repo
        title: Default grub.cfg, one entry per passive snapshot
        retrieved: "2026-10-14"
        version: "v2.3.4"
        quote: 'menuentry "${display_name} (snapshot ${passive_snap})" --id passive${passive_snap} ${passive_snap} {'
      - url: https://elemental.docs.rancher.com/machineregistration-reference
        type: official-docs
        title: MachineRegistration reference, snapshotter
        retrieved: "2026-10-14"
        version: "1.9"
        quote: "| maxSnaps | int    | 2             | Maximum amount of snapshots to keep.                                            |"
      - url: https://github.com/rancher/elemental-toolkit/blob/v2.3.4/pkg/constants/constants.go#L187-L188
        type: source-repo
        title: Snapshotter constants
        retrieved: "2026-10-14"
        version: "v2.3.4"
        quote: LoopDeviceMaxSnaps        = 2
      - url: https://github.com/rancher/elemental-operator/blob/v1.9.2/api/v1beta1/types.go#L56-L68
