      - url: https://github.com/rancher/elemental-toolkit/blob/v2.3.4/docs/content/en/docs/Customizing/selinux_support.md
        type: official-docs
        title: SELinux support
        retrieved: "2026-10-14"
        version: "v2.3.4"
        quote: Since the rootfs is readonly they can't be easily applied at runtime or at boot time.
    unknowns:
      - "The root hash or digest of the running snapshot is not checked at boot in the sources read. No dm-verity documentation was found."

  d03_artifact:
    normalized:
      primary_artifact: oci-container-image
      oci_registry_distribution: "yes"
      content_addressable: "partial"
      mirrorable: true
      signed: "toolkit and operator release binaries are cosign-signed; signing of the Elemental OS images is not stated in the sources read"
      air_gapped_capable: true
    summary: >-
      The OS is an OCI container image that holds the full root, including
      kernel and initrd. It is published to registry.suse.com, tracked as
      ManagedOSVersion objects, and turned into an ISO or raw disk by a
      SeedImage. An air-gap path with a private registry is documented.
    notes: >-
      The installation state doc says a digest is recorded only "if the source
      is an image". The fleet upgrade job runs elemental upgrade from dir:/
      inside the System Upgrade Controller job, so on the ManagedOSImage path
      the source is a directory. Whether a digest is recorded on that path is
      not shown in the sources read. Whether an upgrade pins the digest is not
      stated. A ManagedOSImage normally names a tag.

      Install and upgrade have optional cosign verification (--cosign) and
      mtree checksum verification (--verify). The fleet upgrade job passes
      neither flag, so on the ManagedOSImage path as shipped no signature or
      mtree verification applies (the container runtime still checks layer
      digests when it pulls). Both are off for a direct elemental upgrade unless
      asked for, and cosign needs images that carry signatures.

      The docs and the code disagree on mtree. The toolkit upgrading page says
      elemental upgrade --system runs an mtree checksum verification by
      default and that --verify disables it. The code defines --verify as a
      Bool flag with default false, and the install page describes it as
      "Enable mtree checksum verification". This profile follows the code and
      records the conflict.

      The airgap script builds a channel image that points at the private
      registry, because the official channel references absolute registry.suse.com
      URLs.
    evidence: DOCUMENTED
    sources:
      - url: https://elemental.docs.rancher.com/architecture-components
        type: official-docs
        title: Elemental OS container image
        retrieved: "2026-10-14"
        version: "1.9"
        quote: containing all the files that will make up the OS of the target host
