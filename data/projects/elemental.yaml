        type: official-docs
        title: Cluster reference
        retrieved: "2026-10-14"
        version: "1.9"
        quote: A `Cluster` definition includes a `kubernetesVersion` and a list of `machinePools` to deploy the cluster to.
      - url: https://elemental.docs.rancher.com/unmanaged-os
        type: official-docs
