taxonomy:
  workload_scope: kubernetes-oriented-host
  construction_model:
    - vendor-fixed-image
    - vendor-base-plus-derivation
    - framework
  root_state_substrate:
    - ab-partition-image
    - transactional-snapshot
  notes: >-
    The docs call the result an "OS appliance for Kubernetes nodes". The image
    is built on SL Micro and its docs show zypper and RPM install paths, so it
    is recorded as a host optimized for Kubernetes and not as a node with no
    general user space. Root state is a set of image snapshots on a state
    partition. Each snapshot is a loop-mounted ext4 image (default) or a btrfs
    subvolume.

    ab-partition-image is the closest value. Elemental keeps N image files or
    btrfs subvolumes on one COS_STATE partition and not two fixed partitions.
    The docs still call it A/B ("an A/B install and upgrade system" in the
    docs index, "A/B bootable file system images" in the installation
    partition table).

dimensions:
  d01_os_model:
    normalized:
      workload_scope: kubernetes-oriented-host
      ships_kubernetes: false
      base_os: "SLE Micro (SUSE Linux Micro)"
      components:
        - "elemental-operator: Kubernetes controllers and registration endpoint, runs on the Rancher cluster"
        - "elemental-toolkit and the elemental CLI: install, upgrade and reset on the node"
        - "elemental-register and elemental-system-agent: node-side clients"
        - "Elemental OS container images, flavors base, baremetal, kvm and rt"
    summary: >-
      A stack of three parts. The toolkit boots and upgrades a node from an OCI
      image. The operator connects those nodes to Rancher. The Elemental OS
      images are that toolkit applied to SL Micro. Kubernetes (RKE2 or K3s) is
      not in the image. Rancher installs it on the node.
    notes: >-
      The Elemental OS image is described as an opinionated toolkit image based
      on SLE Micro. The 1.9 channel table names SL Micro 6.1 as the base OS. The
      v2.3.1 Elemental Linux release note mentions SL Micro 6.2, see
      open_questions.

      The toolkit is also published on its own as a way to build derivatives
      from container images, so Elemental is both a vendor image and a
      framework.
    evidence: DOCUMENTED
    sources:
      - url: https://elemental.docs.rancher.com/
        type: official-docs
        title: Welcome to Elemental
        retrieved: "2026-10-14"
        version: "1.9"
        quote: The Elemental Stack consists of a handful of packages on top of SLE Micro
      - url: https://elemental.docs.rancher.com/architecture-components
        type: official-docs
        title: Elemental components
        retrieved: "2026-10-14"
        version: "1.9"
        quote: containing all the files that will make up the OS of the target host
      - url: https://elemental.docs.rancher.com/channels
        type: official-docs
        title: Channels, flavors
        retrieved: "2026-10-14"
        version: "1.9"
        quote: "| SL Micro         | 6.1            | Bare-metal | registry.suse.com/rancher/elemental-channel/sl-micro:6.1-baremetal |"
      - url: https://github.com/rancher/elemental-toolkit/blob/v2.3.4/docs/content/en/docs/Getting%20started/_index.md
        type: official-docs
        title: Elemental toolkit, getting started
        retrieved: "2026-10-14"
        version: "v2.3.4"
        quote: 'Philosophy behind elemental-toolkit is simple: it allows you to create Linux derivatives from container images.'
    unknowns:
      - "Which SL Micro release the current Elemental OS images use. The 1.9 channel table lists 6.1 only."

  d02_immutability:
    normalized:
      read_only:
        - /
        - /usr
      read_only_mechanism: "the root image or btrfs snapshot is mounted read-only in the initramfs (sysroot mount with Options=ro)"
      ephemeral:
        - /etc
        - /srv
        - /var
      ephemeral_mechanism: "overlayfs on tmpfs. The toolkit default layout file sets size 25%, but that file is in the cloud-config-defaults feature, which the Elemental OS image build does not initialize (see notes)"
      writable_and_persistent:
        - /etc/cni (overlay)
        - /etc/iscsi (overlay)
        - /etc/rancher (overlay)
        - /etc/ssh (overlay)
        - /etc/systemd (overlay)
        - /home
        - /opt
        - /root
        - /usr/libexec
        - /var/lib/cni (overlay)
        - /var/lib/kubelet (overlay)
        - /var/lib/rancher (overlay)
        - /var/lib/elemental (overlay)
        - /var/lib/NetworkManager (overlay)
        - /var/lib/calico (overlay)
        - /var/log (overlay)
        - /oem (COS_OEM partition)
        - /usr/local (COS_PERSISTENT partition)
      integrity_mechanism:
        - read-only-mount
      integrity_note: "No dm-verity or composefs is documented in the sources read."
      survives_upgrade:
        - "the COS_PERSISTENT and COS_OEM partitions"
      immutability_can_be_disabled: true
      immutability_disable_where: "boot parameter rd.cos.debugrw, active and passive only, documented for debugging"
      configurable_paths:
        value: 'yes'
        how: 'The writable and persistent paths are set in an immutable-layout cloud-config (RW_PATHS and PERSISTENT_STATE_PATHS), which a derivative or an OEM file can override.'
        evidence: DOCUMENTED
        sources:
          - url: https://github.com/rancher/elemental-toolkit/blob/v2.3.4/docs/content/en/docs/Examples/embedded_images.md
            type: official-docs
            title: Elemental toolkit, embedded images example
            retrieved: "2026-10-14"
            version: "v2.3.4"
            quote: 'RW_PATHS: "/var /etc /srv"'
      mounts_sources:
        - url: https://elemental.docs.rancher.com/installation
          type: official-docs
          title: Installation, Elemental Immutable Root
          retrieved: "2026-10-14"
          version: "1.9"
          quote: One of the characteristics of Elemental OSes is the setup of an immutable root
        - url: https://github.com/rancher/elemental-toolkit/blob/v2.3.4/pkg/features/embedded/elemental-sysroot/usr/lib/dracut/modules.d/20elemental-sysroot/sysroot-generator.sh
          type: source-repo
          title: elemental-sysroot dracut generator
          retrieved: "2026-10-14"
          version: "v2.3.4"
          quote: echo "Options=ro"
        - url: https://github.com/rancher/elemental-toolkit/blob/v2.3.4/pkg/features/embedded/cloud-config-defaults/system/oem/00_layout.yaml
          type: source-repo
          title: Default layout OEM file
          retrieved: "2026-10-14"
          version: "v2.3.4"
          quote: "paths: ['/srv', '/etc', '/var', '/root']"
    summary: >-
      The root filesystem is mounted read-only from the active snapshot. /etc,
      /srv and /var are discarded on reboot, except a list of paths kept as
      persistent overlays, and /home, /opt and /root persist. Two separate
      partitions hold persistent data. The adopter can change the layout in
      cloud-config.
    notes: >-
      The toolkit reference page (immutable_rootfs.md) lists /etc as ephemeral
      and /usr as read-only. The Elemental 1.9 installation page has the full
      path table and shows /root as persistent. The recovery layout file lists
      /root among the ephemeral tmpfs paths. This entry follows the 1.9 table
      for the installed system. Persistent overlay paths are the ones the table
      marks persistent under an ephemeral parent.

      The default layout file cited above (00_layout.yaml, the source for the
      tmpfs 25% size and for /root as ephemeral in recovery mode) belongs to
      the toolkit feature cloud-config-defaults. The Elemental OS base image
      build runs elemental init with the features elemental-rootfs,
      elemental-sysroot, grub-config, dracut-config, cloud-config-essentials,
      elemental-setup and boot-assessment. That list does not include
      cloud-config-defaults. So the tmpfs size and the /root detail may not
      apply to Elemental OS images. They are recorded as toolkit defaults only.

      The SELinux doc states that SELinux labels are applied at install and
      upgrade time for the read-only areas, and at boot for the overlay paths.
    evidence: DOCUMENTED
    sources:
      - url: https://elemental.docs.rancher.com/installation
        type: official-docs
        title: Installation, Elemental Immutable Root
        retrieved: "2026-10-14"
        version: "1.9"
        quote: filesystem where some ephemeral or persistent locations are applied on top of
      - url: https://github.com/rancher/elemental-toolkit/blob/v2.3.4/docs/content/en/docs/Reference/immutable_rootfs.md
        type: official-docs
        title: Immutable root filesystem
        retrieved: "2026-10-14"
        version: "v2.3.4"
        quote: By default, `elemental` and derivatives will inherit an immutable setup.
      - url: https://github.com/rancher/elemental-toolkit/blob/v2.3.4/docs/content/en/docs/Reference/troubleshooting.md
        type: official-docs
        title: Troubleshooting, disable immutability
        retrieved: "2026-10-14"
        version: "v2.3.4"
        quote: By adding `rd.cos.debugrw` to the boot parameters read only mode will be disabled.
      - url: https://github.com/rancher/elemental/blob/v2.3.1/.obs/dockerfile/SL-Micro-base-container/Dockerfile#L107
        type: source-repo
