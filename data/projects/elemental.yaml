        type: official-docs
        title: Configuration persistency
        retrieved: "2026-10-14"
        version: "v2.3.4"
        quote: the `/oem` folder instead is reserved for persistent cloud-init files that can be extended in runtime.
      - url: https://github.com/rancher/elemental-toolkit/blob/v2.3.4/docs/content/en/docs/Getting%20started/_index.md
        type: official-docs
        title: Elemental toolkit, getting started
        retrieved: "2026-10-14"
