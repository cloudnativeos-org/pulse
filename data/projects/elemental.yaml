        title: Release notes, Rancher compatibility
        retrieved: "2026-10-14"
        version: "1.9"
        quote: Since version v1.9.x Elemental Operator must be paired with Rancher v2.14 or superior.
      - url: https://github.com/rancher/elemental-toolkit/blob/v2.3.4/docs/content/en/docs/Reference/installation_state.md
        type: official-docs
        title: Installation state
        retrieved: "2026-10-14"
