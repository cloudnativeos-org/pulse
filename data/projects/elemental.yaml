  d07_kubernetes:
    normalized:
      requirement: optional
      bundled: separately-installed
      independent_lifecycle: "yes"
      os_manages_kubernetes: "no"
      kubernetes_manages_os: "yes: a ManagedOSImage becomes a Fleet Bundle and a System Upgrade Controller Plan on the downstream cluster"
      distributions:
        - RKE2
        - K3s
    summary: >-
      Rancher provisions RKE2 or K3s on the registered nodes through the
      rancher-system-agent. The Kubernetes version is set on the Rancher cluster
      and the OS version on a ManagedOSImage, so they change separately. The
      elemental CLI can install, upgrade and reset a node with no cluster.
    notes: >-
      The cluster phase uses a MachineInventorySelectorTemplate and a Rancher
      Cluster with machinePools. Valid kubernetesVersion values come from Rancher
      metadata.

      Requirement is recorded as optional on the node because the elemental
      CLI works on a node with no cluster. In the normal Elemental flow Rancher
      Manager is required. The unmanaged-OS page is about Toolkitless systems
      (not Elemental OS images) that run only elemental-register. It is cited
      only to show that the operator can be used for inventory without
      provisioning Kubernetes on such systems. It is not evidence for the
      Elemental OS.
    evidence: DOCUMENTED
    sources:
      - url: https://elemental.docs.rancher.com/architecture-clusterdeployment
        type: official-docs
        title: Kubernetes cluster provisioning
        retrieved: "2026-10-14"
        version: "1.9"
