  d04_upgrade:
    normalized:
      fleet_upgrade:
        self_update: "Not applicable. A node upgrades when a ManagedOSImage targets it or when elemental upgrade is run on it."
        paths:
          - kind: fleet-server
            name: "Elemental operator ManagedOSImage"
            license: "Apache-2.0"
            class: open-source
            reconciliation: in-place
            filter: true
            note: "A ManagedOSImage names one OCI image (osImage) or a ManagedOSVersion. The operator creates a Fleet Bundle that applies an upgrade.cattle.io Plan to each targeted cluster, and the System Upgrade Controller runs it on the nodes. Targets are clusters (clusterTargets) and an optional nodeSelector. Default concurrency 1, cordon and drain on. Needs Rancher Manager v2.14 or later for operator 1.9.x."
            evidence: DOCUMENTED
            sources:
              - url: https://elemental.docs.rancher.com/upgrade-lifecycle
                title: "Elemental upgrade lifecycle"
                retrieved: "2026-10-14"
                quote: Whenever a new `ManagedOSIMage` is defined, a related Fleet `Bundle` is also generated by the Elemental Operator.
              - url: https://elemental.docs.rancher.com/managedosimage-reference
                title: "ManagedOSImage reference"
                retrieved: "2026-10-14"
                quote: The ManagedOSImage resource is responsible of defining an OS image or image version that needs to be applied to each node in a set of targeted Clusters.
          - kind: reboot-coordination
            name: "System Upgrade Controller plan with cordon and drain"
            license: "Apache-2.0"
            class: open-source
            filter: true
            note: "Concurrency, cordon and drain are fields of the ManagedOSImage. The toolkit docs also show a hand-written SUC Plan that runs /usr/sbin/suc-upgrade."
            evidence: DOCUMENTED
            sources:
              - url: https://github.com/rancher/system-upgrade-controller
                title: "System Upgrade Controller repository"
                retrieved: "2026-10-14"
              - url: https://github.com/rancher/elemental-toolkit/blob/v2.3.4/docs/content/en/docs/Getting%20started/upgrading.md
                title: "Toolkit upgrading, Integration with System Upgrade Controller"
                retrieved: "2026-10-14"
                quote: '- "/usr/sbin/suc-upgrade"'
      version_identity:
        identifier: "IMAGE, IMAGE_REPO and IMAGE_TAG in /etc/os-release of the OS image. elemental state records the source for each snapshot, and a digest only if the source is an image. The fleet job upgrades from dir:/, so a digest is not shown for that path"
        condition: "No cloud-config hooks that install packages in the new snapshot. The docs show after-upgrade-chroot hooks and rpm installs that run on every upgrade and change the snapshot contents."
        evidence: DOCUMENTED
        sources:
          - url: https://elemental.docs.rancher.com/custom-images
            type: official-docs
            title: "Build custom OS images"
            retrieved: "2026-10-14"
            version: "1.9"
            quote: "# IMPORTANT: /etc/os-release is used for versioning/upgrade."
          - url: https://github.com/rancher/elemental-toolkit/blob/v2.3.4/docs/content/en/docs/Reference/installation_state.md
            type: official-docs
            title: "Installation state"
            retrieved: "2026-10-14"
            version: "v2.3.4"
            quote: "source: oci://my-os-image:v1.2.3"
          - url: https://elemental.docs.rancher.com/extra-rpms
            type: official-docs
            title: "Add third party RPMs"
            retrieved: "2026-10-14"
            version: "1.9"
            quote: "# Install the package after upgrading to a new image"
      mechanism:
        - ab-partition-switch
        - transactional-snapshot
      mechanism_note: "The closest closed-vocabulary values. ab-partition-switch is the label Kairos uses for the same toolkit lineage. transactional-snapshot is kept for the btrfs snapshotter only. The toolkit pulls an OCI image and unpacks it into a new image slot or snapshot that becomes the next boot target. It does not use bootc."
      scope: whole-root
      scope_note: "The root image is replaced. The COS_PERSISTENT and COS_OEM partitions are not."
      scope_sources:
        - url: https://github.com/rancher/elemental-toolkit/blob/v2.3.4/docs/content/en/docs/Getting%20started/upgrading.md
          type: official-docs
          title: Toolkit upgrading
          retrieved: "2026-10-14"
          quote: Elemental considers the container image as a new system where to boot into.
      initiator: "controller-push through System Upgrade Controller, or operator-run elemental upgrade on the node"
      requires_kubernetes: "for the fleet path only. elemental upgrade on a node needs no cluster."
      requires_vendor_infrastructure: false
      self_hostable_update_server: true
      self_hostable_update_source: "A private OCI registry and a channel image you build (airgap script)"
      artifact_verification: "cosign and mtree flags exist on elemental upgrade and are off in the code. The fleet upgrade job passes neither (it runs elemental upgrade from dir:/), so no signature or mtree verification applies on the ManagedOSImage path as shipped (layer digests are still checked when the image is pulled). The toolkit docs say mtree is on by default; the code says off"
      same_or_older_version: "an upgrade to the identical os-release is always skipped, FORCE or not. An older version is skipped unless FORCE is true. The version check is also skipped when IMAGE_REPO differs from the one on the host"
    summary: >-
      A ManagedOSImage points a set of clusters at one OCI image. Each node
      pulls the image, unpacks it into a new snapshot and boots it next. The
      node reboots by itself at the end of the job. An older version is skipped
      unless FORCE is set. The same version is skipped even with FORCE.
    notes: >-
      Updating an existing ManagedOSImage starts a new upgrade cycle for all
      targeted nodes. If both osImage and a ManagedOSVersion are set, osImage
      wins. The upgrade container is not meant to be edited except its env
      keys FORCE, UPGRADE_RECOVERY and UPGRADE_RECOVERY_ONLY.

      The recovery partition is upgraded only when asked (UPGRADE_RECOVERY).

      The docs (upgrade.md) say FORCE forces upgrades to older versions. The
      suc-upgrade script in rancher/elemental v2.3.1 checks isEqualVersion
      first and exits before it reads FORCE, so FORCE does not re-apply the
      same version. The older-version check is skipped when IMAGE_REPO differs.
      The script ends with a reboot of the host (nsenter into PID 1, then
      reboot), after elemental upgrade finishes. So the node does not wait for
      a separate reboot step.

      The fleet path runs through Fleet and the System Upgrade Controller on the
      downstream cluster, both managed by Rancher. A node with no working
      Kubernetes cluster can still be upgraded by running elemental upgrade on
      it.
    evidence: DOCUMENTED
    sources:
      - url: https://elemental.docs.rancher.com/upgrade
        type: official-docs
        title: Upgrade
        retrieved: "2026-10-14"
        version: "1.9"
        quote: When upgrading to an older version or the same version that is already running the upgrade-procedure will be skipped.
