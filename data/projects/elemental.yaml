  d08_hardware_platform:
    normalized:
      ai_accelerators:
        items: []
        note: "No accelerator support is documented in the sources read. The docs only list GPU vendor and model as machine label variables."
      architectures_released:
        - amd64
      architectures_development:
        - arm64
      architectures_not_stated: "riscv64 for the OS images. The toolkit builds a riscv64 binary and its green example has a riscv64 path, which is not a statement of OS image support."
      platforms:
        - bare-metal
        - virtual-machines
        - sbc-experimental
      gpu: "not documented"
      tpm: "TPM 2.0 is used to authenticate registering machines, see d10"
      extension_mechanism: "extra RPMs through cloud-config hooks; hardware drivers are an example in the docs"
    summary: >-
      x86-64 is documented as production ready and fully supported with Rancher
      v2.7.0 and later. ARM (aarch64) is called functional in development and is
      tested only on Raspberry Pi 4 Model B. The docs say Elemental targets edge
      and does not support other hardware.
    notes: >-
      Four image flavors exist: base, baremetal (firmware and drivers for bare
      metal), kvm and rt. A raw disk image for a Raspberry Pi can be built with a
      SeedImage with targetPlatform linux/arm64.

      Build fact: the rancher/elemental v2.3.1 base image Dockerfile for SL
      Micro has "#!ExclusiveArch: x86_64 aarch64". The image build recipe
      therefore targets x86_64 and aarch64 and not riscv64. This supports arm64
      under architectures_development. It does not show which tags are
      published, or the support level.

      The operator ships binaries for amd64, arm and arm64. The toolkit ships
      binaries for amd64, arm64 and riscv64. These are the tools, not the OS
      image.
    evidence: DOCUMENTED
    sources:
