    field: "dimensions.d04_upgrade.normalized.fleet_upgrade"
    change: "The cluster-api-provider-kairos path said 'A single-node control plane is not supported.' The v0.1.3 README says the opposite: replicas accepts 1 (single-node), 3 or 5. Note now records the README facts: replicas 1, 3 or 5; high availability on CAPK, CAPV and CAPM3 for k0s and k3s; the k3s member-removal limitation (KD-5d); the fleet provider supports a single control-plane machine only. Status was 'pre-1.0' (a version number, rule 15 N4); now 'API may still change (README)'. Added the replicas quote and the KD-5d quote to the path's sources, both verified verbatim on 2026-10-06."
