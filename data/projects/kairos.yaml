      version_identity:
        identifier: "KAIROS_VERSION in /etc/kairos-release plus flavor, variant and model fields"
        condition: "One version per build; no system extensions, no bundles, and nothing written to /usr/local or /usr/libexec."
        evidence: DOCUMENTED
        sources:
          - url: https://github.com/kairos-io/kairos/blob/2a3c309/.github/workflows/release.yaml
            type: source-code
            title: "Kairos release workflow (image tag format)"
            retrieved: "2026-10-06"
          - url: https://github.com/kairos-io/kairos-docs/blob/cd96078/docs/reference/kairos-factory.mdx
            type: official-docs
            title: "Kairos factory"
            retrieved: "2026-10-06"
            quote: >-
              It's the responsibility of the derivative project or user (you!) to define and manage the versioning of your images. The only requirement is that versions must follow Semantic Versioning
          - url: https://github.com/kairos-io/kairos-docs/blob/cd96078/docs/architecture/immutable.md
            type: official-docs
            title: "Kairos immutable architecture"
            retrieved: "2026-10-06"
            quote: >-
              /usr/local - persistent
          - url: https://github.com/kairos-io/kairos-docs/blob/cd96078/docs/advanced/bundles.md
            type: official-docs
            title: "Kairos bundles"
            retrieved: "2026-10-06"
            quote: >-
              can be used to install new software ... applied after installation or before bootstrapping a node
          - url: https://github.com/kairos-io/kairos-docs/blob/cd96078/docs/advanced/sys-extensions.md
            type: official-docs
            title: "Kairos system extensions"
            retrieved: "2026-10-06"
            quote: >-
              System extension images may – dynamically at runtime — extend the /usr/ directory hierarchies
      mechanism:
        - ab-partition-switch
      scope: whole-os-image
      scope_note: Paths listed as persistent (including /opt, /etc/systemd, /etc/ssh, /etc/kubernetes; v4.3.0 also listed /usr/libexec, removed after it by kairos-io/kairos#4465) are synced from the image to persistent storage on every boot with rsync --update and no --delete, so a file the new image removes stays, and an image file is not applied when the persisted copy is newer. Not described in the Kairos docs; read from the code. Tracked in kairos-io/kairos#5268.
      scope_note_evidence: INFERRED
      scope_note_inferred_from: 'kairos-io/kairos v4.3.0 immucore/internal/utils/mounts.go SyncState (rsync -aquAX, comment: ''This has the --update flag to avoid overwriting newer files in dst.''); kairos-init/pkg/bundled/cloudconfigs/00_rootfs.yaml PERSISTENT_STATE_PATHS'
      scope_sources:
        - url: https://github.com/kairos-io/kairos-docs/blob/main/docs/architecture/immutable.md
          type: official-docs
          title: 'Kairos docs: immutable architecture'
          retrieved: '2026-10-06'
          quote: a single layer which gets pulled and swapped atomically during upgrades
        - url: https://github.com/kairos-io/kairos/blob/v4.3.0/immucore/internal/utils/mounts.go
          type: source-code
          title: immucore SyncState, v4.3.0
          retrieved: '2026-10-06'
          quote: This has the --update flag to avoid overwriting newer files in dst.
        - url: https://github.com/kairos-io/kairos/blob/v4.3.0/kairos-init/pkg/bundled/cloudconfigs/00_rootfs.yaml
          type: source-code
          title: kairos-init 00_rootfs.yaml, PERSISTENT_STATE_PATHS, v4.3.0
          retrieved: '2026-10-06'
          quote: 'PERSISTENT_STATE_PATHS: >-'
      slot_implementation: "fixed-size image files inside one state partition"
      initiator: operator-or-kubernetes-operator
      requires_kubernetes: false
      requires_vendor_infrastructure: false
      self_hostable_update_server: true
      self_hostable_update_source: "Any OCI registry, or a local file; there is no update server"
      self_hostable_update_server_evidence: DOCUMENTED
      self_hostable_update_server_note: "There is no update server. The agent pulls an OCI image from a registry the operator chooses, or from a local directory, file or saved tarball."
      artifact_verification_by_mode:
        standard: "not checked"
        trusted_boot: enforced
      artifact_verification_note: "Kairos has no default install mode: the standard install and Trusted Boot are both documented choices."
      bootloader_upgraded_by_mode:
        standard: 'not refreshed: a standard install upgrade does not write shim or GRUB'
        trusted_boot: the whole artifact is written to the EFI partition, including the systemd-boot binary
      bootloader_upgraded_evidence: INFERRED
      bootloader_upgraded_inferred_from: 'Code reading only, not described in the docs: kairos-io/kairos v4.3.0 agent/pkg/uki/upgrade.go (DumpSource writes the artifact to the EFI directory); kairos-io/AuroraBoot v0.27.1 pkg/uki/uki.go imageFiles (EFI/BOOT holds the systemd-boot binary); no shim or GRUB write in the standard upgrade path.'
      bootloader_upgraded_sources:
        - url: https://github.com/kairos-io/kairos/blob/v4.3.0/agent/pkg/uki/upgrade.go
          type: source-code
          title: kairos-agent UKI upgrade, v4.3.0
          retrieved: '2026-10-06'
          quote: // Dump artifact to efi dir
        - url: https://github.com/kairos-io/AuroraBoot/blob/v0.27.1/pkg/uki/uki.go
          type: source-code
          title: AuroraBoot UKI artifact files, v0.27.1
          retrieved: '2026-10-06'
          quote: '"EFI/BOOT":       {filepath.Join(sourceDir, bootfile)},'
    summary: >-
      An upgrade pulls an OCI image into a transition file, rotates the current
      active image into the passive slot, renames the transition file into place,
      and writes a one-shot boot entry. The live slot is never written to.
    notes: >-
      The rotation has a safety property worth recording: the active image is
      rotated into passive only if the machine did not boot from passive, on the
      stated reasoning that doing otherwise would overwrite a working passive
      with an unknown active.

      The upgrade works fully without Kubernetes and fully without any
      project-hosted infrastructure. Local file, local directory and local OCI
      tarball sources all work offline, and private registries use standard
      credentials. The only dependency on project infrastructure is release
      discovery, not the upgrade itself.

      **Artifact verification on the default path is none, and this is not
      stated anywhere in the documentation.** Signature checking is behind a
      configuration field that defaults to false, there is no flag on the upgrade
      command to turn it on, and the documentation for it is three table rows.
      Under Trusted Boot the picture reverses: the signature is checked before
      slots rotate and the upgrade aborts on failure. So the same project offers
      enforced verification on one path and none by default on the other, with
      the difference undocumented.

      **At v4.3.0 an upgrade does not refresh the bootloader.** The kernel and
      initrd ride inside the OCI image and swap atomically, but shim and GRUB on
      the EFI partition stay at their install-time versions, because the
      bootloader install routine is called only from install and reset. A fix
      landed on 2026-09-11, after the v4.3.0 tag, and is unreleased and
      undocumented (re-checked 2026-09-22: the commit is 51 commits ahead of
      the v4.3.0 tag, not an ancestor of it, and no release has followed
      v4.3.0). Until then, a factory reset is the only supported way to refresh
      shim and GRUB.

      The Kubernetes-driven upgrade path does not verify that a node returned on
      the new version: its completion condition is the reboot pod exiting
      successfully. INFERRED consequence recorded under unknowns.
    evidence: DOCUMENTED
    sources:
      - url: https://kairos.io/docs/upgrade/manual/
        type: official-docs
        title: Manual upgrade
        retrieved: "2026-09-22"
        quote: "sudo kairos-agent upgrade --source <type>:<address>"
      - url: https://github.com/kairos-io/kairos/blob/master/agent/pkg/action/upgrade.go
        type: source-repo
        title: Upgrade action
        retrieved: "2026-09-22"
        quote: >-
          We dont want to overwrite passive if we are booting from passive as it
          could mean that active is broken and we would be overriding a working
          passive with a broken/unknown  active
      - url: https://kairos.io/docs/reference/configuration/
        type: official-docs
        title: Configuration reference, cosign
        retrieved: "2026-09-22"
        quote: "Enable cosign verification for container images"
      - url: https://github.com/kairos-io/kairos/commit/beaa9cc6
        type: source-repo
        title: "fix(upgrade): refresh the shim, grub and grub.cfg on the ESP (#4513), committed 2026-09-11, not an ancestor of v4.3.0"
        retrieved: "2026-09-22"
        quote: >-
          Grub.Install runs only from install and reset, so a signed-shim
          rotation, a grub.cfg schema change or a grub CVE bump reached
          installed nodes only if the operator ran a reinstall.
      - url: https://kairos.io/docs/upgrade/manual/
        type: official-docs
        title: "Manual upgrade, upgrade sources"
        retrieved: "2026-10-05"
        quote: >-
          An OCI image pulled from a container registry. If the tag is omitted, :latest is assumed.
    unknowns:
      - "Whether the Kubernetes upgrade operator can detect that a node boot-assessed and fell back, before advancing to the next batch. The completion condition observed is the reboot pod exiting zero."
      - "There is no downgrade protection in the agent."

  d05_rollback_recovery:
    normalized:
      rollback_to_previous: available
      rollback_durability: "one-shot boot entry, not a durable pin"
      automatic_rollback_on_boot_failure: available
      automatic_rollback_trigger: "boot assessment flag still set when GRUB is reached again"
      automatic_rollback_attempts: "1 on the GRUB path. On Trusted Boot the docs say there is none, while the agent code arms a boot counter of 3 on the entries it writes"
      success_criterion: "reaching the cloud-init boot.before stage inside the active image"
      retained_versions: 2
      retained_versions_note: "versions on disk, counting the running one: the active and passive images; the recovery image is not counted"
      recovery_environment: dedicated-partition
      factory_reset: available
      network_independent_recovery: "yes"
      remote_recovery: "QR pairing over a peer-to-peer mesh, and a phone-home agent"
    summary: >-
      A dedicated recovery partition, one retained previous version, and boot
      assessment with exactly one retry on the GRUB path. Reset and local
      recovery work fully offline, because the recovery image is on local disk.
    notes: >-
      The success criterion for a boot deserves emphasis because it sets the
      limit of what automatic rollback can catch. A boot counts as successful
      when the system reaches an early cloud-init stage inside the active image.
      That means the root mounted and configuration ran. It does not mean
      networking came up, and it does not mean Kubernetes or any workload is
      healthy. An upgrade that boots cleanly and leaves the cluster dead is a
      successful boot. For v4.3.0 this criterion appears only in a comment in a
      shipped YAML file, not in the v4.3.0 user documentation; the development
      docs added it on 2026-10-06 (see below).

      Retention is exactly one previous version, and that number is stated
      nowhere in the documentation.

      Manual rollback works but is close to undocumented. In the v4.3.0
      documentation tree the word rollback appears once, in the architecture
      statement quoted below. Outside that tree, an unversioned getting-started
      FAQ answers "Can I easily rollback an upgrade?" in two sentences: boot
      into the passive system, then upgrade to the previous image. No page is
      framed as a rollback procedure, the boot entry that selects the previous
      slot is never shown in an example, and the fact that the selection is
      one-shot rather than a durable pin appears only in a source comment. A
      Kubernetes Provider documentation section published on 2026-09-21 adds a
      Rollback heading that states booting the other slot restores the OS but
      not the cluster. The project states a
      deliberate position against incremental rollback: "We believe that bringing
      rollbacks, or incremental patches upgrades increases the exposure to
      infrastructure drift." That is a defensible design stance. It does not
      explain leaving the mechanism that does exist undocumented.

      The docs say automatic rollback is GRUB-only. The boot assessment page says so in the
      current (development) docs: "Automatic rollback is a GRUB-only feature",
      because the stage that manages the sentinels is skipped on every Trusted
      Boot installation, and for Trusted Boot it says a fallback "it's not yet
      implemented in Kairos". The same page now documents the success criterion
      and a manual rollback that selects the fallback boot entry; these
      were added to the development docs on 2026-10-06 and are not in the
      v4.3.0 versioned docs. One example page, on boot assessment under Trusted
      Boot, still describes retries ("3 by default") and a fallback on that
      path, which the boot assessment page contradicts. The code points the other
      way: the agent appends a boot counter of 3 ("+3") to the entries it writes
      for a Trusted Boot install, and the Hadron acceptance suite tests a failover
      from a broken active entry on that path. The page may describe an intended
      state rather than the shipped one. This survey did not reproduce either.

      A fallback stage named autorecovery is documented on one page and exists in
      no repository in the organization.

      Factory reset can run only from recovery, formats the persistent partition
      by default with no flag to prevent it, and also destroys the passive
      rollback target. The second consequence is undocumented.

      The recovery partition drifts by default: the Kubernetes upgrade resource
      does not upgrade recovery unless asked, while the documentation advises
      keeping recovery current.

      Remote recovery has two mechanisms with real prerequisites. The QR pairing
      path needs a human at the console, working outbound networking for a
      peer-to-peer mesh, and a component that ships only in standard images. The
      command-line tool its instructions point at lives in an archived repository
      and ships no asset in v4.3.0. The phone-home agent is a WebSocket control
      channel that can reboot and upgrade a machine, and it has no page in the
      documentation at all.
    evidence: DOCUMENTED
    sources:
      - url: https://kairos.io/docs/upgrade/boot_assessment/
        type: official-docs
        title: Boot assessment (development docs), automatic rollback is GRUB-only
        retrieved: "2026-10-19"
        quote: >-
          Automatic rollback is a GRUB-only feature. The stage that manages the
          sentinels is skipped when the kernel cmdline contains rd.immucore.uki ,
          which is the case for every "Trusted boot" installation.
      - url: https://github.com/kairos-io/kairos-agent/blob/96f93a04a554e30ad034ec9ee8bbf7b9ac242c5d/pkg/uki/upgrade.go
        type: source-repo
        title: kairos-agent, UKI upgrade adds a boot assessment counter to the boot entries
        retrieved: "2026-10-19"
        quote: >-
          Add boot assessment to files by appending +3 to the name
      - url: https://kairos.io/docs/architecture/container/
        type: official-docs
        title: Container architecture, position on rollback
        retrieved: "2026-09-22"
        quote: >-
          We believe that bringing rollbacks, or incremental patches upgrades
          increases the exposure to infrastructure drift.
      - url: https://kairos.io/docs/upgrade/boot_assessment/
        type: official-docs
        title: Boot assessment (cites tracking issue kairos-io/kairos#2864, closed 2024-11-27)
        retrieved: "2026-09-22"
        quote: >-
          While a similar solution exists in systemd to automatically reboot to
          a fallback entry, it's not yet implemented in Kairos.
      - url: https://kairos.io/docs/examples/boot_assessment_trusted_boot/
        type: official-docs
        title: Boot assessment under Trusted Boot
        retrieved: "2026-09-22"
        quote: "If recovery fails, the system attempts autorecovery."
      - url: https://kairos.io/docs/reference/configuration/
        type: official-docs
        title: Reset behaviour
        retrieved: "2026-09-22"
        quote: "if set to true it will format persistent partitions ('oem 'and 'persistent')"
    unknowns:
      - "No rollback procedure page exists, and the one-shot nature of the boot selection is only in a source comment."
      - "That one previous version (the passive image) is retained is not published."
      - "The documented autorecovery fallback stage exists in no repository."

  d06_customization:
    normalized:
      runtime_package_install: "none"
      mechanisms:
        - dockerfile-derivation
        - kairos-init-toolchain
        - stage-extensions
        - systemd-sysext
        - bundles
        - upgrade-hooks
      customization_points:
        - build-time
        - install-time
        - runtime
      board_support: "closed enum in source; adding a board requires a code change"
      add_software:
      - kind: derive-image
        how: A Dockerfile that starts from a Kairos image. The package manager of that image's base distribution runs at build time, not on the node.
        evidence: DOCUMENTED
        sources:
        - url: https://github.com/kairos-io/kairos-docs/blob/53e6883b7904253438ce0fa1b573da6bda926041/versioned_docs/version-v4.3.0/advanced/customizing.md
          type: official-docs
          title: 'Kairos docs: Customizing the system image'
          retrieved: '2026-10-12'
          quote: To modify Kairos and add a package, you'll need to build a container image from the
          version: v4.3.0
        - url: https://github.com/kairos-io/kairos-docs/blob/53e6883b7904253438ce0fa1b573da6bda926041/versioned_docs/version-v4.3.0/advanced/customizing.md
          type: official-docs
          title: 'Kairos docs: Customizing the system image'
          retrieved: '2026-10-12'
          quote: RUN zypper in -y figlet
          version: v4.3.0
      - kind: systemd-sysext
        how: System extension images extend /usr at runtime. The base image needs systemd 255 or newer. Under Trusted Boot only signed images are supported. The docs also state that packages cannot be added to the system after installation; system extensions and bundles are the documented ways to add software.
        evidence: DOCUMENTED
        sources:
        - url: https://github.com/kairos-io/kairos-docs/blob/53e6883b7904253438ce0fa1b573da6bda926041/versioned_docs/version-v4.3.0/architecture/immutable.md
          type: official-docs
          title: 'Kairos docs: Immutable architecture'
          retrieved: '2026-10-12'
          quote: after installation it's not possible to add additional packages to the system, and any configuration change is discarded after reboot.
          version: v4.3.0
        - url: https://github.com/kairos-io/kairos-docs/blob/53e6883b7904253438ce0fa1b573da6bda926041/versioned_docs/version-v4.3.0/advanced/sys-extensions.md
          type: official-docs
          title: 'Kairos docs: Extending the system with systemd extensions'
          retrieved: '2026-10-12'
          quote: extend the /usr/ directory hierarchies with additional files.
          version: v4.3.0
        - url: https://github.com/kairos-io/kairos-docs/blob/53e6883b7904253438ce0fa1b573da6bda926041/versioned_docs/version-v4.3.0/advanced/sys-extensions.md
          type: official-docs
          title: 'Kairos docs: Extending the system with systemd extensions'
          retrieved: '2026-10-12'
          quote: Base image of the OS needs to have at least systemd 255 or newer
          version: v4.3.0
        - url: https://github.com/kairos-io/kairos-docs/blob/53e6883b7904253438ce0fa1b573da6bda926041/versioned_docs/version-v4.3.0/advanced/sys-extensions.md
          type: official-docs
          title: 'Kairos docs: Extending the system with systemd extensions'
          retrieved: '2026-10-12'
          quote: Currently only signed+verity sysexts are supported under Trusted Boot (UKI).
          version: v4.3.0
      - kind: vendor-extensions
        how: Bundles are Kairos container images that hold only files. They install once, at install time or on first boot. Changing a bundle's configuration later has no effect.
        evidence: DOCUMENTED
        sources:
        - url: https://github.com/kairos-io/kairos-docs/blob/53e6883b7904253438ce0fa1b573da6bda926041/versioned_docs/version-v4.3.0/advanced/bundles.md
          type: official-docs
          title: 'Kairos docs: Bundles'
          retrieved: '2026-10-12'
          quote: Bundles are container images containing only files (and not full OS) that can be used to install new software or extend the cloud-init syntax.
          version: v4.3.0
        - url: https://github.com/kairos-io/kairos-docs/blob/53e6883b7904253438ce0fa1b573da6bda926041/versioned_docs/version-v4.3.0/advanced/bundles.md
          type: official-docs
          title: 'Kairos docs: Bundles'
          retrieved: '2026-10-12'
          quote: the installation only happens once.
          version: v4.3.0
    summary: >-
      Customization is expected at build time, by deriving an image with a
      Dockerfile and the kairos-init toolchain, which converts an arbitrary
      upstream base. System extensions are the sanctioned runtime exception and
      persist across upgrades.
    notes: >-
      The flexibility is real and it is this project's distinguishing capability:
      an adopter can Kairos-ify a base the project has never shipped, using
      ordinary container tooling.

      **The cost of that flexibility is where this profile is most critical of
      its own project.** Building your own image is now the recommended path for
      every base except Hadron. The documentation describes the benefits, in a
      page of under 400 words, and assigns exactly one responsibility: "It's the
      responsibility of the derivative project or user (you!) to define and
      manage the versioning of your images."

      Three other responsibilities transfer with it and no page assigns them.
      **Signing:** nothing tells an adopter building their own image that they
      must run their own signing and hold their own keys. **CVE response:** the
      security policy covers vulnerabilities in Kairos, and the release cadence
      text is written for project-published artifacts. Nothing says who patches
      base-OS vulnerabilities in a derived image. The plain reading is that the
      adopter owns it, and no document says so. **Testing:** the automated
      testing referenced covers whether a Kairos-ified base boots, not whether a
      given derivation works.

      This is exactly the pattern the survey methodology requires be recorded for
      any framework, and it applies here more sharply than to any other project
      in this edition, because the project moved its default to this path in v4.

      System extension limits are documented and substantial: still banner-marked
      as preview and v3.4.x-only on the v4.3.0 documentation, signature
      enforcement only under Trusted Boot with the explicit note that "For
      non-uki Kairos, the signature is not enforced yet", only specific /usr
      subdirectories overlayable, and only the last image layer converted.

      Bundles install once and never re-apply, and whether bundle changes survive
      an upgrade is undefined in the documentation.

      Board support is a closed enumeration in source. Adding one requires a code
      change, there is no plugin mechanism, and no page explains the process.
      There is no general GPU driver or out-of-tree module guide for x86; the
      NVIDIA development page is a 2022 note that opens by describing a failed
      port.
    evidence: DOCUMENTED
    sources:
      - url: https://kairos.io/docs/reference/byoi/
        type: official-docs
        title: Bring your own image
        retrieved: "2026-09-22"
        quote: You keep full control over release cadence and patch windows.
      - url: https://kairos.io/docs/reference/kairos-factory/
        type: official-docs
        title: Kairos factory
        retrieved: "2026-09-22"
        quote: >-
          It's the responsibility of the derivative project or user (you!) to
          define and manage the versioning of your images.
      - url: https://kairos.io/docs/advanced/sys-extensions/
        type: official-docs
        title: System extensions
        retrieved: "2026-09-22"
        quote: >-
          Currently only signed+verity sysexts are supported under Trusted Boot
          (UKI). For non-uki Kairos, the signature is not enforced yet
      - url: https://kairos.io/docs/advanced/bundles/
        type: official-docs
        title: Bundles
        retrieved: "2026-09-22"
        quote: >-
          the installation only happens once. Changing the bundle's configuration
          block after Kairos installation is complete, will not have any effect.
    unknowns:
      - "No page assigns ownership of signing, CVE response or testing for an adopter-built image."
      - "Whether bundle configuration changes survive an upgrade is undefined."
      - "No documented mechanism exists to add a board or SoC."

