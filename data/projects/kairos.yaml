  d14_maturity:
    normalized:
      first_release: "2021-07-30"
      current_version: "v4.3.0"
      current_version_date: "2026-09-08"
      release_cadence: "bursty: clusters of same-week patches separated by one to two month gaps"
      observed_intervals: "21, 62, 2, 31, 56, 0, 17, 4, 22, 2, 1 days across v3.7.0 to v4.3.0"
      support_model: "none published"
      support_window: "none published; latest release branch only"
      commercial_support: available
      foundation_status: "CNCF Sandbox since 2024-04-13, no movement to Incubating"
    summary: >-
      Five years old, 197 releases not flagged pre-release, currently at
      v4.3.0. There is no published support lifecycle, no end-of-life policy
      and no LTS. The only statement is that the latest release branch receives
      patch releases.
    notes: >-
      The documentation tree was searched for end-of-life, LTS, support policy
      and supported-version wording, and returned nothing. Only three
      documentation versions are retained. Long-term maintenance exists only as a
      commercial line item.

      Maintenance branches do exist. Several v3.5.x releases were published after
      v3.6.0 and those tags are not ancestors of the main branch, so backporting
      happens. No published policy says which versions receive it.

      Stated and observed cadence do not match. The CNCF landscape entry claims
      at least one minor release per quarter, the documentation claims weekly
      patches and monthly minors, and the observed intervals over the last twelve
      releases are bursty rather than regular.

      The project underwent major structural change in the thirty days before
      this collection date: a monorepo consolidation archived nine repositories
      between 2026-08-19 and 2026-08-31 (five on 2026-08-19, three on
      2026-08-26, the umbrella Kubernetes provider on 2026-08-31, dated by
      each repository's last metadata update), and five further Kubernetes
      provider repositories were archived by 2026-09-07. The code side was
      executed cleanly, with
      a single module, one release tag and a multi-call binary. The documentation
      has not caught up, and a large share of the findings in this profile are
      downstream of that gap rather than of the architecture.

      A fairness correction worth recording, since a naive freshness measure
      would overstate the problem: 35 of 105 documentation pages carry 2022 or
      2023 front-matter dates, but every page has been touched in git in 2026, so
      those are creation dates. The fairer measure is that about a third of pages
      have had no content update since a single migration cleanup commit in
      February 2026.

      Issues are closing faster than they open over the last 90 days.
