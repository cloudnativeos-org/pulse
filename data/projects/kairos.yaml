    summary: >-
      Kubernetes is optional and core images ship none. Where it is included, the
      distribution and version are baked into the image at build time and encoded
      in the artifact tag, so the OS and Kubernetes do not upgrade independently.
    notes: >-
      Two distributions are named as officially supported on the
      choosing-a-distribution page, k3s and k0s, and the released artifact set
      is narrower than that reads: amd64 gets both, arm64 gets k3s only.

      The provider ecosystem contracted sharply in the weeks before this
      collection date. The umbrella provider repository carries an archive
      notice commit dated 2026-08-31. The RKE2, kubeadm, k3s, canonical and
      nodeadm providers have last pushes between 2026-08-18 and 2026-09-03, a
      last metadata update on 2026-09-07, and are archived; the archive
      timestamp itself is not exposed by the REST API, so 2026-09-07 is the
      latest date the archiving could have happened. The MicroK8s provider is
      not archived and its last release is an alpha from February 2023. The
      only kubeadm page in the versioned documentation points at the archived
      provider-kubeadm repository.

      A newer, active Kubernetes provider exists, created in June 2026,
      tracking upstream Kubernetes across three minor versions and
      bootstrapping with kubeadm. On the collection date it was referenced
      nowhere in the documentation. A Kubernetes Provider section was
      published on the documentation site on 2026-09-21, which is why kubeadm
      is now listed under distributions; the choosing-a-distribution page
      still names only k3s and k0s as official. The Cluster API provider
      remains undocumented on the site: it is active at v0.1.3 (2026-09-17;
      v0.1.2 on the collection date) while the documentation still lists
      Cluster API as coming soon.

      Independent lifecycle is recorded as no rather than partial. For official
      standard images the Kubernetes version is in the image tag. Decoupling is
      possible by using a core image and managing Kubernetes separately, but that
      is work pushed to the adopter, and no page describes upgrading Kubernetes
      independently of the OS.
    evidence: DOCUMENTED
