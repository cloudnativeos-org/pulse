      - "No page is framed as OEM or factory provisioning."

  d10_security:
    normalized:
      boot_trust_chain:
        level: 3
        how: opt-in
        route: usi
        artifact: signed UKI
        modes:
          Trusted Boot: 3
          Standard install: 1
        note: With Trusted Boot you sign with your own keys. The whole OS is packed in the UKI initrd
          and runs from memory, with signed system extensions only. Disk keys are sealed to the signed PCR 11
          policy
        evidence: DOCUMENTED
        sources:
        - url: https://kairos.io/docs/architecture/trustedboot/
          type: official-docs
          title: Kairos Trusted Boot architecture
          retrieved: '2026-10-06'
          quote: There is no second stage loaded and no system pivoting
        - url: https://github.com/kairos-io/AuroraBoot/blob/adfcf37fad0d2d0dcfe505f14b4d24c522032520/pkg/uki/uki.go#L686-L714
          type: source-code
          title: AuroraBoot UKI build
          retrieved: '2026-10-06'
          quote: Walk sourceDir with absolute paths (no os.Chdir) and record each entry under a path relative to sourceDir, so the initramfs layout is rooted at "." regardless of the process working directory.
      secure_boot: unknown
      measured_boot: "available under Trusted Boot; disk keys sealed to the signed PCR 11 policy by default, PCR 7 only when bind-pcrs is set"
      tpm: "TPM 2.0"
      integrity: read-only-mount
      integrity_scope: "root image at boot; no runtime re-verification"
      dm_verity: "used for system extensions only, not for the OS root"
      disk_encryption: "LUKS on user-data partitions, opt-in on the default install; automatic under Trusted Boot"
      artifact_verification_release: sigstore-keyless-cosign
      artifact_verification_upgrade_default: "none"
      sbom: "OCI build attestations; documented release assets do not exist"
      provenance: unknown
      fips: "build flag; no FIPS ISO published; no whole-system validation claimed"
      mandatory_access_control: "SELinux relabel on upgrade; posture not documented"
      default_on:
        - read-only-root
        - ssh-baseline-hardening-at-build-time
        - release-signing
      opt_in:
        - trusted-boot-uki
        - disk-encryption
        - upgrade-signature-verification
        - fips-build
    summary: >-
      Two very different security postures ship from one project. Trusted Boot
      enforces signature verification, measures the UKI into the TPM and
      encrypts automatically. The default non-UKI path verifies nothing at
      upgrade time and encrypts nothing.
    notes: >-
      **Secure Boot is recorded as unknown, and the reasoning matters.** The only
      Secure Boot architecture page is dated January 2024 and describes
      piggybacking on an upstream distribution's signed artifacts. That model
      cannot apply to Hadron, which is now the only released base and which
      compiles its own shim from source. No signing step was found in that
      repository, and the build tooling only copies the shim. INFERRED from those
      three facts: the official ISOs carry a self-built shim that will not
      validate against factory-default firmware keys. No primary source documents
      a CA-signed shim or a shim-review submission either way. The architecture
      page still claims any supported flavor works with Secure Boot out of the
      box. This is the largest documentation gap found in this profile, and it is
      the same class of question raised for several other projects under FR-14.

      Trusted Boot keys are entirely the adopter's. The documentation is clear
      and unsentimental about the consequences: you generate the keys, losing
      them prevents generating new images, keys cannot be made non-expiring, and
      enrollment needs firmware setup mode or per-machine work.

      dm-verity is not used for the OS root on either path. It appears only in
      the system extension mechanism, and there signature enforcement is Trusted
      Boot only.

      Disk encryption is opt-in on the default install and covers user-data
      partitions only. INFERRED consequence: a default installation stores host
      keys, home directories and Kubernetes state unencrypted. Under Trusted Boot
      encryption is automatic.

      The remote key server path is documented with a candour worth crediting:
      every worked example uses plain HTTP, and the documentation says plainly
      that nothing proves the answer came from your key server, with certificate
      pinning opt-in and empty by default.

      Release signing is genuine and was verified independently during this
      research. However, three official pages give three mutually inconsistent
      signer identities, and one of them points at an archived repository. A
      verification policy copied from one of those pages would reject current
      releases. User verification is presented as an optional step.

      **The documentation claims SBOMs are release assets at a specific URL. All
      57 assets of v4.3.0 were enumerated and none match; the URL returns 404.**
      Re-checked 2026-09-22: no v4.3.0 asset name contains sbom, spdx or
      cyclonedx, and the documented URL pattern for the core amd64 image still
      returns 404. SBOMs are in fact OCI build attestations, and are disabled
      for Jetson images because they exceed a size limit.

      The FIPS documentation page is 88 words. Two hard limits appear only in
      source: not available on riscv64, and not supported on one base without a
      commercial subscription. No FIPS ISO is published and no claim of
      whole-system validation exists anywhere.

      The security policy has no supported-versions table, no acknowledgement or
      fix service level, no severity matrix, no embargo timeline and no key.
      Exactly one advisory has ever been published, in June 2024. A real,
      well-engineered scanning and triage program exists in a separate
      repository, with committed state and a release gate, and it is not linked
      from the documentation site. As read on this date it carries several
      advisory suppressions whose expiry dates have already passed, and it
      suppresses kernel vulnerabilities wholesale.

      CNCF CLOMonitor, an independent dashboard, reports the project failing its
      SBOM, signed releases, security insights, token permissions, dangerous workflow and
      dependency policy checks (unchanged on 2026-09-22; the dashboard's own
      report timestamp is 2026-09-21). In fairness the signed-releases failure is
      arguably a false negative: that check looks for particular asset
      extensions, and this project ships Sigstore bundles instead, which were
      verified genuine.
    evidence: DOCUMENTED
    sources:
      - url: https://kairos.io/docs/architecture/secureboot/
        type: official-docs
        title: Secure Boot architecture (front matter date 2024-01-29)
        retrieved: "2026-09-22"
        quote: >-
          We piggyback on the upstream artifacts to be properly signed in order
          to support SecureBoot.
      - url: https://github.com/kairos-io/hadron/blob/main/sources.yaml
        type: source-repo
        title: Hadron sources, shim built from upstream tarball
        retrieved: "2026-09-22"
        quote: "https://github.com/rhboot/shim/releases/download/${version}/shim-${version}.tar.bz2"
      - url: https://kairos.io/docs/advanced/partition_encryption/
        type: official-docs
        title: Partition encryption
        retrieved: "2026-09-22"
        quote: >-
          User-data partitions are dedicated to persist data for a running
          system, stored separately from the OS images.
      - url: https://kairos.io/docs/upgrade/trustedboot/
        type: official-docs
        title: Trusted Boot upgrades
        retrieved: "2026-09-22"
        quote: >-
          In order to upgrade a node to a new version of the OS, you need to
          generate again the installable medium with the same keys used in the
          steps before.
      - url: https://kairos.io/docs/reference/image_matrix/
        type: official-docs
        title: Image matrix, SBOM section
        retrieved: "2026-09-22"
        quote: "SBOM lists are regularly pushed via the CI as part of the Github releases assets"
      - url: https://clomonitor.io/api/projects/cncf/kairos
        type: foundation-page
        title: CNCF CLOMonitor API, Kairos (dashboard at clomonitor.io/projects/cncf/kairos)
        retrieved: "2026-09-22"
        quote: '"global":93.23,"license":100.0,"security":59.09'
    unknowns:
      - "Whether the shim in the official Hadron ISOs is signed by any CA present in default firmware, and whether a shim review has been submitted."
      - "Which of three documented signer identities is correct for current releases."
      - "Whether SBOMs are intended to return as release assets, or whether the OCI attestation is now the only channel."
      - "No SLSA generator or level claim was found."

  d11_operations_debugging:
    normalized:
      ssh: available
      local_shell: available
      serial_console: unknown
      recovery_shell: available
      api: "install web UI on port 8080; phone-home WebSocket; AuroraBoot REST API"
      support_bundle: "kairos-agent logs"
      works_without_kubernetes: "yes"
      trusted_boot_debugging: "limited: the command line is measured, so boot-time debug options cannot be added; the troubleshooting page documents TPM event log, sbctl and goverify checks"
    summary: >-
      A complete node-local command line: upgrade, roll back, reset, inspect and
      re-key by hand, with no Kubernetes and no network required. Initramfs
      breakpoints and a recovery entry exist for boot failures.
    notes: >-
      Working without Kubernetes is a genuine strength here and is recorded as
      such. The local agent covers the whole machine lifecycle.

      **There is no debugging story for Trusted Boot, and the documentation says
      so.** Because the kernel command line is measured into the TPM, debug
      options cannot easily be added, and the documentation states outright that
      it cannot yet advise how to build UKI images with debug options. What
      the troubleshooting page rules out is adding boot-time debug options,
      such as initramfs breakpoints, to the measured command line, since the
      system will not boot if it changes. For Trusted Boot it lists TPM event
      log and Secure Boot key checks instead.

      The installer web UI listens on port 8080 on all interfaces. A search of
      its source for authentication, password, token or TLS handling returned no
      matches. INFERRED: anyone on the provisioning network can post a
      configuration to a machine sitting at the installer. The documentation does
      not flag this. The contrast with the AuroraBoot README is instructive,
      which states plainly that its netboot server is unauthenticated by design
      and should run only on a trusted, isolated provisioning network.

      In-RAM boot failure handling is genuinely good: a full-screen error on
      every console naming the exact kernel option needed, then a reboot so that
      boot assessment records the failure.

      There is no logging, telemetry, metrics or monitoring documentation of any
      kind. A page at a URL operators will click expecting alerting guidance is
      published placeholder text. There is no serial console configuration page
      despite an edge and headless audience.

      The multi-cluster remote debugging workflow requires a working cluster to
      deploy into, so it does not help when Kubernetes is the thing that is down.
    evidence: DOCUMENTED
    sources:
      - url: https://kairos.io/docs/reference/troubleshooting/
        type: official-docs
        title: Troubleshooting, Trusted Boot debugging
        retrieved: "2026-09-22"
        quote: >-
          currently we cannot advise how to proceed here to build the UKI images
          with debug options yet
      - url: https://github.com/kairos-io/AuroraBoot
        type: source-repo
        title: AuroraBoot README, netboot server posture
        retrieved: "2026-09-22"
        quote: >-
          unauthenticated by design ... Run it only on a trusted, isolated
          provisioning network.
    unknowns:
      - "Whether the install web UI on port 8080 has any authentication or network scoping."
      - "No logging, telemetry, metrics or monitoring documentation exists."
      - "No serial console configuration page exists."

  d12_fleet_management:
    normalized:
      core_project:
        - "A/B upgrade from an OCI source, offline-capable"
        - "Boot assessment with one retry"
        - "Cloud configuration as the whole configuration surface"
        - "Phone-home agent with a restricted default command set"
        - "Peer-to-peer self-organizing clusters"
