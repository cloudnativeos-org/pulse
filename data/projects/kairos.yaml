  - date: "2026-10-06"
    field: "tradeoffs.costs"
    change: "Methodology section 9, rule 16: concentration is stated once, in one shape. Was 'Maintainership and contribution are concentrated in one company: five of six maintainers, four of four administrators, one listed contributing organization, and about 94 percent of recent human commits from that company's affiliated maintainers.' Now 'Five of six maintainers work for Spectro Cloud.', the one measure every foundation-held entry gets, from the project's own maintainers file. The administrator count, the contributing-organizations count and the commit share stay in d13 contribution_diversity and notes. They are not on the card, because no other entry has a commit share measured the same way."
    source:
      url: "https://github.com/kairos-io/community/blob/main/MAINTAINERS.md"
      type: "governance-doc"
      title: "Kairos maintainers (six maintainers, five at Spectro Cloud and one at Mirantis; four administrators, all at Spectro Cloud; two emeritus, both Spectro Cloud)"
      retrieved: "2026-09-22"
  - date: "2026-10-06"
    field: "tradeoffs.costs"
    change: "Methodology section 9, rule 17: where a capability is documented is not a cost. Removed cost 'A phone-home control channel that can reboot and upgrade machines has no documentation page.' The channel is the AuroraBoot fleet server's node manager. The feature exists and the AuroraBoot README documents it, so where it is documented is not a cost. The kairos.io documentation gap is tracked in kairos-io/kairos#5256."
    source:
      url: "https://github.com/kairos-io/AuroraBoot"
      type: "source-repo"
      title: "AuroraBoot README, node manager"
      retrieved: "2026-10-06"
      quote: "From there you can send commands: upgrade, reboot, reset, apply a cloud-config, or run arbitrary shell"
  - date: "2026-10-06"
    field: "tradeoffs.buys"
    change: "Methodology section 9, rule 17, fleet tooling parity: Flatcar (Nebraska), Bottlerocket (update waves) and EVE-OS (Adam) get a buy for open fleet tooling, and Kairos did not. Added buy 'An open-source fleet server (Apache-2.0) in AuroraBoot: nodes enrol and are grouped, and the server sends upgrade, reboot, reset and configuration commands, with a dashboard, a Secure Boot key store and BMC provisioning. A Cluster API provider builds on it.' Sources as recorded in d12 oss_companion (AuroraBoot, cluster-api-provider-kairos-fleet) and d04 fleet_upgrade, plus the AuroraBoot README, quote verified verbatim on 2026-10-06. The d04 note that bulk commands have no concurrency, batch or failure-stop field stays in the dimension data."
    source:
      url: "https://github.com/kairos-io/AuroraBoot"
      type: "source-repo"
      title: "AuroraBoot README, node manager"
      retrieved: "2026-10-06"
      quote: "From there you can send commands: upgrade, reboot, reset, apply a cloud-config, or run arbitrary shell"
  - date: "2026-10-06"
    field: "tradeoffs.buys"
    change: "Cluster API parity: the profile records the project's own Cluster API providers in d12 (cluster_api and oss_companion) and in the d04 fleet_upgrade block, and the card had no buy for them. Added buy 'Its own Cluster API providers (Apache-2.0): a control-plane provider that rolls control-plane machines one at a time, and a fleet provider that claims nodes already enrolled in AuroraBoot.' The same test was applied to every entry with Cluster API providers recorded in its profile (Talos, Flatcar)."
    source:
      url: "https://github.com/kairos-io/cluster-api-provider-kairos"
      type: "source-repo"
      title: "cluster-api-provider-kairos repository"
      retrieved: "2026-10-06"
      quote: "pre-1.0; API surface may still change"
  - date: "2026-10-06"
    field: "tradeoffs.costs"
    change: "Cluster API parity: no cost covered the stated limits of the new Cluster API buy, so added one cost (C1, C3): 'The Cluster API providers are pre-1.0, and their API may still change. The fleet provider supports a single control-plane machine only.' From d12 oss_companion and cluster_api.maturity, and the fleet provider README as recorded in d12 sources."
    source:
      url: "https://github.com/kairos-io/cluster-api-provider-kairos-fleet"
      type: "source-repo"
      title: "Kairos fleet infrastructure provider README"
      retrieved: "2026-09-22"
      quote: "High-availability control planes (`replicas` greater than 1) are out of scope for this provider."
  - date: "2026-10-06"
    field: "tradeoffs.costs"
    change: "Methodology section 9, rule 18: a limitation counts only where the same aspect is assessed for every entry with the capability, and an unverified security path always counts. Cost c0 reworded to the unverified path only. Was 'On the standard install, upgrade signature checking ships off and has no command-line flag, and the documentation does not say the path is unverified. Trusted Boot enforces verification, and no page documents the difference.' Now 'On the standard install, an upgrade does not verify the image signature, no command-line flag turns it on, and the documentation does not say the path is unverified.' The Trusted Boot half moved to the new Trusted Boot buy ('Upgrades enforce signature verification'). Sources as recorded in d10."
  - date: "2026-10-06"
    field: "tradeoffs"
    change: "Methodology section 9, rule 18: build-your-own responsibility is a status of the build-your-own capability, not a separate cost. Moved cost c2 ('For a base other than Hadron, the adopter builds the image and owns its testing, signing and CVE response. The documentation assigns only versioning to the adopter.') into buy b2, which now ends 'The adopter then owns the image's testing, signing and CVE response; the documentation assigns only versioning to the adopter.' Every fact kept."
  - date: "2026-10-06"
    field: "tradeoffs"
    change: "Methodology section 9, rule 18: disk encryption is assessed as a capability with its status. Moved cost c4 ('On the standard install, disk encryption is opt-in and covers user-data partitions only. Without it, host keys, home directories and Kubernetes state are stored unencrypted.') into a new buy: 'Disk encryption with TPM or KMS unlock, automatic under Trusted Boot. On the standard install it is opt-in and covers the user-data partitions; without it, host keys, home directories and Kubernetes state are stored unencrypted.' Sources as recorded in d10 (disk_encryption, partition encryption page)."
  - date: "2026-10-06"
    field: "tradeoffs"
    change: "Methodology section 9, rule 18: boot-assessment quality is not assessed for every entry with automatic rollback, so it is a status of the recovery buy. Moved cost c5 ('On the standard install, boot assessment allows one retry and counts a boot successful at an early configuration stage, before any workload is healthy. An upgrade that boots but breaks the cluster counts as successful.') into buy b4, which now ends 'Automatic rollback allows one retry on the standard install and counts a boot as good when it reaches an early configuration stage, before any workload is healthy.' Sources as recorded in d05."
  - date: "2026-10-06"
    field: "tradeoffs"
    change: "Methodology section 9, rule 18: Trusted Boot had no buy, and its limits were costs. Added buy 'Trusted Boot: the whole OS in a UKI signed with your own keys, run from memory, with signed system extensions only and disk keys sealed to the signed PCR 11 policy. Upgrades enforce signature verification. The command line is measured, so boot-time debug options cannot be added, and the documentation cannot yet advise how to build UKI images with them.' from d10 boot_trust_chain and the troubleshooting page. Moved cost c10 ('No debugging story exists for Trusted Boot, and the documentation says so. The mode intended for high-assurance deployment has no shell access.') into that buy, and dropped 'no shell access', which no source supports: the troubleshooting page says the measured command line prevents adding boot-time debug options, not that the mode has no shell."
    source:
      url: "https://kairos.io/docs/reference/troubleshooting/"
      type: "official-docs"
      title: "Troubleshooting, Kairos UKI note"
      retrieved: "2026-10-06"
      quote: "Currently on UKI mode we cannot easily change the cmdline to provide debug options easily as the cmdline is measured by the TPM and the system will not boot if the cmdline is changed."
  - date: "2026-10-06"
    field: "dimensions.d11_operations_debugging.notes"
    change: "The note said Trusted Boot 'is the one you cannot get a shell into'. No source supports that. The troubleshooting page says the command line is measured by the TPM and the system will not boot if it is changed, so debug options such as initramfs breakpoints cannot be added. Reworded to that, and noted that the page lists TPM event log and Secure Boot key checks for Trusted Boot."
    source:
      url: "https://kairos.io/docs/reference/troubleshooting/"
      type: "official-docs"
      title: "Troubleshooting, Kairos UKI note"
      retrieved: "2026-10-06"
      quote: "Currently on UKI mode we cannot easily change the cmdline to provide debug options easily as the cmdline is measured by the TPM and the system will not boot if the cmdline is changed."
  - date: "2026-10-06"
    field: "tradeoffs"
    change: "Methodology section 9, rule 18: a version number alone is not a status (rule 15, N4), and a status goes inside the buy when the project states a consequence. Cost c11 ('The Cluster API providers are pre-1.0, and their API may still change. The fleet provider supports a single control-plane machine only.') removed; buy b7 replaced. Was 'Its own Cluster API providers (Apache-2.0): a control-plane provider that rolls control-plane machines one at a time, and a fleet provider that claims nodes already enrolled in AuroraBoot.' Now 'Its own Cluster API providers (Apache-2.0). A bootstrap and control-plane provider for k0s and k3s rolls control-plane machines one at a time and accepts 1, 3 or 5 control-plane replicas, with high availability on CAPK, CAPV and CAPM3; its README says the API may still change. A fleet infrastructure provider claims nodes already enrolled in AuroraBoot, for a single control-plane machine.' Verified verbatim on 2026-10-06 against the v0.1.3 README ('pre-1.0; API surface may still change before v1.0.', 'HA control planes (`spec.replicas: 3` or `5`) are supported on CAPK, CAPV, and CAPM3 for both k0s and k3s.') and the fleet provider README at v0.1.3 ('High-availability control planes (`replicas` greater than 1) are out of scope for this provider.')."
    source:
      url: "https://github.com/kairos-io/cluster-api-provider-kairos/blob/v0.1.3/README.md"
      type: "source-repo"
      title: "cluster-api-provider-kairos README at v0.1.3"
      retrieved: "2026-10-06"
      quote: "`KairosControlPlane.spec.replicas` accepts `1` (single-node), `3`, or `5`"
