      - url: "https://github.com/kairos-io/cluster-api-provider-kairos/blob/v0.1.3/docs/HIGH_AVAILABILITY.md"
        title: "cluster-api-provider-kairos high availability at v0.1.3, k3s member removal (KD-5d)"
        retrieved: "2026-10-06"
        quote: "replacing a k3s control-plane node leaves an orphaned etcd member requiring manual `etcdctl member remove`"
  - text: "In v4.3.0, /usr/libexec is a persistent path, in the shipped configuration and in the documentation. Persisting it across A/B slots merges one slot's binaries into the other and breaks rollback (kairos-io/kairos#4304). It was removed from the configuration after v4.3.0 (kairos-io/kairos#4465)."
    kind: defect
    sources:
      - url: "https://github.com/kairos-io/kairos/issues/4304"
        type: "source-repo"
        title: "/usr/libexec persistence breaks rollback"
        retrieved: "2026-09-22"
        quote: "Persisting /usr/libexec across A/B slots breaks rollback ABI compatibility"
      - url: "https://github.com/kairos-io/kairos/blob/v4.3.0/kairos-init/pkg/bundled/cloudconfigs/00_rootfs.yaml"
        type: "source-code"
