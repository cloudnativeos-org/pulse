          self_hostable: false
          note: "Uses Kairos images, bootstrapped by Spectro Cloud's own Stylus installer. Stylus, the Palette console, cluster profiles and the managed Kubernetes distribution are Spectro Cloud's, not the open-source project's."
        - name: Kairos commercial support
          vendor: Spectro Cloud
          license: subscription
          self_hostable: false
          note: "Published tiers with CVE patch releases and long-term maintenance. This is the only place where a CVE patch commitment and a long-term maintenance offering exist for Kairos."
      cluster_api:
        os_specific_provider: "cluster-api-provider-kairos (bootstrap and control plane), cluster-api-provider-kairos-fleet (infrastructure)"
        provider_types:
          - bootstrap
          - control-plane
          - infrastructure
        maintainer: project-native
        upstream_provider_list: "not listed in the released book; present on the main-branch build since 2026-08-11"
        clusterctl_builtin: "not in any released clusterctl; the entries are on cluster-api main and postdate the v1.14.0 cut, so the provider must be registered by hand today. Re-checked 2026-09-22: v1.14.1 (2026-09-01) and v1.14.2 (2026-09-08) carry no Kairos entry either"
        provisions: "OS configuration and bootstrap through Kairos cloud-config, plus control-plane machine lifecycle. The fleet provider claims enrolled nodes rather than creating instances."
        bootstrap_target: "k0s and k3s, not kubeadm"
        image_builder_target: "none"
        maturity: "pre-1.0, self-declared; v0.1.3 on 2026-09-17 (v0.1.2 on 2026-09-09 on the collection date); first release 2026-05-18"
    summary: >-
      The open-source project provides the upgrade primitive, boot assessment and
      configuration surface, with no inventory, scheduling, canary logic, policy
      engine or dashboard. Those live in AuroraBoot's fleet server and in the
      Kubernetes operator, both separate repositories.
    notes: >-
      AuroraBoot's fleet server is the most capable fleet tool in the
      organization and is close to invisible in the documentation. It has a
      dashboard, a node manager where machines it built phone home and can be
      sent upgrade, reboot, reset, configuration and arbitrary shell commands, a
      Secure Boot key store and BMC provisioning. The word "fleet" does not
      appear on its documentation page at all.

      Several load-bearing companion components are stale or unreleased: two have
      never published a release, one last released in December 2024, one has no
      README. Six repositories the documentation still routes readers to are
      archived.

      The commercial boundary is worth stating precisely and fairly. Spectro
      Cloud's edge product uses Kairos images and adds its own installer, console
      and managed Kubernetes distribution, and the vendor's own documentation
      says so. The commercial support announcement is candid about what changed:
      support had been best effort until then, and it states that Kairos remains
      fully open with no commercial forks or gated features. What the commercial
      tier adds that the project does not offer is a CVE patch commitment and
      long-term maintenance, and that is recorded under d14 as well.

      The Cluster API story is the newest thing here and needs its strong and
      weak halves recorded together, because this profile's authors contribute
      to the provider and a one-sided reading would be the easy mistake.

      The strong half. Three providers exist, all in the project's own
      organization, covering bootstrap, control plane and infrastructure. That
      is a more complete provider set than any other entry in this edition has
      today. They are actively developed, with commits within two days of the
      collection date, and they ship proper clusterctl artifacts. Six pull
      requests registering them landed in cluster-api on 2026-08-11, so the
      names now appear in that project's built-in provider list and glossary on
      main.

      The weak half, and it is the half a reader planning a deployment needs.
      The registration landed about five hours after cluster-api v1.14.0 was
      cut, so Kairos appears in no released clusterctl, and the provider list in
      the published book does not carry it either. Today an operator must
      register the provider by hand before clusterctl init will find it, which
      the project's own README says. The provider is pre-1.0 by its own
      statement, with an API surface that may still change, and its first
      release was four months before this survey. It bootstraps k0s and k3s
      rather than kubeadm, so the standard kubeadm path does not apply, and
      Kairos is not an image-builder target. Provider-list inclusion is
      self-service registration rather than a review or a conformance audit,
      and the six registering pull requests were authored by a Kairos
      maintainer listed in the project's MAINTAINERS.md. None of that makes
      the provider worse than it is; it makes "listed
      upstream" a weaker claim than it sounds, and the same caution is applied
      to every other entry in this edition.
    evidence: DOCUMENTED
