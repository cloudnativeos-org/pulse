                retrieved: "2026-10-06"
                quote: >-
                  `KairosControlPlane.spec.replicas` accepts `1` (single-node), `3`, or `5`
              - url: https://github.com/kairos-io/cluster-api-provider-kairos/blob/v0.1.3/docs/HIGH_AVAILABILITY.md
                title: "cluster-api-provider-kairos high availability at v0.1.3, k3s member removal (KD-5d)"
                retrieved: "2026-10-06"
                quote: >-
                  replacing a k3s control-plane node leaves an orphaned etcd member
