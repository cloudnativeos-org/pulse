        type: "release-notes"
        title: "v4.3.0 release assets (57 assets; riscv64 appears only as Go binary tarballs, no riscv64 ISO or OS container image)"
        retrieved: "2026-09-22"
        quote: "kairos-v4.3.0-linux-riscv64.tar.gz"
  - text: "Every current binary stamps a versioned configuration schema URL into the configuration it emits. The URL resolves for v1.6.0 and returns 404 for v3.5.0, v4.2.0 and v4.3.0."
    kind: stated-vs-delivered
    sources:
      - url: "https://github.com/kairos-io/kairos/blob/master/sdk/schema/validate.go"
        type: "source-repo"
        title: "Schema validator, versioned schema URL (v1.6.0 returns 200; v3.5.0, v4.2.0 and v4.3.0 return 404 on 2026-09-22)"
        retrieved: "2026-09-22"
        quote: "url := fmt.Sprintf(\"https://kairos.io/%s/cloud-config.json\", version)"
  - text: "The Trusted Boot boot-assessment page documents a fallback stage named autorecovery. It exists in no repository in the organization."
    kind: stated-vs-delivered
    sources:
      - url: "https://kairos.io/docs/examples/boot_assessment_trusted_boot/"
        type: "official-docs"
        title: "Boot assessment under Trusted Boot"
        retrieved: "2026-09-22"
        quote: "If recovery fails, the system attempts autorecovery."
  - text: "The only Secure Boot architecture page, dated January 2024, describes relying on upstream-signed artifacts and claims that any supported flavor works with Secure Boot out of the box. Hadron, the only released base, builds its own shim from source, and no signing step was found."
    kind: stated-vs-delivered
    sources:
      - url: "https://kairos.io/docs/architecture/secureboot/"
        type: "official-docs"
        title: "Secure Boot architecture (front matter date 2024-01-29)"
        retrieved: "2026-09-22"
        quote: "We piggyback on the upstream artifacts to be properly signed in order to support SecureBoot."
      - url: "https://github.com/kairos-io/hadron/blob/main/sources.yaml"
