tradeoffs:
  buys:
    - "The OS is an ordinary container image in an ordinary registry, so mirroring, signing, content addressing and air-gapped transfer come from existing ecosystem tooling rather than project-specific infrastructure."
    - "Base-distribution independence. An adopter can convert an upstream base the project has never shipped, using a Dockerfile and standard container tooling."
    - "Other bases are built by the adopter: the project publishes Hadron artifacts only, validates eight distributions in kairos-init, and provides kairos-factory-action and AuroraBoot to run your own pipeline on your own cadence. The adopter then owns the image's testing, signing and CVE response; the documentation assigns only versioning to the adopter."
    - "Offline, node-local operation. Upgrade, rollback, reset, inspection and re-keying all work from the local command line with no network, no management plane and no Kubernetes."
    - "A dedicated recovery partition on local disk, so recovery does not depend on network, media or a management plane. Automatic rollback allows one retry on the standard install and counts a boot as good when it reaches an early configuration stage, before any workload is healthy."
    - "Kubernetes is optional, with a documented path to running without it."
    - "An open-source fleet server (Apache-2.0) in AuroraBoot: nodes enrol and are grouped, and the server sends upgrade, reboot, reset and configuration commands, with a dashboard, a Secure Boot key store and BMC provisioning. A Cluster API provider builds on it."
    - "Its own Cluster API providers (Apache-2.0). A bootstrap and control-plane provider for k0s and k3s rolls control-plane machines one at a time and accepts 1, 3 or 5 control-plane replicas, with high availability on CAPK, CAPV and CAPM3; its README says the API may still change. A fleet infrastructure provider claims nodes already enrolled in AuroraBoot, for a single control-plane machine."
    - "Foundation-held assets under LF Projects, CNCF Sandbox membership, DCO rather than a CLA, and a published governance document with a role ladder and defined offboarding."
    - "Verified Sigstore keyless release signing with transparency log entries."
    - "Trusted Boot: the whole OS in a UKI signed with your own keys, run from memory, with signed system extensions only and disk keys sealed to the signed PCR 11 policy. Upgrades enforce signature verification. The command line is measured, so boot-time debug options cannot be added, and the documentation cannot yet advise how to build UKI images with them."
    - "Disk encryption with TPM or KMS unlock, automatic under Trusted Boot. On the standard install it is opt-in and covers the user-data partitions; without it, host keys, home directories and Kubernetes state are stored unencrypted."
  costs:
    - "On the standard install, an upgrade does not verify the image signature, no command-line flag turns it on, and the documentation does not say the path is unverified."
    - "At v4.3.0 an upgrade does not refresh the bootloader, so shim and GRUB stay at install-time versions. The fix is unreleased and undocumented, and a factory reset is currently the only supported way to refresh them."
    - "No dm-verity and no runtime integrity verification of the root. On a non-UKI installation the root image has no signature check after install."
    - "Trusted Boot uses the adopter's own keys, which must be enrolled through firmware setup mode or per machine."
    - "The only published support statement is that the latest release branch gets patch releases. No end-of-life or LTS policy is published. Long-term maintenance exists only as a commercial offering."
    - "The security policy has no supported-versions table, no response commitment and no embargo policy, and one advisory has been published."
    - "Documentation contradicts shipped behaviour in load-bearing places: a persistent path that breaks rollback, a boot-assessment page that says automatic rollback is GRUB-only while the agent code arms a boot counter on Trusted Boot entries, SBOM release assets that do not exist, a configuration schema URL that returns 404, three inconsistent signer identities, routes to six archived repositories, and a Secure Boot architecture page that describes relying on upstream-signed artifacts, which Hadron, the only released base, does not use."
    - "Trusted Boot media built with AuroraBoot v0.27.1 or older carry a root-caused UKI section-alignment defect (kairos-io/kairos#4885). On firmware with memory-protection asserts, such as the OVMF Secure Boot build, the image loops before the kernel until a watchdog resets it. The fix merged on 2026-09-22 and shipped in AuroraBoot v0.28.0 (2026-10-07), which pins go-ukify v0.5.2."
    - "With k3s, replacing a control-plane node through the Cluster API provider leaves an etcd member that must be removed by hand. The project documents this as a known limitation. k0s is not affected."
    - "Five of six maintainers work for Spectro Cloud."
