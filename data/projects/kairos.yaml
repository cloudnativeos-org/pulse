                retrieved: "2026-10-06"
          - kind: fleet-server
            name: "AuroraBoot fleet server"
            license: "Apache-2.0"
            class: open-source
            reconciliation: one-shot
            filter: true
            note: "Documented in the README only. Bulk commands loop over every matched node. There is no concurrency, batch or failure-stop field."
            evidence: DOCUMENTED
            sources:
              - url: https://github.com/kairos-io/AuroraBoot
                title: "AuroraBoot repository"
                retrieved: "2026-10-06"
              - url: https://github.com/kairos-io/AuroraBoot/blob/master/pkg/handlers/commands.go
                title: "AuroraBoot pkg/handlers/commands.go (CreateBulk)"
                retrieved: "2026-10-06"
          - kind: cluster-api
            name: "cluster-api-provider-kairos"
            license: "Apache-2.0"
            class: open-source
            reconciliation: replacement
            status: "API may still change (README)"
            filter: true
            note: "Replaces control-plane machines one at a time. KairosControlPlane.spec.replicas accepts 1 (single-node), 3 or 5. High-availability control planes are supported on CAPK, CAPV and CAPM3 for k0s and k3s. With k3s, replacing a control-plane node leaves an etcd member that must be removed by hand (KD-5d). The companion provider cluster-api-provider-kairos-fleet claims existing AuroraBoot nodes and does not upgrade by reimaging; it supports a single control-plane machine only."
            evidence: DOCUMENTED
            sources:
              - url: https://github.com/kairos-io/cluster-api-provider-kairos
