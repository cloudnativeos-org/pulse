        retrieved: "2026-10-06"
        quote: "PERSISTENT_STATE_PATHS: >-"
  - text: "The documentation states that SBOM lists are pushed as GitHub release assets. None of the 57 assets of v4.3.0 is an SBOM, and the documented URL returns 404. SBOMs are published as OCI build attestations instead."
    kind: stated-vs-delivered
    sources:
