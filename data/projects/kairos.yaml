        retrieved: "2026-09-22"
open_questions:
  - "Is the shim in the official Hadron ISOs signed by any CA present in default firmware, and has a shim review been submitted? What Secure Boot posture should an adopter expect on stock firmware with the official artifacts? No primary source establishes whether the shipped shim validates against default firmware keys. The shim is built in the Hadron repository, so hadron.yaml records the same question at its source."
  - "Which of the three documented signer identities is correct for v4.3.0 and later?"
  - "Are SBOMs intended to return as release assets, or is the OCI attestation now the only channel?"
  - "Is there a published or intended support-lifecycle policy, and what governs which branches receive backports?"
  - "What is the CVE response commitment for the open-source project, as distinct from the commercial tiers?"
  - "Do Alpine, Debian and Fedora remain supported base distributions?"
  - "Is riscv64 intended to become a released OS platform, or is it permanently build-tooling only?"
  - "Does the install web UI on port 8080 have any authentication or network scoping?"
  - "Is boot-assessment fallback implemented for Trusted Boot? Two pages disagree and the cited issue is closed. What is the documented autorecovery stage, which exists in no repository?"
  - "Does the Kubernetes upgrade resource verify that a node returned on the new image before advancing to the next batch?"
  - "What is the intended support status of the companion repositories that have never released or have no README?"
  - "Is Hadron in scope for the CNCF project's governance, trademark and security processes, or is it a separate project in the same organization? hadron.yaml records the same question from Hadron's side, where the announcement claims CNCF vendor neutrality and no primary source establishes it."
  - "Is there a plan to add a second contributing organization, given that the project's own document names vendor neutrality as an incubation prerequisite?"
  - "Should the governance document carry the voting thresholds that currently live only in a CI configuration file, plus a conflict-resolution process?"
  - "Is the configuration schema URL 404 a hosting regression, and where should tooling fetch the current schema?"
  - "Which cloud images are actually published today?"
  - "Is the kubeadm-based Kubernetes provider, which gained a documentation section on 2026-09-21, an officially supported distribution alongside k3s and k0s? The choosing-a-distribution page still names only those two."
  - "On which dates were the five Kubernetes provider repositories (RKE2, kubeadm, k3s, canonical, nodeadm) archived? Their last pushes fall between 2026-08-18 and 2026-09-03 and their last metadata update is 2026-09-07; the archive timestamp itself is not exposed by the REST API."

