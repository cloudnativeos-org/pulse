        - raw-image
        - maas
      config_mechanism: "yip, a cloud-init-like dialect"
      config_reapplied: "stages re-run at defined lifecycle points"
      primary_tooling: "AuroraBoot, a separate repository"
    summary: >-
      Installation covers interactive, unattended, network boot and cloud paths.
      Media creation, network boot and raw image building all live in AuroraBoot,
      which is a separate repository with its own version.
    notes: >-
      Configuration uses yip, a custom dialect, described on one page as the
      standard cloud-init syntax plus "its own extended syntax" and on another
      as "a subset of cloud-init". Configuration can
      arrive by NoCloud ISO, a URL on the kernel command line, a templated URL
      substituting machine identifiers, bake-in at image build, cloud user data,
      or direct write to the OEM partition, with a documented merge order.
      Thirteen datasource providers exist in the shipped configuration and the
      documentation never enumerates them.

      **The configuration schema URL that every current binary emits returns
      404.** The generator stamps a versioned schema URL into every emitted
      configuration; that URL resolves for v1.6.0 and returns 404 for v3.5.0
      through v4.3.0 (re-checked 2026-09-22: v1.6.0 returns 200; v3.5.0,
      v4.2.0 and v4.3.0 return 404). Tooling that follows the schema reference
      gets nothing.

      Network boot is documented from the tool's side only, and generic PXE, DHCP
      and firmware setup is explicitly out of scope. The fallback iPXE ISO's only
      release is from November 2022.

      The QR pairing installation path is broken end to end: the instructions
      point at an archived repository for a command-line tool that ships no asset
      in the current release, and a component README states the tool is gone.

      No page is framed as OEM or factory provisioning, though several mechanisms
      would serve it.
    evidence: DOCUMENTED
    sources:
