schema_version: "1.0.0"
edition: "2026"
id: kairos
name: Kairos
homepage: https://kairos.io/
repository: https://github.com/kairos-io/kairos
collected_at: "2026-09-15"

entry_kind:
  - framework
  - distribution

category_fit:
  comparable: full
  note: >-
    Comparable on all fourteen dimensions. Carries two entry kinds, in this
    order. Framework first: the project's own description is "a Linux
    Framework", and what it primarily is, on every dimension below, is a
    toolchain (kairos-init, AuroraBoot, the agent) that converts a base
    distribution into an immutable A/B host and manages its lifecycle. This is
    the same kind of object bootc is, one layer up: bootc is a mechanism a
    distribution consumes, Kairos is a framework a base is fed into.
    Distribution second: unlike bootc, the project also releases the artifacts
    its framework produces, under its own version numbers, with its own release
    process, and every finding in d08, d09 and d14 about released images is a
    finding about those artifacts. NixOS and Ubuntu Core carry the same pair on
    the same reasoning.

    This profile carried a third tag, base-images, until 2026-09-22, and it was
    removed. The base images in this pair belong to Hadron, the from-scratch
    base every project-published artifact has been built from since v4, and
    Hadron now has its own entry, hadron.yaml. Kairos's own published images
    are the released artifacts, which distribution already covers. The
    relationship between the two entries is the one between a framework and
    the base it is applied to: the Hadron repository's own build pulls a
    published Hadron image and applies kairos-init to it, exactly as an adopter
    would with an Ubuntu base, and Hadron's home page says it "becomes
    immutable" when "topped with Kairos". Six dimensions of hadron.yaml are
    answered as provided by Kairos and cross-reference this profile, so that a
    comparison table does not count the A/B substrate twice. The reasoning for
    keeping distribution rather than reading Kairos as a framework only is in
    methodology.md section 11, item 7: dropping it would have made the
    released-artifact dimensions not applicable for the authors' own project,
    and those carry some of the least flattering findings here.

    The same field is applied to bootc, NixOS and Unikraft on identical terms.

    This survey was initiated by people who work on Kairos. The research for this
    profile was commissioned with an explicit instruction to hunt for
    limitations, thin documentation and responsibilities pushed onto the adopter.
    Several findings below are unflattering. They are recorded because the
    alternative is a survey nobody should believe.

self_description:
  text: >-
    Kairos is a Linux Framework managing the full lifecycle of machines, from
    installation to upgrades and recovery.
  source:
    url: https://kairos.io/
    type: official-docs
    title: Kairos home page
    retrieved: "2026-09-22"

version_observed:
  version: "v4.3.0"
  released: "2026-09-08"
  channel: stable
  method: >-
    Latest stable GitHub release on kairos-io/kairos via the releases API. 197
    releases not flagged pre-release or draft, out of 314 releases in total,
    counted with gh release list on 2026-09-22. Release assets enumerated to
    establish which artifacts actually ship. Re-checked 2026-09-22: v4.3.0 is
    still the latest release and no release has followed it.
  source:
    url: https://github.com/kairos-io/kairos/releases/tag/v4.3.0
    type: release-notes
    title: Kairos v4.3.0
    retrieved: "2026-09-22"

taxonomy:
  workload_scope: general-purpose-host
  construction_model:
    - framework
    - vendor-base-plus-derivation
    - vendor-fixed-image
  root_state_substrate:
    - ab-partition-image
  notes: >-
    Kubernetes is optional and core images ship none, which places this at the
    general-purpose-host position.

    All three construction models apply, and the balance between them shifted
    materially in v4. The project now publishes prebuilt artifacts for one base
    (Hadron) and directs everyone else to build their own image. See d01 and d06:
    that shift moves real obligations to the adopter, and the documentation
    assigns only one of them. Framework is the primary model. Vendor-fixed-image
    covers the released Hadron-based ISOs and images. Vendor-base-plus-derivation
    covers the documented practice of deriving from a released core image with a
    Dockerfile, which the image matrix page describes as the purpose of core
    images; the base images meant purely to be derived from are Hadron's and are
    recorded in hadron.yaml.

    The A/B pair is unusual in this survey: the slots are fixed-size ext2 files
    inside one state partition, not separate partitions. The vocabulary defines
    ab-partition-image as images in alternating partitions, so the value is the
    closest fit rather than an exact one, and hadron.yaml records the same
    substrate as the same mechanism, not a second one.

dimensions:
  d01_os_model:
    normalized:
      workload_scope: general-purpose-host
      ships_kubernetes: "core images no, standard images yes"
      bases_advertised:
        - Alpine
        - Debian
        - Fedora
        - Hadron
        - openSUSE
        - Rocky
        - Ubuntu
      bases_with_released_os_images:
        - Hadron
      bases_in_iso_ci:
        - Hadron
        - Ubuntu
        - Rocky
        - openSUSE Leap
    summary: >-
      A build toolchain plus a runtime that converts an upstream base into an
      immutable A/B layout with an OCI image as the unit of deployment. As of
      v4.3.0 the only base with released OS images is Hadron, a from-scratch
      distribution in the same organization.
    notes: >-
      The project describes itself four different ways on four official surfaces:
      "The Immutable OS to Operate at Scale" and "a Linux Framework" on the home
      page, "the open-source project that simplifies Edge, cloud, and bare metal
      OS lifecycle management ... distro agnostic" in the docs, "The immutable
      Linux meta-distribution for edge Kubernetes" in the repository description
      and the CNCF landscape, and "a meta-Linux Distribution" on the architecture
      page. Framework, meta-distribution and distro-agnostic project imply
      different adopter obligations, and no page reconciles them.

      The base-distribution picture has three non-agreeing tiers and this matters
      to a reader making a decision. The home page advertises seven bases. The
      docs page titled "Image support matrix" contains no matrix and says: "As a
      small open-source team, we now focus official prebuilt artifacts and docs
      defaults on Hadron", adding that the other flavor repositories "are no
      longer actively updated by the Kairos release pipeline". Every OS ISO in
      the v4.3.0 release is Hadron. The registry images for Alpine, Debian,
      Fedora, openSUSE and Rocky are frozen at v3.7.2 from February 2026, one
      major version behind.

      The build tool recognizes nine distributions in code. The release pipeline
      ships one. A reader of the home page would reasonably conclude they can
      pull a current Fedora or Alpine Kairos image, and they cannot.

      Hadron itself is pre-1.0 (v0.5.2 on the collection date; v0.5.3 followed
      on 2026-09-18), created in June 2025, musl plus systemd with vanilla
      kernels and no package manager, and its README says it is "Engineered by
      Spectro Cloud from the Kairos team". The v4.3.0 ISOs and the docs site
      version selector still carry Hadron v0.5.1. Hadron has its own profile,
      hadron.yaml, which records what is the base's (the kernel, the build, the
      hardening baseline, the shim, the governance of that repository) and marks
      what is this framework's as provided by Kairos. Read the two together: a
      Kairos-published artifact is both.
    evidence: DOCUMENTED
    sources:
      - url: https://kairos.io/docs/reference/image_matrix/
        type: official-docs
        title: Image support matrix
        retrieved: "2026-09-22"
        quote: >-
          As a small open-source team, we now focus official prebuilt artifacts
          and docs defaults on Hadron.
      - url: https://kairos.io/docs/architecture/meta/
        type: official-docs
        title: Meta-distribution architecture
        retrieved: "2026-09-22"
        quote: >-
          a meta-Linux Distribution, as its goal is to convert other distros to
          an immutable layout with Kubernetes Native components
      - url: https://github.com/kairos-io/kairos/releases/tag/v4.3.0
        type: release-notes
        title: v4.3.0 release assets (57 assets; every OS ISO is a Hadron v0.5.1 build)
        retrieved: "2026-09-22"
        quote: "kairos-hadron-v0.5.1-core-amd64-generic-v4.3.0.iso"
      - url: https://github.com/kairos-io/hadron
        type: source-repo
        title: Hadron
        retrieved: "2026-09-22"
        quote: "Hadron is Engineered by Spectro Cloud from the Kairos team."
    unknowns:
      - "Whether Alpine, Debian and Fedora remain supported bases. They appear on the home page, are in no ISO CI matrix, and their registry images are frozen at v3.7.2."

  d02_immutability:
    normalized:
      read_only:
        - /
      read_only_mechanism: "fixed-size ext2 file mounted read-only over loopback"
      ephemeral:
        - /var
        - /etc
        - /srv
      integrity_mechanism:
        - read-only-mount
      runtime_integrity_verification: "none"
      drift_detection: "none"
      immutability_can_be_disabled: true
      ephemeral_mechanism: overlay on tmpfs
      writable_and_persistent:
        - /usr/local
        - /oem
        - paths in PERSISTENT_STATE_PATHS (for example /home, /opt, /root, /etc/ssh and /var/log), bind-mounted from /usr/local/.state
      immutability_disable_where: the kernel command line (rd.immucore.disable or rd.immucore.debugrw)
      configurable_paths:
        value: 'yes'
        evidence: DOCUMENTED
        how: Add persistent bind mounts and ephemeral mounts in the install configuration (install.bind_mounts, install.ephemeral_mounts). The defaults come from cloud-config files that a later file can override.
        sources:
          - url: https://kairos.io/docs/architecture/immutable/
            type: official-docs
            title: Immutable architecture
            retrieved: '2026-10-12'
            quote: You can add additional paths to the persistent partition by using the bind_mounts configuration option.
          - url: https://kairos.io/docs/reference/configuration/
            type: official-docs
            title: Configuration reference, bind mounts
            retrieved: '2026-10-12'
            quote: bind mounts, can be read and modified, changes persist reboots
          - url: https://kairos.io/docs/reference/configuration/
            type: official-docs
            title: Configuration reference, ephemeral mounts
            retrieved: '2026-10-12'
            quote: ephemeral mounts, can be read and modified, changed are discarded at reboot
          - url: https://github.com/kairos-io/immucore/blob/98d6a52/README.md
            type: source-repo
            title: 'immucore README: disabling the immutable root'
            retrieved: '2026-10-12'
            quote: It disables the execution of any immutable rootfs module logic at boot.
      mounts_sources:
        - url: https://github.com/kairos-io/kairos/blob/d17464a/kairos-init/pkg/bundled/cloudconfigs/00_rootfs.yaml
          type: source-repo
          title: 'kairos-init: default rootfs layout, v4.3.0'
          retrieved: '2026-10-12'
          quote: 'RW_PATHS: "/var /etc /srv"'
        - url: https://github.com/kairos-io/immucore/blob/98d6a52/README.md
          type: source-repo
          title: 'immucore README: ephemeral overlay'
          retrieved: '2026-10-12'
          quote: an ephemeral overlay tmpfs filesystem is set in place. Ephemeral refers that changes to files or dirs in this filesystem will be lost upon reboot.
        - url: https://kairos.io/docs/architecture/immutable/
          type: official-docs
          title: 'Immutable architecture: default paths'
          retrieved: '2026-10-12'
          quote: /var - ephemeral /etc - ephemeral /srv - ephemeral / immutable
        - url: https://kairos.io/docs/architecture/immutable/
          type: official-docs
          title: 'Immutable architecture: persistent partition'
          retrieved: '2026-10-12'
          quote: /usr/local - persistent ( partition label COS_PERSISTENT) /oem - persistent ( partition label COS_OEM)
    summary: >-
      The root is a fixed-size ext2 file mounted read-only over loopback, not a
      squashfs and not a partition. Writable paths are overlayfs on tmpfs and are
      discarded on reboot. Persistence is by explicit bind mount from a separate
      partition.
    notes: >-
      There is no dm-verity and no runtime integrity verification of the OS root.
      Integrity is established at install and, under Trusted Boot, at boot
      through the UKI signature. On a non-UKI installation the root image carries
      no signature check after install. This is a real architectural difference
      from the verity-based systems in this survey and is recorded here rather
      than only under d10.

      There is no reconciliation loop. Drift is handled by discard-on-reboot for
      overlay paths only. Anything under /usr/local or a bind-mounted path drifts
      freely and nothing detects it.

      Immutability can be switched off at the kernel command line. The immucore
      README says of one such flag: "Note that this completely breaks the concept
      of an immutable root." These flags are documented only in a component
      README, not on the documentation site.

      The documentation and the shipped configuration disagree in several places,
      and one disagreement is dangerous rather than merely untidy. The docs still
      list /usr/libexec as a persistent bind mount. The shipped configuration
      removed it, with the comment that a path under /usr is owned by the image,
      so persisting it merges one slot's binaries into the other and breaks
      rollback. The published documentation therefore advertises a
      rollback-breaking configuration.

      Other recorded mismatches: overlay size is 25 percent in the shipped
      configuration and 20 percent in the component README, and unpublished on
      the documentation site; the writable-path list is three entries in the
      shipped configuration and seven in the README; the recovery image format is
      documented as squashfs and defaults to ext2 in code.

      The documentation states "after installation it's not possible to add
      additional packages to the system". System extensions contradict this: they
      extend /usr and persist across reboot and upgrade. Both statements are on
      the same site.

      Two hard limits appear only in source: a 3072 MiB ceiling on the root image
      and a 64 MiB OEM partition. Neither figure appears in the documentation.
    evidence: DOCUMENTED
    sources:
      - url: https://kairos.io/docs/architecture/immutable/
        type: official-docs
        title: Immutable architecture
        retrieved: "2026-09-22"
        quote: >-
          after installation it's not possible to add additional packages to the
          system, and any configuration change is discarded after reboot
      - url: https://github.com/kairos-io/kairos/blob/master/sdk/constants/constants.go
        type: source-repo
        title: SDK constants
        retrieved: "2026-09-22"
        quote: 'LinuxImgFs = "ext2"; ImgSize = uint(3072)'
      - url: https://github.com/kairos-io/kairos/issues/4304
        type: source-repo
        title: "/usr/libexec persistence breaks rollback"
        retrieved: "2026-09-22"
        quote: "Persisting /usr/libexec across A/B slots breaks rollback ABI compatibility"
      - url: https://kairos.io/docs/advanced/sys-extensions/
        type: official-docs
        title: System extensions
        retrieved: "2026-09-22"
        quote: "extend the /usr/ directory hierarchies with additional files"
    unknowns:
      - "The overlay tmpfs size, the root image size ceiling and the OEM partition size are not published in the documentation."
      - "Flags that disable immutability are documented only in a component README."

  d03_artifact:
    normalized:
      primary_artifact: oci-image
      derived_artifacts:
        - iso
        - raw-disk-image
        - uki
      oci_registry_distribution: true
      content_addressable: true
      mirrorable: true
      signed: sigstore-keyless-cosign
      air_gapped_upgrade: true
      air_gapped_build: unknown
      kernel_initrd_userspace_together: true
    summary: >-
      The OCI image is the primary artifact and everything else is derived from
      it. Kernel, initrd and userspace travel together in one image that is
      pulled and swapped atomically. Standard registries, standard tooling.
    notes: >-
      This is the cleanest OCI-native artifact model in the survey. The images
      are ordinary multi-architecture OCI indexes in ordinary registries, so
      mirroring, signing and content addressing come from the registry ecosystem
      rather than from project-specific infrastructure.

      Release signing was verified end to end during this research: a v4.3.0
      bundle is a genuine Sigstore bundle with a Fulcio certificate whose subject
      names the project's own release workflow at the v4.3.0 tag, with Rekor
      transparency log entries.

      The OCI rootfs is unpacked into the ext2 file described in d02. It is not
      run as a container.

      Three practical gaps. There is no mirroring guide: no recipe and no
      enumeration of which images a disconnected fleet needs. Raw disk images are
      not release assets because they exceed the GitHub per-file limit, and ship
      as OCI tags instead. Netboot needs a kernel, an initrd and a squashfs
      rootfs that are not shipped as standalone release assets.

      Air-gapped upgrade is documented, using a saved image tarball. Air-gapped
      building is not addressed anywhere, and it is the harder problem: the build
      tool requires the base distribution's package manager at build time.

      Images are published to two registries, one for releases and one for CI and
      for the Hadron bases. No documentation page explains the split.
    evidence: DOCUMENTED
    sources:
      - url: https://kairos.io/docs/architecture/container/
        type: official-docs
        title: Container-based architecture
        retrieved: "2026-09-22"
        quote: >-
          Bootable images are standard OCI artifacts that can be hosted in any
          container registry.
      - url: https://kairos.io/docs/architecture/immutable/
        type: official-docs
        title: Immutable architecture, static initrd
        retrieved: "2026-09-22"
        quote: >-
          to keep the entire OS stack confined as a single layer which gets
          pulled and swapped atomically during upgrades
      - url: https://kairos.io/docs/upgrade/manual/
        type: official-docs
        title: Manual upgrade, local OCI tarball source
        retrieved: "2026-09-22"
        quote: "sudo kairos-agent upgrade --source ocifile:/var/share/kairos-upgrade.tar"
      - url: https://kairos.io/docs/reference/image_matrix/
        type: official-docs
        title: Image matrix, raw image distribution
        retrieved: "2026-09-22"
        quote: >-
          Raw disk images ... are not attached to GitHub releases, because they
          exceed GitHub's 2 GiB per-file asset limit.
    unknowns:
      - "Air-gapped image building is not documented, and the build tool requires the base distribution's package manager at build time."
      - "No mirroring guide exists and no page enumerates the images a disconnected fleet needs."

  d04_upgrade:
    normalized:
      fleet_upgrade:
        self_update: "No self-update agent is documented. No timer or agent appears in the docs."
        paths:
          - kind: operator
            name: "kairos-operator"
            license: "Apache-2.0"
            class: open-source
            reconciliation: one-shot
            filter: true
            note: "Version v0.2.2. A NodeOpUpgrade is one run. Concurrency defaults to 0, which runs all target nodes at once. stopOnFailure defaults to false. The docs examples set concurrency 1 and stopOnFailure true. Cordon, drain and reboot are inside the operator."
            evidence: DOCUMENTED
            sources:
              - url: https://github.com/kairos-io/kairos-operator
                title: "kairos-operator repository"
                retrieved: "2026-10-06"
                quote: >-
                  A `NodeOpUpgrade` represents a **single upgrade run** on the target nodes.
              - url: https://github.com/kairos-io/kairos-docs/blob/main/docs/upgrade/kubernetes.md
                title: "Kairos docs: upgrade on Kubernetes"
                retrieved: "2026-10-06"
                quote: >-
                  The recommended approach is to use the Kairos operator
          - kind: suc
            name: "system-upgrade-controller Plans"
            license: "Apache-2.0"
            class: open-source
            status: "deprecated"
            filter: false
            note: "Deprecated for upgrades. The upgrade Plans were removed in kairos-docs commit 2483c15. A Plan for reset remains in docs/reference/reset.md. The reconciliation mode is inferred from the Plan model."
            evidence: INFERRED
            sources:
              - url: https://kairos.io/docs/upgrade/system-upgrade-controller/
                title: "Kairos docs: system-upgrade-controller"
                retrieved: "2026-10-06"
