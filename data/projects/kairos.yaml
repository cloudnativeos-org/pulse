          license: Apache-2.0
          org: kairos-io
          note: "Cluster API bootstrap and control-plane providers in one repository. v0.1.3 on 2026-09-17 (v0.1.2 on 2026-09-09 was current on the collection date), self-declared pre-1.0 with an API surface that may still change. First release 2026-05-18, so four months of release history. Bootstraps k0s and k3s through Kairos cloud-config, not kubeadm. Not documented on the site, which still lists Cluster API as coming soon."
        - name: cluster-api-provider-kairos-fleet
          repo: https://github.com/kairos-io/cluster-api-provider-kairos-fleet
          license: Apache-2.0
          org: kairos-io
          note: "Cluster API infrastructure provider. v0.1.3 on 2026-09-17 (v0.1.2 on 2026-09-09 was current on the collection date). It calls no IaaS API: it claims an already-enrolled node from an AuroraBoot fleet group and releases it when the machine is deleted. Single control plane only; replicas above 1 are documented as out of scope."
      commercial:
        - name: Spectro Cloud Palette Edge
          vendor: Spectro Cloud
