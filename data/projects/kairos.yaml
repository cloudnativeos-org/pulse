  d13_governance:
    normalized:
      license: Apache-2.0
      license_note: "A directory check on 2026-09-22 found no LICENSE or COPYING file in eight active public repositories in the organization (entangle, entangle-proxy, provider-microk8s, efi-key-enroller, hadron-firmware, hadron-layers, security, homebrew-kairos), plus several archived ones. Two repositories, go-ukify and osutil, are MPL-2.0."
      open_source: true
      open_governance: partial
      vendor_neutral_ownership: foundation-held
      foundation:
        name: CNCF
        level: Sandbox
        since: "2024-04-13"
      trademark_holder: "LF Projects, LLC"
      primary_commercial_sponsor: Spectro Cloud
      contributor_agreement: DCO
      contribution_diversity:
        method: >-
          git log against a freshly fetched origin/master of kairos-io/kairos,
          with the window fixed to end on 2026-09-22 so the count can be re-run.
          Bot and agent accounts are excluded by author email, using the
          pattern in the commands below. Human commits are then attributed to
          the primary sponsor by matching the author emails of the maintainers
          that the community repository's MAINTAINERS.md lists as Spectro Cloud
          employees. This method undercounts contributors who use personal
          addresses, which is why the cross-reference matters here. Merge
          commits are included in the totals. Commands, run from a clone after
          "git fetch origin". Set once: L="git log origin/master
          --format=%ae --since=2025-09-22T00:00:00+00:00
          --until=2026-09-22T00:00:00+00:00" and
          B='\[bot\]|ci-robbot|mudler-bot|agent|Copilot'.
          (1) all commits, twelve months: $L | wc -l;
          (2) bot and agent commits: $L | grep -c -E "$B";
          (3) human commits: $L | grep -v -E "$B" | wc -l;
          (4) distinct human authors: $L | grep -v -E "$B" | sort -u | wc -l;
          (5) six-month human commits: run $L with
          --since=2026-03-22T00:00:00+00:00 added at the end, pipe to
          grep -v -E "$B", then count with wc -l for the 430, or with
          grep -c -E
          '^(dimitris@|itxaka@|itxaka\.garcia@|mudler@|rishi@|contact@mauromorales\.com|mauro\.morales@spectrocloud\.com)'
          for the 406.
        value: >-
          Last twelve months, to 2026-09-22: 1710 total commits, 997 of them from
          bot and agent accounts (778 from the Renovate bot alone), leaving 713
          human commits across 34 distinct author addresses. Over the last six
          months, 406 of 430 human commits (about 94 percent) came from
          maintainers affiliated with the primary sponsor. The
          contributing-organizations file lists exactly one organization.
    summary: >-
      Apache-2.0, CNCF Sandbox since April 2024, assets held under LF Projects,
      DCO rather than a CLA, and a published governance document with a role
      ladder. Contribution and maintainership are concentrated in one company.
    notes: >-
      The four governance properties separate sharply here, and the honest
      reading is mixed. Open source: yes. Vendor-neutral ownership: yes, assets
      are foundation-held, which is more than three other projects in this
      edition can say. Open governance: partial. Contribution diversity: low.

      Open governance is partial rather than documented for concrete reasons. A
      governance document exists, with a Contributor to Approver to Maintainer to
      Admin ladder, nomination and voting for onboarding, and a three-month
      inactivity rule for offboarding. But it names no governance model, defines
      no conflict-resolution or escalation process, has no steering or technical
      oversight body, and says nothing about trademark or asset ownership. The
      voting thresholds are not in it: they live in a continuous-integration
      configuration file, where a maintainer vote requires a 100 percent pass
      threshold over four weeks. An adopter reading the governance document would
      not learn that.

      Maintainer affiliation, from the project's own published file: five of six
      maintainers and four of four administrators work for the primary sponsor,
      with the sixth maintainer at a different company. Both emeritus maintainers
      are from the same sponsor.

      The contributing-organizations file lists a single organization while
      asserting that development "is driven by a diverse set of contributors
      rather than a single vendor" and that contributing organizations "ensure
      that the project remains vendor-neutral". Its own table does not support
      that assertion, and the same document states the goal plainly: more than
      one contributing organization is needed.

      One composition note that a diversity figure would otherwise hide: a
      substantial share of recent commits come from AI agent and CI accounts
      operated by the same maintainers, and most currently open pull requests are
      from those accounts. The organization publishes shared conventions for AI
      coding agents. This is recorded as a fact about how the commit history is
      produced, because a raw commit count would otherwise be read as human
      activity.

      Five adopting organizations and three individuals are listed publicly.
    evidence: DOCUMENTED
    sources:
