open_questions:
  - "Does a node keep the previous fleet version locally, ready to boot, as R3 asks? AKS rolls a node pool back to the previous node image (N-1, seven days), but that replaces the nodes. No document says a node boots its previous slot, so R3 stays unknown."
  - "Does ACL fall back to the other /usr slot automatically after a failed boot, does AKS use the A/B slot at all, or does it always replace the node? Is a recovery path documented?"
  - "What is Trident's role on ACL, and does the shipped image include it?"
  - "Which Flatcar version is a shipping ACL node image built from, given that the repository documents a stable 4459.x pin?"
  - "Will ACL publish releases and a versioning strategy separate from AKS node image versions, and will the weekly images be traceable to the repository?"
  - "Which of ACL's divergences from Flatcar are permanent, and which will go upstream?"
  - "Can ACL be selected for an AKS Automatic node pool, and will it become the default there (Azure/AKS#5918)?"
  - "Where are SBOMs and provenance for ACL images published, and who owns the Secure Boot signing keys?"
  - "Is ACL supported on bare metal, on-premises hardware or another cloud?"
  - "Does Azure Support cover ACL nodes, and what is the ACL calendar support window?"
  - "How does an operator get a shell, a console or a debug container on an ACL node?"

