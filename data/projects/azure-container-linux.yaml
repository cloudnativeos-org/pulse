    summary: >-
      Secure Boot, a measured signed UKI, dm-verity on /usr and SELinux in
      enforcing mode are all on by default. FIPS and kdump are UKI addons that
      the operator turns on. SBOM and provenance publication are not documented.
    notes: >-
      The CVE process is shared with Azure Linux. Packages are scanned twice a
      day against the NVD, advisories are published in VEX format through MSRC,
      and an ACL node gets a fix only through the weekly node image. The
      vendor's CVE page promises "defined service level agreements (SLAs)" and
      states no numbers, so the targets are unknown.

      The SELinux document ships six container domains. container_t is the
      default and the document says not to pick spc_t just to silence denials.
      Operators can set permissive mode for troubleshooting.

      The vendor calls the build chain a "sovereign supply chain". That is a
      claim by the vendor, and the profile records it as one.

      Traceability is a stated gap. An outside user filed it in the ACL
      repository on 2026-08-08, and it is still open without replies. It says
      the weekly AKS images are not correlated with the releases in the
      repository. That is a request for a link between the two. It does not
      show that the repository has no release process (see d14).
