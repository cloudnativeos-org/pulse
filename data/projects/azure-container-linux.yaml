      A four-month-old repository and a four-month-old GA product built on an
      older upstream. Node images ship weekly. The repository publishes no
      release, and no ACL-specific support window is stated.
    notes: >-
      Dates. The repository was created on 2026-05-21. A comment on the ACL
      announcement issue in the AKS tracker states general availability on
      2026-06-02. The newest
      node image note is 202609.23.0.

      The cadence is read from the dates in the node image note filenames. The
      directory held ten notes on 2026-10-05, and older notes may exist or may
      have been removed, which the profile did not check.

      The repository has no GitHub release. Its contributing guide lists a
      release/3.0 branch as the "Staging branch for publishing", and that branch
      has recent commits, so a publishing path exists and is not documented
      further. It has one signed tag,
      stable-4459.2.4, dated 2026-03-03, which is before the repository
      was created. The tag name follows Flatcar's stable numbering.
      The build guide targets Flatcar stable 4459.2.2 (its text says
      "Currently targeting"), and the Flatcar profile records stable 4757.2.0
      on 2026-09-14. So the repository's documented upstream pin is
      substantially older than the current Flatcar stable. Which Flatcar
      version a shipping node image is built from is not stated anywhere found.

      The top-level CHANGELOG.md is empty, and a changelog directory holds
      entries in four categories (changes, bugfixes, security, updates) in
      Flatcar's format. An outside issue asks for a documented release and
      versioning strategy.

      Support: the repository's SUPPORT.md says support for ACL "is limited to
      the resources listed above", meaning GitHub issues and the docs. The Azure
      Linux support page describes Azure Support for production workloads and
      does not mention ACL, so the profile does not state whether Azure Support
      covers ACL nodes.

      On 2026-12-10 AKS retires Azure Linux with OS Guard (preview) and names
      ACL as the migration target. This is a note about a neighbouring product,
      not an entry in the dataset.
