schema_version: "1.0.0"
edition: "2026"
id: azure-container-linux
name: Azure Container Linux (ACL)
homepage: https://learn.microsoft.com/en-us/azure/azure-linux/azure-container-linux-overview
repository: https://github.com/microsoft/azure-container-linux
collected_at: "2026-10-05"

entry_kind:
  - distribution
  - platform-os

category_fit:
  comparable: partial
  note: >-
    ACL is an immutable, image-based container host, so it belongs to the same
    category as the rest of this survey and is comparable on all fourteen
    dimensions. It is "partial" because three things narrow the comparison.

    First, most of its architecture is Flatcar's. Microsoft documents it as
    derived from Flatcar Container Linux, and this profile records the places
    where the ACL source says that is true, and the places where it differs. It
    does not copy Flatcar facts across. Where ACL's own sources are silent, the
    field is "unknown", not the Flatcar value.

    Second, ACL has no release channel of its own. The repository publishes no
    GitHub releases, and ACL versions surface as AKS node image versions (d14).

    Third, fleet management and support are AKS services, not properties of the
    operating system (d12, d14).

    Support scope is Azure. The documented platforms are Azure and a QEMU/KVM
    development target (d08).
  dimensions_not_applicable: []

self_description:
  text: >-
    Azure Container Linux (ACL) is a hardened, immutable, container host
    operating system built for Azure Kubernetes Service (AKS).
  source:
    url: https://github.com/microsoft/azure-container-linux/blob/aclmain/README.md
    type: source-repo
    title: microsoft/azure-container-linux README
    retrieved: "2026-10-05"
    quote: >-
      Azure Container Linux (ACL) is a hardened, immutable, container host
      operating system built for Azure Kubernetes Service (AKS).

version_observed:
  version: "3.0.20260809 (os-release), in AKS node image 202609.23.0"
  released: "2026-09-23"
  channel: "AKS node image, weekly"
  method: >-
    The newest file in the AKS repository's vhd-notes/AzureContainerLinuxv3
    directory, read through the GitHub contents API on 2026-10-05. The VHD note
    for 202609.23.0 records the build start (2026-09-23 00:30 UTC), the
    os-release VERSION field and the kernel (6.6.150.1-1.azl3). The release date
    is the build date in that note. The ACL repository has no GitHub release to
    read instead (d14).
  source:
    url: https://github.com/Azure/AKS/blob/master/vhd-notes/AzureContainerLinuxv3/202609.23.0.txt
    type: release-notes
    title: AKS VHD notes, Azure Container Linux 202609.23.0
    retrieved: "2026-10-05"
    quote: 'PRETTY_NAME="Microsoft Azure Container Linux 3.0.20260809"'
  additional_channels: []

taxonomy:
  workload_scope: kubernetes-oriented-host
  construction_model:
    - vendor-fixed-image
  root_state_substrate:
    - ab-partition-image
  notes: >-
    ACL is documented as a node OS for AKS and does not bundle Kubernetes, so it
    is a host and not an appliance. The published artifacts are vendor-built
    images: the AKS node image and an Azure Marketplace image. The repository
    also carries build tooling, but its own issue tracker records that no
    comprehensive build documentation exists yet (d06), so the profile does not
    claim a derivation model.

    The A/B layout (USR-A and USR-B, each with a verity hash partition) is
    documented in the ACL repository. The root state substrate is recorded from
    that layout. Whether any shipping update path switches between the two slots
    is a separate question, answered in d04.

dimensions:
  d01_os_model:
    normalized:
      workload_scope: kubernetes-oriented-host
      ships_kubernetes: false
      immutable: true
      package_manager_at_runtime: false
    summary: >-
      A Microsoft-maintained immutable container host, derived from Flatcar
      Container Linux and built from Azure Linux 3.0 RPM packages. It is
      documented as the node OS for AKS, and a Marketplace VM image exists.
    notes: >-
      The lineage is stated by Microsoft in three places and is consistent. The
      Learn overview says ACL is "derived from the Flatcar Container Linux
      project". The repository README says it is built from Azure Linux packages
      and inherits "core design principles and image composition SDK" from
      Flatcar. The architecture document says it replaces the Portage build with
      Azure Linux 3.0 RPMs.

      The shipped os-release agrees: ID=azurelinux, ID_LIKE="flatcar", and a
      version in the Azure Linux 3.0 numbering (3.0.20260809), not a Flatcar
      version number.

      The production image does not embed Docker. containerd is baked in as an
      embedded system extension, and Docker is a separate, optional one (d06).
    evidence: DOCUMENTED
    sources:
      - url: https://learn.microsoft.com/en-us/azure/azure-linux/azure-container-linux-overview
        type: vendor-docs
        title: Azure Container Linux overview
        retrieved: "2026-10-05"
        quote: >-
          ACL is derived from the Flatcar Container Linux project, building on
          Flatcar's proven, container-first immutable design while layering in
          Azure Linux packages, servicing, and platform integration.
      - url: https://github.com/microsoft/azure-container-linux/blob/aclmain/README.md
        type: source-repo
        title: microsoft/azure-container-linux README
        retrieved: "2026-10-05"
        quote: >-
          while inheriting core design principles and image composition SDK from
          the Flatcar Container Linux project
      - url: https://github.com/microsoft/azure-container-linux/blob/aclmain/acl/docs/architecture.md
        type: source-repo
        title: ACL architecture
        retrieved: "2026-10-05"
        quote: >-
          Package installation uses RPMs sourced from Azure Linux repositories
          instead of Portage ebuilds.
      - url: https://github.com/Azure/AKS/blob/master/vhd-notes/AzureContainerLinuxv3/202609.23.0.txt
        type: release-notes
        title: AKS VHD notes, Azure Container Linux 202609.23.0
        retrieved: "2026-10-05"
        quote: ID_LIKE="flatcar"

  d02_immutability:
    normalized:
      immutable: true
      integrity_mechanism: ["dm-verity"]
      verity_failure_policy: "panic-on-corruption"
      runtime_package_install: false
      mandatory_access_control: selinux-enforcing
      read_only:
        - /usr
      read_only_mechanism: btrfs filesystem under dm-verity
      writable_and_persistent:
        - /etc (overlay, upper layer persisted on the ROOT partition)
        - the rest of the ROOT partition (the documents do not list which paths)
      configurable_paths:
        value: 'yes'
        evidence: DOCUMENTED
        how: Ignition can format and mount additional disks and set up mount points at first boot. The read-only /usr is fixed.
        sources:
          - url: https://github.com/microsoft/azure-container-linux/blob/4dd4f8b/acl/docs/architecture.md
            type: source-repo
            title: 'Azure Container Linux architecture: Ignition'
            retrieved: '2026-10-12'
            quote: Format and mount additional disks.
      mounts_sources:
        - url: https://github.com/microsoft/azure-container-linux/blob/4dd4f8b/acl/docs/architecture.md
          type: source-repo
          title: 'Azure Container Linux architecture: the /usr partition'
          retrieved: '2026-10-12'
          quote: The `/usr` partition (USR-A) is a read-only btrfs filesystem with zstd compression.
        - url: https://github.com/microsoft/azure-container-linux/blob/4dd4f8b/acl/docs/architecture.md
          type: source-repo
          title: 'Azure Container Linux architecture: the /etc overlay'
          retrieved: '2026-10-12'
          quote: '**Upper (writable)**: persisted on the ROOT partition.'
    summary: >-
      /usr is a read-only btrfs filesystem under dm-verity with a signed root
      hash, and corruption causes a kernel panic. /etc is an overlay whose lower
      layer comes from /usr and whose upper layer persists on ROOT.
    notes: >-
      This is the mechanism the Flatcar profile records, and the ACL source
      states each part of it independently. The verity hash tree sits in its
      own partition (HASH-A after USR-A) and the slot-specific verity
      parameters travel in a per-slot systemd-stub addon, not in the shared
      kernel command line. The architecture document changed on 2026-10-02 to
      say this. Before that date it described the hash tree as appended to the
      USR partition and the parameters as embedded in the UKI. A reader who
      compares older copies of the document will see the difference.

      "Immutable" covers /usr only. State on ROOT persists, so ROOT can drift,
      and rollback reverts /usr but not ROOT (see d05).

      One operational friction is on record. An AKS user reported on
      2026-09-17 that the Azure CNI installer cannot rename binaries under
      /opt/cni/bin on an ACL node because the filesystem is read-only. An AKS
      engineer replied that it is a known issue and that a fix is in
      progress. The report does not say why the path is read-only, so the
      profile records the symptom and not a cause.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/microsoft/azure-container-linux/blob/aclmain/acl/docs/architecture.md
        type: source-repo
        title: ACL architecture, dm-verity for /usr and the /etc overlay
        retrieved: "2026-10-05"
        quote: >-
          Any corruption of `/usr` causes an immediate kernel panic, preventing
          the system from running a tampered image.
      - url: https://learn.microsoft.com/en-us/azure/azure-linux/azure-container-linux-overview
        type: vendor-docs
        title: Azure Container Linux overview, key features
        retrieved: "2026-10-05"
        quote: >-
          The '/usr' directory is mounted as a read-only volume protected by
          dm-verity. At runtime, the kernel validates a signed root hash to
          detect and block tampering
      - url: https://github.com/microsoft/azure-container-linux/commit/6adc59d7c164456f8203b2651f787ccca8764331
        type: source-repo
        title: "feat: enable ABUpdate for UKI-based ACL images (#28)"
        retrieved: "2026-10-05"
        quote: "Slot-specific verity parameters are not baked into this shared command line"
      - url: https://github.com/Azure/AKS/issues/5971
        type: announcement
        title: "[BUG] Azure-CNS daemonset container cni-installer fails to reach Ready state after pod restart on Azure Container Linux (ACL) due to read-only /opt/cni/bin"
        retrieved: "2026-10-05"
        quote: "failed to rename the /opt/cni/bin/azure-vnet to /opt/cni/bin/azure-vnet.old: rename /opt/cni/bin/azure-vnet /opt/cni/bin/azure-vnet.old: read-only file system"
    unknowns:
      - "Which paths other than /usr are read-only on a running ACL node, and why /opt/cni/bin is one of them."

