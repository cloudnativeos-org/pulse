  d04_upgrade:
    normalized:
      fleet_upgrade:
        self_update: "The OS has no update agent of its own. AKS acts when the node OS upgrade channel is NodeImage."
        paths:
          - kind: managed-service
            name: "AKS NodeImage channel"
            license: "service"
            class: service
            reconciliation: replacement
            filter: true
            note: "AKS replaces nodes with a new weekly VHD when the NodeImage channel is set."
            evidence: DOCUMENTED
            sources:
              - url: https://github.com/MicrosoftDocs/azure-aks-docs/blob/main/articles/aks/includes/azure-container-linux-limitations.md
                title: "Azure Container Linux limitations (azure-aks-docs)"
                retrieved: "2026-10-06"
                quote: >-
                  `NodeImage` and `None` are the only supported ... OS upgrade channels. `Unmanaged` and `SecurityPatch` are incompatible with ACL due to the immutable `/usr` directory.
              - url: https://learn.microsoft.com/en-us/azure/aks/auto-upgrade-node-os-image
                title: "Auto-upgrade node OS images (AKS)"
                retrieved: "2026-10-06"
      version_identity:
        identifier: "AKS node image version and os-release VERSION"
        condition: "No optional system extensions beyond those baked into the image."
        evidence: DOCUMENTED
        sources:
          - url: https://github.com/microsoft/azure-container-linux/blob/aclmain/build_library/set_lsb_release
            type: source-code
            title: "ACL build_library/set_lsb_release"
            retrieved: "2026-10-06"
          - url: https://github.com/microsoft/azure-container-linux/blob/aclmain/acl/docs/sysexts.md
            type: official-docs
            title: "ACL system extensions"
            retrieved: "2026-10-06"
            quote: >-
              ACL uses **systemd-sysext** squashfs images to deliver optional functionality on top of the read-only `/usr` partition.
      mechanism:
        - image-replacement-redeploy
        - ab-partition-switch
      scope_by_mode:
        AKS node image: whole-node
        In-node A/B: usr-only
      scope_note: On AKS, ACL supports only full node image updates. The repository documents an in-node A/B /usr slot that Trident switches; no source says AKS uses it.
      scope_sources:
        - url: https://learn.microsoft.com/en-us/azure/azure-linux/azure-container-linux-overview
          type: vendor-docs
          title: Azure Container Linux overview, versioning
          retrieved: '2026-10-06'
          quote: ACL currently only supports full node image updates.
        - url: https://github.com/microsoft/azure-container-linux/blob/6adc59d/acl/docs/architecture.md
          type: source-repo
          title: ACL architecture, A/B slots
          retrieved: '2026-10-06'
          quote: Trident switches slots by swapping which addon is active in `<uki>.efi.extra.d/`, so the same signed UKI boots either A or B.
      mechanism_in_use_on_aks: "image-replacement-redeploy"
      initiator: aks-node-image-upgrade
      requires_kubernetes: true
      requires_vendor_infrastructure: true
      self_hostable_update_server: unknown
      self_hostable_update_server_evidence: UNKNOWN
      self_hostable_update_server_note: "The documented update path is the AKS weekly node image, published by Microsoft. No page found says whether an operator can host an update source."
      self_hostable_update_server_searched: "Read on 2026-10-05: the ACL overview on Microsoft Learn, the ACL migration and CVE pages, microsoft/azure-container-linux README and acl/docs/architecture.md, and the microsoft/trident README. None names an update server, a mirror, or a self-hosting path. The overview scopes ACL to AKS node images."
      artifact_verification: "signed unified kernel image"
      supported_upgrade_channels: ["NodeImage", "None"]
      unsupported_upgrade_channels: ["SecurityPatch", "Unmanaged"]
    summary: >-
      On AKS, ACL updates by full node image replacement on a weekly image
      cadence. No in-place package update exists. The image also carries an A/B
      slot design, but no source says that AKS uses it.
    notes: >-
      The AKS documentation is explicit about the AKS path. ACL "currently only
      supports full node image updates", and only the NodeImage and None
      upgrade channels work, because the SecurityPatch and Unmanaged channels
      depend on in-place patching that an immutable /usr rules out. A CVE fix
      therefore reaches a node only through a new node image.

      The A/B mechanism is documented in the ACL repository, and it is young.
      The architecture document says a new image is written to the inactive
      slot, verified, then switched atomically on reboot, and that a component
      named Trident switches slots by swapping a systemd-stub addon. The commit
      that enabled A/B update for UKI-based ACL images was merged on
      2026-10-02, three days before this profile was written. The document does
      not define Trident. The Trident repository describes itself as an "Azure
      Linux servicing agent". Whether AKS runs it on ACL nodes is not stated
      anywhere found.

      The same pattern is on record for Flatcar on AKS, where the vendor page
      says Flatcar's built-in A/B update was disabled in favour of full node
      image updates (see the flatcar profile). No ACL source says the same, so
      the profile does not assume it.
    evidence: DOCUMENTED
    sources:
      - url: https://learn.microsoft.com/en-us/azure/azure-linux/azure-container-linux-overview
        type: vendor-docs
        title: Azure Container Linux overview, versioning
        retrieved: "2026-10-05"
        quote: ACL currently only supports full node image updates.
      - url: https://learn.microsoft.com/en-us/azure/azure-linux/tutorial-migrate-azure-container-linux-aks
        type: vendor-docs
        title: "Tutorial: migrate existing nodes to ACL, considerations and limitations"
        retrieved: "2026-10-05"
        quote: >-
          NodeImage and None are the only supported operating system (OS)
          upgrade channels. Unmanaged and SecurityPatch are incompatible with
          ACL due to the immutable /usr directory.
      - url: https://learn.microsoft.com/en-us/azure/azure-linux/manage-cves
        type: vendor-docs
        title: Manage CVEs
        retrieved: "2026-10-05"
        quote: >-
          ACL is an immutable, image-based operating system (OS); individual
          packages aren't updated in place.
      - url: https://github.com/microsoft/azure-container-linux/blob/aclmain/acl/docs/architecture.md
        type: source-repo
        title: ACL architecture, dm-verity for /usr
        retrieved: "2026-10-05"
        quote: >-
          The A/B partition scheme (USR-A / USR-B) enables safe updates: the
          inactive slot is written, verified, and then atomically switched on
          reboot.
      - url: https://github.com/microsoft/trident
        type: source-repo
        title: microsoft/trident
        retrieved: "2026-10-05"
        quote: Azure Linux servicing agent - security focused install, provisioning, and update
    unknowns:
      - "Whether AKS uses the A/B slot switch on ACL nodes, or replaces the whole node."
      - "Whether Trident is a component of the shipped ACL image, and who runs it."
      - "Whether the update payload can be verified or served outside the AKS service."

  d05_rollback_recovery:
    normalized:
      rollback_to_previous: unknown
      automatic_rollback_on_boot_failure: unknown
      retained_versions: 2
      recovery_environment: unknown
      factory_reset: unknown
      network_independent_recovery: unknown
      aks_node_image_downgrade: "available at node-pool level since the AKS page 'Roll back node pool versions': back to the previous node image version (N-1), within seven days, and it replaces the nodes"
      aks_os_sku_rollback: "available at node-pool level, by reimaging to the previous OS SKU"
    summary: >-
      The ACL sources document a two-slot layout, but no source describes how an
      operator or the platform returns a node to the previous slot, or whether a
      failed boot falls back automatically. The documented rollback is coarser:
      a node pool can be reimaged to its previous OS SKU.
    notes: >-
      The test list in the ACL repository includes A/B update lifecycle tests,
      which fits a working slot design, but it is a test category name and not
      a description of rollback behaviour. The profile does not infer rollback
      from it.

      AKS documents that a node image version cannot be downgraded. That
      statement is generic to AKS node images and its examples are Ubuntu, so
      it is recorded as the AKS-level rule and not as an ACL finding.

      The one documented reversal is the OS SKU rollback in the ACL migration
      tutorial. If an in-place migration to ACL causes problems, the operator
      changes the OS SKU back to the previous value and AKS reimages the node
      pool. That reverts the operating system kind. It is not a rollback to the
      previous ACL image.
    evidence: DOCUMENTED
    sources:
      - url: https://learn.microsoft.com/en-us/azure/azure-linux/tutorial-migrate-azure-container-linux-aks
        type: vendor-docs
        title: "Tutorial: migrate existing nodes to ACL, rolling back"
        retrieved: "2026-10-05"
        quote: >-
          If you experience issues during the OS SKU migration, you can roll
          back to your previous OS SKU.
      - url: https://learn.microsoft.com/en-us/azure/aks/upgrade-node-image
        type: vendor-docs
        title: Upgrade the node image
        retrieved: "2026-10-05"
        quote: You can't downgrade a node image version
      - url: https://github.com/microsoft/azure-container-linux/blob/aclmain/acl/docs/testing.md
        type: source-repo
        title: ACL testing
        retrieved: "2026-10-05"
        quote: "`cl.update.*` — A/B update lifecycle"
    unknowns:
      - "Whether ACL falls back automatically to the other /usr slot after a failed boot, and on what trigger."
      - "Whether an operator can switch slots by hand, and with what tool."
      - "Whether a recovery environment, a factory reset or an offline recovery procedure exists for ACL. None is documented."
      - "Whether rollback reverts state on ROOT. The layout suggests it does not, but no source says so."

  d06_customization:
    normalized:
      runtime_package_install: false
      mechanisms:
        - ignition-at-first-boot
        - systemd-sysext
        - uki-addons
        - image-customizer
        - build-from-source
      customization_points:
        - image-build
        - provisioning
        - runtime
      documented_limits:
        - "Individual packages are not updated in place; a CVE fix needs a new image."
        - "Docker is not embedded; it is an optional, standalone system extension."
        - "kdump ships disabled; enabling it means copying a signed UKI addon per kernel version, and a kernel update silently turns it off again."
        - "ACL requires Trusted Launch, so a UKI addon must be signed by a key in the Secure Boot db."
      add_software:
      - kind: systemd-sysext
        how: Sysext images merge over the read-only /usr. The image carries a containerd sysext. Standalone sysexts for NVIDIA drivers and Docker are downloaded on demand.
        evidence: DOCUMENTED
        sources:
        - url: https://github.com/microsoft/azure-container-linux/blob/4dd4f8b3b53d2aef5f342ffad5a0ce304c26c9ab/acl/docs/sysexts.md
          type: source-repo
          title: 'ACL docs: System Extensions (sysexts)'
          retrieved: '2026-10-12'
          quote: squashfs images to deliver optional functionality on top of the read-only
        - url: https://github.com/microsoft/azure-container-linux/blob/4dd4f8b3b53d2aef5f342ffad5a0ce304c26c9ab/acl/docs/sysexts.md
          type: source-repo
          title: 'ACL docs: System Extensions (sysexts)'
          retrieved: '2026-10-12'
          quote: sysexts are built separately and downloaded on demand.
      - kind: derive-image
        how: Run the Azure Linux Image Customizer on an existing ACL image. The project's guide uses it to preload container images with a script that runs in a chroot on the image.
        evidence: DOCUMENTED
        sources:
        - url: https://github.com/microsoft/azure-container-linux/blob/4dd4f8b3b53d2aef5f342ffad5a0ce304c26c9ab/acl/docs/containerd-image-preload.md
          type: source-repo
          title: 'ACL docs: Preloading Container Images into an ACL Image'
          retrieved: '2026-10-12'
          quote: This guide shows how to bake OCI container images into the containerd content store of an existing Azure Container Linux (ACL) image
    summary: >-
      Customization is by Ignition at first boot, system extensions on the
      read-only /usr, signed UKI addons for boot options, and image-time changes
      with the Azure Linux Image Customizer. Installing a package on a running
      node is not a supported path.
    notes: >-
      Base system extensions are baked in (containerd and the per-platform OEM
      package). Standalone ones are downloaded on demand: the NVIDIA GPU set
      (CUDA, vGPU, container toolkit, fabric manager) from Microsoft Artifact
      Registry, and Docker. Sysexts are declared in a sysexts.yaml with a
      required mode field, either embedded or standalone.

      UKI addons add boot behaviour without a rebuild. The architecture lists
      four: first boot, OEM selection, FIPS and kdump.

      Image-time customization has a documented recipe. The preload guide uses
      the Image Customizer to bake OCI images into the containerd store. It is a
      repository guide, so it is a documented technique and not a stated
      support boundary.

      The repository has an RPM image build guide, but ACL's own issue tracker
      has an open request (opened 2026-08-08, no replies) for "comprehensive"
      build documentation, system requirements and a release and versioning
      strategy. The build path exists and its support status is not stated.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/microsoft/azure-container-linux/blob/aclmain/acl/docs/sysexts.md
        type: source-repo
        title: ACL system extensions
        retrieved: "2026-10-05"
        quote: >-
          ACL uses **systemd-sysext** squashfs images to deliver optional
          functionality on top of the read-only `/usr` partition.
