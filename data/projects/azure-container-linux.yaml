      General availability is a support statement and not a placement
      statement. The vendor says ACL "is generally available (GA) as an OS
      option on AKS". The AKS node pool documentation says that without an OS
      SKU, "AKS defaults to Ubuntu". The AKS Automatic comparison table
      preconfigures the system node pool to Azure Linux, the mutable
      distribution, and offers Azure Linux or Ubuntu for user nodes. It does not
      list ACL. Azure/AKS#5918, opened 2026-08-12 and still open, asks for ACL
      to become the AKS Automatic default, which confirms that it is not today.

      Requirement is "optional" because the ACL documentation describes AKS use
      and the repository documents a Marketplace image for virtual machines. No
      source describes a self-managed Kubernetes distribution on ACL, so the
      profile lists AKS as the only documented distribution.

      Lifecycle independence is "partial". Node OS image upgrades on AKS do not
      change the cluster's Kubernetes version. The two clocks are still tied at
      the start: ACL is available only from AKS 1.34.

      Pod Sandboxing, confidential VMs and Artifact Streaming are all listed as
      unsupported. An existing cluster that uses one of them may be unable to
      add an ACL node pool. On Arm64, ACL requires Cobalt-based (v6) VM sizes
      for Trusted Launch.
