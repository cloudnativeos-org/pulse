      both still open with no comments. One asks for build documentation and the
      other for traceability. The sample is too small to show how maintainers
      respond to outside requests.

      The README announces recurring community calls through 2027-05-27, run by
      the Azure Linux team and shared with Azure Linux.

      Both ACL and Flatcar document an upstream relationship. The architecture
