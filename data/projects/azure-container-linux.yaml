tradeoffs:
  buys:
    - "An immutable /usr under dm-verity, a signed and measured boot chain, and SELinux enforcing, all on by default on an AKS node pool."
    - "A weekly node image cadence, with CVE fixes delivered the same way, so a node never drifts from a known image."
    - "Built from Azure Linux RPMs, so Microsoft's CVE pipeline covers every package in the image."
    - "An immutable choice that is first-party to AKS, with a documented in-place migration from Ubuntu or Azure Linux and a documented route back."
    - "NVIDIA GPU support delivered as system extensions, kept off the read-only /usr."
  costs:
    - "Several AKS features do not work with ACL: Pod Sandboxing, confidential VMs, Artifact Streaming, Generation 1 VMs, and the SecurityPatch and Unmanaged upgrade channels."
    - "Trusted Launch is required, so some VM sizes are out, and Arm64 needs Cobalt-based sizes."
    - "Governance is a single vendor team."
    - "An open AKS bug reports that the Azure CNI installer cannot update binaries under a read-only /opt/cni/bin."
    - "Support and fleet management are Azure services, and the documented platforms are Azure and a QEMU development target."
maintainers_fact:
  text: "Single vendor."
  evidence: DOCUMENTED
  sources:
    - url: "https://github.com/microsoft/azure-container-linux/blob/aclmain/.github/CODEOWNERS"
      type: "governance-doc"
      title: "CODEOWNERS"
