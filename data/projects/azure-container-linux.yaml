          type: source-code
          title: 'azure-container-linux: per-slot verity addon'
          retrieved: '2026-10-06'
          quote: slot-specific verity params are delivered via a per-slot systemd-stub addon
      secure_boot: "required, through Trusted Launch"
      measured_boot: "signed UKI measured into the vTPM"
      tpm: "vTPM required"
      integrity: "dm-verity on /usr, panic on corruption"
      artifact_verification: "signed unified kernel image"
      sbom: unknown
      provenance: "unknown; an open issue asks for traceability from the weekly AKS images to the repository"
      fips: "available as a UKI addon; the 2026-09-23 node image has FIPS disabled"
      mandatory_access_control: selinux-enforcing
      default_on:
        - selinux-enforcing
