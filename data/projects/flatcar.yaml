tradeoffs:
  buys:
    - "A/B on /usr with dm-verity and bootloader-tracked boot attempts gives automatic, local, network-independent rollback of the OS without a management plane."
    - "The update path is fully self-hostable. Nebraska removes any dependency on project-hosted infrastructure, including the payloads, and air-gapped fleet operation is a supported configuration."
    - "A conventional systemd userspace with SSH, a shell and toolbox means existing Linux operational knowledge transfers directly, and debugging does not depend on Kubernetes being healthy."
    - "Foundation-held assets, a published governance document with defined voting thresholds, and a public maintainer council."
    - "Per-release SBOM, licence manifest, package list and kernel config, plus signed artifacts and a stated SLSA Level 3 position with its remaining gaps listed."
    - "Cluster API support through upstream components (Apache-2.0), with no Flatcar-specific provider: the kubeadm bootstrap provider renders Ignition for it, as an alpha feature behind a gate, image-builder has Flatcar targets on ten platforms, and CAPA, CAPZ, CAPO and CAPV ship Flatcar cluster flavors."
  costs:
    - "A/B covers /usr only. The writable root holding /etc, /opt and /var is not rolled back, so a bad configuration change survives an OS rollback."
    - "Secure Boot is incomplete: the shim is not signed by the third-party UEFI CA, and the documentation has no Secure Boot page. The work has been tracked for four years."
    - "Sysexts that link against Flatcar libraries must pin VERSION_ID and then stop loading after an OS update, which pushes rebuild-and-revalidate work onto the adopter on every OS bump."
    - "amd64 and arm64 only. No riscv64, with the request open since 2024."
    - "The LTS channel's live state does not match its published policy, and the documentation offers no single source of truth for which channels are currently available."
    - "Documentation contradicts itself in at least three places: what is read-only, whether TPM 2.0 is supported, and whether a support-bundle tool exists."
    - "Nine of sixteen maintainers list Microsoft."
