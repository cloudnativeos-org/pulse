  d10_security:
    normalized:
      boot_trust_chain:
        level: 3
        how: opt-in
        route: verity-root-hash-in-signed-artifact
        artifact: signed kernel
        note: 'Flatcar signs with its own key, which you enrol. The /usr root hash is written into the kernel
          before it is signed. Caveat from the code: GRUB always reads an unsigned OEM grub.cfg that can add
          kernel arguments, so the code does not show that /usr verity cannot be bypassed'
        evidence: INFERRED
        inferred_from: flatcar/scripts build_image_util.sh writes the hash into the kernel image before signing;
          build_library/grub.cfg line 27 sets secure_boot="0" and sources the OEM grub.cfg
        sources:
        - url: https://github.com/flatcar/scripts/blob/2bda3aa36db92f282ecb1981d6191fc97d8e7608/build_library/build_image_util.sh#L786-L798
          type: source-code
          title: flatcar/scripts build_image_util.sh
          retrieved: '2026-10-06'
          quote: Root hash injection works by writing the hash value to a known unused SHA256-sized location in the kernel image.
        - url: https://github.com/flatcar/scripts/blob/2bda3aa36db92f282ecb1981d6191fc97d8e7608/build_library/grub.cfg#L27
          type: source-code
          title: flatcar/scripts grub.cfg
          retrieved: '2026-10-06'
          quote: set secure_boot="0"
      secure_boot: partial
      measured_boot: available
      tpm: available
      integrity: dm-verity
      integrity_scope: /usr
      disk_encryption: luks-opt-in
      artifact_verification: gpg-detached-signature
      sbom: published-per-release
      provenance: slsa-level-3-claimed
      fips: compliance-configuration-not-certified
      mandatory_access_control: selinux-available
      default_on:
        - dm-verity
        - update-payload-verification
        - release-artifact-signing
      opt_in:
        - luks-disk-encryption
        - fips-mode
    summary: >-
      dm-verity on /usr, signed release artifacts and verified update payloads
      are on by default. Secure Boot is the incomplete part: signed shim and GRUB
      ship, but under a Flatcar-held key rather than the third-party UEFI CA, so
      an operator must enrol it.
    notes: >-
      The Secure Boot position needs stating precisely. Signed shim and GRUB
      artifacts are published with every release, kernel lockdown in integrity
      mode is enabled when Secure Boot is on, and NVIDIA and ZFS sysext modules
      are signed so they load under it. What is missing is a shim signed by the
      Microsoft third-party UEFI CA. A maintainer stated in June 2025 that the
      shim-review submission was blocked on a legal or procedural issue. The
      tracking request has been open since September 2021. There is no Secure
      Boot page anywhere in the security documentation.

      Measured boot records PCRs 9 to 13 and a PCR policy bundle ships per
      release. The documentation is internally inconsistent on TPM: the
      trusted-computing page still says TPM 1.2 with TPM 2.0 "to be added", while
      the LUKS page says TPM2-backed root encryption is supported from 3913.0.1.
      The LUKS page is the current one.

      LUKS supports systemd-cryptenroll (PCR 7 by default) and Clevis with TPM or
      Tang. The documented caveats are substantial: GRUB PCR values are not
      predictable for a given version and must be observed locally, full PCR
      binding works reliably only with auto-updates disabled, OEM extensions
      are read from the OEM partition without creating measurements, and the
      strongest binding is labelled experimental.

      FIPS is honestly scoped by the project: not certified, but deployable in
      compliance with FIPS 200 and 140-2 from 3185.0.0, with named caveats
      (argon2id LUKS KDF, some SSH ciphers).

      SLSA Level 3 is claimed, with per-package provenance for most image
      packages, and the same page openly lists the remaining gaps: hermetic
      builds, TPM integration for secure boot chains, and multi-administrator
      approval.
    evidence: DOCUMENTED
    sources:
      - url: https://www.flatcar.org/docs/latest/security/supply-chain/
        type: official-docs
        title: Supply chain security
        retrieved: "2026-09-22"
        quote: Our assessment is that Flatcar complies with SLSA Level 3.
      - url: https://github.com/flatcar/Flatcar/issues/501
        type: maintainer-statement
        title: "[RFE] Support Secure Boot"
        retrieved: "2026-09-22"
        quote: >-
          I believe images in the alpha channel have secure boot signatures but
          with a shim that is not signed by the official 3rdparty UEFI CA (our
          shim-review submission is blocked on a legal/procedural issue).
      - url: https://www.flatcar.org/docs/latest/security/encryption/luks/
        type: official-docs
        title: LUKS disk encryption
        retrieved: "2026-09-22"
        quote: TPM2-backed rootfs encryption in Flatcar is supported from version 3913.0.1 onwards.
      - url: https://www.flatcar.org/docs/latest/security/hardening/trusted-computing-hardware-requirements/
        type: official-docs
        title: Trusted computing hardware requirements
        retrieved: "2026-09-22"
        quote: >-
          Support for version 2.0 TPMs identified with the MSFT0101 string will
          be added in a future Flatcar Container Linux release.
      - url: https://www.flatcar.org/docs/latest/security/hardening/fips/
        type: official-docs
        title: FIPS
        retrieved: "2026-09-22"
        quote: >-
          Flatcar is not officially FIPS certified, it is possible to deploy it
          so that it is compliant with two of these standards
      - url: https://www.flatcar.org/docs/latest/updates-releases/releases/verify-images/
        type: official-docs
        title: Verifying images
        retrieved: "2026-09-22"
        quote: >-
          Along with each image, a signature is generated from the Flatcar
          Container Linux Image Signing Key and posted.
    unknowns:
      - "Whether SELinux is enforcing by default on a current stable release. The docs describe how to configure it but do not state the default."
      - "Which channels currently ship Secure Boot signed images, and what exactly an operator must enrol."

