taxonomy:
  workload_scope: kubernetes-oriented-host
  construction_model:
    - vendor-fixed-image
    - vendor-base-plus-derivation
  root_state_substrate:
    - ab-partition-image
  notes: >-
    A container host rather than a Kubernetes appliance. Kubernetes is not
    shipped and the docs treat it as one orchestrator among several, alongside
    Docker and Incus. The A/B pair covers /usr only, not the whole root,
    which is what separates Flatcar from whole-root A/B systems.

dimensions:
  d01_os_model:
    normalized:
      workload_scope: kubernetes-oriented-host
      ships_kubernetes: false
    summary: >-
      A minimal container host in the CoreOS Container Linux lineage, built from
      a ChromiumOS and Gentoo base. It ships no package manager and no
      Kubernetes. Orchestration is the operator's choice.
    notes: >-
      Started in 2018 as what its announcement called "a friendly fork of CoreOS'
      Container Linux", after the CoreOS acquisition, with the stated goals of
      controlling the build and signing pipeline and raising the project bus
      factor.
    evidence: DOCUMENTED
    sources:
      - url: https://www.flatcar.org/docs/latest/
        type: official-docs
        title: Flatcar documentation
        retrieved: "2026-09-22"
        quote: >-
          a minimal, immutable, container-optimized Linux operating system and
          the active successor to CoreOS Container Linux
      - url: https://www.flatcar.org/blog/2018/03/announcing-the-flatcar-linux-project/
        type: announcement
        title: Announcing the Flatcar Linux project
        retrieved: "2026-09-22"
        quote: >-
          Flatcar Linux is a friendly fork of CoreOS' Container Linux and as
          such, compatible with it.
      - url: https://www.flatcar.org/docs/latest/devguide/sdk-modifying-flatcar/
        type: official-docs
        title: Modifying Flatcar
        retrieved: "2026-09-22"
        quote: Flatcar Container Linux is based on ChromiumOS, which is based on Gentoo.

  d02_immutability:
    normalized:
      read_only:
        - /usr
      writable_and_persistent:
        - /
        - /etc
        - /opt
        - /var
      integrity_mechanism:
        - dm-verity
      survives_upgrade:
        - "the writable root partition, including container images"
      read_only_mechanism: separate partition, protected by dm-verity
      configurable_paths:
        value: 'yes'
        evidence: DOCUMENTED
        how: 'Only to add storage: format and attach additional filesystems with a Butane config and systemd mount units, for example at /var/lib/docker. The read-only /usr is fixed.'
        sources:
          - url: https://www.flatcar.org/docs/latest/os-config/storage/mounting-storage/
            type: official-docs
            title: 'Flatcar: mounting storage'
            retrieved: '2026-10-12'
            quote: Butane Configs can be used to format and attach additional filesystems to Flatcar Container Linux nodes
      mounts_sources:
        - url: https://www.flatcar.org/docs/latest/devguide/sdk-disk-partitions/
          type: official-docs
          title: 'Flatcar disk partitions: read-only /usr, stateful /'
          retrieved: '2026-10-12'
          quote: Flatcar Container Linux is divided into two main filesystems, a read-only /usr and a stateful read/write /.
    summary: >-
      Only /usr is read-only, on its own partition, protected by dm-verity with
      the root hash held in the kernel. The root filesystem is writable and
      persistent, and holds /etc, /opt and /var. There is no ephemeral-root
      model.
    notes: >-
      The update process rewrites only the passive /usr partition, so everything
      on the writable root survives an upgrade untouched. /bin, /sbin, /lib and
      /lib64 are symlinks into /usr. A verity reference file
      (flatcar_production_image_verity.txt) ships with each release.

      Two official statements disagree. The repository README says the root
      filesystem is read-only, while the disk-partitions page describes "a
      read-only /usr and a stateful read/write /" and the learning-series page
      says only /usr is strictly read-only. The disk-partitions description
      matches the published layout and is recorded here as the accurate one.
      Raised with maintainers, see open_questions.
    evidence: DOCUMENTED
    sources:
      - url: https://www.flatcar.org/docs/latest/getting-started/learning-series/immutability-updates-rollbacks/
        type: official-docs
        title: "Learning series: immutability, updates and rollbacks"
        retrieved: "2026-09-22"
        quote: /usr is on a separate partition, and that partition is strictly read-only.
      - url: https://www.flatcar.org/docs/latest/devguide/sdk-disk-partitions/
        type: official-docs
        title: Disk partitions
        retrieved: "2026-09-22"
        quote: >-
          Flatcar Container Linux is divided into two main filesystems, a
          read-only /usr and a stateful read/write /.
      - url: https://www.flatcar.org/docs/latest/security/supply-chain/
        type: official-docs
        title: Supply chain security
        retrieved: "2026-09-22"
        quote: >-
          All operating system binaries are contained in a separate, immutable
          (read-only) partition which is mounted to /usr at system boot
      - url: https://github.com/flatcar/Flatcar/blob/main/README.md
        type: source-repo
        title: flatcar/Flatcar README
        retrieved: "2026-09-22"
        quote: its root filesystem is read-only
    unknowns:
      - "No single reference page defines what immutability means in Flatcar. The two statements that come closest contradict each other."

  d03_artifact:
    normalized:
      primary_artifact: disk-image-plus-update-payload
      oci_registry_distribution: "none"
      content_addressable: "none"
      mirrorable: true
      signed: gpg-detached-4096-bit-rsa
      air_gapped_capable: true
    summary: >-
      Releases are HTTP-served files: a full disk image, a separate update
      payload, per-platform images, kernel and initrd, and signed shim and GRUB.
      Every artifact carries a detached GPG signature. The OS is not distributed
      through an OCI registry.
    notes: >-
      Each release also publishes an SBOM, a licence manifest, a package list, a
      kernel config, a verity reference and a PCR policy bundle. A
      flatcar-container.tar.gz exists, but the documentation describes no
      OCI-registry distribution path for the OS itself. Nebraska, the update
      server, is published as an OCI image; the OS is not.

      Air-gapped operation is documented on two paths: flatcar-install, which
      can fetch from a mirror (-b) with a local signing key (-k) or install a
      local image file (-f) that the tool itself labels unverified, and
      Nebraska self-hosting the payloads.
    evidence: DOCUMENTED
    sources:
      - url: https://stable.release.flatcar-linux.net/amd64-usr/current/
        type: release-notes
        title: Stable release artifact listing
        retrieved: "2026-09-22"
      - url: https://www.flatcar.org/docs/latest/security/supply-chain/
        type: official-docs
        title: Supply chain security
        retrieved: "2026-09-22"
        quote: >-
          Flatcar release images and related artifacts are automatically signed
          at build time (on the secure build infrastructure) with a 4096 bit GPG
          RSA key.
      - url: https://www.flatcar.org/docs/latest/deploy/virt-options/notes-for-distributors/
        type: official-docs
        title: Notes for distributors
        retrieved: "2026-09-22"
        quote: >-
          If you are importing images for use inside your environment it is
          recommended that you fetch version.txt from the current directory and
          use its contents to compute the path to the other artifacts.
      - url: https://www.flatcar.org/docs/latest/deploy/bare-metal/installing-to-disk/
        type: official-docs
        title: Installing to disk
        retrieved: "2026-09-22"
        quote: "-f IMAGE Install unverified local image file to disk instead of fetching"
    unknowns:
      - "The internal format of the update payload is not specified in the documentation."
      - "Which key signs the update payload, and whether it is the same as the image signing key."

  d04_upgrade:
    normalized:
      fleet_upgrade:
        self_update: "Each machine should check in about 10 minutes after boot and roughly every hour after that."
        paths:
          - kind: fleet-server
            name: "Nebraska"
            license: "Apache-2.0"
            class: open-source
            reconciliation: in-place
            filter: true
            note: "A self-hostable Omaha update server with groups and rollout control."
            evidence: DOCUMENTED
            sources:
              - url: https://github.com/flatcar/nebraska
                title: "Nebraska repository"
                retrieved: "2026-10-06"
          - kind: cluster-api
            name: "Cluster API providers for Flatcar"
            license: "Apache-2.0"
            class: open-source
            reconciliation: replacement
            filter: true
            note: "The Flatcar docs list six providers: AWS, Linode, Azure, KubeVirt, Proxmox and vSphere. The licence shown is not checked per provider."
            evidence: INFERRED
            sources:
              - url: https://www.flatcar.org/docs/latest/container-runtimes/getting-started-with-kubernetes/
                title: "Flatcar: getting started with Kubernetes"
                retrieved: "2026-10-06"
          - kind: reboot-coordination
            name: "FLUO (Flatcar Linux Update Operator)"
            license: "Apache-2.0"
            class: open-source
            filter: true
            note: "A node reboot controller."
            evidence: DOCUMENTED
            sources:
              - url: https://github.com/flatcar/flatcar-linux-update-operator
                title: "FLUO repository"
                retrieved: "2026-10-06"
                quote: >-
                  a node reboot controller
              - url: https://www.flatcar.org/docs/latest/setup/releases/update-strategies/
                title: "Flatcar update strategies"
                retrieved: "2026-10-06"
          - kind: reboot-coordination
            name: "kured"
            license: "Apache-2.0"
            class: open-source
            filter: true
            note: "Listed on the Flatcar update strategies page."
            evidence: DOCUMENTED
            sources:
              - url: https://github.com/kubereboot/kured
                title: "kured repository"
                retrieved: "2026-10-06"
          - kind: reboot-coordination
            name: "locksmith"
            license: "Apache-2.0"
            class: open-source
            filter: true
            note: "Reboot lock held in etcd. Listed on the update strategies page. The licence was not checked."
            evidence: DOCUMENTED
            sources:
              - url: https://www.flatcar.org/docs/latest/setup/releases/update-strategies/
                title: "Flatcar update strategies"
                retrieved: "2026-10-06"
      version_identity:
        identifier: "FLATCAR_VERSION in os-release, for example 4757.2.1"
        condition: "No system extensions beyond the default set, no default ones disabled, and no writable module overlay."
        evidence: DOCUMENTED
        sources:
          - url: https://www.flatcar.org/docs/latest/sys-ext
            type: official-docs
            title: "Flatcar system extensions"
            retrieved: "2026-10-06"
            quote: >-
              are covered by the Flatcar A/B update mechanism because they are bound to the OS version
          - url: https://www.flatcar.org/docs/latest/sys-ext
            type: official-docs
            title: "Flatcar system extensions (writable overlay)"
            retrieved: "2026-10-06"
            quote: >-
              A writable overlay can be mounted over it to allow installing new modules.
      mechanism:
        - ab-partition-switch
      scope: usr-only
      scope_note: The update also copies that slot's kernel to the EFI partition.
      scope_sources:
        - url: https://www.flatcar.org/docs/latest/devguide/sdk-disk-partitions/
          type: official-docs
          title: Flatcar disk partitions, stateful root
          retrieved: '2026-10-06'
          quote: The data stored on the root partition isn’t manipulated by the update process.
        - url: https://github.com/flatcar/update_engine/blob/f23d6ea/src/update_engine/omaha_response_handler_action.h
          type: source-code
          title: flatcar/update_engine, kernel path for the target slot (coreos-postinst is no longer on main)
          retrieved: '2026-10-06'
          quote: Selects the kernel path associated with the given partition path. ... E.g., /dev/sda4 -> /boot/flatcar/vmlinuz-a
      initiator: node-polls
      requires_kubernetes: false
      requires_vendor_infrastructure: false
      self_hostable_update_server: true
      self_hostable_update_source: "Your own Nebraska update server"
      artifact_verification: signature-against-update-signing-key
    summary: >-
      update_engine polls an Omaha endpoint, downloads the payload to the passive
      /usr partition, verifies it against the update signing key, then flips the
      GPT priority so the bootloader selects it. Reboot timing is a separate,
      configurable decision.
    notes: >-
      Reboot strategy is set in /etc/flatcar/update.conf and executed by
      locksmithd. Documented values are etcd-lock (reboot after taking a
      distributed lock), reboot (immediately, within a reboot window), and off.
      FLUO and kured are the Kubernetes-side alternatives.

      The update server is replaceable. Pointing SERVER= at a self-hosted
      Nebraska instance removes the dependency on project-hosted infrastructure
      entirely, and Nebraska can host the payloads as well as the metadata.
      Nothing in the update path requires Kubernetes.

      Because the A/B pair covers /usr and not the whole root, an upgrade does
      not roll back changes made to /etc, /opt or /var.
    evidence: DOCUMENTED
    sources:
      - url: https://www.flatcar.org/docs/latest/updates-releases/releases/update-strategies/
        type: official-docs
        title: Update strategies
        retrieved: "2026-09-22"
        quote: >-
          It's important to note that updates are always downloaded to the
          passive partition when they become available.
      - url: https://www.flatcar.org/docs/latest/devguide/sdk-disk-partitions/
        type: official-docs
        title: Disk partitions
        retrieved: "2026-09-22"
        quote: >-
          After an update, Flatcar Container Linux will re-configure the GPT
          priority attribute, instructing the bootloader to boot from the passive
          (newly updated) partition.
      - url: https://www.flatcar.org/docs/latest/updates-releases/nebraska/managing-updates/
        type: official-docs
        title: Managing updates with Nebraska
        retrieved: "2026-09-22"
        quote: >-
          by default Nebraska only stores metadata about the Flatcar Container
          Linux updates, not the updates payload.
      - url: https://www.flatcar.org/docs/latest/security/supply-chain/
        type: official-docs
        title: Supply chain security
        retrieved: "2026-09-22"
        quote: Before installation, update images are validated against the update signing key

  d05_rollback_recovery:
    normalized:
      rollback_to_previous: available
      automatic_rollback_on_boot_failure: available
      automatic_rollback_trigger: "new version not marked successful by update_engine, roughly two minutes after boot"
      automatic_rollback_attempts: "GPT tries attribute"
      retained_versions: 2
      recovery_environment: live-media
      factory_reset: unknown
      network_independent_recovery: partial
    summary: >-
      The bootloader tracks boot attempts through GPT priority, tries and
      successful attributes, and reverts to the previous /usr partition if the
      new one is not marked successful. Exactly two versions are kept, so there
      is no rollback to an arbitrary older version.
    notes: >-
      Two manual paths exist. flatcar-update --to-version installs a chosen known
      good version and can disable further updates, but it downloads a payload
      and so needs a reachable server. The cgpt prioritize path switches back to
      the retained partition and needs no network at all. That is the split
      behind the partial value for network-independent recovery.

      Recovery beyond that is the live ISO. The ISO page records two limits on
      that environment: UEFI boot from the ISO is not supported, and the ISO
      console starts a shell without a password. Rollback here reverts /usr
      only; it does not revert state written to the root partition, which is a
      direct consequence of the A/B scope recorded in d02.
    evidence: DOCUMENTED
    sources:
      - url: https://www.flatcar.org/docs/latest/diagnostics/manual-rollbacks/
        type: official-docs
        title: Manual rollbacks
        retrieved: "2026-09-22"
        quote: There is no method to downgrade to an arbitrary version number
      - url: https://www.flatcar.org/docs/latest/devguide/sdk-disk-partitions/
        type: official-docs
        title: Disk partitions
        retrieved: "2026-09-22"
        quote: >-
          These partitions each include three flags that affect the boot
          process, priority, tries, and successful.
      - url: https://www.flatcar.org/docs/latest/deploy/bare-metal/booting-with-iso/
        type: official-docs
        title: Booting with ISO
        retrieved: "2026-09-22"
        quote: UEFI boot is not currently supported. Boot the system in BIOS compatibility mode.
    unknowns:
      - "No factory-reset command or page appears anywhere in the documentation sitemap."
      - "No project-level remote recovery mechanism is documented."

  d06_customization:
    normalized:
      runtime_package_install: "none"
      mechanisms:
        - systemd-sysext
        - ignition-at-first-boot
        - image-partition-customization
        - sdk-rebuild
        - kernel-module-overlay
      customization_points:
        - build-time
        - image-time
        - first-boot
        - runtime-extension
      add_software:
      - kind: systemd-sysext
        how: Sysext images merge over /usr. Flatcar ships some in the image or its release servers. The sysext-bakery releases community ones.
        evidence: DOCUMENTED
        sources:
        - url: https://www.flatcar.org/docs/latest/sys-ext/
          type: official-docs
          title: 'Flatcar docs: systemd-sysext'
          retrieved: '2026-10-12'
          quote: The systemd-sysext feature finally provides a way to extend the base OS with a /usr overlay, thereby making custom binaries available to the user.
        - url: https://www.flatcar.org/docs/latest/sys-ext/
          type: official-docs
          title: 'Flatcar docs: systemd-sysext'
          retrieved: '2026-10-12'
          quote: 'Community supported: These are extensions from the Flatcar sysext-bakery releases and they are not tested in CI.'
      - kind: derive-image
        how: Mount the partitions of a Flatcar image before the first boot and add files to the boot, OEM or root partition. The /usr partition cannot be modified.
        evidence: DOCUMENTED
        sources:
        - url: https://www.flatcar.org/docs/latest/fb-provision/customize-image/customize-the-image/
          type: official-docs
          title: 'Flatcar docs: Customizing a Flatcar image'
          retrieved: '2026-10-12'
          quote: the root partition can hold the OS configuration and additional binaries.
        - url: https://www.flatcar.org/docs/latest/fb-provision/customize-image/customize-the-image/
          type: official-docs
          title: 'Flatcar docs: Customizing a Flatcar image'
          retrieved: '2026-10-12'
          quote: The partition with the OS /usr filesystem can’t be modified because it is signed and gets auto-updated.
    summary: >-
      There is no package manager. Customization happens through systemd-sysext
      overlays on /usr, Ignition at first boot, pre-boot edits to the boot, OEM
      and root partitions, or a full rebuild with the Gentoo-based Flatcar SDK.
    notes: >-
      The Sysext Bakery publishes ready-made extensions for Docker, Kubernetes,
      k3s, rke2, containerd, CRI-O, Cilium, Nomad, the NVIDIA container runtime
      and others, updated by systemd-sysupdate on a timer and staged until
      restart. The ZFS and NVIDIA driver sysexts ship from the Flatcar release
      server alongside each release rather than from the bakery.

      The documented limit is real and specific. An extension whose binaries link
      against Flatcar's libraries must pin VERSION_ID, and then it stops loading
      after an OS update. Statically linked binaries can use SYSEXT_LEVEL
      instead and survive.

      torcx, the previous extension mechanism, is deprecated and removed in
      favour of systemd-sysext.

      Out-of-tree kernel modules are built in the developer container over an
      overlay on /usr/lib/modules. Under Secure Boot only a prebuilt, signed
      sysext works, because modules are signed with the ephemeral kernel module
      signing key. NVIDIA drivers are shipped this way, built with every release,
      amd64 only.
    evidence: DOCUMENTED
    sources:
      - url: https://www.flatcar.org/docs/latest/sys-ext/
        type: official-docs
        title: System extensions
        retrieved: "2026-09-22"
        quote: >-
          systemd-sysext feature finally provides a way to extend the base OS
          with a /usr overlay, thereby making custom binaries available to the
          user.
      - url: https://www.flatcar.org/blog/2023/12/extending-flatcar-say-goodbye-to-torcx-and-hello-to-systemd-sysext/
        type: announcement
        title: "Extending Flatcar: goodbye torcx, hello systemd-sysext"
        retrieved: "2026-09-22"
        quote: >-
          With the advent of systemd-sysext, we will deprecate torcx and remove
          it from Flatcar in early 2024.
      - url: https://www.flatcar.org/docs/latest/os-config/host-config/using-nvidia/
        type: official-docs
        title: Using NVIDIA drivers
        retrieved: "2026-09-22"
        quote: >-
          only the prebuilt sysext will work, as the modules are signed
      - url: https://www.flatcar.org/docs/latest/devguide/kernel-modules/
        type: official-docs
        title: Kernel modules
        retrieved: "2026-09-22"
        quote: >-
          The kernel modules directory /usr/lib/modules is read-only on Flatcar
          Container Linux. A writable overlay can be mounted over it to allow
          installing new modules.
      - url: https://www.flatcar.org/docs/latest/devguide/sdk-modifying-flatcar/
        type: official-docs
        title: Modifying Flatcar with the SDK
        retrieved: "2026-09-22"
        quote: >-
          The guides in this document aim to enable engineers to update, and to
          extend, packages in both the Flatcar OS image as well as the SDK, to
          suit their own needs.
      - url: https://github.com/flatcar/sysext-bakery
        type: source-repo
        title: flatcar/sysext-bakery
        retrieved: "2026-09-22"
        quote: >-
          Each individual release in the Bakery serves one extension in one
          specific version; e.g. `docker-24.0.1` or `kubernetes-1.22.0`.
    unknowns:
      - "Whether the ephemeral kernel module signing key can be used by third parties to sign their own sysext modules for Secure Boot nodes."

  d07_kubernetes:
    normalized:
      requirement: optional
      bundled: "none"
      independent_lifecycle: "yes"
      os_manages_kubernetes: "no"
      kubernetes_manages_os: "FLUO (flatcar-linux-update-operator), optional; kured also supported"
      distributions:
        - kubeadm
        - Cluster API
        - Kubespray
        - Typhoon
        - k3s (via Sysext Bakery)
    summary: >-
      Kubernetes is optional and not shipped. It is installed through Ignition or
      a sysext, which gives the OS and Kubernetes fully separate update paths and
      version streams.
    notes: >-
      Three reboot-coordination mechanisms exist and are distinct. locksmithd is
      the OS-level reboot manager and is not Kubernetes-aware except through its
      etcd lock. FLUO is Kubernetes-native: it drains a node before rebooting it
      and reboots one node at a time. kured is third party, supported since
      3067.0.0. FLUO and locksmithd are mutually exclusive.

      Non-Kubernetes orchestration is documented as a first-class option for
      Docker and Incus, which have their own pages under Orchestration and
      Container Runtimes. Nomad has no documentation page: it is available as
      a Sysext Bakery extension, and the flatcar/nomad-on-flatcar repository is
      archived, last pushed 2023-07-25.
    evidence: DOCUMENTED
    sources:
      - url: https://www.flatcar.org/docs/latest/orchestrate/kubernetes/getting-started-with-kubernetes/
        type: official-docs
        title: Getting started with Kubernetes
        retrieved: "2026-09-22"
        quote: >-
          It's possible to install the tools (kubeadm, kubelet, etc.) using
          Ignition or directly with the Kubernetes sysext image distributed from
          the flatcar/sysext-bakery release page.
      - url: https://github.com/flatcar/flatcar-linux-update-operator
        type: source-repo
        title: flatcar-linux-update-operator
        retrieved: "2026-09-22"
        quote: >-
          a node reboot controller for Kubernetes running Flatcar Container Linux
          images. When a reboot is needed after updating the system via
          update_engine, the operator will drain the node before rebooting it.
      - url: https://github.com/flatcar/locksmith
        type: source-repo
        title: locksmith
        retrieved: "2026-09-22"
