  d14_maturity:
    normalized:
      first_release: "2018-03"
      current_version: "4757.2.0"
      current_version_date: "2026-09-14"
      release_cadence: "14 days within a channel; new major alpha monthly; alpha to beta every 2 months; beta to stable every 3 to 4 months; new LTS yearly"
      observed_intervals: "stable, beta and alpha all published 2026-09-14; LTS last published 2026-08-13"
      support_model: lts-stream
      support_window: "LTS streams maintained 18 months, with a 6-month overlap between yearly streams"
      commercial_support: unknown
    summary: >-
      Eight years old, four channels, a documented 14-day cadence within a
      channel and an 18-month LTS window. Stable, beta and alpha are all current.
      The LTS channel is the part that does not currently reconcile with its own
      published policy.
    notes: >-
      The LTS situation is recorded as a fact about documentation legibility, not
      as a judgement. The releases page announces that the LTS-2024 stream
      (4081 series) hits end of life in mid-2026, yet the lts channel still
      served 4081.3.10 on 2026-08-13. No LTS-2025 stream is visible as a channel.
      The project's own forward release plan issues for October to December 2026
      point LTS at a 4593.x series. A user issue titled "Is LTS channel dead?"
      opened in March 2026 remains open; a maintainer replied that LTS is not
      dead and had been missed in recent releases. A later comment asks for a
      single source of truth on which channels are currently available, and the
      documentation does not provide one.

      Re-checked on 2026-09-22: version.txt on all four release servers was
      unchanged since collection, the lts channel still served 4081.3.10, the
      releases page still announced mid-2026 end of life for the 4081 series,
      and the "Is LTS channel dead?" issue remained open with no new comment
      since 2026-06-21. The September 2026 release plan issue lists no LTS
      release; the October to December plans list LTS 4593.3.1 to 4593.3.3.

      Commercial support is recorded as unknown. The only commercial offering
      this survey found documented, the Flatcar Pro Azure Marketplace images,
      is described in the past tense by the project's own Azure page (d12), and
      flatcar.org names no support vendor.

      Release tracking is otherwise public, with a project board and kind/release
      issues, and the repositories show daily activity.
    evidence: DOCUMENTED
    sources:
