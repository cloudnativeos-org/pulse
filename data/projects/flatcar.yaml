  d12_fleet_management:
    normalized:
      core_project:
        - "update_engine, the Omaha client that applies A/B payloads"
        - "locksmithd, reboot manager with an etcd-based distributed lock"
        - "/etc/flatcar/update.conf, the per-node GROUP and SERVER policy surface"
      oss_companion:
        - name: Nebraska
          repo: https://github.com/flatcar/nebraska
          license: Apache-2.0
          org: flatcar
          note: "Self-hostable Omaha update server. Groups, channels, rollout control, pause and resume, per-version instance statistics. Can also host the payloads."
        - name: FLUO (flatcar-linux-update-operator)
          repo: https://github.com/flatcar/flatcar-linux-update-operator
          license: Apache-2.0
          org: flatcar
          note: "Kubernetes-native reboot coordination. Drains a node before rebooting, one node at a time. Mutually exclusive with locksmithd."
        - name: Cluster API support, through upstream components rather than a Flatcar provider
          repo: https://github.com/kubernetes-sigs/image-builder
          license: Apache-2.0
          org: kubernetes-sigs
          note: "No Flatcar-specific provider exists. The mechanism is the kubeadm bootstrap provider emitting Ignition instead of cloud-init, plus image-builder Flatcar targets on ten platforms, plus Flatcar cluster flavors shipped by CAPA, CAPZ, CAPO and CAPV. Flatcar maintains flatcar/ignition, whose description states it exists for development and ClusterAPI."
      commercial:
        - name: Flatcar Pro images (Azure Marketplace, discontinued)
          vendor: Microsoft
          license: proprietary-listing
          self_hostable: false
          note: "The Flatcar Azure documentation describes Flatcar Pro images in the past tense: paid marketplace images that came with commercial support and extra features, whose features are now in the standard free marketplace images published under the kinvolk publisher. No current commercial offering for Flatcar is documented on flatcar.org."
      cluster_api:
        os_specific_provider: "none"
        maintainer: not-applicable
        upstream_provider_list: "not listed, and no Flatcar provider is expected, because the mechanism lives inside the kubeadm bootstrap provider"
        provisions: "OS configuration and bootstrap through the kubeadm bootstrap provider emitting Ignition; machine lifecycle through whichever infrastructure provider is used"
        bootstrap_target: "kubeadm, with bootstrap data rendered as Ignition rather than cloud-init"
        bootstrap_maturity: "alpha and behind a feature gate since Cluster API v1.1, still alpha at v1.14.2"
        image_builder_target: "ten platforms: AWS AMI including arm64, Azure including gen2, Hetzner including arm64, OpenStack, Nutanix, Outscale, OVA for vSphere, Proxmox, QEMU, raw"
        infrastructure_provider_flavors:
          - CAPA
          - CAPZ
          - CAPO
          - CAPV
    summary: >-
      Fleet update management is fully self-hostable open source. Nebraska
      replaces any project-hosted update service, and FLUO or kured coordinate
      reboots on the Kubernetes side. No commercial product is required for any
      of it.
    notes: >-
      One documented vendor-platform fact belongs here, and its scope should be
      read carefully. Microsoft's AKS documentation states that from 2026-06-08
      AKS no longer supports Flatcar Container Linux for AKS (preview), stops
      producing node images and security patches, and will remove existing
      Flatcar node images on 2026-09-08. As of 2026-09-22 the page still
      carries that removal in the future tense. The same page notes that on
      AKS, Flatcar's built-in A/B update was disabled in favour of full node
      image updates.

      That is a statement about one vendor's managed-Kubernetes offering. It is
      recorded here because it is a documented fact about commercial availability
      on that platform. It says nothing documented about the upstream CNCF
      project, which is Incubating with active releases across four channels
      (d14). No inference beyond what the page states is drawn here.

      The Cluster API position is the one place in this edition where counting
      providers gives exactly the wrong answer. This project has no provider of
      any kind and the deepest practical Cluster API integration of any entry
      here. The mechanism is that the kubeadm bootstrap provider can emit
      Ignition instead of cloud-init, and the upstream documentation states
      that the implementation uses Ignition v2 and was tested with Flatcar
      Container Linux only. Around that sit image-builder targets on ten
      platforms, with dedicated Ansible roles and Ignition and CLC bootstrap
      files, and Flatcar cluster flavors shipped by four infrastructure
      providers. The project also maintains flatcar/ignition, whose repository
      description says it exists for development and for ClusterAPI.

      Two qualifications keep this honest. That bootstrap path is an alpha
      feature behind a gate, introduced at Cluster API v1.1 and still marked
      alpha at v1.14.2, so a reader should not read depth of integration as
      stability of contract. And flatcar/cluster-api-bootstrap-provider-kubeadm-ignition
      exists as a repository name with governance files and no source code, two
      commits, no release, and nothing pushed since March 2025. Anyone testing
      "does a provider repository exist" will score this project wrong in both
      directions at once.

      The same vendor's replacement offering is downstream of Flatcar, and
      leaving that out would make the fact above one-sided. Azure Container Linux
      (ACL), generally available as an AKS OS option from AKS v1.34, is
      documented by Microsoft as "derived from the Flatcar Container Linux
      project". Its repository's architecture document states that the Flatcar
      update model, the USR-A/USR-B A/B partition layout and the OEM package
      model are retained, with Azure Linux RPMs replacing the Portage build.
      The repository's top-level README thanks "the Flatcar Container Linux
      Project for providing us with a strong foundation of an immutable container
      host and community." Read together, the two facts describe a change of
      packaging and support arrangement rather than a departure from Flatcar's
      architecture. See the azure-container-linux profile.

      Kinvolk, which started Flatcar, was acquired by Microsoft in 2021. The
      project was donated to the CNCF in 2024. Both are recorded as dated facts
      with no speculation attached.
    evidence: DOCUMENTED
    sources:
      - url: https://github.com/flatcar/nebraska
        type: source-repo
        title: flatcar/nebraska
        retrieved: "2026-09-22"
        quote: Store and serve Flatcar Container Linux payloads (optional);
      - url: https://www.flatcar.org/docs/latest/updates-releases/nebraska/managing-updates/
        type: official-docs
        title: Managing updates with Nebraska
        retrieved: "2026-09-22"
        quote: >-
          By default, your Flatcar Container Linux instances use the public
