open_questions:
  - "What is the current LTS stream, and what is the definitive list of valid GROUP values for /etc/flatcar/update.conf and Nebraska?"
  - "What is the state of the shim-review submission, and what must an operator enrol for Secure Boot to work on stock UEFI CA firmware today? Which channels ship signed images?"
  - "Is TPM 2.0 supported on current releases, and should the trusted-computing hardware-requirements page be updated? Which PCRs are measured, and what is flatcar_production_image_pcr_policy.zip for?"
  - "What is the format of the update payload, which key signs it, and can an operator pin or rotate that key?"
  - "Is there any plan to distribute the OS image or update payloads through an OCI registry with content-addressable digests?"
  - "Is flatcar/mayday still the supported support-bundle tool? If so, why is it undocumented?"
  - "Is there a documented factory-reset or reprovision-in-place path, or is reinstall the only answer?"
  - "Is SELinux enforcing by default on a current stable release?"
  - "Can a third party use the ephemeral kernel module signing key to ship signed sysext modules for Secure Boot nodes?"
  - "Is there an intent to record maintainer organizational affiliations in MAINTAINERS.md, as several CNCF projects do?"
  - "Is RISC-V support on any roadmap, and what would adding a third SDK board require?"
  - "What is the supported upgrade path for a sysext when the OS major version changes, given that VERSION_ID-pinned extensions stop loading?"
  - "Is any commercial support offering for Flatcar currently available, now that the project's Azure page describes the Flatcar Pro images in the past tense and flatcar.org names no support vendor?"
  - "Is Exoscale officially supported or community supported? The cloud deployment page lists it among the officially supported providers, while the releases page download selector marks it Community."

