      - url: https://kinvolk.io/blog/2021/04/microsoft-acquires-kinvolk/
        type: announcement
        title: Microsoft acquires Kinvolk
        retrieved: "2026-09-22"
        quote: Today, we are excited to announce that Kinvolk has been acquired by Microsoft.
      - url: https://learn.microsoft.com/en-us/azure/azure-linux/azure-container-linux-overview
        type: vendor-docs
        title: Azure Container Linux overview
        retrieved: "2026-09-22"
        quote: >-
          ACL is derived from the Flatcar Container Linux project, building on
          Flatcar's proven, container-first immutable design while layering in
          Azure Linux packages, servicing, and platform integration.
      - url: https://github.com/microsoft/azure-container-linux/blob/aclmain/acl/README.md
        type: source-repo
        title: Azure Container Linux README
        retrieved: "2026-09-22"
        quote: >-
          It replaces the traditional Portage-based build system with Azure Linux
