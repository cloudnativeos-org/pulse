      - url: https://github.com/microsoft/azure-container-linux/blob/aclmain/acl/docs/architecture.md
        type: design-doc
        title: Azure Container Linux architecture
        retrieved: "2026-09-22"
        quote: >-
          The Flatcar update model, partition layout (USR-A/USR-B A/B scheme,
          OEM, ROOT), and OEM package model are retained.
