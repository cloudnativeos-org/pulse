<!-- @dsCard height=288 -->
<div class="cv">
<!--
  blocks: ink 288x112 (the pinned entry column), band-cool 192x112, rule-strong 48x112, rule 240x112, band-cool 144x112, accent 48x56
  arrangement: a strip of unequal bands across the top, read as matrix columns; one 2px ink rule crosses at y=40 like a row rule
  pattern: precise, technical, dense reference -> a dot grid at space-6 (24px) pitch on the rule band, skipping the ruled row; 30 dots
  scales: widths are multiples of space-12 (48px); radius-0 everywhere, as the system's tables
-->
<svg viewBox="0 0 960 112" width="960" height="112" aria-hidden="true">
  <rect class="b-ink" x="0" y="0" width="288" height="112"/>
  <rect class="b-head" x="288" y="0" width="192" height="112"/>
  <rect class="b-strong" x="480" y="0" width="48" height="112"/>
  <rect class="b-rule" x="528" y="0" width="240" height="112"/>
  <rect class="b-head" x="768" y="0" width="144" height="112"/>
  <rect class="b-flag" x="912" y="56" width="48" height="56"/>
  <rect class="b-line" x="288" y="40" width="672" height="2"/>
  <g class="dots"></g>
</svg>
<div class="cv-name">cloud native OS Pulse</div>
<div class="cv-tag">A sourced comparison with no score and no winner. Ink on paper, every claim labelled.</div>
</div>
<style>
  html, body { margin: 0; background: var(--paper); }
  .cv { width: 960px; height: 288px; position: relative; background: var(--paper); }
  .cv svg { display: block; }
  .b-ink { fill: var(--ink); }
  .b-head { fill: var(--band-cool); }
  .b-strong { fill: var(--rule-strong); }
  .b-rule { fill: var(--rule); }
  .b-flag { fill: var(--accent); }
  .b-line { fill: var(--ink); }
  .dots circle { fill: var(--ink); }
  .cv-name { position: absolute; left: 32px; top: 152px; font: 600 64px/0.95 var(--font-sans); letter-spacing: -0.02em; color: var(--ink); white-space: nowrap; }
  .cv-tag { position: absolute; left: 32px; top: 232px; max-width: 440px; font: 400 14px/20px var(--font-sans); color: var(--ink-muted); }
</style>
<script>
  (function () {
    var g = document.querySelector(".cv .dots"), ns = "http://www.w3.org/2000/svg";
    for (var r = 0; r < 3; r++) for (var c = 0; c < 10; c++) {
      var d = document.createElementNS(ns, "circle");
      d.setAttribute("cx", 528 + 12 + c * 24); d.setAttribute("cy", [16, 64, 88][r]);
      d.setAttribute("r", 2); g.appendChild(d);
    }
  })();
</script>
